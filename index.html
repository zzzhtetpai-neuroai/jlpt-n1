<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JLPT N1 Mock Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ec;--card:#fffdf8;--ink:#23201b;--mute:#6f685c;--line:#e3ddd0;--acc:#1f4e79;--ok:#2e7d4f;--okbg:#e6f3ea;--ng:#b3392f;--ngbg:#f9e7e4;--sel:#e8eef6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;font-size:17px;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 110px}
h1{font-family:"Noto Serif JP",serif;font-size:1.45rem;margin:.4em 0 .1em;font-weight:600}
.sub{color:var(--mute);font-size:.88rem;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.row{display:flex;align-items:center;gap:10px}
.sec{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin:8px 0;cursor:pointer}
.sec:active{background:var(--sel)}
.sec .t{font-weight:600;font-size:.98rem}.sec .e{color:var(--mute);font-size:.8rem}
.sec .p{font-size:.8rem;color:var(--mute);text-align:right;white-space:nowrap}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px;width:84px}
.bar i{display:block;height:100%;background:var(--acc)}
.grp{font-size:.78rem;letter-spacing:.08em;color:var(--mute);margin:20px 4px 4px;font-weight:700}
button{font:inherit;border:none;border-radius:11px;padding:12px 16px;cursor:pointer}
.btn{background:var(--acc);color:#fff;font-weight:600}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.small{font-size:.85rem;padding:8px 12px}
.instr{font-size:.88rem;color:var(--mute);border-left:3px solid var(--line);padding-left:10px;margin:6px 0 10px}
.passage{font-family:"Noto Serif JP",serif;font-size:1.02rem;line-height:1.95}
.passage p{margin:.4em 0}
.notice{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:.78rem;line-height:1.45;font-family:"Noto Sans JP",sans-serif}
.tbl th,.tbl td{border:1px solid var(--line);padding:5px 4px;vertical-align:top}
.tbl th{background:#f1ede4}
.tblwrap{overflow-x:auto}
.qn{display:inline-block;min-width:30px;padding:0 7px;border:1.5px solid var(--ink);border-radius:6px;text-align:center;font-weight:700;font-size:.85rem;margin-right:8px}
.q{margin:6px 0 10px;font-size:1.05rem}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;margin:7px 0;color:var(--ink);line-height:1.55}
.opt .num{font-weight:700;color:var(--mute);min-width:1.1em}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ng{border-color:var(--ng);background:var(--ngbg)}
.opt:disabled{cursor:default}
.exp{border-radius:11px;padding:11px 13px;margin:8px 0 4px;font-size:.92rem;line-height:1.7;background:#f3f0e8}
.exp .v{font-weight:700;margin-bottom:3px}
.exp .v.ok{color:var(--ok)}.exp .v.ng{color:var(--ng)}
.qblock{border-top:1px dashed var(--line);padding-top:12px;margin-top:14px}
.qblock:first-of-type{border-top:none;margin-top:0;padding-top:0}
u{text-decoration-thickness:1.5px;text-underline-offset:4px}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(246,243,236,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.nav .in{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:center}
.nav .mid{flex:1;text-align:center;font-size:.82rem;color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pill{font-size:.78rem;background:var(--sel);color:var(--acc);border-radius:20px;padding:3px 10px;font-weight:600}
textarea{width:100%;font:inherit;font-size:.8rem;border:1px solid var(--line);border-radius:10px;padding:8px;min-height:70px;background:#fff}
.msg{font-size:.85rem;color:var(--ok);min-height:1.2em;margin-top:6px}
a{color:var(--acc)}
.big{font-size:2rem;font-weight:700;font-family:"Noto Serif JP",serif}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.modal .card{max-width:420px;width:100%}
.hide{display:none!important}
.pick{display:flex;align-items:center;gap:10px;background:#ebe6da;border-radius:12px;padding:6px 6px 6px 14px;margin:4px 0}
.pick span{font-size:.85rem;font-weight:700;color:var(--mute);white-space:nowrap}
.pick select{flex:1;font:inherit;font-weight:700;font-size:1rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 10px;-webkit-appearance:menulist;appearance:menulist}
.rev{display:inline-block;font-size:.78rem;font-weight:700;color:#8a5a00;background:#fbefd5;border-radius:6px;padding:1px 7px;margin-bottom:4px}
.tabs{display:flex;gap:4px;overflow-x:auto;background:#ebe6da;padding:4px;border-radius:12px;margin:4px 0 4px}
.tab{flex:1;background:transparent;color:var(--mute);font-weight:600;padding:9px 2px;font-size:.88rem;white-space:nowrap;min-width:58px}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="nav hide" id="nav"><div class="in">
 <button class="ghost small" id="bHome">目次</button>
 <button class="ghost small" id="bPrev">← 前</button>
 <div class="mid" id="navMid"></div>
 <button class="btn small" id="bNext">次 →</button>
</div></div>
<div class="modal hide" id="modal"><div class="card" id="modalBody"></div></div>
<script>
const SECTIONS = [{"id":"m1","title":"問題1 漢字読み","en":"Kanji reading","instr":"＿＿の言葉の読み方として最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":1,"q":"彼の話は<u>辻褄</u>が合わない。","o":["つじづま","つじつま","つじま","つじつも"],"a":1,"e":"<b>辻褄 (つじつま)</b> = logic, consistency. 辻褄が合わない = the story doesn't add up. The trap is つじづま: 褄 is read <b>つま</b> and does NOT get rendaku (voicing) here."}]},{"qs":[{"n":2,"q":"努力の成果が数字に<u>如実</u>に表れている。","o":["じょじつ","じょうじつ","にょうじつ","にょじつ"],"a":3,"e":"<b>如実 (にょじつ)</b> = clearly, vividly (as it really is). 如 is read <b>にょ</b> here (go-on reading, like 如来 にょらい), not じょ (as in 欠如 けつじょ). That makes じょじつ the main trap."}]},{"qs":[{"n":3,"q":"資金不足のため、計画は途中で<u>頓挫</u>した。","o":["とんざ","とんさ","とうざ","とうさ"],"a":0,"e":"<b>頓挫 (とんざ)</b> = to stall, fall through. 頓 = とん (as in 整頓 せいとん), 挫 = ざ (as in 挫折 ざせつ). Both readings are short and voiced; とうざ and とんさ are made-up readings."}]},{"qs":[{"n":4,"q":"彼女は言い訳をせず、<u>潔く</u>自分の非を認めた。","o":["こころよく","いさましく","いさぎよく","すがすがしく"],"a":2,"e":"<b>潔い (いさぎよい)</b> = graceful, manly, accepting without excuses. こころよく = 快く (willingly), いさましく = 勇ましく (brave), すがすがしく = 清々しく (refreshing). All are real words, so you have to know the kanji."}]},{"qs":[{"n":5,"q":"旅行の費用を<u>捻出</u>するために、毎月少しずつ貯金している。","o":["にんしゅつ","ねんしゅつ","ねんすつ","にんすつ"],"a":1,"e":"<b>捻出 (ねんしゅつ)</b> = to scrape together (money, time). 捻 = ねん (as in 捻挫 ねんざ, sprain). 出 = しゅつ."}]},{"qs":[{"n":6,"q":"平日の昼間の商店街は<u>閑散</u>としていた。","o":["けんさん","かんざん","げんさん","かんさん"],"a":3,"e":"<b>閑散 (かんさん)</b> = quiet, deserted. 閑 = かん (as in 閑静 かんせい), 散 = さん (unvoiced). Very common N1 word, often with としている."}]}]},{"id":"m2","title":"問題2 文脈規定","en":"Word in context","instr":"（　　）に入れるのに最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":7,"q":"長年の努力が（　　）、ついに念願の店を開くことができた。","o":["果たして","実って","叶って","成して"],"a":1,"e":"<b>努力が実る (みのる)</b> = efforts bear fruit. This is a fixed collocation. 叶う goes with 夢 or 願い (夢が叶う), not 努力. 果たす goes with 役割 or 約束 (役割を果たす). 成す is used like 財を成す."}]},{"qs":[{"n":8,"q":"反対意見が相次ぎ、新しい計画の話し合いは（　　）に乗り上げた。","o":["岩礁","座礁","暗礁","難航"],"a":2,"e":"<b>暗礁に乗り上げる (あんしょうにのりあげる)</b> = to hit a snag, reach a deadlock. Idiom. 座礁 (ざしょう) means a ship runs aground, but it is used as 座礁する, not 座礁に乗り上げる. 難航 = difficult progress, used as 難航する."}]},{"qs":[{"n":9,"q":"部下に命令ばかりして自分は何もしないなど、課長の（　　）な態度が目立つ。","o":["謙虚","素朴","律儀","横柄"],"a":3,"e":"<b>横柄 (おうへい)</b> = arrogant, bossy. Fits the context of ordering people around. 謙虚 (けんきょ) = humble, 素朴 (そぼく) = simple, unpretentious, 律儀 (りちぎ) = honest and faithful. All are positive, the opposite of the context."}]},{"qs":[{"n":10,"q":"彼の説明は（　　）としていて、何が言いたいのかよくわからない。","o":["漠然","歴然","整然","毅然"],"a":0,"e":"<b>漠然 (ばくぜん)</b> = vague. 歴然 (れきぜん) = obvious (差は歴然としている), 整然 (せいぜん) = orderly, 毅然 (きぜん) = resolute (毅然とした態度). All four are ～然 words, a classic N1 trap."}]},{"qs":[{"n":11,"q":"資金が集まらず、新しい工場の建設計画は（　　）に戻された。","o":["空白","白紙","白状","余白"],"a":1,"e":"<b>白紙に戻す (はくしにもどす)</b> = to start over from scratch, cancel a plan. 空白 = a blank or gap, 白状 (はくじょう) = confession, 余白 = margin space on a page."}]},{"qs":[{"n":12,"q":"新しいサービスについて利用者から多くの（　　）が寄せられ、改善に役立てた。","o":["リサーチ","ノルマ","フィードバック","プレゼン"],"a":2,"e":"<b>フィードバック</b> = feedback. Opinions that are 寄せられる (sent in) by users and used to improve something. リサーチ = research (done by yourself), ノルマ = quota, プレゼン = presentation."}]},{"qs":[{"n":13,"q":"試験は明日だというのに、弟は（　　）ゲームばかりしている。","o":["てきぱき","きっぱり","ちゃっかり","のんきに"],"a":3,"e":"<b>のんきに (呑気に)</b> = carefree, without worrying. Fits the contrast with というのに. てきぱき = efficiently, きっぱり = flatly, decisively (きっぱり断る), ちゃっかり = shrewdly, cheekily."}]}]},{"id":"m3","title":"問題3 言い換え類義","en":"Paraphrase","instr":"＿＿の言葉に意味が最も近いものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":14,"q":"彼は会議中、<u>しきりに</u>時計を見ていた。","o":["じっと","何度も","こっそり","ちらっと"],"a":1,"e":"<b>しきりに</b> = frequently, again and again. Closest is 何度も. じっと = staring fixedly, こっそり = secretly, ちらっと = with a quick glance."}]},{"qs":[{"n":15,"q":"部長の話はいつも<u>くどい</u>。","o":["わかりにくい","つまらない","しつこい","厳しい"],"a":2,"e":"<b>くどい</b> = long-winded, repeating the same thing. Closest is しつこい (persistent, too much). It is not about being hard to understand (わかりにくい) or boring (つまらない)."}]},{"qs":[{"n":16,"q":"ここまで悪化してしまっては、もう<u>手の施しようがない</u>。","o":["まだ間に合う","時間がかかる","手伝う人がいない","どうすることもできない"],"a":3,"e":"<b>手の施しようがない (てのほどこしようがない)</b> = nothing can be done anymore. Literally, there is no way to apply a hand (a remedy). ～ようがない = there is no way to ～."}]},{"qs":[{"n":17,"q":"二人の意見は<u>ことごとく</u>対立した。","o":["すべて","ときどき","激しく","最後まで"],"a":0,"e":"<b>ことごとく (悉く)</b> = all, every single one, without exception. So the answer is すべて. 激しく is a trap because 対立 suggests strength, but ことごとく is about quantity."}]},{"qs":[{"n":18,"q":"冬になると、この湖には<u>おびただしい</u>数の鳥がやってくる。","o":["珍しい","非常に多い","美しい","様々な"],"a":1,"e":"<b>おびただしい (夥しい)</b> = enormous in number or amount. So the answer is 非常に多い. It often comes with 数 or 量, and sometimes with a negative feel (おびただしい血)."}]},{"qs":[{"n":19,"q":"突然名前を呼ばれて、彼女は<u>うろたえた</u>。","o":["怒った","疲れた","あわてた","悲しんだ"],"a":2,"e":"<b>うろたえる</b> = to be flustered, lose composure. The closest is あわてた (慌てた). Similar word: 動揺した (どうようした)."}]}]},{"id":"m4","title":"問題4 用法","en":"Usage","instr":"次の言葉の使い方として最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":20,"q":"<b>目覚ましい</b>","o":["彼の目覚ましい声で、家族全員が起きてしまった。","この数年で、彼女の日本語は目覚ましい進歩を遂げた。","朝の目覚ましい空気を吸うと、気分がすっきりする。","目覚ましい色のシャツを着て、パーティーに出かけた。"],"a":1,"e":"<b>目覚ましい (めざましい)</b> = remarkable, striking, used for progress or achievement: 目覚ましい進歩, 目覚ましい発展, 目覚ましい活躍. It has nothing to do with waking up (option 1) even though it looks like 目覚まし時計. Option 4 would need 派手な or 鮮やかな."}]},{"qs":[{"n":21,"q":"<b>打開</b>","o":["交渉の行き詰まりを打開するため、新たな案が出された。","窓を打開して、部屋の空気を入れ替えた。","来月、駅前に新しい店を打開する予定だ。","箱を打開すると、中から古い手紙が出てきた。"],"a":0,"e":"<b>打開 (だかい)</b> = to break through a deadlock or difficult situation: 状況を打開する, 打開策. It is never used for physically opening things (窓を開ける, 箱を開ける) or opening a shop (開店する)."}]},{"qs":[{"n":22,"q":"<b>手分け</b>","o":["彼は料理の手分けがとてもうまい。","試験の結果を手分けして、両親に報告した。","時間がないので、みんなで手分けして準備しよう。","大きなケーキを四つに手分けした。"],"a":2,"e":"<b>手分け (てわけ)</b> = dividing work among people: 手分けして探す, 手分けして準備する. Cutting a cake is 切り分ける. Option 1 would be 手際 (てぎわ, skill, handling)."}]},{"qs":[{"n":23,"q":"<b>煩わしい</b>","o":["彼は煩わしい性格で、誰とでもすぐに仲良くなれる。","試合に負けて、一晩中煩わしい気持ちだった。","この料理は煩わしくて、とてもおいしい。","ログインのたびにパスワードを入力するのは煩わしい。"],"a":3,"e":"<b>煩わしい (わずらわしい)</b> = troublesome, annoying, a hassle (usually a procedure or something tiresome to deal with). Option 2 would need 悔しい (くやしい) or 落ち込んだ."}]},{"qs":[{"n":24,"q":"<b>見落とす</b>","o":["何度も確認したつもりだったが、大事な誤字を見落としていた。","駅で友人を見落として、大きく手を振った。","夕日がゆっくりと山に見落とされていく。","彼は試験に見落として、来年もう一度受けるそうだ。"],"a":0,"e":"<b>見落とす (みおとす)</b> = to overlook, miss something you should have noticed. Option 2 needs 見つけて, option 4 needs 落ちて (試験に落ちる = fail an exam)."}]},{"qs":[{"n":25,"q":"<b>一概に</b>","o":["一概に言えば、明日は晴れるでしょう。","彼は一概に毎朝五キロ走っている。","この仕事は一概に今日中に終わらせてください。","最近の若者は本を読まないとは、一概には言えない。"],"a":3,"e":"<b>一概に (いちがいに)</b> = sweepingly, as a blanket statement. It almost always comes with a negative: 一概には言えない / 一概に～とは限らない. Option 1 would be 一般的に or 簡単に言えば."}]}]},{"id":"m5","title":"問題5 文法形式の判断","en":"Grammar form","instr":"次の文の（　　）に入れるのに最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":26,"q":"社長の許可（　　）、この資料を社外に出すことはできない。","o":["なくして","ならでは","をよそに","をもって"],"a":0,"e":"<b>NなくしてはV(negative)</b> = without N, ～ can't happen. Here it shows the need for permission. ならでは = unique to (京都ならではの味), をよそに = ignoring (心配をよそに), をもって = by means of, as of (本日をもって)."}]},{"qs":[{"n":27,"q":"彼の料理の腕前は、プロ（　　）だ。","o":["ずくめ","顔負け","まみれ","ぐるみ"],"a":1,"e":"<b>N顔負け (かおまけ)</b> = so good it would put N to shame. プロ顔負け, 大人顔負け. ずくめ = full of (いいことずくめ), まみれ = covered in something dirty (泥まみれ), ぐるみ = including all (家族ぐるみ)."}]},{"qs":[{"n":28,"q":"合格の知らせを聞いた彼女は、飛び上がら（　　）喜んだ。","o":["ないまでも","んばかりに","んがため","ずにはすまず"],"a":1,"e":"<b>Vない形 + んばかりに</b> = as if about to V, almost V-ing. 飛び上がらんばかりに喜ぶ = so happy she almost jumped. んがため = in order to (archaic purpose), ないまでも = even if not quite, ずにはすまない = will have to (no way to avoid)."}]},{"qs":[{"n":29,"q":"一度失敗した（　　）、あきらめるのはまだ早い。","o":["ばかりに","だけあって","からといって","とあって"],"a":2,"e":"<b>～からといって</b> = just because ～ (doesn't mean ...). It sets up a contrast with what follows. ばかりに = only because (bad result), だけあって = as expected of, とあって = because of a special situation."}]},{"qs":[{"n":30,"q":"このプロジェクトのリーダーには、彼（　　）適任者はいない。","o":["をよそに","にもまして","をもって","をおいて"],"a":3,"e":"<b>Nをおいて～ない</b> = there is no one except N, N is the only one. 彼をおいて適任者はいない. にもまして = even more than (以前にもまして)."}]},{"qs":[{"n":31,"q":"親の心配（　　）、彼は一人で海外へ旅立った。","o":["をよそに","をめぐって","を皮切りに","をもって"],"a":0,"e":"<b>Nをよそに</b> = paying no attention to N, ignoring N (worry, opposition, etc.). をめぐって = concerning, about a dispute, を皮切りに = starting with."}]},{"qs":[{"n":32,"q":"今回の事故は、確認を怠った私の責任で（　　）。","o":["あるまいし","なくもない","なくてなんだろう","しかるべきだ"],"a":2,"e":"<b>Nでなくてなんだろう</b> = if this isn't N, what is? So, it is definitely N. A strong, literary way to assert. なくもない = it's not that I don't, しかるべきだ = it's appropriate to."}]},{"qs":[{"n":33,"q":"子どもじゃある（　　）、自分のことは自分でしなさい。","o":["ものか","まいし","まじき","べく"],"a":1,"e":"<b>Nじゃあるまいし</b> = it's not like you're N, so ... Typically followed by advice or a command. まじき = should not (in 学生にあるまじき行為), べく = in order to."}]},{"qs":[{"n":34,"q":"彼は医師という立場に（　　）、患者の個人情報を外部に漏らした。","o":["あっての","あればこそ","ありながら","あるまじく"],"a":2,"e":"<b>～ありながら</b> = despite being ～ (ながら as contrast). He is a doctor, but he leaked information. あっての = possible only because of (客あっての商売), あればこそ = precisely because there is."}]},{"qs":[{"n":35,"q":"年末（　　）、どの店も買い物客で混雑している。","o":["とあって","ともなく","といえども","とばかりに"],"a":0,"e":"<b>Nとあって</b> = because it is (a special situation) N, so naturally ... 年末とあって混雑している. といえども = even though, とばかりに = as if to say."}]}]},{"id":"m6","title":"問題6 文の組み立て","en":"Sentence building","instr":"次の文の ★ に入る最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":36,"q":"彼の作品は、＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 評価が高い。","o":["海外","国内","はもとより","でも"],"a":0,"e":"Correct order: 国内 はもとより <b>海外</b> でも 評価が高い (2 3 1 4). <b>AはもとよりBも/でも</b> = not only A but also B. The ★ is the 3rd slot, 海外."}]},{"qs":[{"n":37,"q":"彼女は ＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 、毎日練習を欠かさない。","o":["歌手に","プロの","なる","べく"],"a":2,"e":"Correct order: プロの 歌手に <b>なる</b> べく (2 1 3 4). <b>Vる + べく</b> = in order to V (formal). The ★ is なる."}]},{"qs":[{"n":38,"q":"皆様の ＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 成功はありえませんでした。","o":["今回の","なくして","温かい","ご協力"],"a":1,"e":"Correct order: 温かい ご協力 <b>なくして</b> 今回の 成功は (3 4 2 1). <b>NなくしてはVない</b> = without N, impossible. The ★ is なくして."}]},{"qs":[{"n":39,"q":"人は ＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 気づくものだ。","o":["はじめて","失って","大切さに","その"],"a":3,"e":"Correct order: 失って はじめて <b>その</b> 大切さに 気づく (2 1 4 3). <b>Vてはじめて</b> = only after V-ing. The ★ is その."}]},{"qs":[{"n":40,"q":"雨が ＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 、試合は予定どおり行われた。","o":["ものの","降って","いた","少し"],"a":2,"e":"Correct order: 少し 降って <b>いた</b> ものの (4 2 3 1). <b>～ものの</b> = although. 少し goes before the verb. The ★ is いた."}]}]},{"id":"m7","title":"問題7 文章の文法","en":"Grammar in a passage","instr":"次の文章を読んで、文章全体の内容を考えて、41 から 45 の中に入る最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　最近、手紙を書く機会がめっきり減った。用件はメールやメッセージアプリで済んでしまうし、そのほうが早くて便利だ。（41）、先日、久しぶりに祖母から手紙が届いた。少し震えた文字で、季節のあいさつから始まり、私の体調を気遣う言葉が並んでいた。</p><p>　読みながら、私は不思議な温かさを感じた。内容（42）、ごく普通のものだ。それでも心を動かされたのは、一文字一文字に祖母が費やした時間が感じられたからだろう。メールなら数分で書ける内容も、手書きとなると（43）。便せんを選び、言葉を考え、間違えれば書き直す。その手間そのものが、相手を思う気持ちの表れなのだ。</p><p>　もちろん、メールを否定する（44）。急ぎの連絡には、やはりメールが向いている。ただ、大切な人に気持ちを伝えたいときくらいは、手間をかけてみてもいいのではないか。祖母への返事は、ペンで（45）。</p>","qs":[{"n":41,"q":"（41）","o":["そのうえ","ところが","したがって","つまり"],"a":1,"e":"Before: letters are rare and email is convenient. After: surprisingly, a letter came. That is a contrast, so <b>ところが</b> (however, but then). そのうえ = moreover, したがって = therefore, つまり = in other words."},{"n":42,"q":"（42）","o":["だけ見れば","に限って","ならでは","をめぐって"],"a":0,"e":"<b>内容だけ見れば、ごく普通</b> = if you look only at the content, it's ordinary. The next sentence says it was moving anyway (それでも). に限って = only in the case of (often with bad luck), ならでは = unique to."},{"n":43,"q":"（43）","o":["そうでもない","そうに違いない","そうはいかない","そうするしかない"],"a":2,"e":"Email takes a few minutes, but handwriting <b>そうはいかない</b> = it doesn't work that way (it takes time). The next sentence lists all the effort. That confirms it."},{"n":44,"q":"（44）","o":["までもない","ものではない","わけにはいかない","つもりはない"],"a":3,"e":"<b>否定するつもりはない</b> = I don't intend to reject email. Then she admits email is good for urgent contact. わけにはいかない would mean she can't deny it (wrong nuance), までもない = there's no need to."},{"n":45,"q":"（45）","o":["書かれている","書いてみようと思う","書くべきだった","書いたことがある"],"a":1,"e":"The conclusion says it's worth taking time for important people, so her decision is <b>書いてみようと思う</b> = I think I'll try writing it (with a pen). べきだった = should have (a regret about the past) doesn't fit."}]}]},{"id":"r8","title":"問題8 内容理解（短文）","en":"Reading: short passages","instr":"次の（1）から（4）の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>（1）</p><p>　「失敗は成功のもと」という言葉がある。しかし、失敗さえすれば成功に近づけるわけではない。なぜうまくいかなかったのかを振り返らなければ、同じ失敗を繰り返すだけだ。大切なのは、失敗したという事実ではなく、その後に何をするかである。失敗を恐れて挑戦しないのは論外だが、失敗を重ねることを努力と勘違いしてもいけない。</p>","qs":[{"n":46,"q":"筆者の考えに合うものはどれか。","o":["失敗した後にその原因を考えることが、成功につながる。","失敗を恐れずに、できるだけ多く挑戦するべきだ。","失敗しないように、事前に十分な準備をするべきだ。","失敗の経験が多い人ほど、成功しやすい。"],"a":0,"e":"Key line: <b>なぜうまくいかなかったのかを振り返らなければ、同じ失敗を繰り返すだけ</b> and <b>大切なのは…その後に何をするか</b>. Option 2 and 4 are the trap: the author says piling up failures is NOT the same as effort (失敗を重ねることを努力と勘違いしてもいけない)."}]},{"passage":"<p>（2）</p><p>以下は、ある会社の社内に出されたお知らせである。</p><div class='notice'><p>社員各位</p><p>　11月1日より、会議室の予約方法が変わります。これまでは総務部への電話で受け付けていましたが、11月1日以降は社内システムからの予約のみとなります。<br>　なお、10名以上で使用する大会議室については、システムで予約した上で、使用日の3日前までに総務部へ利用目的を届け出てください。届け出がない場合、予約は自動的に取り消されますのでご注意ください。</p><p style='text-align:right'>総務部</p></div>","qs":[{"n":47,"q":"11月以降、12名で大会議室を使いたい人はどうしなければならないか。","o":["総務部に電話で予約し、3日前までに利用目的を伝える。","3日前までに総務部に利用目的を届け出れば、予約は必要ない。","システムで予約すれば、ほかに何もする必要はない。","システムで予約し、3日前までに総務部に利用目的を届け出る。"],"a":3,"e":"Two steps are needed: <b>システムで予約した上で</b> (after booking in the system) AND <b>3日前までに総務部へ利用目的を届け出る</b>. 12 people counts as 10名以上. Phone booking ends on Nov 1. Watch for <b>なお</b>: in notices, it often introduces the extra condition that the question is about."}]},{"passage":"<p>（3）</p><p>　子どもに「勉強しなさい」と何度言っても、なかなか机に向かわないものだ。ところが、親が楽しそうに本を読んでいると、子どもは自然とそれをまねし始めるという。子どもは親の言葉よりも、親の姿を見て育つのである。何かを身につけさせたいなら、まず大人自身がそれを楽しんでいる姿を見せるのが近道なのかもしれない。</p>","qs":[{"n":48,"q":"筆者によると、子どもに何かを身につけさせるにはどうするのがよいか。","o":["何度も繰り返して言い聞かせる。","大人がそれを楽しむ姿を見せる。","子どもが興味を持つまで待つ。","楽しく学べる教材を用意する。"],"a":1,"e":"Final sentence: <b>まず大人自身がそれを楽しんでいる姿を見せるのが近道</b>. Option 1 is exactly what the passage says does NOT work."}]},{"passage":"<p>（4）</p><p>　人工知能が文章を書く時代になり、人間が文章を書く意味を問う声もある。だが、書くという行為は、単に情報を伝えるためだけのものではない。頭の中にあるぼんやりとした考えは、言葉にしようとして初めて形になる。書きながら、自分が何を考えていたのかに気づくことも少なくない。書くことは、考えることそのものなのである。</p>","qs":[{"n":49,"q":"筆者が最も言いたいことは何か。","o":["人工知能が書く文章は、人間の文章より劣っている。","情報を正確に伝えるには、人間が書いたほうがよい。","文章を書くことは、考えを形にする作業でもある。","書く前に、自分の考えをはっきりさせておくべきだ。"],"a":2,"e":"Main point is the last line: <b>書くことは、考えることそのもの</b>. Ideas take shape only when you try to put them into words. Option 4 is the reverse: the author says you discover your thoughts WHILE writing, not before. The author never compares AI and human quality (option 1)."}]}]},{"id":"r9","title":"問題9 内容理解（中文）","en":"Reading: mid-length passages","instr":"次の（1）から（3）の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>（1）</p><p>　電車を待つ数分間、ほとんどの人がスマートフォンを取り出す。私もその一人だ。少しでも空いた時間があると、つい画面を見てしまう。かつては、待ち時間にぼんやりと景色を眺めたり、考え事をしたりしていたはずなのに、いつの間にかそうした時間はなくなってしまった。</p><p>　先日、スマートフォンを家に忘れて出かけたことがある。最初は落ち着かず、何度もポケットに手を入れた。しかし、しばらくすると、普段は気にも留めない街の音や、行き交う人々の表情が目に入ってくるようになった。そして、ずっと解決できずにいた仕事の問題について、ふと新しいアイデアが浮かんだのである。</p><p>　何もしていないときにも脳は活発に働いており、<u>①そうした時間</u>に記憶が整理されたり、ひらめきが生まれたりすると言われている。退屈な時間は、決して無駄な時間ではないのだ。</p><p>　もちろん、スマートフォンを手放せと言いたいわけではない。便利な道具であることは間違いない。ただ、空いた時間をすべて情報で埋めてしまうことで、私たちは<u>②大切なもの</u>を失っているのかもしれない。たまには何もしない時間を、意識して作ってみてはどうだろうか。</p>","qs":[{"n":50,"q":"筆者がスマートフォンを家に忘れた日に気づいたことは何か。","o":["スマートフォンがないと、仕事に集中できないこと","スマートフォンを使いすぎると、疲れやすいこと","待ち時間には、景色を眺めるほうが楽しいこと","周りの様子に目を向けていると、考えが浮かぶこともあること"],"a":3,"e":"Paragraph 2: he started noticing street sounds and faces (周りの様子), then <b>ふと新しいアイデアが浮かんだ</b>. Option 3 adds 楽しい, which is not stated."},{"n":51,"q":"<u>①そうした時間</u>とはどのような時間か。","o":["スマートフォンで情報を集めている時間","仕事の問題について考えている時間","特に何もしていない時間","記憶を整理しようとしている時間"],"a":2,"e":"そうした points back in the same sentence: <b>何もしていないとき</b>. Option 4 is a trap: memory gets organized automatically, not because you are trying to organize it."},{"n":52,"q":"<u>②大切なもの</u>とは何か。","o":["退屈な時間から生まれる考えやひらめき","便利な道具を使いこなす力","周りの人と話す機会","新しい情報を得る楽しみ"],"a":0,"e":"Filling every free moment with information means losing the empty time. The passage says empty time is where <b>記憶が整理されたり、ひらめきが生まれたり</b> happen. So what we lose is those ideas and insights."}]},{"passage":"<p>（2）</p><p>　町の小さな書店が次々と姿を消している。インターネットで注文すれば翌日には本が届き、電子書籍ならその場ですぐに読める。品ぞろえでも価格でも、小さな書店が太刀打ちするのは難しい。</p><p>　そんな中、私の住む町で、ある書店が開店から五年を迎えた。店の広さは普通のコンビニほどで、置いてある本の数も決して多くない。しかし、店主が自分で読んで選んだ本ばかりが並び、一冊一冊に手書きの紹介文が添えられている。客は目当ての本を買いに来るというより、<u>①思いがけない一冊に出会う</u>ために足を運ぶのだ。</p><p>　店主によると、ネットで本を買う人は、すでに知っている本や、似たような本ばかりを選びがちだという。おすすめ機能は便利だが、その人の好みの範囲から外れた本を薦めることは少ない。「自分では選ばなかったはずの本が、人生を変えることもある。そういう出会いを作るのが、書店の役目だと思っています」と店主は話す。</p><p>　本を手に入れるだけなら、ネットのほうがはるかに効率的だ。しかし、<u>②書店の価値</u>は、効率とは別のところにあるのではないか。この店が五年続いてきたことが、それを物語っているように思う。</p>","qs":[{"n":53,"q":"この書店の特徴として正しいものはどれか。","o":["ほかの書店より本の数が多い。","本の値段がネットより安い。","店主が選んだ本に紹介文がついている。","客が読みたい本を注文できる。"],"a":2,"e":"<b>店主が自分で読んで選んだ本ばかり…手書きの紹介文が添えられている</b>. Option 1 is the opposite (本の数も決して多くない)."},{"n":54,"q":"<u>①思いがけない一冊に出会う</u>とはどういうことか。","o":["探していた本をすぐに見つけること","店主と本について話すこと","安い値段で本を買えること","自分では選ばないような本と出会うこと"],"a":3,"e":"思いがけない = unexpected. Paragraph 3 explains it: <b>自分では選ばなかったはずの本</b>. Option 1 is the opposite (目当ての本 = the book you came for)."},{"n":55,"q":"<u>②書店の価値</u>について、筆者はどう考えているか。","o":["ネットより早く本を届けられることにある。","品ぞろえが多いことにある。","予想していなかった本との出会いを生むことにある。","町の人が集まる場所になることにある。"],"a":2,"e":"<b>効率とは別のところ</b> (not efficiency) refers back to the store owner's words: the bookstore's role is to create unexpected encounters with books. Option 4 sounds nice, but it is never mentioned."}]},{"passage":"<p>（3）</p><p>　「見れる」「食べれる」といった、いわゆる「ら抜き言葉」は、言葉の乱れとしてしばしば批判されてきた。正しくは「見られる」「食べられる」であり、テレビの字幕などでは今も直されることが多い。</p><p>　しかし、言葉の研究者の間では、ら抜き言葉を単なる乱れとは見なさない考え方が広がっている。「見られる」には、可能の意味のほかに、受身や尊敬の意味もある。そのため、「先生が見られる」と言った場合、先生が見ることができるのか、先生が誰かに見られるのか、先生が見るという尊敬なのか、文脈がなければ区別しにくい。「見れる」と言えば、可能の意味であることがはっきりする。つまり、ら抜き言葉は、<u>①意味の区別をつける</u>という点で、むしろ合理的な変化だというわけだ。</p><p>　言葉は、使う人々によって常に形を変えていくものである。今では正しいとされている言い方も、かつては誤りとされていたものが少なくない。もちろん、改まった場面では、規範的な言い方を使うべきだろう。しかし、新しい言い方を頭から否定するのではなく、なぜそうした変化が起きたのかを考えてみることも大切ではないだろうか。</p>","qs":[{"n":56,"q":"筆者によると、「見られる」にはどのような問題があるか。","o":["改まった場面では使えない。","若い人の間で使われなくなっている。","いくつかの意味があり、区別しにくいことがある。","テレビの字幕で直されることが多い。"],"a":2,"e":"見られる can mean potential, passive or honorific, so <b>文脈がなければ区別しにくい</b>. Option 1 is backwards: 見られる is the standard (規範的) form for formal situations."},{"n":57,"q":"<u>①意味の区別をつける</u>とはどういうことか。","o":["可能の意味であることがはっきりわかる。","尊敬の意味を強く表せる。","受身と尊敬を区別できる。","正しい言葉と誤った言葉を区別できる。"],"a":0,"e":"Right before it: <b>「見れる」と言えば、可能の意味であることがはっきりする</b>. 見れる separates the potential meaning from the other two."},{"n":58,"q":"筆者の考えに合うものはどれか。","o":["ら抜き言葉は、どんな場面で使ってもかまわない。","新しい言い方は、変化の理由を考えずに否定すべきではない。","規範的な言い方は、もう必要ない。","ら抜き言葉は、いずれ正しい言葉として認められる。"],"a":1,"e":"Last sentence: <b>頭から否定するのではなく、なぜそうした変化が起きたのかを考えてみることも大切</b>. Options 1 and 3 are wrong because the author says formal situations still need the standard form. Option 4 is a prediction the author never makes."}]}]},{"id":"r10","title":"問題10 内容理解（長文）","en":"Reading: long passage","instr":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　近年、「わかりやすさ」が何よりも求められるようになった。テレビのニュースでは複雑な問題が図やイラストを使って短く解説され、書店には「一時間でわかる」「図解でわかる」といった題名の本が並ぶ。難しいことを簡単に説明できる人は高く評価され、反対に、説明がわかりにくい人は、それだけで能力が低いと見なされることさえある。</p><p>　わかりやすく伝える工夫そのものは、もちろん悪いことではない。専門的な知識を多くの人に届けるうえで、欠かせない技術である。私自身、大学で講義をする際には、できるだけ身近な例を挙げて説明するよう心がけている。</p><p>　しかし、<u>①わかりやすさが行き過ぎると</u>、思わぬ落とし穴がある。世の中の問題の多くは、本来、単純には割り切れないものだ。たとえば、ある政策が良いか悪いかは、誰の立場から見るか、どれくらいの期間で考えるかによって答えが変わる。こうした複雑さを省いて「要するにこういうことです」とまとめてしまえば、確かに聞き手は納得しやすい。だが、そのとき切り捨てられた部分にこそ、問題の本質が隠れていることも多いのである。</p><p>　さらに心配なのは、わかりやすい説明に慣れることで、受け手の側が<u>②わからない状態に耐えられなくなる</u>ことだ。すぐに答えが示されないと不安になり、簡単な結論を示してくれる人の言葉を、深く考えずに信じてしまう。これは、考える力を他人に預けてしまうことにほかならない。</p><p>　学生と接していても、そうした傾向を感じることがある。レポートの課題を出すと、「結論は何を書けば正解ですか」と聞きに来る学生が少なくない。彼らにとって、問いには必ず一つの正解があり、それを早く見つけることが勉強なのだ。しかし、大学で学ぶべきなのは、正解のない問いに向き合い、迷いながらも自分なりの答えを探し続ける姿勢のはずである。</p><p>　わからないことは、決して恥ずかしいことではない。むしろ、すぐにはわからないものに粘り強く向き合う中で、人は考える力を身につけていく。わかりやすさを求めるのと同じくらい、わからなさを抱えておく力も大切にしたい。</p>","qs":[{"n":59,"q":"筆者は、わかりやすく伝えることについてどう考えているか。","o":["専門家が使うべきではない技術だ。","大学の講義では使わないほうがよい技術だ。","能力の低い人ほど必要とする技術だ。","知識を多くの人に届けるために必要な技術だ。"],"a":3,"e":"Paragraph 2: <b>専門的な知識を多くの人に届けるうえで、欠かせない技術</b>. The author even uses it himself in lectures, so option 2 is wrong. The author's criticism is only about going too far."},{"n":60,"q":"<u>①わかりやすさが行き過ぎると</u>、どうなると筆者は考えているか。","o":["複雑な部分が省かれ、問題の本質が見えなくなる。","説明が長くなり、聞き手が飽きてしまう。","専門家の評価が下がってしまう。","聞き手が説明を信用しなくなる。"],"a":0,"e":"Same paragraph: <b>複雑さを省いて…切り捨てられた部分にこそ、問題の本質が隠れている</b>. Option 4 is the opposite: listeners trust too easily (納得しやすい)."},{"n":61,"q":"<u>②わからない状態に耐えられなくなる</u>と、どうなるか。","o":["自分で調べる習慣がつく。","難しい本を避けるようになる。","簡単な結論を、深く考えずに受け入れてしまう。","他人に質問できなくなる。"],"a":2,"e":"Next sentence: <b>簡単な結論を示してくれる人の言葉を、深く考えずに信じてしまう</b>. In N1, the answer to an underlined part is very often in the sentence right after it."},{"n":62,"q":"この文章で筆者が最も言いたいことは何か。","o":["わかりやすい説明は問題の本質を隠すので、避けるべきだ。","大学では、正解を早く見つける力を育てるべきだ。","すぐにはわからないことにも、向き合い続ける力が大切だ。","説明がわかりにくい人の能力を、低く評価すべきではない。"],"a":2,"e":"The last paragraph holds the main idea: <b>わからなさを抱えておく力も大切にしたい</b>. Option 1 goes too far, since the author says clarity itself is good. 主張 questions usually match the final paragraph."}]}]},{"id":"r11","title":"問題11 統合理解","en":"Integrated comprehension (A vs B)","instr":"次のAとBの文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p><b>A</b></p><p>　在宅勤務が広がり、通勤の負担から解放された人は多い。満員電車に乗る必要がなくなり、その分の時間を家族と過ごしたり、自分の勉強に充てたりできる。また、職場では話しかけられて作業が中断されることも多いが、自宅なら集中して仕事に取り組める。企業にとっても、オフィスの賃料を減らせるという利点がある。働く場所を選べることは、育児や介護と仕事を両立させたい人にとっても大きな助けになるだろう。在宅勤務は、これからの働き方の中心になっていくべきだ。</p><p><b>B</b></p><p>　在宅勤務には確かに便利な面がある。しかし、長く続けるうちに、問題も見えてきた。最も大きいのは、社員同士のちょっとした会話が失われたことだ。廊下ですれ違ったときの雑談や、隣の席の同僚への何気ない質問から、新しい発想が生まれたり、仕事上の問題が早めに見つかったりすることは多い。特に、入社したばかりの若手社員にとっては、先輩の仕事ぶりを近くで見て学ぶ機会がなくなってしまう。在宅勤務の利点を生かしつつも、人が顔を合わせる場の価値を見直す必要があるのではないか。</p>","qs":[{"n":63,"q":"AとBのどちらの文章にも触れられている点は何か。","o":["在宅勤務によって、通勤時間を自由に使えること","在宅勤務によって、企業の費用が減ること","在宅勤務では、若手社員が学ぶ機会が減ること","在宅勤務には、便利な面があること"],"a":3,"e":"A lists many benefits. B opens with <b>確かに便利な面がある</b>. Options 1 and 2 appear only in A, option 3 only in B. For どちらにも questions, check each option against BOTH texts."},{"n":64,"q":"在宅勤務について、AとBはどのように述べているか。","o":["Aはこれからの働き方の中心にすべきだと述べ、Bは人が顔を合わせる場の価値も見直すべきだと述べている。","AもBも、在宅勤務はやめるべきだと述べている。","Aは企業にとっての利点を中心に述べ、Bは社員の不満を中心に述べている。","Aは自宅では集中できないと述べ、Bは雑談が増えると述べている。"],"a":0,"e":"Compare the last sentences: A ends with <b>働き方の中心になっていくべき</b>, B ends with <b>顔を合わせる場の価値を見直す必要</b>. B does not reject remote work (利点を生かしつつ), so option 2 is wrong."}]}]},{"id":"r12","title":"問題12 主張理解（長文）","en":"Reading: author's argument","instr":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　「好きなことを仕事にしよう」という言葉をよく耳にする。好きなことであれば、つらいことがあっても頑張れるし、毎日を楽しく過ごせる。若い人に向けて、そう語りかける本や講演も多い。</p><p>　しかし、私はこの言葉に、どこか<u>①息苦しさ</u>を感じてしまう。まず、自分が何を好きなのか、はっきりわかっている人はそれほど多くない。特に、社会に出る前の若者にとって、知っている仕事の種類は限られている。その狭い範囲の中から「好きなこと」を探せと言われても、困ってしまうのが当然だろう。好きなことが見つからない自分は駄目なのだと、思い詰めてしまう人もいるかもしれない。</p><p>　また、好きなことを仕事にした結果、かえってそれが嫌いになってしまうという話も聞く。趣味であれば自分のペースで楽しめたことも、仕事となれば締め切りがあり、客の要望に応えなければならない。好きだったはずのことが、義務に変わってしまうのだ。</p><p>　私自身のことを言えば、今の仕事は最初から好きだったわけではない。就職先を決めたのは、たまたま声をかけてもらったからに過ぎない。初めのうちは失敗ばかりで、辞めたいと思ったことも一度や二度ではなかった。それでも続けているうちに、少しずつできることが増え、周りから頼られるようにもなった。そうなると、不思議なもので、仕事が面白く感じられるようになったのである。</p><p>　<u>②この経験</u>から言えるのは、「好き」は最初からそこにあるものではなく、関わり続ける中で育っていくものだということだ。何かに真剣に取り組み、上達し、それが誰かの役に立つ。その過程の中で、人はその対象を好きになっていくのではないか。</p><p>　だとすれば、仕事を選ぶ段階で、好きかどうかにそれほどこだわる必要はないだろう。大切なのは、目の前のことにまずは誠実に取り組んでみることだ。好きなことを仕事にするのではなく、仕事を好きになっていく。そういう道があってもいいと私は思う。</p>","qs":[{"n":65,"q":"筆者が<u>①息苦しさ</u>を感じる理由として、合っているものはどれか。","o":["好きなことを仕事にしても、収入が少ないから","好きなことを仕事にする人が、増えすぎているから","好きなことがわからない人が、自分を責めてしまうことがあるから","若者が知っている仕事の種類が、多すぎるから"],"a":2,"e":"<b>好きなことが見つからない自分は駄目なのだと、思い詰めてしまう人もいる</b>. 思い詰める = to brood, blame yourself. Option 4 is reversed: young people know too FEW jobs (限られている)."},{"n":66,"q":"好きなことを仕事にした場合について、筆者はどのように述べているか。","o":["締め切りや客の要望のために、好きでなくなることがある。","つらいことがあっても、必ず頑張れる。","趣味のときより、さらに好きになる。","自分のペースで楽しむことができる。"],"a":0,"e":"Paragraph 3: <b>締め切りがあり、客の要望に応えなければならない…義務に変わってしまう</b>. Option 2 is the popular view the author argues against. Option 4 describes hobbies, not work."},{"n":67,"q":"<u>②この経験</u>とはどのような経験か。","o":["好きな仕事を見つけるまで、何度も仕事を変えた経験","周りの人に頼られて、仕事を選んだ経験","好きな仕事に就いたが、失敗ばかりで辞めた経験","最初は好きではなかった仕事が、続けるうちに面白くなった経験"],"a":3,"e":"この経験 = paragraph 4: the job wasn't something he liked at first (最初から好きだったわけではない), but by continuing, <b>仕事が面白く感じられるようになった</b>. He didn't quit (option 3)."},{"n":68,"q":"筆者の考えに最も近いものはどれか。","o":["仕事は、好きかどうかで選ぶべきだ。","好きなことは、仕事にしないほうがよい。","好きという気持ちは、取り組み続けるうちに生まれてくる。","仕事が好きになれないなら、早めに辞めるべきだ。"],"a":2,"e":"Core claim: <b>「好き」は…関わり続ける中で育っていくもの</b>. Option 2 is too extreme: he only says there can be another path (そういう道があってもいい), not that you should never work on what you love."}]}]},{"id":"r13","title":"問題13 情報検索","en":"Information retrieval","instr":"次は、ある市の文化センターの講座案内である。下の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<div class='notice'><p style='text-align:center'><b>さくら市民文化センター　秋の講座案内</b></p><table class='tbl'><tr><th>講座</th><th>日時</th><th>回数</th><th>受講料</th><th>対象</th><th>定員</th></tr><tr><td>A 初めての陶芸</td><td>土曜 10:00～12:00</td><td>全4回</td><td>6,000円<br>(材料費込み)</td><td>市内在住または在勤の方</td><td>12名</td></tr><tr><td>B スマホで撮る写真教室</td><td>水曜 19:00～20:30</td><td>全3回</td><td>3,000円</td><td>どなたでも<br>(小学生以上)</td><td>20名</td></tr><tr><td>C 親子で楽しむ料理教室</td><td>日曜 10:00～13:00</td><td>全2回</td><td>1組 4,000円<br>(材料費 1回1,000円が別に必要)</td><td>小学生とその保護者</td><td>8組</td></tr><tr><td>D ビジネス英会話（中級）</td><td>火曜 19:00～21:00</td><td>全8回</td><td>16,000円</td><td>市内在住または在勤の方<br>(高校生以上)</td><td>15名</td></tr><tr><td>E 初心者のための書道</td><td>土曜 14:00～16:00</td><td>全4回</td><td>5,000円<br>(道具の貸し出しあり)</td><td>どなたでも</td><td>15名</td></tr></table><p>【申し込み】10月20日（月）までに、センター窓口または電話でお申し込みください。応募者が定員を超えた場合は抽選となります。</p><p>【注意】市外にお住まいの方は、受講料が2割増しとなります（市内の会社や学校に通っている方も含みます）。小学生は、保護者の同伴が必要です。</p></div>","qs":[{"n":69,"q":"リンさんは隣の市に住み、さくら市の会社に勤めている。土曜日の講座に参加したいが、費用はできるだけ安くしたい。リンさんが申し込む講座と受講料はどれか。","o":["Aで6,000円","Aで7,200円","Eで5,000円","Eで6,000円"],"a":3,"e":"Saturday courses are A and E. She works in the city (在勤), so she CAN join A. But she lives outside the city, so the fee is <b>+20% (2割増し)</b>, even for people who work in the city (市内の会社に通っている方も含みます). A = 6,000 × 1.2 = 7,200円. E = 5,000 × 1.2 = <b>6,000円</b>. E is cheaper. Info retrieval questions almost always hide a condition in the 注意 notes."},{"n":70,"q":"市内に住む会社員の田中さんは、平日の夜に、小学生の娘と一緒に参加できる講座を探している。田中さんの希望に合う講座はどれか。","o":["Bだけ","Cだけ","BとC","BとD"],"a":0,"e":"Weekday evening courses: B (Wed 19:00) and D (Tue 19:00). D is for high school students and up (高校生以上), so his daughter can't join. C is on Sunday, not a weekday. So <b>B only</b>. B allows elementary students and up, and a parent must come along, which is exactly his plan."}]}]}];
const SET2 = [{"id":"m1","title":"問題1 漢字読み","en":"Kanji reading","instr":"＿＿の言葉の読み方として最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":1,"q":"<u>拙い</u>日本語ですが、精一杯お話しします。","o":["もろい","おさない","つたない","はかない"],"e":"<b>拙い (つたない)</b> = clumsy, unskilled. A common humble phrase is 拙い文章ですが. もろい = 脆い (fragile), おさない = 幼い (young), はかない = 儚い (fleeting).","a":2}]},{"qs":[{"n":2,"q":"仕事が忙しくても、健康管理を<u>疎か</u>にしてはいけない。","o":["おろか","まばら","うとか","おろそか"],"e":"<b>疎か (おろそか)</b> = neglectful, careless. ～を疎かにする = to neglect something. おろか = 愚か (foolish), so watch the length. 疎 is also read うと in 疎い (うとい), but うとか is not a word.","a":3}]},{"qs":[{"n":3,"q":"今回のプロジェクトでは、田中さんが<u>采配</u>を振った。","o":["さいばい","ざいはい","さいぱい","さいはい"],"e":"<b>采配 (さいはい)</b> = command, direction. 采配を振る = to take command. No voicing on は. さいばい is 栽培 (cultivation), which makes it a sound-alike trap.","a":3}]},{"qs":[{"n":4,"q":"地域で協力し合う雰囲気を<u>醸成</u>することが大切だ。","o":["じょせい","じょうせい","じょうぜい","しょうせい"],"e":"<b>醸成 (じょうせい)</b> = to foster, cultivate (an atmosphere or mood). 醸 = じょう (as in 醸造 じょうぞう, brewing). The long vowel じょう is the key point.","a":1}]},{"qs":[{"n":5,"q":"彼は新しい知識を<u>貪欲</u>に吸収している。","o":["どんよく","たんよく","ひんよく","どんらく"],"e":"<b>貪欲 (どんよく)</b> = greedy, eager. In a positive sense: 貪欲に学ぶ = learn eagerly. 貪 = どん, 欲 = よく.","a":0}]},{"qs":[{"n":6,"q":"この施設の運営費は、すべて寄付で<u>賄われて</u>いる。","o":["つぐなわれて","あがなわれて","まかなわれて","うるおわれて"],"e":"<b>賄う (まかなう)</b> = to cover (costs), to supply. 費用を賄う. つぐなう = 償う (compensate), あがなう = 贖う (atone), うるおう = 潤う (be moistened, prosper).","a":2}]}]},{"id":"m2","title":"問題2 文脈規定","en":"Word in context","instr":"（　　）に入れるのに最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":7,"q":"新製品の発売に（　　）、記者会見が開かれた。","o":["先駆け","先回り","先送り","先立ち"],"e":"<b>Nに先立ち (さきだち)</b> = prior to N. It's a fixed pattern. 先駆け (さきがけ) = pioneer (時代の先駆け), 先回り = getting ahead of someone, 先送り = postponing.","a":3}]},{"qs":[{"n":8,"q":"その政治家の不用意な発言は、多くの国民の（　　）を買った。","o":["反論","反省","反響","反感"],"e":"<b>反感を買う (はんかんをかう)</b> = to provoke antipathy. A fixed collocation. 反論 = counterargument (反論する), 反響 = response (反響を呼ぶ).","a":3}]},{"qs":[{"n":9,"q":"彼女はどんな仕事も（　　）こなす、頼りになる存在だ。","o":["そつなく","あっけなく","さりげなく","ぎこちなく"],"e":"<b>そつなく</b> = smoothly, without mistakes. そつなくこなす is a set phrase. あっけなく = disappointingly quickly (あっけなく負けた), さりげなく = casually, ぎこちなく = awkwardly.","a":0}]},{"qs":[{"n":10,"q":"二つの案にはそれぞれ長所があり、（　　）をつけがたい。","o":["善悪","是非","優劣","損得"],"e":"<b>優劣をつけがたい (ゆうれつ)</b> = hard to say which is better. 善悪 = good and evil (morality), 是非 = right or wrong, 損得 = profit and loss. Only 優劣 compares quality.","a":2}]},{"qs":[{"n":11,"q":"残業を減らすため、会社は仕事の（　　）を一から見直した。","o":["キャリア","スタンス","ノウハウ","プロセス"],"e":"<b>プロセス</b> = process, workflow. 仕事のプロセスを見直す = to rethink how work is done. キャリア = career, スタンス = stance, position, ノウハウ = know-how (you gain or share it, you don't redesign it).","a":3}]},{"qs":[{"n":12,"q":"同じ説明を何度もさせられて、もう（　　）している。","o":["うんざり","うっとり","ぐったり","すっきり"],"e":"<b>うんざり</b> = fed up, sick of something. うっとり = enchanted, ぐったり = physically exhausted, すっきり = refreshed. Repetition makes you feel うんざり.","a":0}]},{"qs":[{"n":13,"q":"彼の提案は（　　）だが、実現するには費用がかかりすぎる。","o":["消極的","画期的","断続的","形式的"],"e":"<b>画期的 (かっきてき)</b> = groundbreaking. だが shows a contrast: a great idea, BUT too expensive. That's why the blank needs something positive. 消極的 = passive, 断続的 = intermittent, 形式的 = formal, a mere formality.","a":1}]}]},{"id":"m3","title":"問題3 言い換え類義","en":"Paraphrase","instr":"＿＿の言葉に意味が最も近いものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":14,"q":"会議の資料は<u>あらかじめ</u>読んでおいてください。","o":["前もって","必ず","ゆっくり","もう一度"],"e":"<b>あらかじめ (予め)</b> = in advance. The closest is 前もって. 事前に is another close word.","a":0}]},{"qs":[{"n":15,"q":"彼のスピーチは<u>ありきたりの</u>内容だった。","o":["意外な","複雑な","平凡な","感動的な"],"e":"<b>ありきたり</b> = commonplace, unoriginal. The closest is 平凡な (へいぼん). Similar words: 月並み (つきなみ), 陳腐 (ちんぷ).","a":2}]},{"qs":[{"n":16,"q":"天気予報では晴れだったが、<u>案の定</u>午後から雨が降ってきた。","o":["意外にも","突然","まもなく","やはり"],"e":"<b>案の定 (あんのじょう)</b> = just as expected (often a bad thing the speaker expected). The closest is やはり. 意外にも is the opposite.","a":3}]},{"qs":[{"n":17,"q":"計画は<u>おおむね</u>順調に進んでいる。","o":["予定より","非常に","だいたい","ようやく"],"e":"<b>おおむね (概ね)</b> = mostly, generally. The closest is だいたい or ほぼ.","a":2}]},{"qs":[{"n":18,"q":"冬の服は<u>かさばる</u>ので、旅行には少なめに持っていく。","o":["重い","汚れやすい","場所をとる","乾きにくい"],"e":"<b>かさばる (嵩張る)</b> = bulky, takes up space. The closest is 場所をとる. It is about volume, not weight, so 重い is the trap.","a":2}]},{"qs":[{"n":19,"q":"<u>ずさんな</u>管理のせいで、データが失われた。","o":["厳しすぎる","古い","複雑な","いいかげんな"],"e":"<b>ずさん (杜撰)</b> = sloppy, careless. The closest is いいかげんな. It is often used with 管理 or 計画.","a":3}]}]},{"id":"m4","title":"問題4 用法","en":"Usage","instr":"次の言葉の使い方として最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":20,"q":"<b>発足</b>","o":["地域の防災について話し合う委員会が、来月発足する。","始発の電車は、毎朝五時に駅を発足する。","明日の朝早く、家族で旅行に発足する予定だ。","長く歩いたので、足が発足して痛くなった。"],"e":"<b>発足 (ほっそく)</b> = the launch of an organization or system: 委員会が発足する, 新政権が発足する. Trains 発車する, people 出発する. It has nothing to do with feet.","a":0}]},{"qs":[{"n":21,"q":"<b>しなやか</b>","o":["このシャツは値段がしなやかで、買いやすい。","彼は難しい問題をしなやかに計算した。","今日は風がしなやかで、とても寒い。","ダンサーのしなやかな動きに、観客は見とれた。"],"e":"<b>しなやか</b> = supple, graceful, flexible (body, movement, branches). Cheap prices are 手頃 (てごろ), quick calculation is すばやく, strong wind is 強い.","a":3}]},{"qs":[{"n":22,"q":"<b>心当たり</b>","o":["彼の優しい心当たりに、思わず涙が出た。","試験の前は、心当たりで夜も眠れない。","その名前には心当たりがあるが、どこで聞いたか思い出せない。","この料理は、作った人の心当たりが感じられる。"],"e":"<b>心当たり (こころあたり)</b> = an idea of who or what something might be, a clue. 心当たりがある or ない. Kindness is 心遣い (こころづかい), worry is 心配, the heart put into food is 心がこもっている.","a":2}]},{"qs":[{"n":23,"q":"<b>交える</b>","o":["コーヒーに砂糖を交えて飲んだ。","駅で友人と交えて、一緒に帰った。","専門家を交えて、今後の対策を話し合った。","二つの道が交える場所に、大きな木がある。"],"e":"<b>交える (まじえる)</b> = to include someone in a discussion: 専門家を交えて. Sugar is 入れる or 混ぜる, meeting a friend is 会う, crossing roads use 交わる (まじわる).","a":2}]},{"qs":[{"n":24,"q":"<b>ことによると</b>","o":["ことによると、私は毎朝六時に起きています。","この料理は、ことによるとおいしかった。","ことによると、彼の説明はわかりやすい。","空が暗くなってきた。ことによると、夕方から雪になるかもしれない。"],"e":"<b>ことによると</b> = possibly, perhaps. It goes with かもしれない. It expresses a guess, not a fact or habit.","a":3}]},{"qs":[{"n":25,"q":"<b>見合わせる</b>","o":["久しぶりに会った友人と見合わせて笑った。","鏡で自分の顔を見合わせた。","この服とその帽子は、よく見合わせる。","大雪の影響で、電車は運転を見合わせている。"],"e":"<b>見合わせる (みあわせる)</b> = to suspend or postpone: 運転を見合わせる (very common in train announcements). Exchanging looks is 顔を見合わせる (needs 顔を), clothes that match 似合う.","a":3}]}]},{"id":"m5","title":"問題5 文法形式の判断","en":"Grammar form","instr":"次の文の（　　）に入れるのに最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":26,"q":"大企業の社長（　　）、自由に使える時間はほとんどないだろう。","o":["ときたら","ともなると","ならいざしらず","とはいえ"],"e":"<b>Nともなると</b> = once you reach the level of N, naturally ... ときたら = speaking of (with criticism: うちの息子ときたら), ならいざしらず = if it were N it might be OK, but ..., とはいえ = even so.","a":1}]},{"qs":[{"n":27,"q":"彼の迫力ある演技は、観客を感動させ（　　）。","o":["ずじまいだった","ずにすんだ","ずにはいられない","ずにはおかない"],"e":"<b>Vずにはおかない</b> = will inevitably cause V (for things that move people's feelings). ずにはいられない is the trap: it describes the speaker's own urge (笑わずにはいられない), and it doesn't fit 感動させる. ずじまい = ended up never doing.","a":3}]},{"qs":[{"n":28,"q":"事故で家族を失った人の話を聞き、同情を（　　）。","o":["禁じ得なかった","余儀なくされた","免れなかった","避けられなかった"],"e":"<b>Nを禁じ得ない (きんじえない)</b> = cannot help feeling N (同情, 怒り, 驚き). Formal. 余儀なくされる = to be forced to (do something), 免れない = cannot escape (responsibility, criticism).","a":0}]},{"qs":[{"n":29,"q":"実態に（　　）計画を立てなければ、成果は上がらない。","o":["際した","即した","至った","関した"],"e":"<b>Nに即した (そくした)</b> = in line with N, based on N (実態, 現実, ルール). に際して = on the occasion of, に至る = to reach a point.","a":1}]},{"qs":[{"n":30,"q":"大会まで一週間しかない。一日（　　）練習を休むわけにはいかない。","o":["ばかりか","ならでは","たりとも","なりに"],"e":"<b>一N たりとも～ない</b> = not even one N. 一日たりとも, 一円たりとも. なりに = in one's own way (私なりに).","a":2}]},{"qs":[{"n":31,"q":"皆様のますますのご活躍を、心より願って（　　）。","o":["なりません","いられません","やみません","かないません"],"e":"<b>Vてやまない</b> = to sincerely and continually wish or hope (願ってやみません). Used in speeches and letters. てなりません goes with feelings like 気がしてなりません, not 願う.","a":2}]},{"qs":[{"n":32,"q":"終業のベルが鳴る（　　）、生徒たちは教室を飛び出していった。","o":["が早いか","そばから","ものなら","ことなしに"],"e":"<b>Vる が早いか</b> = no sooner than, the moment. そばから = no sooner than, repeatedly (覚えるそばから忘れる), so it's for repeated actions, not one event. ものなら = if one could.","a":0}]},{"qs":[{"n":33,"q":"初めて富士山の頂上から朝日を見たときの感動（　　）。","o":["にすぎなかった","どころではなかった","といったらなかった","にほかならなかった"],"e":"<b>Nといったらない</b> = indescribably N, so N it can't be put into words. Here, the emotion was overwhelming. にすぎない = merely, どころではない = no time for.","a":2}]},{"qs":[{"n":34,"q":"彼は出張（　　）、毎回のように観光を楽しんでいる。","o":["にかこつけて","にもまして","にひきかえ","をおして"],"e":"<b>Nにかこつけて</b> = using N as an excuse. 出張にかこつけて観光する. にひきかえ = in contrast to, をおして = despite (illness, opposition).","a":0}]},{"qs":[{"n":35,"q":"素人の私には、プロのような技術など望む（　　）。","o":["までもない","ほかない","べくもない","にあたらない"],"e":"<b>Vる べくもない</b> = there's no way to V, out of the question. 望むべくもない is a common phrase. までもない = no need to, にあたらない = not worth (驚くにあたらない).","a":2}]}]},{"id":"m6","title":"問題6 文の組み立て","en":"Sentence building","instr":"次の文の ★ に入る最もよいものを、1、2、3、4から一つ選びなさい。","fixed":true,"pages":[{"qs":[{"n":36,"q":"この計画は、＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 実現は難しい。","o":["ことなしに","理解を","住民の","得る"],"a":3,"e":"Correct order: 住民の 理解を <b>得る</b> ことなしに (3 2 4 1). <b>Vることなしに</b> = without V-ing. The ★ is 得る."}]},{"qs":[{"n":37,"q":"この店の料理は、＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 、味も一流だ。","o":["さることながら","も","美しさ","見た目の"],"a":1,"e":"Correct order: 見た目の 美しさ <b>も</b> さることながら (4 3 2 1). <b>Nもさることながら</b> = N is great, and moreover ... The ★ is も."}]},{"qs":[{"n":38,"q":"子どもの ＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 、母親は看病を続けた。","o":["まで","下がる","一晩中","熱が"],"a":0,"e":"Correct order: 熱が 下がる <b>まで</b> 一晩中 (4 2 1 3). Hint: まで must come right after a dictionary-form verb. The ★ is まで."}]},{"qs":[{"n":39,"q":"彼は ＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 、決して謝ろうとしない。","o":["悪い","わかっていながら","と","自分が"],"a":2,"e":"Correct order: 自分が 悪い <b>と</b> わかっていながら (4 1 3 2). The quote marker と links 悪い and わかる. The ★ is と."}]},{"qs":[{"n":40,"q":"この映画は、＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 楽しめる作品だ。","o":["大人","まで","子ども","から"],"a":0,"e":"Correct order: 子ども から <b>大人</b> まで (3 4 1 2). <b>AからBまで</b> = from A to B. The ★ is 大人."}]}]},{"id":"m7","title":"問題7 文章の文法","en":"Grammar in a passage","instr":"次の文章を読んで、文章全体の内容を考えて、41 から 45 の中に入る最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　子どものころ、学校からの帰り道に寄り道をするのが好きだった。いつもと違う道を通ると、見たことのない店や小さな公園が現れる。（41）、大人になった今は、目的地まで最短の道を選ぶことがほとんどだ。スマートフォンの地図アプリを使えば、迷うこと（42）、効率よく移動できる。</p><p>　しかし先日、時間に余裕があったので、あえて知らない道を歩いてみた。すると、通い慣れた町（43）、新しい発見の連続だった。古い建物の味わいのある看板、路地裏の小さなパン屋。目的地へ急いでいたら、決して気づかなかった（44）。</p><p>　効率を求めることは悪いことではない。しかし、無駄に見える時間の中にこそ、思いがけない楽しみが隠れているのかもしれない。たまには、目的を持たずに歩いて（45）。</p>","qs":[{"n":41,"q":"（41）","o":["そのため","なぜなら","それに対して","ところで"],"e":"Childhood (loved detours) vs now (always the shortest route). That's a contrast between two things, so <b>それに対して</b>. ところで changes the topic, そのため = therefore.","a":2},{"n":42,"q":"（42）","o":["もなく","ばかりか","どころか","ながら"],"e":"<b>迷うこともなく</b> = without even getting lost. Vこともなく is a natural pattern. ばかりか and どころか need a stronger second clause.","a":0},{"n":43,"q":"（43）","o":["だけあって","にもかかわらず","からこそ","ばかりに"],"e":"It's a town she knows well, AND YET it was full of new discoveries. That's an unexpected result, so <b>にもかかわらず</b> (despite). だけあって would mean as expected of a familiar town, which is the opposite logic.","a":1},{"n":44,"q":"（44）","o":["わけではない","ことだろう","ものではない","ことにする"],"e":"<b>気づかなかったことだろう</b> = I surely would not have noticed. ～ことだろう expresses a strong guess about a hypothetical (急いでいたら).","a":1},{"n":45,"q":"（45）","o":["みてはどうだろうか","みたものだ","みるしかなかった","みるわけにはいかない"],"e":"The conclusion is a suggestion to the reader: <b>歩いてみてはどうだろうか</b> = why not try walking? ～たものだ = used to (a past habit), which doesn't fit たまには.","a":0}]}]},{"id":"r8","title":"問題8 内容理解（短文）","en":"Reading: short passages","instr":"次の（1）から（4）の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>（1）</p><p>　忙しい人ほど、睡眠時間を削って仕事や勉強の時間を確保しようとする。しかし、睡眠不足の状態では集中力が落ち、同じ作業にも余計に時間がかかる。結局、削ったはずの時間を取り戻せないばかりか、ミスまで増えてしまう。時間を生み出したいなら、まず十分に眠ることから始めるべきだろう。</p>","qs":[{"n":46,"q":"筆者の考えに合うものはどれか。","o":["忙しい人は、睡眠時間を削っても問題はない。","睡眠不足でも、集中力は訓練によって保てる。","ミスを減らすには、作業時間を増やすべきだ。","十分な睡眠が、結果的に時間を生み出すことになる。"],"e":"Last line: <b>時間を生み出したいなら、まず十分に眠ることから</b>. Lack of sleep makes work slower AND causes mistakes, so cutting sleep doesn't actually save time.","a":3}]},{"passage":"<p>（2）</p><p>以下は、ある店がホームページに出したお知らせである。</p><div class='notice'><p>お客様各位</p><p><b>店内改装に伴う休業のお知らせ</b></p><p>　いつも当店をご利用いただき、誠にありがとうございます。<br>　当店は、店内改装のため、12月1日（月）から12月14日（日）まで休業いたします。休業期間中も、オンラインショップは通常どおりご利用いただけます。<br>　なお、ポイントカードの有効期限が休業期間中に切れるお客様につきましては、期限を12月末日まで延長いたします。<br>　ご不便をおかけいたしますが、何卒ご理解のほどよろしくお願い申し上げます。</p></div>","qs":[{"n":47,"q":"ポイントカードの有効期限が12月10日の客について、正しいものはどれか。","o":["有効期限が12月31日まで延長される。","有効期限は12月10日のまま変わらない。","有効期限が12月14日まで延長される。","オンラインショップでのみポイントが使えるようになる。"],"e":"Dec 10 falls inside the closure (Dec 1 to 14), so the <b>なお</b> rule applies: the deadline moves to <b>12月末日</b> (Dec 31). 12月14日 is a trap, since that's just the last day of the closure.","a":0}]},{"passage":"<p>（3）</p><p>　「最近の若者は〇〇離れが進んでいる」という言い方をよく耳にする。車離れ、テレビ離れ、読書離れ。しかし、これらの多くは、若者の興味が失われたというより、お金の使い道や情報の得方が変わった結果と見るべきだろう。車を持たなくても移動に困らない都市に住み、新聞ではなくネットで記事を読む若者を、単純に「離れた」と言うのは、上の世代から見た一方的な見方にすぎない。</p>","qs":[{"n":48,"q":"筆者は、「〇〇離れ」という言い方についてどう考えているか。","o":["生活環境の変化を考えない、一方的な見方だ。","若者の興味が減ったことを、正しく表している。","若者自身がよく使っている表現だ。","車やテレビの業界が作り出した言葉だ。"],"e":"<b>上の世代から見た一方的な見方にすぎない</b>. The author says the real cause is changes in how money is spent and how information is found. Saying young people's interest decreased is exactly the view the author rejects.","a":0}]},{"passage":"<p>（4）</p><p>　旅先で写真を撮ることに夢中になり、肝心の景色をほとんど自分の目で見ていなかった、という経験はないだろうか。写真は記録を残すには便利だが、カメラ越しに見る景色は、どうしても枠の中に切り取られたものになる。その場の空気や音、においまで含めて記憶に残すには、時にはカメラを置き、ただ眺める時間も必要なのだ。</p>","qs":[{"n":49,"q":"筆者が最も言いたいことは何か。","o":["旅行では写真を撮らないほうがよい。","景色を自分の目で味わう時間も大切だ。","写真は記録を残すのに不便だ。","よい写真を撮るには、その場の空気や音を感じるべきだ。"],"e":"Key: <b>時には…ただ眺める時間も必要</b>. The words 時には and も matter. The author doesn't say stop taking photos, and actually says photos ARE convenient for records.","a":1}]}]},{"id":"r9","title":"問題9 内容理解（中文）","en":"Reading: mid-length passages","instr":"次の（1）から（3）の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>（1）</p><p>　私は地方の出身で、大学進学を機に東京へ出てきた。最初のころは自分の方言が恥ずかしく、できるだけ標準語で話そうと努めていた。うっかり方言が出たら笑われるのではないかと、人と話すたびに緊張していたのを覚えている。</p><p>　ところが、ある日、ゼミの友人に、故郷の家族と方言で電話しているところを聞かれてしまった。からかわれるかと思ったが、友人は「その話し方、温かくていいね」と言ったのである。驚くと同時に、<u>①肩の力がふっと抜けた</u>。</p><p>　それ以来、私は無理に方言を隠さなくなった。不思議なことに、自然に話せるようになると、人との会話も以前より楽しくなった。言葉は単に意味を伝える道具ではなく、その人が育ってきた土地や人とのつながりを映すものでもある。方言を隠すことは、<u>②自分の一部を隠すこと</u>だったのかもしれない。</p><p>　もちろん、場面によって言葉を使い分けることは必要だ。ただ、自分の言葉を恥じる必要はない。今は、そう思えるようになった。</p>","qs":[{"n":50,"q":"筆者が東京に来たころ、人と話すたびに緊張していたのはなぜか。","o":["標準語がまったく話せなかったから","ゼミの友人と仲良くなれなかったから","故郷の家族と話す機会がなかったから","方言を笑われるのではないかと心配だったから"],"e":"Paragraph 1: <b>うっかり方言が出たら笑われるのではないかと…緊張していた</b>. He tried to speak standard Japanese, so he could speak it.","a":3},{"n":51,"q":"<u>①肩の力がふっと抜けた</u>のはなぜか。","o":["友人も同じ地方の出身だとわかったから","標準語が上手になったと言われたから","友人が方言を好意的に受け止めてくれたから","電話の内容を聞かれずにすんだから"],"e":"肩の力が抜ける = to relax, stop being tense. It happened because the friend said <b>温かくていいね</b>, a positive reaction to his dialect. He WAS overheard, so the last choice is wrong.","a":2},{"n":52,"q":"<u>②自分の一部を隠すこと</u>とはどういうことか。","o":["自分が育った土地や人とのつながりを表に出さないこと","自分の考えを人に言わないこと","場面によって言葉を使い分けること","故郷に帰らないようにすること"],"e":"The sentence before it explains: language reflects <b>その人が育ってきた土地や人とのつながり</b>. Hiding your dialect means hiding that background. Code-switching is something the author says IS necessary, so it isn't the answer.","a":0}]},{"passage":"<p>（2）</p><p>　家電が壊れたとき、修理に出すより新しく買ったほうが安い、ということが珍しくなくなった。修理には部品代や技術料がかかるうえ、メーカーが部品の生産をやめてしまえば、そもそも直すことができない。こうして、まだ使えるはずの製品が次々と捨てられていく。</p><p>　こうした状況を変えようと、近年、ヨーロッパを中心に「修理する権利」を求める動きが広がっている。消費者や修理業者が、必要な部品や修理の情報を手に入れられるよう、メーカーに義務づけようというものだ。製品を長く使えるようにすることで、ごみを減らし、資源を守るねらいがある。</p><p>　日本でも、地域の人がボランティアで壊れたおもちゃや家電を直す「修理カフェ」のような取り組みが見られるようになった。参加者の多くは、単に費用を節約したいわけではないという。<u>①愛着のある物を、もう一度使えるようにしたい</u>。そうした気持ちが、人々を修理に向かわせているのだ。</p><p>　安く、早く、新しい物を手に入れることが当たり前になった今、物を直して使うという選択は、私たちの暮らし方そのものを問い直すきっかけになるのではないだろうか。</p>","qs":[{"n":53,"q":"本文によると、製品を修理できないことがあるのはなぜか。","o":["修理の技術を持つ人が少ないから","メーカーが部品を作らなくなることがあるから","消費者が修理を望まないから","修理カフェの数が少ないから"],"e":"<b>メーカーが部品の生産をやめてしまえば、そもそも直すことができない</b>. そもそも = in the first place, at all.","a":1},{"n":54,"q":"<u>①愛着のある物を、もう一度使えるようにしたい</u>とあるが、これは何を説明しているか。","o":["修理カフェが無料である理由","メーカーが部品を作る理由","新しい製品が売れなくなった理由","人々が修理に参加する主な理由"],"e":"The next sentence says <b>そうした気持ちが、人々を修理に向かわせている</b>. So it explains WHY people take part. The text never says the repair cafes are free.","a":3},{"n":55,"q":"筆者の考えに合うものはどれか。","o":["修理は、費用を節約するための最もよい方法だ。","物を直して使うことは、暮らし方を見直すことにつながる。","メーカーは、新しい製品を作るのをやめるべきだ。","日本は、ヨーロッパより修理の取り組みが進んでいる。"],"e":"Last paragraph: <b>暮らし方そのものを問い直すきっかけになる</b>. The text says people repair NOT simply to save money, so saving money isn't the point.","a":1}]},{"passage":"<p>（3）</p><p>　人を育てるには、ほめることが大切だとよく言われる。確かに、ほめられればうれしいし、やる気も出る。しかし、ほめ方を間違えると、<u>①かえって逆効果になる</u>こともある。</p><p>　ある研究では、子どもたちに問題を解かせた後、一方のグループには「頭がいいね」と能力をほめ、もう一方には「よく頑張ったね」と努力をほめた。その後、次に解く問題を、易しいものと難しいものから選ばせたところ、能力をほめられた子どもの多くは易しい問題を選んだという。「頭がいい」という評価を失うのが怖くなり、失敗しそうな課題を避けるようになったのだ。</p><p>　一方、努力をほめられた子どもたちは、難しい問題にも積極的に取り組んだ。結果より過程を認められたことで、失敗しても次に頑張ればいいと思えたのだろう。</p><p>　ほめることは、相手に何が大切かを伝えることでもある。何をほめるかによって、<u>②相手が何を目指すようになるかが変わってくる</u>のだ。</p>","qs":[{"n":56,"q":"<u>①かえって逆効果になる</u>とあるが、ここではどういうことか。","o":["ほめられた人が、ほめた人を信用しなくなる。","ほめられすぎて、努力をやめてしまう。","ほめられないと、やる気が出なくなる。","ほめられたことで、難しいことに挑戦しなくなる。"],"e":"The research example explains it: children praised as smart <b>失敗しそうな課題を避けるようになった</b>. They stopped taking on hard problems. The text says nothing about them giving up effort completely.","a":3},{"n":57,"q":"研究によると、努力をほめられた子どもたちはどうなったか。","o":["易しい問題を選ぶようになった。","難しい問題に積極的に取り組んだ。","結果を気にするようになった。","能力をほめられた子どもより成績が上がった。"],"e":"<b>努力をほめられた子どもたちは、難しい問題にも積極的に取り組んだ</b>. Grades are never mentioned, so the last choice adds information not in the text.","a":1},{"n":58,"q":"<u>②相手が何を目指すようになるかが変わってくる</u>とはどういうことか。","o":["ほめる回数によって、相手の目標の高さが変わる。","ほめる人によって、相手の将来の仕事が変わる。","ほめる時期によって、相手の成績が変わる。","何をほめるかによって、相手が大切にすることが変わる。"],"e":"Previous sentence: praising tells the other person <b>何が大切か</b>. Praise effort and they value effort, praise ability and they protect their image. The key is WHAT you praise, not how often or when.","a":3}]}]},{"id":"r10","title":"問題10 内容理解（長文）","en":"Reading: long passage","instr":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　どの職場にも、仕事の手順をまとめたマニュアルがある。マニュアルがあれば、新人でも短期間で一定の水準の仕事ができるようになる。誰が担当しても同じ品質のサービスを提供できることは、客にとっても安心だろう。チェーン展開する飲食店やコンビニエンスストアが全国どこでも同じように運営できるのは、よく作り込まれたマニュアルのおかげである。</p><p>　しかし、マニュアルには限界もある。マニュアルに書けるのは、あくまで想定された場面への対応だけだ。現実の仕事では、想定外の出来事が毎日のように起こる。そのとき、マニュアルどおりにしか動けない人は、どうしてよいかわからなくなってしまう。</p><p>　以前、ある薬局で、閉店間際に駆け込んできた客が「子どもの熱を下げる薬がほしい」と頼んでいるのを見かけた。店員は申し訳なさそうに「レジはもう締めてしまったので」と断っていた。<u>①店員の対応</u>は、規則としては正しかったのだろう。しかし、困っている客を前にして、もう少し何かできることはなかったのかと、私は考えずにはいられなかった。</p><p>　マニュアルが悪いわけではない。問題は、マニュアルが何のためにあるのかを考えずに、ただ従うことにある。どんな手順にも、それが作られた目的がある。客の安全を守るため、ミスを防ぐため、客に気持ちよく過ごしてもらうため。その目的を理解していれば、想定外の場面でも、<u>②何を優先すべきかを自分で判断できる</u>はずだ。</p><p>　そう考えると、新人を育てる際に大切なのは、手順を覚えさせることだけではない。なぜその手順なのか、その理由まで伝えることである。手順は時代や状況によって変わっていくが、目的を理解する力は、どんな場面でも役に立つ。マニュアルは、考えることをやめるための道具ではなく、考えるための土台であるべきなのだ。</p>","qs":[{"n":59,"q":"筆者は、マニュアルの長所をどのように述べているか。","o":["想定外の出来事にも、すぐに対応できるようになる。","店員が、自分で判断する力を身につけられる。","新人でも、早く一定の水準の仕事ができるようになる。","店の規則を、時代に合わせて変えやすくなる。"],"e":"Paragraph 1: <b>新人でも短期間で一定の水準の仕事ができる</b>. Handling the unexpected is listed in paragraph 2 as a LIMIT of manuals, not a strength.","a":2},{"n":60,"q":"<u>①店員の対応</u>について、筆者はどう感じたか。","o":["規則を守ったので、すばらしい対応だと感じた。","規則としては正しいが、もっと何かできたのではないかと感じた。","客の頼み方が失礼だったと感じた。","店の規則が厳しすぎると感じた。"],"e":"<b>規則としては正しかったのだろう。しかし…もう少し何かできることはなかったのか</b>. Note the structure 〜は正しかったのだろう。しかし: the real opinion comes after しかし. The author doesn't criticize the rules themselves.","a":1},{"n":61,"q":"<u>②何を優先すべきかを自分で判断できる</u>のは、どのような場合か。","o":["手順が作られた目的を理解している場合","マニュアルを完全に覚えている場合","上司にすぐ相談できる場合","想定外の出来事を経験したことがある場合"],"e":"Same sentence: <b>その目的を理解していれば</b>. ～ていれば (if) gives the condition directly. Memorizing the manual is exactly what the author says is NOT enough.","a":0},{"n":62,"q":"この文章で筆者が最も言いたいことは何か。","o":["マニュアルは想定外の場面に対応できないので、必要ない。","マニュアルは、考えるための土台として使うべきだ。","店員は、規則よりも客の頼みを常に優先すべきだ。","マニュアルは、時代に合わせて頻繁に変えるべきだ。"],"e":"Final sentence: <b>考えることをやめるための道具ではなく、考えるための土台であるべき</b>. The author clearly says マニュアルが悪いわけではない, so saying manuals aren't needed is wrong. 常に (always) in another choice is too extreme.","a":1}]}]},{"id":"r11","title":"問題11 統合理解","en":"Integrated comprehension (A vs B)","instr":"次のAとBの文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p><b>A</b></p><p>　学校の制服には多くの利点がある。毎朝着る服に悩む必要がなく、家庭の経済状況の違いが服装に表れにくい。また、制服を着ることで、生徒に学校の一員としての自覚が生まれ、気持ちを切り替えて学習に向かうことができる。地域の人にとっても、どの学校の生徒かがすぐにわかるため、子どもを見守りやすいという面がある。最近は、性別にかかわらずスカートかズボンかを選べる学校も増えており、制服は時代に合わせて変わりつつある。制服の良さを生かしながら、こうした工夫を続けていくことが大切だろう。</p><p><b>B</b></p><p>　制服については、その必要性を改めて考える時期に来ているのではないか。制服は一式そろえると数万円かかり、成長期の子どもは何度も買い替えなければならない。家庭の経済的な負担は決して小さくない。また、暑さや寒さに合わせて服装を調節しにくいという問題もある。服装の自由は、自分で考えて選ぶ力を育てる機会にもなるはずだ。すぐに制服をなくすべきだとは言わないが、私服を選べる日を設けるなど、生徒が自分で選べる余地を広げていくべきだ。</p>","qs":[{"n":63,"q":"制服と家庭の経済状況について、AとBはどのように述べているか。","o":["Aは経済状況の違いが目立たなくなると述べ、Bは制服の費用が負担になると述べている。","AもBも、制服は家庭の経済的な負担を減らすと述べている。","AもBも、制服の費用が高すぎると述べている。","Aは制服の費用が負担になると述べ、Bは経済状況の違いが目立たなくなると述べている。"],"e":"A: <b>家庭の経済状況の違いが服装に表れにくい</b> (differences are hidden). B: <b>数万円かかり…負担は決して小さくない</b> (uniforms are expensive). Same topic, different angles. That is the typical 統合理解 pattern. One choice simply swaps A and B, so read carefully.","a":0},{"n":64,"q":"制服の今後について、AとBはどのように述べているか。","o":["AもBも、制服はすぐになくすべきだと述べている。","Aは工夫しながら制服を続けるべきだと述べ、Bは生徒が服装を選べる機会を増やすべきだと述べている。","Aは制服をなくすべきだと述べ、Bは制服を続けるべきだと述べている。","AもBも、今の制服をそのまま続けるべきだと述べている。"],"e":"Check each final sentence. A: <b>制服の良さを生かしながら…工夫を続けていく</b>. B: <b>すぐに制服をなくすべきだとは言わないが…選べる余地を広げていくべき</b>. B is NOT saying abolish uniforms right away.","a":1}]}]},{"id":"r12","title":"問題12 主張理解（長文）","en":"Reading: author's argument","instr":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　「ひとりでいる」ことに否定的なイメージを持つ人は少なくない。昼食をひとりで食べている姿を見られたくないと、人目につかない場所で食事をする学生がいるという話を聞いたこともある。友人が多いことが良いことで、ひとりでいるのは寂しい人、という考えが、どこかで私たちの心に根付いているのだろう。</p><p>　しかし、私は、<u>①ひとりの時間をもっと積極的にとらえるべきだ</u>と考えている。人と一緒にいるとき、私たちは知らず知らずのうちに相手に合わせている。話題を選び、相手の反応を気にし、場の空気を読む。それは社会で生きていくうえで必要な力だが、そればかりでは、自分が本当は何を感じ、何を考えているのかがわからなくなってしまう。</p><p>　ひとりの時間は、自分と向き合う時間である。本を読んだり、散歩をしたり、ただぼんやりしたりする中で、人は自分の考えを整理し、心を休めることができる。歴史に残る作品や発見の多くも、そうした孤独な時間から生まれてきた。</p><p>　もちろん、人とのつながりが大切であることは言うまでもない。問題は、ひとりでいることを恐れるあまり、<u>②常に誰かとつながっていなければ不安になってしまう</u>ことだ。スマートフォンが普及した今、私たちはいつでも誰かと連絡を取ることができる。しかし、その便利さが、かえってひとりでいる力を弱めているようにも思える。</p><p>　ひとりでいられる人は、決して人と関わることが苦手な人ではない。むしろ、自分の考えをしっかり持っているからこそ、他人とも対等な関係を築くことができる。人とつながる力と、ひとりでいる力。その両方を持つことが、豊かに生きるために必要なのではないだろうか。</p>","qs":[{"n":65,"q":"筆者が<u>①ひとりの時間をもっと積極的にとらえるべきだ</u>と考えるのはなぜか。","o":["人に合わせる力は、社会で必要ないから","人に合わせてばかりいると、自分の考えがわからなくなるから","友人が多いと、人間関係の問題が増えるから","ひとりで食事をする学生が増えているから"],"e":"<b>そればかりでは、自分が本当は何を感じ、何を考えているのかがわからなくなってしまう</b>. The author says adapting to others IS a necessary skill (必要な力), so the choice saying it isn't needed is wrong.","a":1},{"n":66,"q":"筆者によると、ひとりの時間にはどのような働きがあるか。","o":["他人の考えを理解できるようになる。","場の空気を読む力が身につく。","自分の考えを整理し、心を休めることができる。","新しい友人を作るきっかけになる。"],"e":"Paragraph 3: <b>自分の考えを整理し、心を休めることができる</b>. Reading the room (空気を読む) belongs to time WITH others, from paragraph 2.","a":2},{"n":67,"q":"<u>②常に誰かとつながっていなければ不安になってしまう</u>ことについて、筆者はどう考えているか。","o":["人とのつながりを大切にしている証拠であり、問題ではない。","スマートフォンの便利さが、その傾向を強めているかもしれない。","若い世代だけに見られる問題だ。","スマートフォンを使わなければ、すぐに解決する。"],"e":"<b>その便利さが、かえってひとりでいる力を弱めているようにも思える</b>. ようにも思える = it also seems, a soft opinion, so かもしれない matches. すぐに解決する is far too strong, and the author calls it a 問題.","a":1},{"n":68,"q":"筆者の考えに最も近いものはどれか。","o":["人と関わるのが苦手な人は、ひとりの時間を増やすべきだ。","ひとりの時間は、人とのつながりより大切だ。","豊かに生きるには、人とつながる力とひとりでいる力の両方が必要だ。","歴史に残る作品を生むには、孤独が必要だ。"],"e":"Final line: <b>その両方を持つことが、豊かに生きるために必要</b>. The author never ranks alone time above connection. 主張理解 answers almost always come from the final paragraph.","a":2}]}]},{"id":"r13","title":"問題13 情報検索","en":"Information retrieval","instr":"次は、ある市立図書館の利用案内である。下の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<div class='notice'><p style='text-align:center'><b>みどり市立図書館　ご利用案内</b></p><p>【開館時間】平日 9:00～20:00 ／ 土曜、日曜、祝日 9:00～17:00<br>【休館日】毎週月曜日（月曜日が祝日の場合は、翌日の火曜日）</p><table class='tbl'><tr><th>資料の種類</th><th>貸出数</th><th>貸出期間</th><th>延長</th></tr><tr><td>本、雑誌</td><td>合わせて10冊まで</td><td>2週間</td><td>予約が入っていなければ1回のみ可</td></tr><tr><td>雑誌の最新号</td><td colspan='3'>館内での閲覧のみ（貸出不可）</td></tr><tr><td>CD、DVD</td><td>合わせて3点まで</td><td>1週間</td><td>延長不可</td></tr></table><p>【利用カード】市内に住んでいる方、通勤、通学している方は無料で作れます。それ以外の方は、年会費1,000円で作れます。<br>【予約】1人5点まで。インターネットからも予約できます。<br>【返却が遅れた場合】遅れた日数と同じ日数の間、新たに借りることができません。</p></div>","qs":[{"n":69,"q":"アンさんは隣の市に住み、みどり市の大学に通っている。本を8冊とDVDを2枚借りたい。アンさんについて正しいものはどれか。","o":["年会費1,000円を払えば、すべて借りられる。","利用カードは無料で作れ、すべて借りられる。","利用カードは無料で作れるが、DVDは1枚しか借りられない。","市外に住んでいるので、本は5冊までしか借りられない。"],"e":"She studies in the city (通学), so the card is <b>free</b>, even though she lives outside. Books: 8 is within 10. DVDs: 2 is within 3. So she can borrow everything. 5 is the RESERVATION limit (予約), not the borrowing limit, which is a classic trap.","a":1},{"n":70,"q":"鈴木さんは、来週の月曜日（祝日ではない）の夕方に、雑誌の最新号とCDを4枚借りに行こうと考えている。正しいものはどれか。","o":["その日は休館日なので、何も借りられない。","雑誌の最新号は借りられないが、CDは4枚借りられる。","雑誌の最新号は借りられず、CDも3枚までしか借りられない。","雑誌の最新号もCDも、希望どおり借りられる。"],"e":"Check the date FIRST: Monday that is not a holiday = <b>休館日</b> (closed). The choice saying no latest issue and only 3 CDs is a perfect trap, since the rules are right but the library is closed. In 情報検索, always check opening days and conditions before anything else.","a":0}]}]}];
const SET3 = [{"id":"m1","title":"問題1 漢字読み","en":"Đọc kanji","instr":"＿＿の言葉の読み方として最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":1,"q":"店員の<u>横柄</u>な態度に、客は腹を立てた。","o":["おうへ","こうへい","おうへい","よこへい"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>横柄 (おうへい)</b> = kiêu căng, hống hách. 横 ở đây đọc là <b>おう</b> (như 横断 おうだん), không phải よこ. 柄 đọc là <b>へい</b>, có trường âm.","a":2}]},{"qs":[{"n":2,"q":"人間関係が<u>煩わしく</u>なって、しばらく一人で過ごしたいと思った。","o":["いまわしく","なやましく","わずらわしく","けがらわしく"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>煩わしい (わずらわしい)</b> = phiền phức, rắc rối. Các đáp án khác cũng là từ có thật: いまわしい = 忌まわしい (đáng ghê tởm), なやましい = 悩ましい (khó xử), けがらわしい = 汚らわしい (dơ bẩn).","a":2}]},{"qs":[{"n":3,"q":"父は<u>寡黙</u>な人で、家ではほとんど話さない。","o":["かもく","かぼく","がもく","かむく"],"e":"<b>寡黙 (かもく)</b> = ít nói, trầm lặng. 寡 = <b>か</b>, 黙 = <b>もく</b> (như 沈黙 ちんもく). Không có biến âm.","a":0}]},{"qs":[{"n":4,"q":"新しい証拠が見つかり、これまでの説が<u>覆された</u>。","o":["ひるがえされた","おびやかされた","くらまされた","くつがえされた"],"e":"<b>覆す (くつがえす)</b> = lật ngược, đảo ngược (một giả thuyết, quyết định). ひるがえす = 翻す (thay đổi ý kiến, phất cờ), おびやかす = 脅かす (đe dọa).","a":3}]},{"qs":[{"n":5,"q":"不公平な判定に、選手たちは強い<u>憤り</u>を感じた。","o":["いつわり","おこたり","あせり","いきどおり"],"e":"<b>憤り (いきどおり)</b> = sự phẫn nộ. いつわり = 偽り (giả dối), おこたり = 怠り (lơ là), あせり = 焦り (nóng vội).","a":3}]},{"qs":[{"n":6,"q":"人手不足により、現場の状況は<u>逼迫</u>している。","o":["ひっぱく","ひっぱ","ひつばく","ふくはく"],"e":"<b>逼迫 (ひっぱく)</b> = căng thẳng, cấp bách (nhân lực, tài chính, y tế). Lưu ý âm ngắt <b>っ</b> và biến âm <b>ぱ</b>.","a":0}]}]},{"id":"m2","title":"問題2 文脈規定","en":"Từ theo ngữ cảnh","instr":"（　　）に入れるのに最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":7,"q":"資金が集まらず、新事業の計画は途中で（　　）してしまった。","o":["損失","破損","頓挫","消耗"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>頓挫 (とんざ)する</b> = (kế hoạch) bị đổ bể giữa chừng. 損失 = tổn thất (tiền), 破損 = hư hỏng (đồ vật), 消耗 = tiêu hao (sức lực).","a":2}]},{"qs":[{"n":8,"q":"安全管理が（　　）だったことが、今回の事故の原因だった。","o":["几帳面","ずさん","綿密","厳重"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 2, lần này hỏi theo dạng khác.</span><br><b>ずさん (杜撰)</b> = cẩu thả, làm ẩu. Vì là nguyên nhân tai nạn nên cần từ mang nghĩa xấu. 几帳面 (きちょうめん) = cẩn thận, 綿密 (めんみつ) = tỉ mỉ, 厳重 = nghiêm ngặt, đều là nghĩa tốt.","a":1}]},{"qs":[{"n":9,"q":"赤字が続く状況を（　　）するため、社長は新しい方針を打ち出した。","o":["打開","開拓","開設","展開"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>打開 (だかい)する</b> = phá vỡ, tìm lối thoát cho tình thế khó khăn. 開拓 = khai phá (thị trường mới), 開設 = mở (tài khoản, văn phòng), 展開 = triển khai.","a":0}]},{"qs":[{"n":10,"q":"彼は何度失敗しても（　　）、挑戦を続けた。","o":["くじけて","ひるんで","めげずに","こりて"],"e":"<b>めげずに</b> = không nản chí. Câu nói anh ấy vẫn tiếp tục thử thách, nên cần nghĩa không nản. くじけて = nản lòng, ひるんで = chùn bước, こりて = 懲りて (rút kinh nghiệm, chừa), đều trái nghĩa.","a":2}]},{"qs":[{"n":11,"q":"経験の浅い彼に、チームのリーダーは（　　）が重いだろう。","o":["荷","肩","腰","手"],"e":"<b>荷が重い (にがおもい)</b> = trách nhiệm quá nặng so với khả năng. Thành ngữ cố định. 腰が重い = lười động tay, 手が重い không phải thành ngữ.","a":0}]},{"qs":[{"n":12,"q":"社員の（　　）を高めるため、成果に応じたボーナスを導入した。","o":["モチベーション","コンセプト","ボリューム","リアクション"],"e":"<b>モチベーション</b> = động lực. モチベーションを高める. コンセプト = ý tưởng chủ đạo, ボリューム = khối lượng, âm lượng, リアクション = phản ứng.","a":0}]},{"qs":[{"n":13,"q":"彼女の話はいつも（　　）がなく、何が言いたいのかわからない。","o":["見通し","手応え","見込み","取り留め"],"e":"<b>取り留めがない (とりとめがない)</b> = lan man, không có trọng tâm. 見通し = triển vọng, dự đoán, 手応え = cảm giác có kết quả, 見込み = khả năng, triển vọng.","a":3}]}]},{"id":"m3","title":"問題3 言い換え類義","en":"Từ gần nghĩa","instr":"＿＿の言葉に意味が最も近いものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":14,"q":"将来について<u>漠然とした</u>不安を感じている。","o":["はっきりしない","大きな","急な","根拠のある"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>漠然 (ばくぜん)とした</b> = mơ hồ, không rõ ràng. Gần nhất là はっきりしない. 根拠のある (có căn cứ) gần như trái nghĩa.","a":0}]},{"qs":[{"n":15,"q":"毎日同じ料理ばかりで、<u>うんざりした</u>。","o":["驚いた","疲れた","いやになった","慣れた"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 2, lần này hỏi theo dạng khác.</span><br><b>うんざりする</b> = chán ngấy. Gần nhất là いやになった. 疲れた là bẫy: うんざり là chán về mặt cảm xúc, không phải mệt về thể chất.","a":2}]},{"qs":[{"n":16,"q":"祖父は九十歳になるが、<u>いたって</u>元気だ。","o":["意外に","とても","少し","前より"],"e":"<b>いたって (至って)</b> = rất, cực kỳ (văn trang trọng). Gần nhất là とても, 非常に. Thường gặp: いたって元気, いたって普通.","a":1}]},{"qs":[{"n":17,"q":"彼女は毎日<u>ひたむきに</u>練習に取り組んでいる。","o":["一生懸命に","楽しそうに","黙って","時間をかけて"],"e":"<b>ひたむき</b> = hết lòng, chuyên tâm vào một việc. Gần nhất là 一生懸命に.","a":0}]},{"qs":[{"n":18,"q":"その計画について、社員の意見は<u>まちまち</u>だった。","o":["一致していた","いろいろだった","少なかった","厳しかった"],"e":"<b>まちまち</b> = mỗi người một kiểu, không thống nhất. Gần nhất là いろいろ, ばらばら. 一致していた là trái nghĩa.","a":1}]},{"qs":[{"n":19,"q":"ボールが飛んできたので、<u>とっさに</u>頭を下げた。","o":["ゆっくり","わざと","すぐに","思い切って"],"e":"<b>とっさに</b> = ngay lập tức, theo phản xạ (không kịp suy nghĩ). Gần nhất là すぐに. わざと = cố ý, trái với phản xạ.","a":2}]}]},{"id":"m4","title":"問題4 用法","en":"Cách dùng từ","instr":"次の言葉の使い方として最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":20,"q":"<b>案の定</b>","o":["案の定、明日は晴れるでしょう。","彼は何でもよく考える、案の定な人だ。","しっかりと案の定を立ててから、計画を進めた。","準備不足のまま試験を受けたら、案の定、不合格だった。"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 2, lần này hỏi theo dạng khác.</span><br><b>案の定 (あんのじょう)</b> = quả nhiên (đúng như đã lo trước, thường là chuyện xấu). Dùng cho việc ĐÃ xảy ra, không dùng cho dự báo tương lai (明日は…でしょう). Không phải tính từ (案の定な人 sai).","a":3}]},{"qs":[{"n":21,"q":"<b>疎か</b>","o":["この道は夜になると人通りが疎かになる。","彼は疎かな性格なので、よく失敗する。","部活動に夢中になって、勉強が疎かになっている。","この部屋は家具が疎かで、広く感じる。"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 2, lần này hỏi theo dạng khác.</span><br><b>疎か (おろそか)にする / になる</b> = xao nhãng, lơ là (việc cần làm). Đường vắng người là 人通りが少ない (hoặc まばら). Tính cách hậu đậu là そそっかしい.","a":2}]},{"qs":[{"n":22,"q":"<b>しきりに</b>","o":["雨はしきりに一時間だけ降って、すぐにやんだ。","このケーキは、しきりにおいしい。","母は電話で、しきりに私の体調を心配していた。","彼はしきりな性格で、誰にでも話しかける。"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>しきりに</b> = liên tục, nhiều lần (hành động lặp đi lặp lại). Không dùng để nhấn mạnh tính từ (しきりにおいしい sai), không có dạng しきりな.","a":2}]},{"qs":[{"n":23,"q":"<b>根回し</b>","o":["明日の試験の根回しで、夜遅くまで勉強した。","会議で反対されないよう、事前に関係者に根回しをしておいた。","彼は根回しも言わずに、先に帰ってしまった。","スープの根回しに、少し塩を加えた。"],"e":"<b>根回し (ねまわし)</b> = vận động, thuyết phục trước (trước cuộc họp, quyết định), rất đặc trưng trong công ty Nhật. Ôn thi là 試験勉強, nêm gia vị là 味付け.","a":1}]},{"qs":[{"n":24,"q":"<b>差し支える</b>","o":["友人が差し支えて、引っ越しを手伝ってくれた。","重い荷物を二人で差し支えて運んだ。","夜更かしをすると、翌日の仕事に差し支える。","彼は私の意見に強く差し支えた。"],"e":"<b>差し支える (さしつかえる)</b> = gây trở ngại, ảnh hưởng xấu. Dạng hay gặp: 差し支えなければ (nếu không phiền). Giúp đỡ là 手伝う, khiêng là 支える (ささえる), phản đối là 反対する.","a":2}]},{"qs":[{"n":25,"q":"<b>拍子</b>","o":["今日は拍子がいいので、試験もうまくいくだろう。","彼は明るくて、とても拍子な人だ。","転んだ拍子に、かけていた眼鏡を落としてしまった。","旅行の拍子を立てるのは楽しい。"],"e":"<b>Vた拍子に (ひょうしに)</b> = ngay khoảnh khắc làm gì đó thì (bất ngờ xảy ra chuyện khác). 転んだ拍子に. Phong độ tốt là 調子がいい, lập kế hoạch là 計画を立てる.","a":2}]}]},{"id":"m5","title":"問題5 文法形式の判断","en":"Ngữ pháp","instr":"次の文の（　　）に入れるのに最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":26,"q":"彼は足のけが（　　）、最後まで走りきった。","o":["をものともせず","にひきかえ","をもって","に至っては"],"e":"<b>Nをものともせず</b> = bất chấp N (khó khăn, nguy hiểm), không coi N ra gì. にひきかえ = trái ngược với, をもって = bằng, tính đến, に至っては = đến mức (nêu ví dụ cực đoan).","a":0}]},{"qs":[{"n":27,"q":"子どものため（　　）、親はどんな苦労もいとわない。","o":["とあれば","ときたら","ともなく","とばかりに"],"e":"<b>Nとあれば</b> = nếu là vì N (thì sẵn sàng làm bất cứ điều gì). いとわない = không ngại. ときたら = nói đến (thường chê bai), ともなく = vô thức, không chủ đích.","a":0}]},{"qs":[{"n":28,"q":"事故の現場は、見る（　　）ほどひどい状態だった。","o":["にかたくない","に足りない","にあたらない","にたえない"],"e":"<b>Vる にたえない</b> = không chịu nổi khi V (見るにたえない, 聞くにたえない = thảm đến mức không nỡ nhìn, nghe). に足りない = không đáng, にあたらない = không đến mức phải.","a":3}]},{"qs":[{"n":29,"q":"家族を失った彼女の悲しみは、想像（　　）。","o":["にたえない","にかたくない","に足る","にすぎない"],"e":"<b>Nにかたくない</b> = không khó để (想像にかたくない = dễ dàng tưởng tượng được). Văn viết. に足る = đáng để, にすぎない = chỉ là.","a":1}]},{"qs":[{"n":30,"q":"試験の結果（　　）、進学先を考え直すことになるかもしれない。","o":["いかんによらず","をめぐって","を問わず","いかんでは"],"e":"<b>Nいかんでは</b> = tùy vào N mà có thể... Đi với かもしれない. Bẫy là いかんによらず (bất kể N), mang nghĩa ngược lại. を問わず = không phân biệt.","a":3}]},{"qs":[{"n":31,"q":"今年は、昇進に結婚と、いいこと（　　）の一年だった。","o":["まみれ","ずくめ","がらみ","ぐるみ"],"e":"<b>Nずくめ</b> = toàn là N (thường là chuyện tốt: いいことずくめ, ごちそうずくめ). まみれ = dính đầy (thứ bẩn: 泥まみれ), がらみ = liên quan đến, ぐるみ = bao gồm cả (家族ぐるみ).","a":1}]},{"qs":[{"n":32,"q":"条件次第では、その仕事を引き受け（　　）。","o":["ずにはおかない","てやまない","ないものでもない","ないではすまない"],"e":"<b>Vない ものでもない</b> = không phải là không thể V (có thể làm, tùy điều kiện). Đi với 条件次第では. ずにはおかない = chắc chắn gây ra, てやまない = luôn mong ước.","a":2}]},{"qs":[{"n":33,"q":"どんなに準備しても、当日に雨が降れば（　　）。","o":["それだけだ","それどころではない","そればかりだ","それまでだ"],"e":"<b>～ばそれまでだ</b> = nếu ~ thì mọi thứ coi như hết, vô ích. Mẫu cố định: 雨が降ればそれまでだ.","a":3}]},{"qs":[{"n":34,"q":"彼は物事を悲観的に考える（　　）。","o":["しまつだ","までもない","きらいがある","ことだ"],"e":"<b>Vる きらいがある</b> = có khuynh hướng (xấu). しまつだ = rốt cuộc đến mức (kết quả tệ), までもない = không cần đến, ことだ = nên (lời khuyên).","a":2}]},{"qs":[{"n":35,"q":"天気の良さも（　　）、祭りの会場は大勢の人でにぎわった。","o":["兼ねて","伴って","通じて","相まって"],"e":"<b>Nも相まって (あいまって)</b> = cộng thêm N, kết hợp với N tạo ra kết quả. 兼ねて = kiêm, 伴って = kèm theo, 通じて = thông qua.","a":3}]}]},{"id":"m6","title":"問題6 文の組み立て","en":"Sắp xếp câu","instr":"次の文の ★ に入る最もよいものを、1、2、3、4から一つ選びなさい。","fixed":true,"pages":[{"qs":[{"n":36,"q":"この問題は、＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 解決できるものではない。","o":["到底","だけで","一人の","力"],"a":1,"e":"Thứ tự đúng: 一人の 力 <b>だけで</b> 到底 (3 4 2 1). <b>到底～ない</b> = hoàn toàn không thể. 到底 đứng ngay trước động từ phủ định. ★ là だけで."}]},{"qs":[{"n":37,"q":"来年の ＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 、毎日アルバイトをしている。","o":["費用を","ために","貯める","留学の"],"a":2,"e":"Thứ tự đúng: 留学の 費用を <b>貯める</b> ために (4 1 3 2). <b>Vる ために</b> = để V. ★ là 貯める."}]},{"qs":[{"n":38,"q":"＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 、彼はその仕事を引き受けることにした。","o":["末","に","迷った","さんざん"],"a":0,"e":"Thứ tự đúng: さんざん 迷った <b>末</b> に (4 3 1 2). <b>Vた末に</b> = sau khi đã V rất nhiều thì cuối cùng. ★ là 末."}]},{"qs":[{"n":39,"q":"この本は ＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 、大人が読んでも十分面白い。","o":["とはいえ","子ども","向けに","書かれた"],"a":3,"e":"Thứ tự đúng: 子ども 向けに <b>書かれた</b> とはいえ (2 3 4 1). <b>～とはいえ</b> = tuy nói là... nhưng. ★ là 書かれた."}]},{"qs":[{"n":40,"q":"一度 ＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 、途中で投げ出すべきではない。","o":["は","以上","仕事を","引き受けた"],"a":1,"e":"Thứ tự đúng: 仕事を 引き受けた <b>以上</b> は (3 4 2 1). <b>Vた以上は</b> = một khi đã V thì (phải). ★ là 以上."}]}]},{"id":"m7","title":"問題7 文章の文法","en":"Ngữ pháp trong đoạn văn","instr":"次の文章を読んで、文章全体の内容を考えて、41 から 45 の中に入る最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　去年の春、ベランダで野菜を育て始めた。きっかけは、友人からミニトマトの苗をもらったことだ。（41）、それまで植物を育てた経験はほとんどなく、すぐに枯らしてしまうのではないかと心配だった。</p><p>　実際に育ててみると、思った（42）手がかかった。毎朝の水やりに加え、虫がついていないかを確認し、伸びすぎた枝を切る。旅行に出かけるときは、誰に水やりを頼むかで頭を悩ませた。</p><p>　それでも、小さな花が咲き、やがて青い実がなったときの喜びは（43）。赤く色づいた実を口に入れたとき、店で買うトマトとは比べものにならないほど甘く感じた。もっとも、それは味そのものより、自分で育てたという満足感（44）のかもしれない。</p><p>　植物は、急かしても早く育つわけではない。毎日少しずつ変化していく姿を見守るうちに、私は待つことの楽しさを知った。今年は、ナスやピーマンにも挑戦して（45）。</p>","qs":[{"n":41,"q":"（41）","o":["ただ","それで","すると","おまけに"],"e":"Câu trước: được bạn tặng cây giống. Câu sau: nhưng chưa từng trồng cây, nên lo lắng. Đây là ý bổ sung một điều kiện trái chiều nhẹ, nên dùng <b>ただ</b> (có điều, nhưng). それで = vì vậy, おまけに = hơn nữa.","a":0},{"n":42,"q":"（42）","o":["ほど","以上に","あまり","ばかりか"],"e":"<b>思った以上に</b> = hơn mình tưởng. Sau đó liệt kê nhiều việc phải làm. 思ったほど phải đi với phủ định (思ったほど～ない).","a":1},{"n":43,"q":"（43）","o":["言葉では言い表せないほどだった","言うまでもなかった","言うにすぎなかった","言わざるを得なかった"],"e":"Niềm vui lớn đến mức <b>không thể diễn tả bằng lời</b>. 言わざるを得ない = buộc phải nói, にすぎない = chỉ là, đều không hợp.","a":0},{"n":44,"q":"（44）","o":["に反するものだった","に限るものだった","に代わるものだった","によるものだった"],"e":"Vị ngọt có lẽ <b>là do</b> cảm giác thỏa mãn vì tự tay trồng. Nは～によるものだ = N là do ~ (nguyên nhân). もっとも = tuy nhiên, nói thêm cho chính xác.","a":3},{"n":45,"q":"（45）","o":["みたばかりだ","みるつもりだ","みたものだ","みるところだった"],"e":"今年は = năm nay (dự định cho tương lai), nên dùng <b>挑戦してみるつもりだ</b>. たばかり = vừa mới, たものだ = đã từng hay (thói quen quá khứ), るところだった = suýt nữa thì.","a":1}]}]},{"id":"r8","title":"問題8 内容理解（短文）","en":"Đọc hiểu: đoạn ngắn","instr":"次の（1）から（4）の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>（1）</p><p>　会議中、パソコンでメモを取る人が増えた。打つのが速く、後で検索もできるので便利だ。しかし、手で書く場合は、話をすべて書き写すことができないため、自然と要点を選んで書くことになる。この「選ぶ」という作業こそが、内容の理解を深めるのである。速く記録できることが、必ずしも理解につながるとは限らない。</p>","qs":[{"n":46,"q":"筆者は、手書きのメモについてどう考えているか。","o":["話の内容をすべて正確に記録できる。","パソコンより速く書くことができる。","後で必要な情報を探しやすい。","要点を選ぶ過程で、内容の理解が深まる。"],"e":"Câu then chốt: <b>この「選ぶ」という作業こそが、内容の理解を深める</b>. Viết tay không chép được hết nên phải chọn ý chính, và chính việc chọn giúp hiểu sâu hơn. Ghi nhanh và tìm kiếm lại là ưu điểm của máy tính, không phải của viết tay.","a":3}]},{"passage":"<p>（2）</p><p>以下は、あるマンションの掲示板に貼られたお知らせである。</p><div class='notice'><p>居住者の皆様へ</p><p style='text-align:center'><b>給水管点検工事のお知らせ</b></p><p>　下記の日程で、給水管の点検工事を行います。工事中は断水となりますので、あらかじめ飲料水などをご用意ください。</p><p>日時：1月20日（火）9:00～15:00<br>（雨天の場合は1月22日（木）に延期）</p><p>　なお、工事の際、作業員が各部屋の台所に入る必要があります。当日ご不在の予定の方は、1月13日までに管理人室へご連絡ください。改めて日程を調整いたします。</p><p style='text-align:right'>管理組合</p></div>","qs":[{"n":47,"q":"1月20日に一日中家を留守にする予定の住人は、どうしなければならないか。","o":["1月13日までに管理人室に連絡する。","1月22日に家にいるようにする。","工事の前に台所を片付けておく。","飲料水を用意しておけば、ほかに何もしなくてよい。"],"e":"Phần <b>なお</b>: người vắng nhà vào ngày đó phải <b>liên hệ phòng quản lý trước ngày 13/1</b> để hẹn lại lịch. Ngày 22 chỉ là ngày dự phòng khi trời mưa, đây là bẫy. Trong thông báo, phần sau なお thường chứa đáp án.","a":0}]},{"passage":"<p>（3）</p><p>　翻訳アプリの精度が上がり、外国語を学ぶ必要はもうないと言う人もいる。確かに、旅行先で道を尋ねたり、メニューを読んだりするには十分だろう。しかし、言葉を学ぶことは、単に意味を置き換える技術を身につけることではない。その言葉を話す人々が何を大切にし、どのように世界を見ているのかを知ることでもある。機械が訳してくれるのは、言葉の表面にすぎない。</p>","qs":[{"n":48,"q":"筆者の考えに合うものはどれか。","o":["翻訳アプリは、旅行では役に立たない。","外国語を学ぶことで、その言葉を話す人々の考え方を知ることができる。","翻訳アプリの精度は、まだ十分ではない。","これからは、外国語を学ぶ必要はない。"],"e":"Ý chính: học ngoại ngữ là để biết <b>人々が何を大切にし、どのように世界を見ているのか</b>. Tác giả THỪA NHẬN app dịch đủ dùng khi du lịch (確かに…十分だろう), nên đáp án nói app vô dụng khi du lịch là sai.","a":1}]},{"passage":"<p>（4）</p><p>　人気の店の前にできた行列を見ると、つい並びたくなる。多くの人が並んでいるのだから、きっとおいしいに違いないと考えてしまうのだ。しかし、よく考えれば、その人たちも同じように、行列を見て並んでいるだけなのかもしれない。他人の選択を基準にするのは楽だが、それは自分で判断することを放棄しているのと同じではないだろうか。</p>","qs":[{"n":49,"q":"筆者が最も言いたいことは何か。","o":["行列ができる店は、おいしい店が多い。","人気の店には、並ぶべきではない。","行列に並ぶのは、時間の無駄だ。","他人の行動にただ従うのではなく、自分で判断すべきだ。"],"e":"Câu cuối: dựa vào lựa chọn của người khác thì dễ, nhưng đó là <b>từ bỏ việc tự mình phán đoán</b>. Câu hỏi tu từ ～ではないだろうか = tác giả đang khẳng định ý kiến. Tác giả không nói không nên xếp hàng.","a":3}]}]},{"id":"r9","title":"問題9 内容理解（中文）","en":"Đọc hiểu: đoạn vừa","instr":"次の（1）から（3）の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>（1）</p><p>　五年前、東京の会社を辞め、山あいの小さな町に移り住んだ。周囲からは「不便な田舎で何をするのか」と心配されたが、インターネットがあれば仕事はどこでもできる。今は、デザインの仕事をしながら、空いた時間に畑を耕している。</p><p>　移住して最初に驚いたのは、<u>①時間の流れ方の違い</u>だった。東京では、電車の時刻や会議の予定に追われ、一日が細かく区切られていた。ここでは、日の出とともに起き、暗くなれば仕事を終える。天気によって予定が変わることも珍しくない。最初は戸惑ったが、自然に合わせて暮らすうちに、心に余裕が生まれた。</p><p>　もちろん、いいことばかりではない。病院や店は遠く、車がなければ生活できない。冬は雪かきに追われる。地域の行事にも参加しなければならず、人付き合いを面倒に感じる人もいるだろう。</p><p>　それでも私がここで暮らし続けているのは、<u>②自分の手で生活を作っている実感</u>があるからだ。食べる野菜を育て、困ったときは近所の人と助け合う。便利さと引き換えに、私はお金では買えないものを手に入れたのだと思う。</p>","qs":[{"n":50,"q":"<u>①時間の流れ方の違い</u>とはどういうことか。","o":["東京より一日が長く感じられること","仕事をする時間が短くなったこと","電車の本数が少ないこと","自然に合わせて生活のリズムが決まること"],"e":"Giải thích ngay sau đó: ở quê <b>日の出とともに起き、暗くなれば仕事を終える</b>, lịch thay đổi theo thời tiết. Tức là nhịp sống theo tự nhiên, không theo giờ tàu hay lịch họp.","a":3},{"n":51,"q":"筆者は、町での生活の不便な点についてどのように述べているか。","o":["インターネットが使えず、仕事が難しい。","車がないと生活が難しく、冬は雪かきも大変だ。","近所の人が助けてくれない。","地域の行事に参加させてもらえない。"],"e":"Đoạn 3: <b>車がなければ生活できない。冬は雪かきに追われる</b>. Internet thì có (インターネットがあれば仕事はどこでもできる), hàng xóm thì giúp đỡ nhau, và sự kiện địa phương là PHẢI tham gia chứ không phải không được tham gia.","a":1},{"n":52,"q":"<u>②自分の手で生活を作っている実感</u>とはどのようなものか。","o":["自分で家を建てて暮らしている感覚","東京にいたときより多く稼いでいる感覚","誰にも頼らずに何でもできる感覚","自分で食べ物を育て、周りの人と助け合って暮らしている感覚"],"e":"Câu tiếp theo giải thích: <b>食べる野菜を育て、困ったときは近所の人と助け合う</b>. Có giúp đỡ nhau, nên không phải cảm giác không dựa vào ai.","a":3}]},{"passage":"<p>（2）</p><p>　最近は、多くの美術館が所蔵作品の高画質な画像をインターネットで公開している。自宅にいながら、世界中の名画を細部まで拡大して見ることができるのだから、便利な時代になったものだ。実際、肉眼では見えないような筆の跡まで、画面上ならはっきり確認できる。</p><p>　では、もう美術館に足を運ぶ必要はないのだろうか。私はそうは思わない。先日、ある画家の作品を美術館で見たとき、その大きさに圧倒された。画面で何度も見ていた絵だったが、実物の前に立つと、まるで絵の中に引き込まれるような感覚があった。絵の具の盛り上がりが作る影や、見る角度によって変わる色の輝きは、<u>①画像では決して伝わらないもの</u>だった。</p><p>　また、美術館という空間そのものにも意味がある。静かな部屋で、ほかの来館者とともに一枚の絵と向き合う時間は、日常から切り離された特別な体験だ。</p><p>　デジタル画像と実物の鑑賞は、どちらが優れているというものではない。画像で興味を持ち、実物を見に行く。<u>②そうした使い分け</u>こそが、これからの美術の楽しみ方なのではないだろうか。</p>","qs":[{"n":53,"q":"筆者によると、インターネットで公開された画像の良い点は何か。","o":["作品の大きさを正確に感じられる。","肉眼では見えない細かい部分まで確認できる。","絵の具の盛り上がりがよくわかる。","美術館と同じ雰囲気を味わえる。"],"e":"Đoạn 1: <b>肉眼では見えないような筆の跡まで、画面上ならはっきり確認できる</b>. Kích thước tranh và độ nổi của màu là những thứ CHỈ cảm nhận được khi xem tranh thật.","a":1},{"n":54,"q":"<u>①画像では決して伝わらないもの</u>とは何か。","o":["筆の跡の細かさ","実物を見たときにわかる、絵の具の立体感や色の変化","作品が描かれた時代の背景","画家の名前や作品の題名"],"e":"Chủ ngữ của câu: <b>絵の具の盛り上がりが作る影や、見る角度によって変わる色の輝き</b> = độ nổi và sự thay đổi màu sắc. Nét cọ thì ảnh LẠI thấy rõ, nên đó là bẫy.","a":1},{"n":55,"q":"<u>②そうした使い分け</u>とはどういうことか。","o":["画像で興味を持ってから、実物を見に行くこと","美術館では画像を見ないようにすること","有名な作品だけを実物で見ること","画像と実物のどちらか一方を選ぶこと"],"e":"そうした chỉ câu ngay trước: <b>画像で興味を持ち、実物を見に行く</b>. Tác giả nói không cái nào hơn cái nào, nên chọn chỉ một bên là sai.","a":0}]},{"passage":"<p>（3）</p><p>　授業の最後に「何か質問はありますか」と聞いても、手を挙げる学生はほとんどいない。理解できたから質問がないのかといえば、そうではない。後で個別に話を聞くと、わからないことはあったのだが、何を聞けばいいのかわからなかった、という答えが多いのだ。</p><p>　実は、質問をするには、ある程度の理解が必要である。自分がどこまでわかっていて、どこからがわからないのか。その境目が見えていなければ、<u>①質問の形にすることはできない</u>。つまり、質問が出ないのは、理解が足りないからというより、自分の理解の状態を把握できていないからなのである。</p><p>　そこで私は、授業の途中で、学生に「今日の話で一番わかりにくかったところ」を一行で書いてもらうことにした。すると、驚くほど具体的な疑問が集まるようになった。書こうとすることで、学生は自分の理解を振り返るのだろう。</p><p>　<u>②よい質問ができる力</u>は、生まれつきのものではない。自分の理解を確かめる習慣によって、少しずつ育てていけるものなのだ。</p>","qs":[{"n":56,"q":"授業の最後に質問が出ない理由について、筆者はどう考えているか。","o":["授業の内容をすべて理解しているから","人前で質問するのが恥ずかしいから","質問する時間が足りないから","何がわからないのかを、自分ではっきりつかめていないから"],"e":"<b>自分の理解の状態を把握できていないから</b>. Tác giả phủ nhận lý do đã hiểu hết (そうではない). Ngại hỏi trước mọi người và thiếu thời gian thì không được nhắc đến.","a":3},{"n":57,"q":"<u>①質問の形にすることはできない</u>のはなぜか。","o":["質問に使う言葉を知らないから","教師が質問を受け付けないから","わからないことが多すぎるから","わかっている部分とわからない部分の境目が見えていないから"],"e":"Điều kiện ngay trước: <b>その境目が見えていなければ</b> = nếu không thấy ranh giới giữa chỗ hiểu và chỗ không hiểu.","a":3},{"n":58,"q":"<u>②よい質問ができる力</u>について、筆者はどう考えているか。","o":["生まれつき持っている人とそうでない人がいる。","授業でたくさん発言すれば身につく。","自分の理解を確かめる習慣によって育てられる。","教師が質問のしかたを教えれば身につく。"],"e":"<b>生まれつきのものではない。自分の理解を確かめる習慣によって…育てていける</b>. Bẫy là đáp án nói có người sinh ra đã có, trái với 生まれつきのものではない.","a":2}]}]},{"id":"r10","title":"問題10 内容理解（長文）","en":"Đọc hiểu: đoạn dài","instr":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　日本各地には、漆器や陶磁器、織物など、長い歴史を持つ伝統工芸が数多く残っている。しかし、その多くが今、存続の危機にある。生活様式の変化によって需要が減り、職人の数も年々減少している。厳しい修業に耐えて技術を身につけても、それで生活していけるだけの収入を得るのは容易ではない。後継者が見つからず、何百年も続いてきた技術が途絶えてしまうという話も珍しくない。</p><p>　こうした中で、伝統を守るためには、昔ながらのやり方を変えずに続けることが大切だと考える人も多い。確かに、受け継がれてきた技術には、長い時間をかけて磨かれた知恵が詰まっている。安易に変えてしまえば、その価値が失われるおそれもあるだろう。</p><p>　しかし、私は、<u>①伝統を守ることと、何も変えないことは同じではない</u>と考えている。そもそも、今「伝統」と呼ばれているものも、生まれた当時は新しいものだったはずだ。それぞれの時代の職人が、使う人の暮らしに合わせて工夫を重ねてきたからこそ、技術は今日まで生き残ってきたのである。</p><p>　実際、新しい試みによって息を吹き返した産地もある。ある漆器の産地では、若い職人たちが、食器洗い機で洗える器や、現代的なデザインの食器を作り始めた。伝統的な技法は守りつつ、今の生活で使いやすい形にしたことで、若い世代や海外の客からも注目を集めるようになったという。<u>②こうした変化</u>を、伝統を壊すものだと批判する声もある。だが、使われなくなった器は、どれほど優れた技術で作られていても、やがて忘れられていくだけだ。</p><p>　伝統工芸の本当の価値は、美術館に飾られることで
