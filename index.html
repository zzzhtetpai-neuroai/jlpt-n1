だんだん集中してくる。掃除をするつもりはなかったのに、机の上を少し片付け始めたら、気づけば部屋中をきれいにしていた、ということはないだろうか。やる気は、行動する前ではなく、<u>②行動した後</u>についてくるものなのだ。</p><p>　だとすれば、やる気が出ないときにすべきことは、やる気が出るのを待つことではない。まずは五分だけ、あるいは一行だけと決めて、とにかく始めてしまうことだ。小さな一歩が、次の一歩を呼んでくれる。</p>","qs":[{"n":56,"q":"筆者によると、多くの人が誤解していることは何か。","o":["行動しなければやる気は出ない、ということに気づいていないと思っていること","やる気を待ってから動くものだと思うこと","脳は、何かを続けることが苦手だと思っていること","掃除は面倒なだけで、気分転換にはならないと思っていること"],"e":"Nhiều người nghĩ <b>やる気があるから行動できる</b>, nhưng thực tế thì ngược lại. Bẫy: \"không hành động thì không có động lực\" chính là ĐIỀU ĐÚNG theo tác giả, không phải hiểu lầm.","a":1},{"n":57,"q":"掃除の例が示していることに最も近いものはどれか。","o":["部屋の掃除をすると、気分がよくなって仕事への意欲も高まる。","部屋が片付いていないと、集中できない。","少しのつもりの作業が、いつの間にか広がる。","何事も、最初に立てた計画どおりに進めることが大切だ。"],"e":"Định dọn bàn một chút mà lại dọn cả phòng, minh họa cho <b>何かを始めると、それを続けようとする性質</b>. Bẫy: động lực làm việc tăng lên không phải là ý của ví dụ.","a":2},{"n":58,"q":"筆者の考えに沿った行動として、最も適当なものはどれか。","o":["気が進まないレポートを、まず一行だけ書いてみる。","やる気が出るまで、好きなことをして気分を変える。","一日で全部終わらせるよう、計画を立てる。","やる気が出る音楽を探してから、勉強を始める。"],"e":"Dạng câu hỏi áp dụng: <b>まずは五分だけ、あるいは一行だけと決めて、とにかく始めてしまう</b>. Các đáp án còn lại đều là \"chờ động lực\" hoặc chuẩn bị trước khi làm, đúng điều tác giả phản đối.","a":0}]}]},{"id":"r10","title":"問題10 内容理解（長文）","en":"Đọc hiểu: đoạn dài","instr":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　新しい感染症が広がったとき、専門家の発言が日によって変わることに、不信感を抱いた人は多かったのではないか。昨日は「マスクは効果が薄い」と言っていたのに、今日は「マスクをすべきだ」と言う。いったい何を信じればいいのかと、戸惑った人もいるだろう。</p><p>　しかし、<u>①専門家の意見が変わること</u>は、必ずしも悪いことではない。科学とは、もともとそういうものだからだ。科学者は、その時点で手に入るデータをもとに、最も確からしい説明を考える。新しいデータが得られれば、それに合わせて考えを修正する。意見が変わるのは、科学が正しく機能している証拠でもあるのだ。</p><p>　問題は、私たちが科学に「絶対に正しい答え」を求めすぎていることにある。病気や災害のように、生活や命に関わる場面ではなおさらだ。不安な状況にいると、人ははっきりとした答えを欲しがる。そのため、「わかっていないことがある」と正直に言う専門家よりも、自信を持って断言する人の言葉のほうが、信頼できるように聞こえてしまう。<u>②これは危うい</u>。</p><p>　専門家の側にも、伝え方の工夫が必要だろう。何がわかっていて、何がまだわかっていないのか。なぜ以前の意見を変えたのか。そうしたことを丁寧に説明すれば、意見の変化に対する不信感は和らぐはずだ。</p><p>　科学は、完成した答えの集まりではなく、答えに近づくための方法である。その性質を理解していれば、専門家の意見が変わったときにも、慌てずに受け止めることができる。不確かさを含めて科学と付き合うこと。それが、情報があふれる時代に私たちに求められている姿勢なのではないだろうか。</p>","qs":[{"n":59,"q":"「マスクは効果が薄い」から「マスクをすべきだ」への変化について、筆者の見方に合うものはどれか。","o":["最初の専門家の判断が誤っていたことを示す、大きな失敗だ。","安心させるための政治判断だ。","同じ問題について、専門家の間で意見が対立していた結果だ。","根拠に基づく修正で、科学として自然だ。"],"e":"<b>新しいデータが得られれば…修正する。意見が変わるのは、科学が正しく機能している証拠</b>. データ được nói lại thành 根拠. Bẫy: coi đó là thất bại chính là cách nhìn mà tác giả muốn sửa.","a":3},{"n":60,"q":"筆者によると、断言する人の言葉が信頼されやすいのはなぜか。","o":["断言する人のほうが、正直に話す専門家よりも専門的な知識を持っているから","不安なとき、人ははっきりした答えを欲しがるから","正直に話す専門家が少ないから","科学は常に、一つの正しい答えを出すものだと誰もが知っているから"],"e":"<b>不安な状況にいると、人ははっきりとした答えを欲しがる</b>. Bẫy: người nói chắc chắn chỉ \"nghe có vẻ\" đáng tin (ように聞こえる), không phải họ hiểu biết hơn.","a":1},{"n":61,"q":"筆者によると、意見の変化への不信感を和らげるには何が有効か。","o":["未解明の点や考えを変えた理由を説明すること","考えを変えるときは、混乱を避けるため理由を言わずにできるだけ素早く伝えること","わからないことがあっても、自信を持って断言すること","新しいデータがすべてそろうまでは、何も意見を言わないようにすること"],"e":"<b>何がまだわかっていないのか。なぜ以前の意見を変えたのか…丁寧に説明すれば</b>. Bẫy: nói chắc chắn là điều tác giả cho là nguy hiểm (危うい).","a":0},{"n":62,"q":"筆者の主張に最も近いものはどれか。","o":["科学の答えはいつ変わるかわからないので、あまり信頼しすぎるべきではない。","専門家は、一度出した意見を変えるべきではない。","不安なときこそ、迷わず断言してくれる専門家の言葉を信じるべきだ。","科学は答えに近づく過程で、変化も含めて受け止めたい。"],"e":"<b>科学は、完成した答えの集まりではなく、答えに近づくための方法…不確かさを含めて科学と付き合う</b>. Bẫy: \"đừng tin khoa học\" là suy diễn sai. Tác giả muốn chúng ta hiểu bản chất của khoa học, không phải nghi ngờ nó.","a":3}]}]},{"id":"r11","title":"問題11 統合理解","en":"Đọc so sánh A và B","instr":"次のAとBの文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p><b>A</b></p><p>　週休三日制を導入する企業が出てきた。休みが増えれば、社員は趣味や家族との時間、学び直しにも時間を使える。心身の疲れがとれることで、働く日の集中力も高まるだろう。実際、導入した企業の中には、生産性が下がらなかったという例もある。育児や介護をしながら働く人にとっても、大きな助けになるはずだ。人材を確保するためにも、多くの企業が積極的に取り入れていくべきだ。</p><p><b>B</b></p><p>　週休三日制は、確かに魅力的に聞こえる。休みが増えて喜ぶ人は多いだろう。しかし、どんな職場にも合う制度ではない。客の対応が必要な店や工場では、人員を増やさなければ仕事が回らない。また、休みが増える代わりに給料が減る仕組みの場合、生活が苦しくなる人も出てくる。一日の労働時間が長くなり、かえって疲れるという声もある。制度を一律に広めるのではなく、職場の実情や働く人の希望に合わせて、選べるようにすべきだ。</p>","qs":[{"n":63,"q":"AとBの両方の筆者が認めていることは何か。","o":["週休三日制を導入しても、会社の生産性は下がらないということ","週休三日制では、給料が減る場合があること","週休三日制は、客の対応が必要な店や工場も含め、どの職場にも合うこと","働く人にとって魅力のある制度であること"],"e":"A liệt kê ưu điểm, B mở đầu bằng <b>確かに魅力的に聞こえる</b>. Năng suất chỉ có ở A, giảm lương chỉ có ở B. B nói rõ là KHÔNG hợp với mọi nơi làm việc.","a":3},{"n":64,"q":"Bの主張に最も近いものはどれか。","o":["人材を確保するため、多くの企業が積極的に取り入れるべきだ。","給料を減らさない場合に限って、導入すべきだ。","職場の事情や個人の希望に応じて、選べるようにすべきだ。","客の対応がある職場では、導入すべきではない。"],"e":"Câu cuối của B: <b>職場の実情や働く人の希望に合わせて、選べるようにすべき</b>. Bẫy: \"tích cực áp dụng\" là ý của A. B chỉ nêu khó khăn với cửa hàng, không nói cấm áp dụng.","a":2}]}]},{"id":"r12","title":"問題12 主張理解（長文）","en":"Đọc hiểu: quan điểm tác giả","instr":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　友人の誕生日が近づくと、毎年頭を悩ませる。何を贈れば喜んでもらえるのか。インターネットで「人気のプレゼント」を調べ、値段や評判を比べるうちに、何時間もたってしまうことがある。</p><p>　最近は、相手に欲しいものを直接聞いたり、好きなものを選べるカタログを贈ったりする人も増えているという。確かに、そのほうが失敗はない。相手が本当に必要としているものを確実に渡せるのだから、合理的な方法と言えるだろう。</p><p>　しかし、私はどこか<u>①物足りなさ</u>を感じてしまう。贈り物の価値は、品物そのものだけにあるのではないと思うからだ。相手の好みを思い出し、最近の様子を想像し、何なら喜んでくれるだろうかと考える。その<u>②迷う時間</u>こそが、贈り物の中心にあるのではないか。</p><p>　私が今でも大切にしている贈り物に、学生時代の友人からもらった一冊の古本がある。高価なものではない。しかし、私が以前に何気なく話した作家の本を、友人は覚えていて、古本屋で探してくれたのだ。本を手に取ったとき、自分の話をきちんと聞いてくれていたことが、何よりうれしかった。</p><p>　贈り物を受け取ったとき、私たちが喜ぶのは、品物を手に入れたからだけではない。自分のことを考えてくれた人がいる、という事実に心を動かされるのだ。だとすれば、多少好みから外れていたとしても、相手のことを思って選んだ贈り物には、十分な価値がある。失敗を恐れず、相手を思う時間を楽しみたいと思う。</p>","qs":[{"n":65,"q":"相手に欲しいものを聞く方法について、筆者はどのように評価しているか。","o":["確実だが、大事な何かが欠けていると感じる。","相手に何が欲しいかを聞くのは失礼なので、避けるべきだと考えている。","最も気持ちが伝わる方法だと考えている。","値段や評判を比べる手間が省けるので、とても便利な方法だと考えている。"],"e":"<b>合理的な方法…しかし、私はどこか物足りなさを感じてしまう</b>. 物足りない được nói lại thành 何かが欠けている. Bài không nói phương pháp này thất lễ.","a":0},{"n":66,"q":"筆者が、贈り物の中心にあると考えているものは何か。","o":["相手を思い浮かべながら選ぶ時間","品物の値段や、インターネットでの評判","相手が本当に必要としている品物","失敗しないように、何時間もかけて念入りに行う下調べ"],"e":"<b>その迷う時間こそが、贈り物の中心にある</b>. Bẫy: \"món đồ thật sự cần\" là ưu điểm của việc hỏi trực tiếp, mà tác giả thấy chưa đủ.","a":0},{"n":67,"q":"古本の例で、筆者が最も伝えたいことは何か。","o":["高価なものでなくても、なかなか手に入らない珍しい本なら喜ばれる。","話を覚えてくれたことが何よりうれしかった。","欲しいものを頼んでおけば、確実に手に入る。","古本屋で探せば、新しい本を買うよりずっと安く贈り物を用意できる。"],"e":"<b>自分の話をきちんと聞いてくれていたことが、何よりうれしかった</b>. Bẫy: tác giả chỉ tình cờ nhắc đến (何気なく話した), không hề nhờ mua.","a":1},{"n":68,"q":"筆者の主張に最も近いものはどれか。","o":["好みから外れても、思って選んだ物には意味がある。","贈り物は、相手の好みに完全に合うものを、時間をかけて選ぶべきだ。","贈り物を選ぶのに、時間をかけすぎるべきではない。","失敗しないよう、前もって相手に欲しいものを聞いておくべきだ。"],"e":"<b>多少好みから外れていたとしても…十分な価値がある</b>. Câu cuối: <b>失敗を恐れず</b>, nên đáp án \"phải hợp hoàn toàn\" là ngược lại.","a":0}]}]},{"id":"r13","title":"問題13 情報検索","en":"Tìm thông tin","instr":"次は、ある宅配会社の料金表である。下の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<div class='notice'><p style='text-align:center'><b>そよかぜ便　料金のご案内（関東から発送する場合）</b></p><table class='tbl'><tr><th>サイズ<br>（縦横高さの合計）</th><th>関東</th><th>関西</th><th>九州</th><th>北海道</th></tr><tr><td>60cmまで</td><td>900円</td><td>1,100円</td><td>1,300円</td><td>1,400円</td></tr><tr><td>80cmまで</td><td>1,200円</td><td>1,400円</td><td>1,600円</td><td>1,700円</td></tr><tr><td>100cmまで</td><td>1,500円</td><td>1,700円</td><td>1,900円</td><td>2,000円</td></tr><tr><td>120cmまで</td><td>1,800円</td><td>2,000円</td><td>2,200円</td><td>2,300円</td></tr></table><p>※重さが20kgを超える場合は、サイズにかかわらず「120cmまで」の料金となります。<br>※営業所に直接お持ち込みいただくと、1個につき100円引きとなります。<br>※お届け時間の指定は無料です。お届け日の指定は、発送日から7日以内に限ります。<br>※冷蔵、冷凍での発送は、上記料金に300円が加算されます。</p></div>","qs":[{"n":69,"q":"東京に住む佐藤さんは、関西の友人に二つの荷物を送る。一つは縦横高さの合計が58cmで重さ3kgの冷凍食品、もう一つは合計が95cmで重さ8kgの衣類である。どちらも営業所に持ち込む。料金の合計はいくらか。","o":["3,100円","3,200円","2,900円","3,000円"],"e":"Gói 1: mức 60cm đi 関西 1,100 + đông lạnh 300 − mang đến 100 = 1,300円. Gói 2: mức 100cm 1,700 − 100 = 1,600円. Tổng <b>2,900円</b>. Bẫy: 3,100円 (quên giảm khi mang đến), 3,000円 (chỉ giảm 100 một lần, nhưng giảm theo <b>1個につき</b>, tức mỗi kiện).","a":2},{"n":70,"q":"荷物を発送日の10日後に届くよう指定したい場合、正しいものはどれか。","o":["その日付は指定できない。","追加料金を払えば、発送日から10日後の日付でも指定できる。","時間指定と同じく、無料で指定できる。","営業所に直接持ち込めば、7日を超える日付でも指定できる。"],"e":"<b>お届け日の指定は、発送日から7日以内に限ります</b>. 10 ngày là quá 7 ngày nên không thể chỉ định. Chỉ định GIỜ thì miễn phí, đây là bẫy trộn hai điều kiện.","a":0}]}]}];
const SET7 = [{"id":"m1","title":"問題1 漢字読み","en":"Đọc kanji","instr":"＿＿の言葉の読み方として最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":1,"q":"どちらの作品も素晴らしく、<u>優劣</u>をつけるのは難しい。","o":["ゆうれつ","ゆうりつ","ゆれつ","ようれつ"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 2, lần này hỏi theo dạng khác.</span><br><b>優劣 (ゆうれつ)</b> = hơn kém. 優 = <b>ゆう</b> (trường âm), 劣 = <b>れつ</b> (như 劣る おとる, 劣化 れっか).","a":0}]},{"qs":[{"n":2,"q":"彼の明るい言葉とは<u>裏腹</u>に、表情は暗かった。","o":["りふく","うらばら","うらはら","りはら"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 4, lần này hỏi theo dạng khác.</span><br><b>裏腹 (うらはら)</b> = trái ngược. Cả hai chữ đều đọc theo âm Nhật: 裏 = うら, 腹 = はら. Không biến âm thành ばら.","a":2}]},{"qs":[{"n":3,"q":"彼女はハンカチで、そっと涙を<u>拭った</u>。","o":["ぬぐった","ふいた","はらった","すくった"],"e":"<b>拭う (ぬぐう)</b> = lau, chùi (nước mắt, mồ hôi). Bẫy: chữ 拭 cũng đọc là <b>ふく</b> (拭く = lau), nhưng 拭った với đuôi った thì là ぬぐった. ふいた sẽ viết là 拭いた.","a":0}]},{"qs":[{"n":4,"q":"政府は、被害を受けた地域に対して特別な<u>措置</u>をとった。","o":["しょち","そうち","そち","さくち"],"e":"<b>措置 (そち)</b> = biện pháp. 措 = <b>そ</b>, 置 = <b>ち</b>. Bẫy là しょち vì 処置 (しょち) cũng có nghĩa gần giống (xử lý).","a":2}]},{"qs":[{"n":5,"q":"来月から、入国の制限が<u>緩和</u>される予定だ。","o":["かんわ","えんわ","かんか","だんわ"],"e":"<b>緩和 (かんわ)</b> = nới lỏng, giảm nhẹ (quy định, triệu chứng). 緩 = <b>かん</b> (âm Nhật: ゆるい), 和 = <b>わ</b>.","a":0}]},{"qs":[{"n":6,"q":"祖父は<u>頑な</u>に、自分のやり方を変えようとしなかった。","o":["かたくな","がんこな","かたな","がんな"],"e":"<b>頑な (かたくな)</b> = cố chấp, bướng bỉnh. Bẫy: がんこ là 頑固, nghĩa gần giống nhưng chữ khác. 頑な với đuôi な thì đọc là <b>かたくな</b>.","a":0}]}]},{"id":"m2","title":"問題2 文脈規定","en":"Từ theo ngữ cảnh","instr":"（　　）に入れるのに最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":7,"q":"この十年で、医療技術は（　　）発展を遂げた。","o":["慌ただしい","紛らわしい","目覚ましい","目まぐるしい"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>目覚ましい (めざましい)</b> = ngoạn mục, đáng kinh ngạc (sự tiến bộ). Bẫy: 目まぐるしい = thay đổi chóng mặt (目まぐるしく変わる), không đi với 発展を遂げる. 紛らわしい = dễ gây nhầm lẫn.","a":2}]},{"qs":[{"n":8,"q":"迷子の犬を探すため、近所の人たちが（　　）して町中を回った。","o":["手配","手入れ","手当て","手分け"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>手分け (てわけ)する</b> = chia nhau ra làm. 手配 = sắp xếp, chuẩn bị, 手入れ = chăm sóc, bảo dưỡng, 手当て = chữa trị (vết thương), hoặc phụ cấp.","a":3}]},{"qs":[{"n":9,"q":"さっきまで晴れていたのに、空が（　　）曇り出した。","o":["しだいに","にわかに","ひそかに","おもむろに"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 4, lần này hỏi theo dạng khác.</span><br><b>にわかに</b> = đột nhiên. Đi với さっきまで晴れていたのに (vừa nãy còn nắng). しだいに = dần dần, ひそかに = lén lút, おもむろに = thong thả, từ từ.","a":1}]},{"qs":[{"n":10,"q":"新製品の大ヒットが、会社の業績回復に（　　）をかけた。","o":["歯止め","水","手間","拍車"],"e":"<b>拍車をかける (はくしゃ)</b> = thúc đẩy nhanh hơn. 歯止めをかける = kìm hãm (ngược nghĩa), 水をかける = dội nước lạnh, làm mất hứng, 手間をかける = tốn công.","a":3}]},{"qs":[{"n":11,"q":"記者に質問されても、大臣の答えはどこか（　　）が悪かった。","o":["口数","歯切れ","手応え","風当たり"],"e":"<b>歯切れが悪い (はぎれ)</b> = nói ấp úng, không dứt khoát. 口数が少ない = ít nói, 手応えがある = có cảm giác thành công, 風当たりが強い = bị chỉ trích nhiều.","a":1}]},{"qs":[{"n":12,"q":"ベテラン社員が長年かけて身につけた（　　）を、若手に伝える研修を始めた。","o":["ハンディ","ブランク","ノウハウ","ギャップ"],"e":"<b>ノウハウ</b> = bí quyết, kinh nghiệm thực tế (know-how). ハンディ = bất lợi, ブランク = khoảng trống (thời gian nghỉ việc), ギャップ = khoảng cách, chênh lệch.","a":2}]},{"qs":[{"n":13,"q":"準備には（　　）はない。あとは本番で力を出すだけだ。","o":["漏れ","抜かり","隙間","不備"],"e":"<b>抜かりはない (ぬかり)</b> = không có sơ suất gì, chuẩn bị chu đáo. 抜かりない là cụm cố định. 漏れ = sót (漏れがない cũng có nhưng đi với danh sách, kiểm tra), 不備 = thiếu sót (dùng 不備がない nhưng không đi với には).","a":1}]}]},{"id":"m3","title":"問題3 言い換え類義","en":"Từ gần nghĩa","instr":"＿＿の言葉に意味が最も近いものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":14,"q":"新人の彼は、初めての仕事も<u>そつなく</u>こなした。","o":["時間をかけて","楽しそうに","一人だけで","問題なく上手に"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 2, lần này hỏi theo dạng khác.</span><br><b>そつなく</b> = trơn tru, không mắc lỗi gì. Gần nhất là 問題なく上手に.","a":3}]},{"qs":[{"n":15,"q":"その名前には、まったく<u>心当たりがない</u>。","o":["思い当たることがない","興味がない","聞いたことがある","覚えたくない"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 2, lần này hỏi theo dạng khác.</span><br><b>心当たり (こころあたり)がない</b> = không có chút manh mối, không nghĩ ra là ai. Gần nhất là 思い当たることがない.","a":0}]},{"qs":[{"n":16,"q":"事故の影響で、電車は運転を<u>見合わせて</u>いる。","o":["遅らせて","一時的に止めて","変更して","再開して"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 2, lần này hỏi theo dạng khác.</span><br><b>見合わせる (みあわせる)</b> = tạm dừng, hoãn lại. 運転を見合わせる = tạm dừng chạy tàu. Gần nhất là 一時的に止めて. 再開 = chạy lại, là trái nghĩa.","a":1}]},{"qs":[{"n":17,"q":"毎日練習を続けていれば、<u>おのずと</u>結果はついてくる。","o":["すぐに","必ずしも","自然に","少しずつ"],"e":"<b>おのずと (自ずと)</b> = tự nhiên, tự khắc. Gần nhất là 自然に.","a":2}]},{"qs":[{"n":18,"q":"引っ越しの準備は、<u>あらかた</u>終わった。","o":["やっと","ほとんど","少しだけ","すべて"],"e":"<b>あらかた</b> = hầu hết, phần lớn. Gần nhất là ほとんど. Không phải すべて (toàn bộ).","a":1}]},{"qs":[{"n":19,"q":"部長に、来年度の海外赴任を<u>打診された</u>。","o":["行くように命令された","行かないように言われた","してもいいか意向を聞かれた","詳しく説明された"],"e":"<b>打診 (だしん)する</b> = thăm dò ý kiến (trước khi quyết định chính thức). Gần nhất là 意向を聞かれた. Không phải là ra lệnh (命令).","a":2}]}]},{"id":"m4","title":"問題4 用法","en":"Cách dùng từ","instr":"次の言葉の使い方として最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":20,"q":"<b>白紙</b>","o":["彼女は白紙な性格で、誰とでも仲良くなれる。","雪が降って、町が一面白紙になった。","テストの答えがわからず、頭の中が白紙で光った。","予算が足りず、新しい駅の建設計画は白紙に戻された。"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>白紙に戻す (はくしにもどす)</b> = hủy bỏ, quay lại từ đầu (kế hoạch). Tính cách trong sáng là 素直, tuyết phủ trắng là 真っ白になる, đầu óc trống rỗng là 頭が真っ白になる.","a":3}]},{"qs":[{"n":21,"q":"<b>ことごとく</b>","o":["ことごとく、明日は晴れるだろう。","彼の予想は、ことごとく外れた。","彼女はことごとく親切な人だ。","雨がことごとく降り続いている。"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>ことごとく</b> = tất cả, không trừ cái nào (đối tượng có số nhiều). Không dùng để phỏng đoán, nhấn mạnh tính từ, hay mô tả thời gian kéo dài.","a":1}]},{"qs":[{"n":22,"q":"<b>気兼ね</b>","o":["試験の前日は、気兼ねで眠れなかった。","ここは私の家だと思って、気兼ねなくゆっくりしてください。","彼は気兼ねが強くて、すぐに怒る。","旅行の気兼ねに、新しいかばんを買った。"],"e":"<b>気兼ね (きがね)</b> = ngại ngùng, e ngại làm phiền người khác. 気兼ねなく = cứ tự nhiên. Lo lắng là 不安 hoặc 心配, nóng tính là 気が短い.","a":1}]},{"qs":[{"n":23,"q":"<b>見込み</b>","o":["彼は人の見込みをよく覚えている。","窓から見込みのいい部屋を選んだ。","この工事は、来年の春に完成する見込みだ。","この絵は、遠くから見込むと美しい。"],"e":"<b>見込み (みこみ)</b> = dự kiến, triển vọng. ～見込みだ = dự kiến sẽ ~. Nhớ mặt người là 顔を覚える, phòng có tầm nhìn đẹp là 見晴らしがいい.","a":2}]},{"qs":[{"n":24,"q":"<b>張り合い</b>","o":["子どもたちが喜んでくれるので、料理にも張り合いがある。","この布は張り合いがあって、しわになりにくい。","二人は張り合いをして、仲直りした。","寒さで、手の張り合いがなくなった。"],"e":"<b>張り合い (はりあい)がある</b> = có động lực, thấy đáng công làm. Vải cứng cáp là 張りがある, cảm giác ở tay là 感覚.","a":0}]},{"qs":[{"n":25,"q":"<b>秀でる</b>","o":["この店の料理は値段が秀でている。","今朝は早く秀でて、散歩に出かけた。","山の上から、朝日が秀でてきた。","彼女は語学に秀でており、五か国語を話す。"],"e":"<b>Nに秀でる (ひいでる)</b> = xuất sắc, vượt trội về N. Giá đắt là 高い, dậy sớm là 起きる, mặt trời mọc là 昇る.","a":3}]}]},{"id":"m5","title":"問題5 文法形式の判断","en":"Ngữ pháp","instr":"次の文の（　　）に入れるのに最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":26,"q":"周囲の不安（　　）、新しい市長は大胆な改革を次々と進めた。","o":["をもとに","をよそに","をきっかけに","にこたえて"],"e":"<span class='rev'>【Ôn tập ngữ pháp】 Mẫu này đã xuất hiện ở 模試 1, lần này trong câu mới.</span><br><b>Nをよそに</b> = mặc kệ N (lo lắng, phản đối của người khác). Bẫy: <b>にこたえて</b> = đáp ứng (kỳ vọng), mà đáp ứng sự lo lắng bằng cải cách táo bạo thì mâu thuẫn.","a":1}]},{"qs":[{"n":27,"q":"最近の天気（　　）、晴れたかと思えば急に大雨になる。","o":["ときたら","とあって","ともなると","としたら"],"e":"<b>Nときたら</b> = nói đến N thì (than phiền). Bẫy: としたら = nếu giả sử là, ともなると = một khi đã đến mức.","a":0}]},{"qs":[{"n":28,"q":"彼の真剣な訴えは、聞く人の心を動かさ（　　）。","o":["ずにはいられない","ずにはおかない","ずじまいだった","ないではすまない"],"e":"<span class='rev'>【Ôn tập ngữ pháp】 Mẫu này đã xuất hiện ở 模試 2, lần này trong câu mới.</span><br><b>Nは～ずにはおかない</b> = N chắc chắn sẽ gây ra (chủ ngữ là sự việc: lời kêu gọi). Bẫy: <b>ずにはいられない</b> là cảm xúc của chính người nói, chủ ngữ phải là người.","a":1}]},{"qs":[{"n":29,"q":"あまりの緊張で、自分の名前（　　）うまく言えなかった。","o":["こそ","なり","ほど","すら"],"e":"<b>Nすら～ない</b> = ngay cả N cũng không. Bẫy: こそ = chính là (nhấn mạnh tích cực), なり = hoặc là (～なり～なり).","a":3}]},{"qs":[{"n":30,"q":"故郷を離れて一人で暮らす娘を思う母親の気持ちは、察する（　　）。","o":["にたえない","に足りない","にあたらない","にかたくない"],"e":"<span class='rev'>【Ôn tập ngữ pháp】 Mẫu này đã xuất hiện ở 模試 3, lần này trong câu mới.</span><br><b>Vる にかたくない</b> = không khó để V. 察するにかたくない = dễ dàng thấu hiểu. Bẫy: にたえない = không chịu nổi (見るにたえない), にあたらない = không đáng phải (驚くにあたらない).","a":3}]},{"qs":[{"n":31,"q":"睡眠時間を削っ（　　）、ゲームを続ける必要はないだろう。","o":["てまで","てこそ","てからは","てはじめて"],"e":"<b>Vて まで</b> = đến mức phải V (hy sinh quá đáng). Bẫy: てこそ và てはじめて đều nghĩa là \"chỉ khi V mới\", không hợp với 必要はない.","a":0}]},{"qs":[{"n":32,"q":"優勝とは言わ（　　）、せめて一回戦は勝ちたい。","o":["ないまでも","ないことには","ないものでもない","ないばかりに"],"e":"<b>Vない までも</b> = dù không đến mức V, thì ít nhất. Đi với せめて. Cả bốn đều bắt đầu bằng ない, phải dựa vào nghĩa: ないことには = nếu không thì không thể.","a":0}]},{"qs":[{"n":33,"q":"謝りに来たの（　　）、彼は自分の言い分ばかりを話し始めた。","o":["かのように","かどうか","かと思いきや","かいもなく"],"e":"<span class='rev'>【Ôn tập ngữ pháp】 Mẫu này đã xuất hiện ở 模試 5, lần này trong câu mới.</span><br><b>～かと思いきや</b> = cứ tưởng là ~, ai ngờ. Bẫy: かのように = cứ như thể, かいもなく phải đi với Vた (来たかいもなく), không đi với の.","a":2}]},{"qs":[{"n":34,"q":"この病気は、早く治療しないと命（　　）。","o":["にかかわる","にそくする","にあたる","にこたえる"],"e":"<b>命にかかわる</b> = nguy hiểm đến tính mạng. Cụm cố định. にそくする = dựa theo, にこたえる = đáp ứng.","a":0}]},{"qs":[{"n":35,"q":"この本は、一度読み始めた（　　）、最後まで止まらなくなる。","o":["が最後","が早いか","がゆえに","そばから"],"e":"<b>Vたが最後</b> = một khi đã V thì không dừng lại được. Bẫy: が早いか = vừa V thì ngay (một sự việc nối tiếp), そばから = vừa làm xong lại (lặp lại).","a":0}]}]},{"id":"m6","title":"問題6 文の組み立て","en":"Sắp xếp câu","instr":"次の文の ★ に入る最もよいものを、1、2、3、4から一つ選びなさい。","fixed":true,"pages":[{"qs":[{"n":36,"q":"私は君の将来を ＿＿＿ <b>★</b> ＿＿＿ ＿＿＿ 厳しいことを言うのだ。","o":["こそ","本気で","あえて","思えば"],"a":3,"e":"<span class='rev'>【Ôn tập ngữ pháp】 Mẫu này đã xuất hiện ở 模試 4, lần này trong câu mới.</span><br>Thứ tự đúng: 本気で <b>思えば</b> こそ あえて (2 4 1 3). <b>Vばこそ</b> = chính vì V. ★ ở vị trí thứ hai."}]},{"qs":[{"n":37,"q":"部長は、＿＿＿ ＿＿＿ ＿＿＿ <b>★</b> 、休日も会社に来ている。","o":["立場","上","という","責任者"],"a":1,"e":"Thứ tự đúng: 責任者 という 立場 <b>上</b> (4 3 1 2). <b>N上 (じょう)</b> = xét về mặt N. ★ ở vị trí cuối."}]},{"qs":[{"n":38,"q":"この店は ＿＿＿ <b>★</b> ＿＿＿ ＿＿＿ ので、いつも行列ができている。","o":["うえに","味もいい","安い","値段が"],"a":2,"e":"Thứ tự đúng: 値段が <b>安い</b> うえに 味もいい (4 3 1 2). <b>～うえに</b> = không những ~ mà còn."}]},{"qs":[{"n":39,"q":"彼女は、<b>★</b> ＿＿＿ ＿＿＿ ＿＿＿ 、また同じミスをした。","o":["ばかり","先週","なのに","注意された"],"a":1,"e":"Thứ tự đúng: <b>先週</b> 注意された ばかり なのに (2 4 1 3). ★ ở vị trí đầu. Mẹo: từ chỉ thời gian (先週) thường đứng đầu cụm."}]},{"qs":[{"n":40,"q":"こんな難しい仕事は、＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 引き受けられない。","o":["私には","とても","浅い","経験の"],"a":0,"e":"Thứ tự đúng: 経験の 浅い <b>私には</b> とても (4 3 1 2). とても～ない: とても phải đứng ngay trước động từ phủ định."}]}]},{"id":"m7","title":"問題7 文章の文法","en":"Ngữ pháp trong đoạn văn","instr":"次の文章を読んで、文章全体の内容を考えて、41 から 45 の中に入る最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　四十歳を過ぎてから、ピアノを習い始めた。子どものころから憧れてはいたが、この年で始めても上達しないだろうと、ずっと（41）。</p><p>　きっかけは、友人の一言だった。「やってみない（42）、上達するかどうかなんてわからないよ」。確かにそのとおりだ。そう思い直して、近所の教室に申し込んだ。</p><p>　始めてみると、思うように指が動かない。子どもなら一週間で覚える曲に、一か月かかることもある。（43）、不思議と苦にはならなかった。誰かと競争しているわけではないし、昨日弾けなかったところが今日弾けるようになる、それだけでうれしいのだ。</p><p>　大人になると、新しいことを始めるのをためらいがちだ。失敗するのが恥ずかしい、今さら遅い、と考えてしまう。しかし、上手になること（44）、楽しむことを目的にすれば、年齢は関係ない。来年の発表会では、子どもたちに交じって一曲弾く（45）。</p>","qs":[{"n":41,"q":"（41）","o":["あきれていた","あきらめていた","習っていた","うぬぼれていた"],"e":"Nghĩ học ở tuổi này sẽ không tiến bộ nên <b>đã từ bỏ</b> (あきらめる). Bẫy về âm: あきれる = sững sờ, chán ngán. うぬぼれる = tự mãn.","a":1},{"n":42,"q":"（42）","o":["ことなしに","ことだし","ことには","ことか"],"e":"<span class='rev'>【Ôn tập ngữ pháp】 Mẫu này đã xuất hiện ở 模試 4, lần này trong câu mới.</span><br><b>Vないことには～ない</b> = nếu không V thì không thể. Bẫy: <b>ことなしに</b> = mà không V. Nếu dùng ở đây sẽ thành phủ định kép sai ngữ pháp (ないことなしに).","a":2},{"n":43,"q":"（43）","o":["それにしては","それでも","そのくせ","それゆえ"],"e":"Học chậm, tay không chạy (khó khăn), <b>それでも</b> (dù vậy) lại không thấy khổ. Bẫy: <b>そのくせ</b> = vậy mà (mang ý chê bai người khác), không hợp khi nói về cảm xúc của bản thân.","a":1},{"n":44,"q":"（44）","o":["をよそに","にひきかえ","にかかわらず","よりも"],"e":"<b>AよりもB</b> = B hơn là A. Bẫy: にかかわらず phải đi với cặp đối lập hoặc かどうか (上手かどうかにかかわらず).","a":3},{"n":45,"q":"（45）","o":["つもりだった","つもりだ","どころではない","わけにはいくまい"],"e":"来年 = năm sau, nên dùng <b>つもりだ</b> (dự định). Bẫy: <b>つもりだった</b> = đã định nhưng (thường là không làm được), không hợp với dự định tương lai.","a":1}]}]},{"id":"r8","title":"問題8 内容理解（短文）","en":"Đọc hiểu: đoạn ngắn","instr":"次の（1）から（4）の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>（1）</p><p>　メールやメッセージに、すぐに返信しなければと焦る人は多い。返事が遅れると、相手に失礼だと感じるからだろう。しかし、急いで書いた返信は、内容が不十分だったり、誤解を招く表現が含まれていたりすることも少なくない。大切なのは返信の速さではなく、相手の問いに正確に答えることだ。すぐに答えられない内容なら、「確認して後ほどご連絡します」と一言送っておけば十分である。</p>","qs":[{"n":46,"q":"筆者の考えに合うものはどれか。","o":["返信が遅れると相手に失礼なので、内容よりもまず返信の速さを優先すべきだ。","急いだ返信はいつも不十分だ。","正確に答えられない内容には、相手に誤解を与えないよう返信しないほうがよい。","すぐ答えられないなら、一言伝えれば十分だ。"],"e":"<b>「確認して後ほどご連絡します」と一言送っておけば十分</b>. Bẫy: \"trả lời chậm là thất lễ\" là suy nghĩ của nhiều người mà tác giả không đồng ý. いつも quá tuyệt đối, bài chỉ nói 少なくない.","a":3}]},{"passage":"<p>（2）</p><p>以下は、ある駅前の駐輪場に貼られたお知らせである。</p><div class='notice'><p style='text-align:center'><b>駐輪場の利用方法変更のお知らせ</b></p><p>　4月1日より、駐輪場の利用方法が以下のように変わります。</p><p>【一時利用】最初の2時間は無料、以降24時間ごとに100円<br>【定期利用】月額1,800円（学生は月額1,200円）</p><p>　定期利用の申し込みは、駐輪場の管理事務所で受け付けます。学生料金で申し込む場合は、学生証をお持ちください。<br>　なお、3月末までに定期利用を申し込んだ方は、4月分の料金が無料となります。</p></div>","qs":[{"n":47,"q":"大学生のチャンさんは、4月から毎日この駐輪場を使いたい。正しいものはどれか。","o":["3月中に学生証を持って申し込めば、4月分は無料だ。","4月に入ってから定期利用を申し込んでも、最初の4月分の料金は無料になる。","一時利用なら、何時間とめても料金はかからない。","学生証を見せて定期利用を申し込めば、料金は月額1,800円になる。"],"e":"Phần なお: đăng ký <b>trước cuối tháng 3</b> thì tháng 4 miễn phí. Bẫy: đăng ký tháng 4 thì không được miễn. Gửi theo lượt chỉ miễn phí 2 giờ đầu. Sinh viên là 1,200円, không phải 1,800円.","a":0}]},{"passage":"<p>（3）</p><p>　一人で考え事をしているとき、つい独り言を言ってしまうことがある。周りの人に聞かれると恥ずかしいが、実は独り言には、考えを整理する効果があるという。頭の中だけで考えていると、同じところをぐるぐる回ってしまいがちだ。声に出すことで、自分の考えを外から聞くことになり、どこが曖昧なのかに気づきやすくなる。行き詰まったときは、小さな声で考えを口にしてみるのもよいだろう。</p>","qs":[{"n":48,"q":"筆者によると、頭の中だけで考えていると、どうなりやすいか。","o":["頭の中で考えたことは、すぐに忘れてしまうことが多い。","同じところを回って、考えが進まなくなる。","周りの人に、考えを知られてしまう。","考えの曖昧な点に、声に出すときよりも気づきやすくなる。"],"e":"<b>同じところをぐるぐる回ってしまいがち</b>. ぐるぐる回る được nói lại thành 堂々めぐり (luẩn quẩn). Bẫy: nhận ra điểm mơ hồ là tác dụng của việc nói ra thành tiếng, ngược lại hoàn toàn.","a":1}]},{"passage":"<p>（4）</p><p>　手帳の予定を隙間なく埋めると、充実した毎日を送っているような気がする。しかし、予定を詰め込みすぎると、一つの予定が遅れただけで、その後のすべてが崩れてしまう。急な用事や体調の変化にも対応できない。予定と予定の間に、あえて何も入れない時間を作っておくこと。その余白こそが、計画を最後まで守るための支えになるのである。</p>","qs":[{"n":49,"q":"「余白」について、筆者が言いたいことは何か。","o":["予定の数を減らしさえすれば、毎日の生活がより充実したものになる。","空いた時間が、予定全体を守る役に立つ。","余白には急用を入れるべきだ。","予定は手帳に書き込まず、すべて頭の中で管理するようにすべきだ。"],"e":"<b>その余白こそが、計画を最後まで守るための支えになる</b>. Bẫy: tác giả không nói giảm lịch thì cuộc sống phong phú hơn. Khoảng trống là để ứng phó việc gấp, chứ không phải xếp trước việc gấp vào.","a":1}]}]},{"id":"r9","title":"問題9 内容理解（中文）","en":"Đọc hiểu: đoạn vừa","instr":"次の（1）から（3）の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>（1）</p><p>　小学生のころ、近所の書道教室に通っていた。先生は七十代の女性で、普段はとても穏やかだったが、筆の持ち方や姿勢には厳しかった。</p><p>　ある日、何枚書いても字がうまく書けず、私は途中で投げやりになった。すると先生は、私の書いた紙を一枚ずつ並べ、「よく見てごらん」と言った。言われて見比べると、最初の一枚より最後の一枚のほうが、線がまっすぐになっている。<u>①自分では気づかなかった変化</u>だった。</p><p>　先生は続けて、「上手に書けなかった紙も、全部あなたの練習の跡。無駄な一枚なんてないのよ」と言った。その言葉を聞いて、私はもう一度筆を取った。</p><p>　大人になった今、仕事でうまくいかないとき、私はよくこの言葉を思い出す。結果がすぐに出なくても、積み重ねた努力は必ずどこかに残っている。<u>②先生が教えてくれたのは、字の書き方だけではなかった</u>のだ。</p>","qs":[{"n":50,"q":"先生が書いた紙を並べたのは、筆者にどのようなことを気づかせるためだったと考えられるか。","o":["筆の持ち方が最初から間違っていて、直す必要があったこと","最初に書いた一枚が、一番よく書けていたこと","一日に書く枚数が多すぎて、集中できていなかったこと","投げやりな練習の中にも、上達があったこと"],"e":"<b>最初の一枚より最後の一枚のほうが、線がまっすぐになっている</b>. Bẫy: đáp án nói tờ đầu tiên đẹp nhất là đảo ngược. Đáp án đúng không chép nguyên văn mà diễn đạt lại.","a":3},{"n":51,"q":"「無駄な一枚なんてない」という言葉の意味に最も近いものはどれか。","o":["紙は大切なものなので、書き損じで一枚も無駄にしてはいけない。","上手に書けた紙だけを、大切に残すべきだ。","失敗した練習も、すべて成長の積み重ねだ。","枚数を重ねるより、一枚一枚をていねいに書くことが大切だ。"],"e":"Câu trước đó: <b>上手に書けなかった紙も、全部あなたの練習の跡</b>. Bẫy: hiểu theo nghĩa đen là đừng lãng phí giấy. Viết cẩn thận từng tờ nghe hợp lý nhưng không phải ý của câu này.","a":2},{"n":52,"q":"大人になった筆者について、本文の内容と合うものはどれか。","o":["うまくいかないとき、先生の言葉を支えにしている。","今も仕事の合間に時間を見つけて、書道を続けている。","仕事では、厳しい姿勢を大切にしている。","子どものころの経験を生かして、子どもたちに書道を教えている。"],"e":"<b>仕事でうまくいかないとき、私はよくこの言葉を思い出す</b>. Các đáp án khác đều không có trong bài.","a":0}]},{"passage":"<p>（2）</p><p>　レジ袋が有料になって数年がたち、買い物に自分の袋を持参する人はすっかり増えた。プラスチックごみを減らすための一歩として、この取り組みには一定の効果があったと言える。</p><p>　しかし、<u>①これで十分だ</u>と考えるのは早い。実は、レジ袋がプラスチックごみ全体に占める割合は、それほど大きくない。食品の容器や包装、ペットボトルなど、私たちの身の回りには、まだ大量のプラスチックがあふれている。</p><p>　では、レジ袋の有料化に意味はなかったのだろうか。私はそうは思わない。この取り組みの最も大きな成果は、<u>②人々の意識を変えたこと</u>にある。袋を断るという小さな行動を毎日繰り返すうちに、ごみについて考える習慣が生まれた。包装の少ない商品を選んだり、詰め替え用の製品を買ったりする人が増えたのも、その表れだろう。</p><p>　一人一人の行動は小さくても、意識が変われば、社会全体の変化につながっていく。レジ袋は、そのきっかけにすぎないのだ。</p>","qs":[{"n":53,"q":"筆者は、レジ袋の有料化をどのように評価しているか。","o":["プラスチックごみの量を大きく減らした点で、十分な成果を上げた取り組みだ。","効果はほとんどなく、意味のない取り組みだった。","効果は限られるが、意識を変えた点で意味がある。","袋を持ち歩く人は増えたが、人々のごみに対する意識はほとんど変わらなかった。"],"e":"Đoạn 2: túi nilon chỉ chiếm phần nhỏ trong rác nhựa. Đoạn 3: <b>最も大きな成果は、人々の意識を変えたこと</b>. Đáp án đúng phải gộp ý của cả hai đoạn. Đây là kỹ thuật của N1.","a":2},{"n":54,"q":"「これで十分だ」と考えるのが早いのはなぜか。","o":["買い物に自分の袋を持ち歩く人が、まだそれほど多くはないから","レジ袋の値段が、安すぎるから","レジ袋は、ごみ全体のごく一部にすぎないから","包装の少ない商品や詰め替え用の製品が、まだあまり売れていないから"],"e":"<b>レジ袋がプラスチックごみ全体に占める割合は、それほど大きくない</b>. Bẫy: số người mang túi riêng đã <b>tăng rất nhiều</b> (すっかり増えた).","a":2},{"n":55,"q":"筆者の考えに最も近いものはどれか。","o":["レジ袋の有料化によって、プラスチックごみの問題は解決に向かい始めた。","個人の行動だけでは、社会は変わらない。","レジ袋以外の食品の容器やペットボトルも、すべて有料にすべきだ。","小さな行動の積み重ねが、社会を変える出発点になる。"],"e":"<b>一人一人の行動は小さくても、意識が変われば、社会全体の変化につながっていく</b>. Bẫy: tác giả nói túi nilon chỉ là \"khởi đầu\" (きっかけにすぎない), chưa giải quyết được vấn đề.","a":3}]},{"passage":"<p>（3）</p><p>　年を取ると、新しいことへの興味が薄れていくと考える人は多い。しかし、八十歳を過ぎても、驚くほど好奇心が旺盛な人がいる。私の祖父もその一人だ。</p><p>　祖父は八十二歳でスマートフォンを買い、使い方を孫の私に毎日のように聞いてくる。写真の撮り方を覚えると、今度は動画の撮り方を知りたがり、最近ではビデオ通話で遠くに住む友人と話している。わからないことがあると、<u>①恥ずかしがらずに何度でも質問する</u>。その姿を見ていると、学ぶことに年齢は関係ないのだと感じる。</p><p>　祖父に、なぜそんなに新しいことに挑戦するのかと聞いてみたことがある。祖父は笑って、「知らないことを知るのが楽しいからだよ。それに、できなかったことができるようになると、まだまだ自分も捨てたものではないと思える」と答えた。</p><p>　好奇心は、若さを保つ秘訣なのかもしれない。<u>②祖父の言葉</u>を聞いて、私も何か新しいことを始めてみたくなった。</p>","qs":[{"n":56,"q":"祖父の様子として、本文の内容と合うものはどれか。","o":["孫に頼らずに、自分で本やインターネットを使って使い方を調べている。","わからないことがあっても、恥ずかしくて聞けない。","写真の撮り方を覚えたことで満足し、それ以上は覚えようとしない。","一つ覚えると、すぐ次を知りたがる。"],"e":"Học chụp ảnh xong <b>今度は動画の撮り方を知りたがり</b>, rồi gọi video. Bẫy: ông hỏi cháu mỗi ngày, và hỏi không ngại ngùng.","a":3},{"n":57,"q":"「まだまだ自分も捨てたものではない」とは、どのような気持ちか。","o":["古い物でも簡単には捨てずに、長く大切に使い続けたいという気持ち","若い人には負けたくないという気持ち","自分にもまだ力があると感じる気持ち","スマートフォンを使いこなして、家族の役に立ちたいという気持ち"],"e":"捨てたものではない = vẫn còn giá trị, chưa đến nỗi bỏ đi. Câu trước: <b>できなかったことができるようになると</b>. Bẫy: hiểu nghĩa đen của 捨てる (vứt đồ).","a":2},{"n":58,"q":"筆者の考えに合うものはどれか。","o":["学ぶ意欲は、年齢で決まるものではない。","年を取ると、新しいことへの興味は誰でも自然に薄れていくものだ。","高齢者も、スマートフォンを使うべきだ。","年を取っても好奇心を保つには、若いうちから努力しておくべきだ。"],"e":"<b>学ぶことに年齢は関係ない</b>. Bẫy: \"già thì mất hứng thú\" là suy nghĩ của nhiều người (考える人は多い), mà tác giả đưa ra để phản bác.","a":0}]}]},{"id":"r10","title":"問題10 内容理解（長文）","en":"Đọc hiểu: đoạn dài","instr":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　近所の公園の入り口に、こんな看板が立っている。「ボール遊び禁止」「大声禁止」「自転車の乗り入れ禁止」「ペットの散歩禁止」。並んだ禁止の文字を見ていると、いったいこの公園で何をしてよいのかと、考え込んでしまう。</p><p>　こうした看板が増えた背景には、近隣住民からの苦情があるという。子どもの声がうるさい、ボールが庭に飛び込んでくる、犬のふんが放置されている。苦情が寄せられるたびに、管理者は新しい禁止事項を加えていく。一つ一つの対応は、もっともなものだろう。しかし、<u>①その結果として</u>、公園は誰も使わない、静かな空き地になってしまった。</p><p>　禁止によって問題を防ごうとする方法は、手軽で、すぐに効果が見える。だが、そこには見落とされているものがある。それは、人々が互いに話し合い、折り合いをつける機会である。たとえば、ボール遊びをする時間帯を決める、住宅に近い側では使わないなど、工夫次第で、遊びたい人と静かに暮らしたい人が共存する方法はあるはずだ。<u>②一律の禁止</u>は、そうした知恵を生み出す機会そのものを奪ってしまう。</p><p>　実際、ある町では、住民と子どもたちが集まって、公園の使い方を一緒に考える会を開いた。最初は意見がぶつかったが、話し合いを重ねるうちに、互いの事情が見えてきた。最終的には、禁止の看板を外し、利用者自身が決めたルールを掲示することになったという。自分たちで決めたルールは、上から与えられたものより、守られやすいそうだ。</p><p>　公園は、本来、さまざまな人が共に過ごす場所である。誰かにとって迷惑な行為をすべて禁止するのではなく、どうすれば共に使えるかを考えること。それが、地域で暮らすということなのではないだろうか。</p>","qs":[{"n":59,"q":"第2段落の内容と合うものはどれか。","o":["一つ一つの対応は妥当でも、結果として使われなくなった。","管理者は、近隣の住民から寄せられる苦情を長い間無視し続けてきた。","子どもの声がうるさいという苦情は、不当なものだった。","禁止事項を次々と増やしたことで、住民からの苦情がなくなり問題は解決した。"],"e":"<b>一つ一つの対応は、もっともなもの…しかし、その結果として、公園は誰も使わない…空き地</b>. Bẫy: tác giả không nói khiếu nại là vô lý. Mẫu ～はもっともだ。しかし rất hay gặp.","a":0},{"n":60,"q":"筆者によると、禁止によって問題を防ごうとするやり方で見落とされているものは何か。","o":["禁止事項を利用者に守らせるために、管理者が負担しなければならない費用","安全を守る効果","話し合って歩み寄る機会","公園で遊べなくなった子どもたちが、新しい遊び場を探す手間"],"e":"<b>人々が互いに話し合い、折り合いをつける機会</b>. 折り合いをつける được nói lại thành 歩み寄る (nhượng bộ lẫn nhau).","a":2},{"n":61,"q":"ある町の例について、本文の内容と合うものはどれか。","o":["公園の使い方について、住民と子どもたちの意見は最初から一致していた。","禁止の看板を増やすことで、苦情を減らした。","管理者が新しいルールを決めて、住民と子どもたちにそれを守らせた。","対立を経て、利用者自身がルールを作った。"],"e":"<b>最初は意見がぶつかったが…利用者自身が決めたルールを掲示</b>. Bẫy: ban đầu ý kiến đối lập. Quy tắc do người dùng tự đặt, không phải do ban quản lý.","a":3},{"n":62,"q":"筆者の主張に最も近いものはどれか。","o":["迷惑な行為を一律に禁じるより、共に使う方法を探るべきだ。","公園では、どんなことも禁止すべきではない。","苦情を言う住民の意見は、聞く必要がない。","利用者が決めたルールより、管理者のルールのほうが守られやすい。"],"e":"<b>すべて禁止するのではなく、どうすれば共に使えるかを考えること</b>. Bẫy: \"không cấm gì cả\" là quá mức. Bài nói quy tắc tự đặt <b>dễ được tuân thủ hơn</b>, đáp án cuối đảo ngược.","a":0}]}]},{"id":"r11","title":"問題11 統合理解","en":"Đọc so sánh A và B","instr":"次のAとBの文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p><b>A</b></p><p>　24時間営業の店を見直す動きが広がっている。深夜は客が少なく、売り上げに比べて電気代や人件費がかさむ。人手不足の中、夜中に働く店員を確保するのも難しい。深夜の勤務は体への負担も大きく、店員の健康を守るという点からも、営業時間の短縮は当然の流れだろう。夜中に買い物をしなければならない人は、それほど多くないはずだ。</p><p><b>B</b></p><p>　店の営業時間を短くすることには、確かに合理的な理由がある。人手不足や働く人の負担を考えれば、見直しはやむを得ないだろう。しかし、夜中に開いている店に助けられている人もいる。夜勤の仕事を終えた人や、急に子どもの薬が必要になった親にとって、深夜の店は欠かせない。また、明かりのついた店が、夜道を歩く人に安心感を与えているという面もある。地域の事情を考えて、本当に必要な場所には深夜の店を残す工夫が必要だ。</p>","qs":[{"n":63,"q":"AとBの両方の筆者が認めていることは何か。","o":["深夜は客が少なく、夜中に買い物をしなければならない人はほとんどいないこと","深夜に開いている店が、地域の安心につながっていること","深夜は売り上げが多いので、店にとって24時間営業は欠かせないこと","見直しにはもっともな理由があること"],"e":"A nói rõ lý do, B cũng <b>確かに合理的な理由がある…見直しはやむを得ない</b>. Ít khách mua đêm chỉ có ở A, an toàn ban đêm chỉ có ở B.","a":3},{"n":64,"q":"Bが、深夜の店を必要とする人として挙げているのはどれか。","o":["人手不足の中、深夜に働くことを希望している店員","夜中にしか買い物ができない学生","夜勤明けの人や、薬が急に要る親","深夜の電気代や人件費を節約したいと考えている店主"],"e":"B: <b>夜勤の仕事を終えた人や、急に子どもの薬が必要になった親</b>. 仕事を終えた được nói lại thành 夜勤明け.","a":2}]}]},{"id":"r12","title":"問題12 主張理解（長文）","en":"Đọc hiểu: quan điểm tác giả","instr":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　日本では、ほめられたときに「いえいえ、そんなことはありません」と否定するのが礼儀だとされてきた。自分の家族を人に紹介するときにも、「うちの息子は出来が悪くて」などと言うことがある。こうした謙遜は、相手を立て、和を大切にする日本の文化の表れだと言われる。</p><p>　私自身、長い間それを当然のことと思ってきた。しかし、海外の大学で学んでいたころ、<u>①ある出来事</u>をきっかけに考えが変わった。発表の後、指導教員に「とてもよかった」とほめられ、私はいつものように「いえ、まだまだです」と答えた。すると教員は、少し困った顔で「あなたは私の評価が間違っていると言いたいの？」と尋ねたのである。</p><p>　その一言で、私ははっとした。謙遜のつもりで口にした言葉が、相手の評価を否定することにもなりうる。ほめてくれた人の気持ちを受け止めず、はね返してしまうことでもあるのだ。</p><p>　もちろん、謙遜の文化そのものを捨てるべきだとは思わない。自分を大きく見せようとせず、他人を立てる姿勢には、学ぶべき点も多い。<u>②問題は、それが形だけの習慣になってしまうこと</u>だ。本心では努力を認めてもらってうれしいのに、反射的に否定の言葉を口にする。それは、相手のためにも自分のためにもならないのではないか。</p><p>　最近、私はほめられたら、まず「ありがとうございます」と言うようにしている。そのうえで、「〇〇さんに助けていただいたおかげです」と付け加えることもある。感謝の言葉で受け止め、周りの人への敬意を示す。それも、相手を立てる一つの形だと思うのだ。</p>","qs":[{"n":65,"q":"筆者が「はっとした」のはなぜか。","o":["自分の発表に対する教員の評価が、実は間違っていたことに気づいたから","自分の発表が不十分だったことに気づいたから","海外には、日本のように謙遜する人がまったくいないことに気づいたから","謙遜が相手の評価を否定しうると気づいたから"],"e":"<b>謙遜のつもりで口にした言葉が、相手の評価を否定することにもなりうる</b>. 否定する được nói lại thành 退ける. Bài thuyết trình được khen là tốt, nên không phải là chưa đủ.","a":3},{"n":66,"q":"筆者は、謙遜の文化をどのように考えているか。","o":["謙遜の文化は、今の時代や国際社会には合わないので捨てるべきだ。","海外でも通用する、優れた文化だ。","価値はあるが、形だけになると問題だ。","謙遜の文化は、日本で育った人にしか本当には理解できない。"],"e":"<b>捨てるべきだとは思わない…学ぶべき点も多い。問題は、それが形だけの習慣になってしまうこと</b>. Đáp án đúng gộp cả hai ý (có giá trị, nhưng có vấn đề).","a":2},{"n":67,"q":"「形だけの習慣」の例として、最も近いものはどれか。","o":["本当に自信がないので、ほめられたときに正直に「まだまだです」と答える。","ほめられて、「ありがとうございます」と答える。","相手の努力をきちんと認めて、心から「すごいですね」とほめる。","料理をほめられ、うれしいのに「まずいですよ」と返す。"],"e":"Dạng câu hỏi áp dụng. Định nghĩa: <b>本心では…うれしいのに、反射的に否定の言葉を口にする</b>. Bẫy: nếu thật sự không tự tin thì đó là thật lòng, không phải \"hình thức\".","a":3},{"n":68,"q":"筆者の主張に最も近いものはどれか。","o":["ほめられたら謙遜せずに、自分がどれだけ努力したかを強調して答えるべきだ。","謙遜の言葉は相手を傷つけるので、使わないほうがよい。","感謝で受け止め周りに敬意を示すのも、相手を立てる形だ。","海外では、日本の礼儀や習慣を捨てて、現地のやり方に合わせて振る舞うべきだ。"],"e":"<b>感謝の言葉で受け止め、周りの人への敬意を示す。それも、相手を立てる一つの形</b>. Bẫy: tác giả còn cảm ơn người khác (おかげです), không nhấn mạnh nỗ lực bản thân.","a":2}]}]},{"id":"r13","title":"問題13 情報検索","en":"Tìm thông tin","instr":"次は、ある映画館の料金案内である。下の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<div class='notice'><p style='text-align:center'><b>シネマみなと　料金のご案内</b></p><table class='tbl'><tr><th>区分</th><th>通常料金</th></tr><tr><td>一般</td><td>1,900円</td></tr><tr><td>大学生、専門学校生</td><td>1,500円</td></tr><tr><td>高校生</td><td>1,000円</td></tr><tr><td>中学生以下</td><td>800円</td></tr><tr><td>シニア（60歳以上）</td><td>1,200円</td></tr></table><p style='margin-top:8px'><b>【割引サービス】</b><br>●毎月1日（映画の日）：どなたでも1,200円<br>●レイトショー（20時以降に始まる回）：一般、大学生は1,400円<br>●夫婦50割（どちらかが50歳以上のご夫婦）：二人で2,400円</p><p>※割引サービスは、ほかの割引と一緒に使うことはできません。<br>※学生料金、シニア料金でご購入の際は、学生証または年齢がわかるものをご提示ください。<br>※3D作品は、上記の料金に400円が加算されます。</p></div>","qs":[{"n":69,"q":"会社員の森さん（35歳）は、毎月1日の夜8時半から始まる3D作品を一人で見る。料金は最も安くていくらか。","o":["1,600円","1,800円","1,200円","2,300円"],"e":"Ngày 1 (映画の日): 1,200円, rẻ hơn レイトショー 1,400円. Không được dùng hai ưu đãi cùng lúc. Phim 3D: <b>+400円</b>. Vậy 1,200 + 400 = <b>1,600円</b>. Bẫy: 1,800円 (chọn レイト), 1,200円 (quên 3D).","a":0},{"n":70,"q":"大学生のアン（20歳）と、その母（55歳）、父（58歳）の三人で、15日の夕方5時から通常の作品を見る。三人分の料金の合計は、最も安くていくらか。","o":["5,300円","3,900円","3,600円","4,300円"],"e":"An: sinh viên 1,500円. Bố mẹ: chưa 60 tuổi nên không có giá シニア, nhưng bố 58 tuổi nên được <b>夫婦50割</b>: hai người 2,400円. Tổng <b>3,900円</b>. Bẫy: 3,600円 là giá 映画の日 nhưng hôm nay là ngày 15. 5,300円 là quên ưu đãi vợ chồng.","a":1}]}]}];
const SET8 = [{"id":"m1","title":"問題1 漢字読み","en":"Đọc kanji","instr":"＿＿の言葉の読み方として最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":1,"q":"住民の意見を<u>踏まえて</u>、計画の内容を見直した。","o":["ふまえて","ふみえて","とまえて","ふまって"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 6, lần này hỏi theo dạng khác.</span><br><b>踏まえる (ふまえる)</b> = dựa trên, căn cứ vào. 踏 đọc âm Nhật là <b>ふ</b> (踏む = ふむ). Bẫy ふみえて vì nghĩ đến ふむ.","a":0}]},{"qs":[{"n":2,"q":"物価の上昇に<u>歯止め</u>をかけるため、政府は新しい対策を発表した。","o":["はどめ","はとめ","しどめ","はやめ"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 5, lần này hỏi theo dạng khác.</span><br><b>歯止め (はどめ)</b> = sự kìm hãm. 止め đứng sau 歯 nên biến âm thành <b>どめ</b> (rendaku). Bẫy はとめ là không biến âm.","a":0}]},{"qs":[{"n":3,"q":"専門家たちは、事態の悪化を深く<u>憂慮</u>している。","o":["ゆうりょう","ゆりょ","うりょ","ゆうりょ"],"e":"<b>憂慮 (ゆうりょ)</b> = lo ngại sâu sắc. 憂 = <b>ゆう</b>, 慮 = <b>りょ</b> (âm ngắn, như 配慮 はいりょ, 考慮 こうりょ). Bẫy ゆうりょう có trường âm ở cuối.","a":3}]},{"qs":[{"n":4,"q":"長い交渉の末、両国は<u>漸く</u>合意に達した。","o":["ようやく","しばらく","まもなく","とうとう"],"e":"<b>漸く (ようやく)</b> = cuối cùng thì, mãi mới. Thường viết bằng hiragana, nhưng N1 hay hỏi cách đọc chữ kanji. しばらく = 暫く, まもなく = 間もなく, とうとう = 到頭.","a":0}]},{"qs":[{"n":5,"q":"申請の手続きが<u>煩雑</u>で、多くの人が途中であきらめてしまう。","o":["ぼんざつ","はんさつ","わずざつ","はんざつ"],"e":"<b>煩雑 (はんざつ)</b> = rườm rà, phức tạp. 煩 có hai âm: <b>はん</b> (煩雑) và ぼん (煩悩 ぼんのう). Bẫy ぼんざつ. Từ 煩わしい đã gặp ở 模試 1 và 3 dùng cùng chữ 煩.","a":3}]},{"qs":[{"n":6,"q":"彼は単身で、内戦が続く地域へ取材に<u>赴いた</u>。","o":["おもむかいた","むかいた","おもむいた","ふりむいた"],"e":"<b>赴く (おもむく)</b> = đi đến (một nơi, thường vì công việc hay nhiệm vụ). 赴任 (ふにん) = đến nhận nhiệm sở. Bẫy むかいた (向かう) có nghĩa gần giống.","a":2}]}]},{"id":"m2","title":"問題2 文脈規定","en":"Từ theo ngữ cảnh","instr":"（　　）に入れるのに最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":7,"q":"二人の証言が（　　）ため、警察は改めて現場を調べることにした。","o":["入れ違っていた","食い違っていた","行き違っていた","すれ違っていた"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 5, lần này hỏi theo dạng khác.</span><br><b>食い違う (くいちがう)</b> = (lời khai, ý kiến) không khớp nhau. Tất cả đều có 違う: 入れ違う = vào ra lệch nhau, 行き違う = đi lướt qua, lỡ nhau (thư, tin nhắn), すれ違う = đi lướt qua nhau.","a":1}]},{"qs":[{"n":8,"q":"会社の責任について、社長の説明は（　　）なまま、記者会見は終わった。","o":["まちまち","うやむや","ありきたり","おおざっぱ"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 6, lần này hỏi theo dạng khác.</span><br><b>うやむや</b> = mập mờ, bỏ lửng không làm rõ. まちまち = mỗi nơi một khác (ôn từ 模試 3), ありきたり = tầm thường, おおざっぱ = qua loa, đại khái.","a":1}]},{"qs":[{"n":9,"q":"今月の利益は、円高による損失と（　　）され、ほとんど残らなかった。","o":["相殺","削減","補充","減殺"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 5, lần này hỏi theo dạng khác.</span><br><b>相殺 (そうさい)される</b> = bị bù trừ, triệt tiêu lẫn nhau. Bẫy: 減殺 (げんさい) = làm giảm bớt (hiệu quả), không mang nghĩa bù trừ hai bên. 削減 = cắt giảm.","a":0}]},{"qs":[{"n":10,"q":"会議の結論には、どうも（　　）に落ちない点がある。","o":["胸","気","耳","腑"],"e":"<b>腑に落ちない (ふにおちない)</b> = không thông suốt, chưa thấy thuyết phục. Thành ngữ cố định. 胸に落ちる hay 耳に落ちる không phải thành ngữ.","a":3}]},{"qs":[{"n":11,"q":"国内の需要が減り、この商品の売り上げは数年前から（　　）になっている。","o":["手詰まり","頭打ち","尻すぼみ","先細り"],"e":"<b>頭打ち (あたまうち)</b> = chững lại, không tăng thêm được (đã chạm trần). Bẫy: 尻すぼみ = đầu voi đuôi chuột, 先細り = ngày càng thu hẹp. Hai từ này nói về sự giảm dần, không hợp với ý \"từ vài năm trước đã dừng tăng\".","a":1}]},{"qs":[{"n":12,"q":"計画を進める前に、関係する部署の（　　）を得ておく必要がある。","o":["ニュアンス","スタンス","プロフィール","コンセンサス"],"e":"<b>コンセンサス</b> = sự đồng thuận. コンセンサスを得る. ニュアンス = sắc thái (ôn từ 模試 5), スタンス = lập trường, ノルマ = chỉ tiêu.","a":3}]},{"qs":[{"n":13,"q":"費用が高いため、多くの企業が新システムの導入に（　　）を踏んでいる。","o":["地団駄","薄氷","場数","二の足"],"e":"<b>二の足を踏む (にのあしをふむ)</b> = do dự, ngần ngại. Tất cả đều đi với 踏む: 地団駄を踏む = dậm chân tức tối, 薄氷を踏む = đi trên băng mỏng (rất nguy hiểm), 場数を踏む = tích lũy kinh nghiệm.","a":3}]}]},{"id":"m3","title":"問題3 言い換え類義","en":"Từ gần nghĩa","instr":"＿＿の言葉に意味が最も近いものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":14,"q":"この地域は、地震に対して<u>脆弱</u>だと指摘されている。","o":["弱い","敏感だ","強い","慣れている"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 5, lần này hỏi theo dạng khác.</span><br><b>脆弱 (ぜいじゃく)</b> = yếu ớt, dễ bị tổn thương. Gần nhất là 弱い (もろい).","a":0}]},{"qs":[{"n":15,"q":"その研究所は、<u>潤沢な</u>資金をもとに最新の設備をそろえた。","o":["わずかな","豊富な","安定した","公的な"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 4, lần này hỏi theo dạng khác.</span><br><b>潤沢 (じゅんたく)</b> = dồi dào. Gần nhất là 豊富な (ほうふ).","a":1}]},{"qs":[{"n":16,"q":"出発前、母に「無駄遣いはしないように」と<u>釘を刺された</u>。","o":["念を押された","頼まれた","ほめられた","からかわれた"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 4, lần này hỏi theo dạng khác.</span><br><b>釘を刺す (くぎをさす)</b> = nhắc nhở trước, căn dặn kỹ. Gần nhất là 念を押す (ねんをおす).","a":0}]},{"qs":[{"n":17,"q":"新しい規則は、全社員に<u>一律に</u>適用される。","o":["少しずつ","前もって予告して","同じように","自動的に"],"e":"<b>一律 (いちりつ)に</b> = đồng loạt, như nhau. Gần nhất là 同じように.","a":2}]},{"qs":[{"n":18,"q":"隣の部屋の工事の音には、<u>閉口している</u>。","o":["驚いている","慣れている","怒っている","困っている"],"e":"<b>閉口 (へいこう)する</b> = bó tay, khổ sở (vì điều gì khó chịu). Gần nhất là 困っている. Bẫy: 怒っている quá mạnh, 閉口 là cảm giác bất lực hơn là tức giận.","a":3}]},{"qs":[{"n":19,"q":"遠くで一人暮らしをする息子の体調を<u>案じて</u>いる。","o":["確認して","心配して","想像して","気にかけないで"],"e":"<b>案じる (あんじる)</b> = lo lắng. Gần nhất là 心配する. Từ liên quan: 案の定 (ôn từ 模試 2).","a":1}]}]},{"id":"m4","title":"問題4 用法","en":"Cách dùng từ","instr":"次の言葉の使い方として最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":20,"q":"<b>かろうじて</b>","o":["道が混んでいたが、かろうじて飛行機の出発に間に合った。","駅前にあるこの小さな店のケーキは、かろうじておいしいので、いつも多くの客でにぎわっている。","彼はかろうじて毎朝五時に起きて、散歩をしている。","先週受けた英語の試験の結果は、かろうじて満点だった。"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 5, lần này hỏi theo dạng khác.</span><br><b>かろうじて (辛うじて)</b> = vừa kịp, suýt soát. Dùng khi vượt qua được trong gang tấc. Không dùng để nhấn mạnh (かなり), không dùng cho thói quen, và đạt điểm tuyệt đối thì không thể là \"suýt soát\".","a":0}]},{"qs":[{"n":21,"q":"<b>板挟み</b>","o":["この料理は、パンに野菜を板挟みにして作る。","ドアに指を板挟みにして、けがをしてしまった。","業界で競い合ってきた二つの会社が板挟みになって、共同で新しい製品を開発した。","会社の方針と客の要望の板挟みになり、担当者は頭を抱えた。"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 6, lần này hỏi theo dạng khác.</span><br><b>板挟み (いたばさみ)になる</b> = bị kẹt giữa hai bên. Kẹp rau vào bánh mì là 挟む, kẹt ngón tay vào cửa là 指を挟む, hai công ty hợp tác là 提携する.","a":3}]},{"qs":[{"n":22,"q":"<b>見通し</b>","o":["この部屋は窓が大きく、見通しのいい家具が多い。","彼は人の見通しをするのが得意だ。","専門家によると、景気が回復する見通しはまだ立っていない。","来週の試験の見通しにするために、昨日解いた問題をもう一度最初から解き直した。"],"e":"<b>見通し (みとおし)</b> = triển vọng, dự đoán (見通しが立つ = thấy được triển vọng). Ôn tập phân biệt: 見込み (dự kiến, 模試 7), めど (mục tiêu khả thi, 模試 4).","a":2}]},{"qs":[{"n":23,"q":"<b>手薄</b>","o":["夜間は警備が手薄になるため、防犯カメラを増やした。","このかばんは手薄で、持ち運びに便利だ。","彼は手薄な性格なので、細かいことに気がつかない。","今月は急な出費が重なって給料が手薄になったので、しばらく外食を控えることにした。"],"e":"<b>手薄 (てうす)</b> = mỏng, thiếu người, thiếu lực lượng (警備, 人手). Túi xách mỏng là 薄い, tính cách đại khái là 大ざっぱ, lương ít là 少ない.","a":0}]},{"qs":[{"n":24,"q":"<b>持ち越す</b>","o":["重い荷物を持ち越して、三階まで運んだ。","彼は試験に持ち越して、合格した。","時間が足りず、残りの議題は次回の会議に持ち越すことになった。","彼は友人の誕生日会に呼ばれ、大勢の前で得意な歌を何曲も持ち越した。"],"e":"<b>持ち越す (もちこす)</b> = hoãn sang, để lại (vấn đề, quyết định) cho lần sau. Mang đồ nặng lên tầng là 運ぶ, đỗ kỳ thi là 合格する, trình bày bài hát là 披露する (ひろう).","a":2}]},{"qs":[{"n":25,"q":"<b>際立つ</b>","o":["彼は会議中に際立って、部屋を出て行った。","子どもが際立つまで、母親はずっとそばにいた。","駅の近くの古い商店街のそばに、新しい高層ビルが次々と際立って建てられた。","多くの作品の中でも、彼女の絵の色彩は際立っていた。"],"e":"<b>際立つ (きわだつ)</b> = nổi bật hẳn lên. Đứng dậy là 立ち上がる, trẻ tự lập là 自立する, tòa nhà được xây là 建つ.","a":3}]}]},{"id":"m5","title":"問題5 文法形式の判断","en":"Ngữ pháp","instr":"次の文の（　　）に入れるのに最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":26,"q":"小学生（　　）、大学生にもなってそんな簡単な計算ができないとは驚いた。","o":["ならでは","ならいざしらず","とあって","にもかかわらず"],"e":"<b>Nならいざしらず</b> = nếu là N thì còn có thể hiểu, nhưng... Bẫy: ならでは = chỉ N mới có (khen), にもかかわらず = mặc dù (không đi với \"nếu là N thì còn hiểu được\").","a":1}]},{"qs":[{"n":27,"q":"今年の夏は、例年（　　）暑さが厳しい。","o":["にもまして","をよそに","にかかわらず","をもって"],"e":"<b>Nにもまして</b> = còn hơn cả N. Bẫy: にかかわらず phải đi với cặp đối lập (晴雨にかかわらず), không đi với 例年.","a":0}]},{"qs":[{"n":28,"q":"新しい空港の建設（　　）、住民の意見は大きく二つに分かれた。","o":["をもとに","にかけて","をめぐって","にもかかわらず"],"e":"<b>Nをめぐって</b> = xoay quanh N (thường là tranh luận, đối lập). をもとに = dựa trên, にかけて = trong khoảng, にもかかわらず = mặc dù.","a":2}]},{"qs":[{"n":29,"q":"入院中の祖父は、歩くこと（　　）、一人で起き上がることさえできない。","o":["はおろか","もさることながら","をもって","にしては"],"e":"<b>AはおろかBさえ～ない</b> = đừng nói A, ngay cả B cũng không. Bẫy: <b>もさることながら</b> cũng có nghĩa \"không chỉ A mà cả B\", nhưng chỉ dùng cho nghĩa TÍCH CỰC (khen).","a":0}]},{"qs":[{"n":30,"q":"これくらいの文章なら、辞書を引か（　　）理解できるだろう。","o":["ずとも","ずじまいで","ずにはおかず","ざるを得ず"],"e":"<b>Vず とも</b> = dù không V cũng (= Vなくても, văn viết). Bẫy: cả bốn đều là dạng phủ định cổ ず. ざるを得ず = buộc phải V.","a":0}]},{"qs":[{"n":31,"q":"彼は、この会社にとって欠く（　　）存在だ。","o":["べき","べからざる","べく","ざるを得ない"],"e":"<b>Vる べからざる + N</b> = N không được phép V. 欠くべからざる存在 = sự tồn tại không thể thiếu. Bẫy: <b>べき</b> = nên. 欠くべき存在 sẽ thành \"nên thiếu\", nghĩa ngược hẳn.","a":1}]},{"qs":[{"n":32,"q":"最近の若者は、何でもインターネットで調べて済ませる（　　）。","o":["しまつだ","きらいがある","までもない","ずにはすまない"],"e":"<span class='rev'>【Ôn tập ngữ pháp】 Mẫu này đã xuất hiện ở 模試 3, lần này trong câu mới.</span><br><b>Vる きらいがある</b> = có khuynh hướng (xấu). Bẫy: しまつだ = rốt cuộc đến nỗi (kết quả tệ của một chuỗi sự việc cụ thể), không dùng để nói khuynh hướng chung.","a":1}]},{"qs":[{"n":33,"q":"最新の設備を持つ大病院と、町の小さな診療所とでは、比べる（　　）。","o":["にかたくない","にたえない","べくもない","にかかわる"],"e":"<span class='rev'>【Ôn tập ngữ pháp】 Mẫu này đã xuất hiện ở 模試 2, lần này trong câu mới.</span><br><b>Vる べくもない</b> = không thể nào V được (vì chênh lệch quá lớn). Bẫy: にかたくない = dễ dàng (想像にかたくない), にたえない = không chịu nổi (見るにたえない).","a":2}]},{"qs":[{"n":34,"q":"一言相談してくれれば力になれた（　　）、なぜ一人で抱え込んでしまったのだろう。","o":["ものの","ものを","もので","ものなら"],"e":"<span class='rev'>【Ôn tập ngữ pháp】 Mẫu này đã xuất hiện ở 模試 6, lần này trong câu mới.</span><br><b>～ば～たものを</b> = nếu ~ thì đã ~, vậy mà (tiếc nuối, trách nhẹ). Bẫy: ものの = tuy nhưng (sẽ thành \"tuy đã giúp được\", mâu thuẫn), ものなら phải đi với thể khả năng ở thì hiện tại.","a":1}]},{"qs":[{"n":35,"q":"ずっと伝えようと思っていた感謝の気持ちを、結局祖母には伝え（　　）になってしまった。","o":["ずとも","ずじまい","ずにはおかない","ずもがな"],"e":"<span class='rev'>【Ôn tập ngữ pháp】 Mẫu này đã xuất hiện ở 模試 5, lần này trong câu mới.</span><br><b>Vず じまい</b> = rốt cuộc đã không V (tiếc nuối). Bẫy: ずとも = dù không V cũng, ずもがな = không V thì tốt hơn. Chỉ ずじまい đi được với になってしまった.","a":1}]}]},{"id":"m6","title":"問題6 文の組み立て","en":"Sắp xếp câu","instr":"次の文の ★ に入る最もよいものを、1、2、3、4から一つ選びなさい。","fixed":true,"pages":[{"qs":[{"n":36,"q":"彼は ＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 、周りから誤解されることも多い。","o":["ゆえに","正直","が","すぎる"],"a":2,"e":"<span class='rev'>【Ôn tập ngữ pháp】 Mẫu này đã xuất hiện ở 模試 4, lần này trong câu mới.</span><br>Thứ tự đúng: 正直 すぎる <b>が</b> ゆえに (2 4 3 1). <b>～がゆえに</b> = vì ~ (văn viết). ★ ở vị trí thứ ba."}]},{"qs":[{"n":37,"q":"この仕事は、＿＿＿ <b>★</b> ＿＿＿ ＿＿＿ ので、一人ではとてもこなせない。","o":["も求められる","質の高さ","量","もさることながら"],"a":3,"e":"Thứ tự đúng: 量 <b>もさることながら</b> 質の高さ も求められる (3 4 2 1). <b>Aもさることながら、Bも</b> = A thì đã đành, B cũng. ★ ở vị trí thứ hai."}]},{"qs":[{"n":38,"q":"＿＿＿ ＿＿＿ ＿＿＿ <b>★</b> 、試合は予定どおり行われた。","o":["いた","ものの","降っては","小雨が"],"a":1,"e":"Thứ tự đúng: 小雨が 降っては いた <b>ものの</b> (4 3 1 2). <b>Vてはいたものの</b> = tuy có V nhưng. Mẹo: ては luôn cần いる hoặc いた đi ngay sau. ★ ở vị trí cuối."}]},{"qs":[{"n":39,"q":"彼の ＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 、誰も反論できなかった。","o":["論理的","だったので","説明が","あまりに"],"a":0,"e":"Thứ tự đúng: 説明が あまりに <b>論理的</b> だったので (3 4 1 2). あまりに đứng ngay trước tính từ mà nó nhấn mạnh. ★ ở vị trí thứ ba."}]},{"qs":[{"n":40,"q":"この映画は、＿＿＿ <b>★</b> ＿＿＿ ＿＿＿ 楽しめる作品だ。","o":["十分に","を問わず","誰もが","年齢"],"a":1,"e":"Thứ tự đúng: 年齢 <b>を問わず</b> 誰もが 十分に (4 2 3 1). <b>Nを問わず</b> = không phân biệt N. ★ ở vị trí thứ hai."}]}]},{"id":"m7","title":"問題7 文章の文法","en":"Ngữ pháp trong đoạn văn","instr":"次の文章を読んで、文章全体の内容を考えて、41 から 45 の中に入る最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　会社員として働く（41）、週末に翻訳の仕事をしている。大学で学んだ英語を生かしたいと思ったのがきっかけだ。</p><p>　始めたころは、締め切りに間に合わせるのに必死で、休日がまるでなくなってしまった。好きで始めたことなのに、（42）苦しくなり、やめようかと考えた時期もある。</p><p>　そんなとき、ある先輩の翻訳者にこう言われた。「全部を完璧にしようとするから疲れるんだよ。自分にできる量を見極めることも、プロの仕事のうちだ」。その言葉を聞いて、肩の荷が下りた（43）。それ以来、引き受ける仕事の量を減らし、一つ一つに丁寧に向き合うようにしている。</p><p>　仕事を減らしたのだから、収入も減るはずだと思っていた。（44）、丁寧な仕事が評価され、以前より条件のよい依頼が来るようになった。量より質を大切にすることが、結果として自分を（45）のだ。</p>","qs":[{"n":41,"q":"（41）","o":["がてら","ついでに","かたわら","あげく"],"e":"<span class='rev'>【Ôn tập ngữ pháp】 Mẫu này đã xuất hiện ở 模試 4, lần này trong câu mới.</span><br><b>Vる かたわら</b> = vừa làm việc chính, vừa làm việc khác. Bẫy: がてら đi với danh từ hoặc Vます bỏ ます (散歩がてら), ついでに = nhân tiện (việc nhỏ, một lần), あげく phải đi với Vた.","a":2},{"n":42,"q":"（42）","o":["あえて","かえって","せめて","おもむろに"],"e":"Bắt đầu vì thích, vậy mà <b>ngược lại</b> (かえって) thấy khổ sở. Bẫy: あえて = cố tình, せめて = ít nhất thì, おもむろに = thong thả, từ từ.","a":1},{"n":43,"q":"（43）","o":["気がしなかった","気がかりだった","気が気でなかった","気がした"],"e":"<b>肩の荷が下りた気がした</b> = cảm thấy như trút được gánh nặng. Bẫy: 気がかり = lo lắng, 気が気でない = đứng ngồi không yên. Cả ba đều là thành ngữ với 気 nhưng mang nghĩa lo âu.","a":3},{"n":44,"q":"（44）","o":["それゆえ","ましてや","ところが","いわば"],"e":"Nghĩ thu nhập sẽ giảm, <b>ai ngờ</b> (ところが) lại nhận được việc tốt hơn. Kết quả trái với dự đoán. Bẫy: それゆえ = vì vậy, ましてや = huống chi, いわば = có thể nói là.","a":2},{"n":45,"q":"（45）","o":["助けることになった","助けるわけがなかった","助けたためしがない","助けかねなかった"],"e":"<b>結果として…ことになった</b> = kết cục là đã. Đi với 結果として ở đầu câu. Bẫy: ためしがない = chưa từng, かねない = có nguy cơ (chuyện xấu).","a":0}]}]},{"id":"r8","title":"問題8 内容理解（短文）","en":"Đọc hiểu: đoạn ngắn","instr":"次の（1）から（4）の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>（1）</p><p>　節約のために家計簿をつけ始めたものの、まったくお金が貯まらないという人は少なくない。毎日きちんと記録しているのに、なぜだろうか。多くの場合、記録すること自体が目的になってしまい、月末に数字を見返して、どこに無駄があったかを考える時間をとっていないのである。家計簿は、書いた時点で役目を終えるのではない。読み返し、次の行動を変えたとき、はじめて意味を持つのだ。</p>","qs":[{"n":46,"q":"筆者によると、家計簿をつけてもお金が貯まらない人に足りないのは何か。","o":["毎日欠かさずに、細かい支出まで正確に記録し続けること","節約したいという強い気持ちを持つこと","記録をもとに、使い方を見直すこと","月末だけでなく、毎日数字を見返すこと"],"e":"<b>数字を見返して、どこに無駄があったかを考える時間をとっていない</b>. Đáp án đúng là cách nói khác (見直す). Bẫy: những người này ĐÃ ghi chép đầy đủ mỗi ngày (毎日きちんと記録している), nên đó không phải điều họ thiếu. Bài không nói phải xem lại MỖI NGÀY.","a":2}]},{"passage":"<p>（2）</p><p>以下は、ある会社の社員に届いたメールである。</p><div class='notice'><p>件名：定期健康診断の実施について</p><p>社員各位</p><p>　今年度の定期健康診断を、下記のとおり実施します。</p><p>日時：6月10日（水）、11日（木）　9:00～12:00<br>場所：本社5階会議室</p><p>　受診を希望する日を、5月25日までに社内システムから登録してください。どちらの日も都合がつかない場合は、指定の病院で個別に受診することもできます。その場合は、6月末までに受診し、結果を人事部に提出してください。費用は会社が負担しますが、領収書が必要です。<br>　なお、前日の夜9時以降は、水以外は口にしないでください。</p><p style='text-align:right'>人事部</p></div>","qs":[{"n":47,"q":"6月10日、11日のどちらも出張で受診できない社員は、どうしなければならないか。","o":["6月中に指定の病院で受け、結果と領収書を出す。","5月25日までに、受診を希望する日を社内システムから登録する。","6月末までに指定の病院で受診し、費用は自分で支払う。","人事部に連絡して、本社での受診日を別の日に変更してもらう。"],"e":"Không đi được cả hai ngày thì <b>khám riêng ở bệnh viện chỉ định trước cuối tháng 6</b>, nộp kết quả cho phòng nhân sự. Công ty trả phí nhưng <b>cần hóa đơn</b> (領収書が必要). Bẫy: \"tự trả phí\" là sai. Đăng ký trên hệ thống là dành cho người khám ngày 10 hoặc 11.","a":0}]},{"passage":"<p>（3）</p><p>　言葉を短くする習慣は、日本語の大きな特徴の一つだ。「スマートフォン」は「スマホ」に、「コンビニエンスストア」は「コンビニ」になる。こうした略語は、便利な一方で、仲間内でしか通じないことも多い。若者同士では当たり前の略語が、年配の人には意味不明ということもある。言葉を縮めることは、時間の節約にはなっても、相手との距離を縮めるとは限らないのである。</p>","qs":[{"n":48,"q":"筆者が最も言いたいことは何か。","o":["略語は、日本語を乱すものなので使うべきではない。","若者は、年配の人にもわかる略語だけを使うようにしている。","略語は効率的だが、通じない相手もいることに注意したい。","略語を使えば、時間も相手との距離も縮められる。"],"e":"Câu cuối: <b>時間の節約にはなっても、相手との距離を縮めるとは限らない</b>. Chơi chữ với 縮める (rút ngắn). Bẫy: đáp án cuối lấy nguyên từ trong bài nhưng đảo ý. Tác giả không phản đối dùng từ viết tắt (便利な一方で).","a":2}]},{"passage":"<p>（4）</p><p>　部下に仕事を任せられない上司がいる。自分でやったほうが速いし、失敗されるのも困るからだ。しかし、それでは部下はいつまでたっても育たず、結局、上司の仕事は減らない。任せるということは、ある程度の失敗を前もって受け入れることでもある。短期的な効率を少し手放すことが、長い目で見れば、チーム全体の力を高めることにつながるのだ。</p>","qs":[{"n":49,"q":"筆者の考えに合うものはどれか。","o":["部下に任せると失敗が増えるので、上司が手本を見せるべきだ。","上司は仕事を早く終わらせるために、部下に多くの仕事を任せるべきだ。","目先の効率より、部下に経験させることを重視すべきだ。","失敗しない部下を選んで、仕事を任せるべきだ。"],"e":"<b>短期的な効率を少し手放すことが…チーム全体の力を高める</b>. 短期的な効率 được nói lại thành 目先の効率. Bẫy: mục đích giao việc không phải để xong việc nhanh hơn. Tác giả nói chấp nhận thất bại (失敗を受け入れる), không phải chọn người không thất bại.","a":2}]}]},{"id":"r9","title":"問題9 内容理解（中文）","en":"Đọc hiểu: đoạn vừa","instr":"次の（1）から（3）の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>（1）</p><p>　子どものころ、夏休みに祖父母の住む山の村へ行くと、夜空には数え切れないほどの星が見えた。ところが、都会で暮らす今、夜空を見上げても、見えるのはわずかな星だけだ。</p><p>　星が見えなくなった原因の一つが、「光害」と呼ばれるものである。街灯や看板、建物の明かりが空を照らし、星の光をかき消してしまうのだ。光害は、星が見えにくくなるという問題にとどまらない。夜の明るさは、動物の行動や植物の成長にも影響を与えることがわかってきた。</p><p>　とはいえ、夜道の安全を考えれば、明かりを減らせばよいという単純な話ではない。最近では、必要な場所だけを照らし、光が空に向かわないように工夫した照明を取り入れる町も出てきた。<u>①そうした町</u>では、安全を保ちながら、星空を取り戻すことにも成功しているという。</p><p>　便利さと引き換えに失ったものは、元に戻せないと思いがちだ。だが、少しの工夫で取り戻せるものもある。<u>②都会の夜空</u>も、その一つなのかもしれない。</p>","qs":[{"n":50,"q":"光害について、本文の内容と合うものはどれか。","o":["影響は、星の見え方だけにとどまらない。","山の村でも、光害で星が見えなくなっている。","光害の主な原因は、自動車のライトである。","光害は、植物の成長にはよい影響を与える。"],"e":"<b>光害は、星が見えにくくなるという問題にとどまらない</b>, còn ảnh hưởng đến động vật và thực vật. Bẫy: ảnh hưởng đến thực vật là có, nhưng bài không nói là ảnh hưởng TỐT. Đèn xe không được nhắc đến.","a":0},{"n":51,"q":"<u>①そうした町</u>とは、どのような町か。","o":["安全のために、夜も街灯をすべて明るく照らし続けている町","星を見るために、夜は町のすべての明かりを消している町","街灯の数を減らして、電気代を節約している町","光を必要な所に限り、空に漏らさない工夫をしている町"],"e":"そうした chỉ câu trước: <b>必要な場所だけを照らし、光が空に向かわないように工夫した照明</b>. Bẫy: tắt hết đèn là cách \"đơn giản\" mà bài đã phủ nhận vì lý do an toàn.","a":3},{"n":52,"q":"<u>②都会の夜空</u>も、その一つなのかもしれないとあるが、筆者はどう考えているか。","o":["都会の夜空は、二度と元には戻らない。","星空を取り戻すには、都会の便利さを捨てるしかない。","都会の人は、星空に関心を持っていない。","工夫しだいで、星空を取り戻せる可能性がある。"],"e":"その一つ = <b>少しの工夫で取り戻せるもの</b>. Bẫy: \"không thể lấy lại\" là suy nghĩ mà con người thường có (～と思いがちだ), tác giả phản bác bằng だが.","a":3}]},{"passage":"<p>（2）</p><p>　日本の手紙には、「春暖の候」「紅葉の美しい季節となりました」といった、季節のあいさつから書き始める習慣がある。メールで用件だけを伝えることに慣れた若い世代には、<u>①回りくどく感じられる</u>かもしれない。</p><p>　しかし、このあいさつには、単なる決まり文句以上の役割がある。季節に触れることで、書き手と読み手が同じ時間を生きていることを確かめ、いきなり本題に入る唐突さを和らげるのだ。相手との関係を整えてから用件に入る、いわば<u>②会話の前のほほえみ</u>のようなものである。</p><p>　もちろん、ビジネスの場で毎回長いあいさつを書く必要はない。ただ、大切な相手に感謝やお願いを伝えるときには、一言季節に触れてみてはどうだろう。それだけで、文章の印象はずいぶん変わるはずだ。</p>","qs":[{"n":53,"q":"<u>①回りくどく感じられる</u>のはなぜだと考えられるか。","o":["用件を先に伝えることに慣れているから","手紙を書くことが、昔より少なくなったから","季節のあいさつの言葉が、古くて難しすぎるから","メールでは、季節のあいさつを書くことが禁止されているから"],"e":"<b>メールで用件だけを伝えることに慣れた若い世代</b> → nên thấy lời chào mùa là vòng vo. Bẫy: \"từ ngữ cổ và khó\" nghe hợp lý nhưng bài không nói.","a":0},{"n":54,"q":"<u>②会話の前のほほえみ</u>とは、どのようなことのたとえか。","o":["相手に気に入られるため、文章で冗談を言うこと","本題の前に、相手との関係を整えること","季節の変化を、相手より先に伝えること","相手の返事を待たずに、用件を伝えること"],"e":"Ngay trước đó: <b>相手との関係を整えてから用件に入る</b>. Nụ cười trước khi nói chuyện = làm dịu bầu không khí trước khi vào việc chính. Bẫy: ほほえみ không có nghĩa là pha trò.","a":1},{"n":55,"q":"筆者の考えに合うものはどれか。","o":["ビジネスの手紙でも、毎回長い季節のあいさつを書くべきだ。","季節のあいさつは、決まった言葉をそのまま使うのが一番よい。","メールでは、季節のあいさつは不要なので省くべきだ。","大事な相手への文には、季節に触れる一言を添えるとよい。"],"e":"Đoạn cuối: <b>大切な相手に…一言季節に触れてみてはどうだろう</b>. Bẫy: tác giả nói rõ trong kinh doanh <b>không cần</b> viết dài mỗi lần. Bài cũng nói lời chào mùa có vai trò hơn cả câu khuôn mẫu (決まり文句以上).","a":3}]},{"passage":"<p>（3）</p><p>　高校時代、私はサッカー部の補欠だった。三年間で公式戦に出たのは、わずか数分だけだ。当時は、試合のたびにベンチから仲間を見つめ、悔しい思いをしていた。</p><p>　しかし、今振り返ると、補欠だったからこそ学べたことがある。ベンチにいると、試合全体がよく見える。どこにすき間ができているか、誰が疲れているか。私はそれをメモし、試合後にレギュラーの仲間に伝えるようになった。最初は迷惑がられたが、やがて仲間のほうから「どう見えた？」と聞きに来るようになった。</p><p>　チームは、試合に出る選手だけで成り立っているわけではない。外から支える人がいてこそ、内側の力も生きる。<u>あの三年間</u>は、社会に出た今の私にとって、何物にも代えがたい財産になっている。</p>","qs":[{"n":56,"q":"ベンチにいた筆者は、何をするようになったか。","o":["レギュラーになるため、ベンチで戦術を研究した。","疲れた選手の代わりに、試合に出るよう監督に頼んだ。","外から見て気づいた点を、仲間に伝えた。","試合のたびに、悔しさを日記に書いた。"],"e":"<b>それをメモし、試合後にレギュラーの仲間に伝えるようになった</b>. Bẫy: tác giả ghi chép để giúp đồng đội, không phải để bản thân được đá chính.","a":2},{"n":57,"q":"仲間の態度は、どのように変わったか。","o":["初めは嫌がったが、やがて自分から意見を求めるようになった。","初めから、筆者の意見を喜んで聞いていた。","筆者がどれだけ熱心に伝えても、最後まで筆者のメモを読もうとしなかった。","筆者をレギュラーにするよう、監督に頼んだ。"],"e":"<b>最初は迷惑がられたが、やがて仲間のほうから「どう見えた？」と聞きに来る</b>. 迷惑がる = tỏ ra khó chịu. Đáp án đúng phải gộp cả hai giai đoạn (trước và sau).","a":0},{"n":58,"q":"<u>あの三年間</u>について、筆者はどう考えているか。","o":["試合に出られず、無駄な時間を過ごしてしまった。","試合に出られなかった経験が、今の自分を支えている。","あのときもっと努力していれば、自分もレギュラーとして試合に出られたはずだ。","補欠の経験は、社会では役に立たない。"],"e":"<b>何物にも代えがたい財産</b> = tài sản không gì thay thế được. Bẫy: \"phí thời gian\" là cảm giác LÚC ĐÓ (悔しい思い), không phải đánh giá hiện tại.","a":1}]}]},{"id":"r10","title":"問題10 内容理解（長文）","en":"Đọc hiểu: đoạn dài","instr":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　利用者の減少を理由に、地方の鉄道が次々と廃止されている。車を持つ人が増え、人口も減り続ける中で、赤字の路線を維持するのは容易ではない。鉄道会社にとって、乗る人の少ない路線を廃止し、バスに切り替えるのは、経営上やむを得ない判断なのだろう。</p><p>　だが、鉄道がなくなった町を訪れると、<u>①失われたものの大きさ</u>に気づかされる。駅前の商店街はシャッターを下ろし、高校生や高齢者など、車を運転できない人の移動は一気に不便になった。バスは本数が少なく、時間も読みにくい。結果として、若い世代が町を離れ、人口減少にさらに拍車がかかるという悪循環に陥った地域もある。</p><p>　鉄道の価値は、運賃収入だけでは測れない。駅は人が集まる場であり、町の顔でもある。線路が通っているというだけで、「ここは人の住む場所だ」という安心感を与えることもあるだろう。こうした目に見えない価値は、鉄道会社の帳簿には表れない。</p><p>　もちろん、赤字をすべて鉄道会社に負わせるのは無理がある。そこで、自治体や住民が費用の一部を負担し、地域全体で鉄道を支えようとする動きも出てきた。駅舎を地域の交流スペースとして活用したり、観光列車を走らせて外から人を呼び込んだりする試みもある。こうした取り組みが、すべて成功しているわけではない。<u>②それでも</u>、鉄道を「会社のもの」ではなく「地域のもの」として考え直すことには、大きな意味があると思う。</p><p>　鉄道を残すかどうかは、単なる交通手段の選択ではない。その町でどのように暮らし続けたいのかという、住民自身の問いでもあるのだ。</p>","qs":[{"n":59,"q":"第1段落で、筆者は鉄道の廃止についてどのように述べているか。","o":["人口が減っている地域では、すぐに廃止すべきだ。","会社の立場からは、仕方のない面もある。","鉄道会社の判断は、明らかに誤っている。","バスに切り替えれば、問題はすべて解決する。"],"e":"<b>経営上やむを得ない判断なのだろう</b>. やむを得ない = không còn cách nào khác. Tác giả hiểu cho công ty, rồi mới phản biện ở đoạn 2 (だが). Đây là cấu trúc nhượng bộ rất hay gặp.","a":1},{"n":60,"q":"<u>①失われたものの大きさ</u>の例として、本文に合わないものはどれか。","o":["駅前の商店街の店が閉まってしまった。","車を運転できない人の移動が不便になった。","観光客が増え、町が混雑するようになった。","若い世代が町を出て行くようになった。"],"e":"Câu hỏi PHỦ ĐỊNH (合わないもの). Ba đáp án kia đều có trong đoạn 2. Bài không nói khách du lịch tăng. Tàu du lịch là một GIẢI PHÁP ở đoạn 4, không phải hậu quả.","a":2},{"n":61,"q":"<u>②それでも</u>とあるが、筆者はどのようなことを認めたうえでこう述べているか。","o":["鉄道の赤字を、すべて会社に負わせるのは無理があること","地域で鉄道を支える試みが、必ずしもうまくいっていないこと","自治体や住民が、費用を負担し始めていること","観光列車を走らせたことで、外から多くの観光客を呼び込むことに成功していること"],"e":"それでも nhượng bộ câu ngay trước: <b>こうした取り組みが、すべて成功しているわけではない</b>. Bẫy: đáp án thứ hai cũng có trong bài, nhưng nằm xa hơn và không phải điều mà それでも chỉ đến.","a":1},{"n":62,"q":"この文章で筆者が最も言いたいことは何か。","o":["鉄道の存続は、地域の暮らし方を住民が考える問題でもある。","赤字の鉄道は、鉄道会社に代わって自治体が費用も運営もすべて引き受けるべきだ。","地方の鉄道は、観光列車に切り替えれば生き残れる。","鉄道がなくなっても、バスがあれば生活に困ることはない。"],"e":"Đoạn cuối: <b>その町でどのように暮らし続けたいのかという、住民自身の問い</b>. Bẫy: bài nói \"một phần\" chi phí (費用の一部), không phải gánh hết. Tàu du lịch chỉ là một ví dụ.","a":0}]}]},{"id":"r11","title":"問題11 統合理解","en":"Đọc so sánh A và B","instr":"次のAとBの文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p><b>A</b></p><p>　小学校で英語を教える学年を、さらに早めるべきだという意見がある。私も賛成だ。幼いうちは、音をそのまま聞き取ってまねする力が高く、発音も自然に身につきやすい。また、早い時期に外国語に触れることで、自分と違う文化を持つ人への抵抗感が薄れ、世界に目を向けるきっかけにもなる。もちろん、教えられる教員の確保は課題だが、それは育成を急ぐことで解決すべきであって、開始を遅らせる理由にはならない。</p><p><b>B</b></p><p>　英語教育の開始時期を早めることには、慎重であるべきだと考える。確かに、幼い子どもは音への感覚が鋭く、外国の文化に親しむ意味もあるだろう。しかし、限られた授業時間の中で英語を増やせば、ほかの教科、とりわけ母語である国語の時間が圧迫されかねない。考える力の土台となるのは母語であり、その力が不十分なまま外国語を学んでも、深い理解には至らない。さらに、英語を十分に教えられる教員がまだ少ないという現状もある。今は開始時期を早めることより、授業の質を高めることを優先すべきだ。</p>","qs":[{"n":63,"q":"AとBの筆者が、どちらも認めていることは何か。","o":["国語の時間が減るおそれがあること","教員の不足は、開始を遅らせる理由にならないこと","幼い子どもは音を聞き取る力が高いこと","母語の力が、考える力の土台になること"],"e":"A: <b>音をそのまま聞き取ってまねする力が高く</b>. B: <b>確かに、幼い子どもは音への感覚が鋭く</b>. Cả hai đều thừa nhận. Bẫy: cả A và B đều nhắc đến thiếu giáo viên, nhưng ý kiến về vấn đề này lại TRÁI NGƯỢC nhau.","a":2},{"n":64,"q":"教員の不足について、AとBはどのように述べているか。","o":["AもBも、教員が不足しているので開始を遅らせるべきだとしている。","Aは教員は足りているとし、Bは不足しているとしている。","AもBも、教員の不足は一時的なものにすぎず、授業の開始時期とは関係のない問題だとしている。","Aは育成を急げばよいとし、Bは開始を早めない理由の一つとしている。"],"e":"A: <b>育成を急ぐことで解決すべきであって、開始を遅らせる理由にはならない</b>. B: thiếu giáo viên là một lý do trong lập luận <b>慎重であるべき</b>. Bẫy: A KHÔNG nói giáo viên đã đủ, A thừa nhận đó là 課題 (vấn đề cần giải quyết).","a":3}]}]},{"id":"r12","title":"問題12 主張理解（長文）","en":"Đọc hiểu: quan điểm tác giả","instr":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　旅の計画を立てるのが好きな人は多い。行きたい場所を調べ、乗り換えの時間を確かめ、評判のよい店を予約する。インターネットのおかげで、今では旅先の様子を出発前にかなり詳しく知ることができる。準備を重ねれば重ねるほど、失敗のない旅になるだろう。</p><p>　しかし、振り返ってみると、私の記憶に深く残っている旅は、<u>①むしろ計画どおりにいかなかった旅</u>のほうだ。乗るはずの電車が止まり、知らない駅で一晩過ごしたこと。予約した店が休みで、仕方なく入った食堂で、地元の人と話し込んだこと。そのときは慌てたり、がっかりしたりしたはずなのに、今思い出すのは、そうした場面ばかりである。</p><p>　なぜだろうか。計画どおりの旅は、言ってみれば、出発前に頭の中で一度経験した旅を、もう一度なぞるようなものだ。確認はあっても、発見は少ない。一方、予定が狂ったとき、人は目の前の状況に向き合わざるを得なくなる。周りをよく見て、人に尋ね、自分で判断する。<u>②その過程</u>で出会ったものは、調べて知っていたものとは違い、自分だけの体験として心に刻まれるのだろう。</p><p>　だからといって、計画を立てずに出かければよいと言うつもりはない。何も決めずに出かければ、ただ時間を無駄にするだけの旅になることもある。大切なのは、計画を立てつつも、それに縛られすぎないことだ。予定が崩れたときに、「失敗した」と嘆くのではなく、「さて、何が起こるだろう」と楽しめる余裕を持っていたい。</p><p>　旅に限らず、人生も思いどおりにいかないことの連続である。計画からはみ出した時間にこそ、本当の発見がある。そう考えれば、予定外の出来事も、少し違って見えてくるのではないだろうか。</p>","qs":[{"n":65,"q":"<u>①むしろ計画どおりにいかなかった旅</u>のほうが記憶に残っているのはなぜだと筆者は考えているか。","o":["計画どおりの旅は、失敗が多くて楽しめないから","予定が狂うと、旅の費用が安くすむから","予定が狂って慌てたりがっかりしたりした気持ちが、いつまでも強く心に残るから","状況に自分で向き合い、体験が自分だけのものになるから"],"e":"Đoạn 3: <b>目の前の状況に向き合わざるを得なくなる…自分だけの体験として心に刻まれる</b>. Bẫy: tác giả nói điều ông nhớ là CÁC TÌNH HUỐNG (場面), không phải cảm giác hoảng hốt (そのときは慌てたり…したはずなのに).","a":3},{"n":66,"q":"<u>②その過程</u>とは、どのような過程か。","o":["出発前に、旅先の情報を詳しく調べる過程","計画どおりに、予定を一つずつ確認する過程","周りを見て人に尋ね、自分で判断する過程","失敗した理由を、旅の後で振り返る過程"],"e":"その chỉ câu trước: <b>周りをよく見て、人に尋ね、自分で判断する</b>. Bẫy: tìm hiểu trước là \"xác nhận\" (確認), mà tác giả nói ít \"phát hiện\" (発見).","a":2},{"n":67,"q":"旅の計画について、筆者はどのように考えているか。","o":["計画を立てると発見がなくなるので、立てないほうがよい。","失敗しないように、できるだけ詳しく立てるべきだ。","計画は、旅の後で振り返るために立てるものだ。","立てるのはよいが、それにとらわれすぎないほうがよい。"],"e":"<b>計画を立てずに出かければよいと言うつもりはない…計画を立てつつも、それに縛られすぎないこと</b>. 縛られる được nói lại thành とらわれる. Bẫy: \"không lập kế hoạch\" bị tác giả phủ nhận trực tiếp.","a":3},{"n":68,"q":"筆者の主張に最も近いものはどれか。","o":["人生は計画どおりにいかないので、計画は意味がない。","旅先では、地元の人と話すことが最も大切だ。","予定からはずれた時間にこそ、本当の発見がある。","失敗を避けるためには、余裕のある計画を立てるべきだ。"],"e":"Câu kết: <b>計画からはみ出した時間にこそ、本当の発見がある</b>. はみ出した được nói lại thành はずれた. Bẫy: nói chuyện với người địa phương chỉ là một ví dụ. Tác giả không coi kế hoạch là vô nghĩa.","a":2}]}]},{"id":"r13","title":"問題13 情報検索","en":"Tìm thông tin","instr":"次は、あるホテルの宿泊プランの案内である。下の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<div class='notice'><p style='text-align:center'><b>ホテル海風　宿泊プランのご案内</b>（1泊、1部屋の料金）</p><table class='tbl'><tr><th>プラン</th><th>内容</th><th>1名利用</th><th>2名利用</th></tr><tr><td>A 素泊まり</td><td>食事なし</td><td>7,000円</td><td>11,000円</td></tr><tr><td>B 朝食付き</td><td>朝食バイキング</td><td>8,500円</td><td>14,000円</td></tr><tr><td>C 夕朝食付き</td><td>夕食（和食コース）、朝食</td><td>12,000円</td><td>21,000円</td></tr><tr><td>D 早期予約</td><td>朝食付き。宿泊日の30日前までの予約限定。キャンセル不可</td><td>7,500円</td><td>12,000円</td></tr></table><p>※金曜日、土曜日、祝日の前日は、上記料金に1部屋につき2,000円が加算されます。<br>※小学生以下のお子様は、大人と同じ部屋に泊まる場合、宿泊無料です（食事は1食500円）。<br>※2泊以上連続で宿泊される場合、2泊目以降の料金が10％引きになります（Dプランは対象外）。<br>※チェックイン15:00、チェックアウト11:00。</p></div>","qs":[{"n":69,"q":"会社員の林さんは、今日（6月1日）、6月20日（土）に一人で1泊するため予約したい。朝食は食べたい。最も安いプランの料金はいくらか。","o":["7,500円","9,500円","8,500円","10,500円"],"e":"Hôm nay 1/6, ngày ở 20/6 chỉ còn 19 ngày, nên <b>không đủ 30 ngày trước</b>, không dùng được gói D. Gói có bữa sáng là B: 8,500円. Ngày 20/6 là <b>thứ bảy, +2,000円</b>. Tổng <b>10,500円</b>. Bẫy: 7,500円 và 9,500円 là chọn nhầm gói D. 8,500円 là quên phụ phí thứ bảy.","a":3},{"n":70,"q":"山田さん夫婦と小学生の娘の三人は、7月7日（火）から2泊、Cプランで同じ部屋に泊まる。娘も夕食と朝食をとる。料金の合計はいくらか。","o":["42,000円","43,000円","41,900円","39,900円"],"e":"Đêm 1 (thứ ba): C cho 2 người 21,000円. Đêm 2 (thứ tư): giảm 10% = 18,900円. Con gái học tiểu học: ở miễn phí, ăn 500円 × 4 bữa (2 tối + 2 sáng) = 2,000円. Tổng 21,000 + 18,900 + 2,000 = <b>41,900円</b>. Bẫy: 42,000円 là quên cả giảm 10% lẫn tiền ăn của con. 43,000円 là quên giảm 10% và chỉ tính 2 bữa. 39,900円 là quên tiền ăn của con.","a":2}]}]}];
const SET9 = [{"id":"m1","title":"問題1 漢字読み","en":"Đọc kanji","instr":"＿＿の言葉の読み方として最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":1,"q":"彼女は幼いころから音楽の才能に<u>秀でて</u>いた。","o":["すぐれて","ひでて","ひいでて","ひきでて"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 7, lần này hỏi theo dạng khác.</span><br><b>秀でる (ひいでる)</b> = xuất sắc, vượt trội. Bẫy: すぐれる (優れる) cùng nghĩa nhưng là chữ khác. ひでて thiếu い.","a":2}]},{"qs":[{"n":2,"q":"祖母は、破れたシャツを丁寧に<u>繕って</u>くれた。","o":["つくって","ぬって","いろどって","つくろって"],"e":"<b>繕う (つくろう)</b> = khâu vá, sửa chữa (quần áo). Cũng dùng theo nghĩa bóng: 体裁を繕う = giữ thể diện. Bẫy: ぬう = 縫う (khâu), nghĩa gần giống nhưng chữ khác.","a":3}]},{"qs":[{"n":3,"q":"彼の話し方には<u>抑揚</u>がなく、聞いていて眠くなる。","o":["ようよう","よくよう","よくおう","ぎょくよう"],"e":"<b>抑揚 (よくよう)</b> = ngữ điệu, trầm bổng. 抑 = <b>よく</b> (như 抑制 よくせい), 揚 = <b>よう</b> (như 揚げる あげる).","a":1}]},{"qs":[{"n":4,"q":"部署間の意思の<u>疎通</u>がうまくいっていない。","o":["そどう","そつう","しょつう","そうつう"],"e":"<b>疎通 (そつう)</b> = sự thông suốt (ý kiến, giao tiếp). 意思の疎通 là cụm cố định. Chữ 疎 đã gặp ở 疎か (おろそか, 模試 2), nhưng ở đây đọc âm Hán là <b>そ</b>.","a":1}]},{"qs":[{"n":5,"q":"彼の主張は、事実を無視した<u>甚だしい</u>誤解に基づいている。","o":["はなはだしい","おびただしい","いちじるしい","たのもしい"],"e":"<b>甚だしい (はなはだしい)</b> = quá mức, nghiêm trọng (thường đi với điều xấu: 甚だしい誤解). Bẫy: おびただしい (夥しい, ôn từ 模試 1) = rất nhiều, いちじるしい = 著しい (rõ rệt).","a":0}]},{"qs":[{"n":6,"q":"子どもたちの笑顔を見ていると、心が<u>和む</u>。","o":["なごむ","やわらむ","わむ","なごやむ"],"e":"<b>和む (なごむ)</b> = dịu lại, thấy ấm lòng, thư thái. Bẫy: やわらぐ (和らぐ) cùng chữ 和 nhưng đuôi khác. Tính từ liên quan: 和やか (なごやか) = hòa thuận.","a":0}]}]},{"id":"m2","title":"問題2 文脈規定","en":"Từ theo ngữ cảnh","instr":"（　　）に入れるのに最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":7,"q":"数ある応募作品の中で、彼女の作品の独創性は（　　）いた。","o":["張り合って","目立たせて","際立って","取り立てて"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 8, lần này hỏi theo dạng khác.</span><br><b>際立つ (きわだつ)</b> = nổi bật hẳn. Bẫy: 張り合う = cạnh tranh với nhau (người với người). 目立たせる là thể sai khiến, cần tân ngữ. 取り立てて = đặc biệt (thường đi với phủ định).","a":2}]},{"qs":[{"n":8,"q":"男女の賃金の格差を（　　）するため、国は新しい制度を作った。","o":["改訂","修繕","訂正","是正"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 5, lần này hỏi theo dạng khác.</span><br><b>是正 (ぜせい)</b> = điều chỉnh cho đúng (bất bình đẳng, sai lệch về chế độ). Bẫy: 訂正 = sửa lỗi (chữ viết, lời nói), 改訂 = sửa đổi (sách, quy định), 修繕 = sửa chữa (nhà cửa).","a":3}]},{"qs":[{"n":9,"q":"上着とズボンの色が（　　）で、どうも落ち着かない。","o":["ちぐはぐ","ぎくしゃく","まちまち","うやむや"],"e":"<b>ちぐはぐ</b> = không ăn khớp, lệch tông. Bẫy: ぎくしゃく = gượng gạo (quan hệ, cử động), まちまち = mỗi cái một khác (ôn từ 模試 3), うやむや = mập mờ (ôn từ 模試 6).","a":0}]},{"qs":[{"n":10,"q":"客が急いでいるのを知って、店は（　　）見て、高い値段をつけた。","o":["足元を","手元を","胸元を","目元を"],"e":"<b>足元を見る (あしもとをみる)</b> = lợi dụng điểm yếu của người khác (để ép giá). Thành ngữ cố định.","a":0}]},{"qs":[{"n":11,"q":"彼女は十年の（　　）を経て、再び舞台に立った。","o":["ギャップ","ノウハウ","ブランク","ニュアンス"],"e":"<b>ブランク</b> = khoảng thời gian gián đoạn (nghỉ việc, nghỉ diễn). Bẫy: ギャップ = khoảng cách, chênh lệch (giữa hai thứ), không dùng cho thời gian nghỉ.","a":2}]},{"qs":[{"n":12,"q":"彼の論文は、これまでの常識に（　　）を投じるものとして注目された。","o":["一役","一目","一線","一石"],"e":"<b>一石を投じる (いっせきをとうじる)</b> = gây tiếng vang, đặt ra vấn đề mới. Ôn tập: 一目置く (模試 6), 一役買う = góp sức, 一線を画す = vạch ranh giới.","a":3}]},{"qs":[{"n":13,"q":"君のために言っているのに、そんなふうに文句を言われる（　　）はない。","o":["筋合い","筋道","筋書き","筋違い"],"e":"<b>～筋合いはない (すじあいはない)</b> = không có lý do gì để bị (trách, nói). Bẫy: 筋道 = lý lẽ, trình tự, 筋書き = kịch bản, 筋違い = không đúng chỗ, lạc đề. Tất cả đều có 筋.","a":0}]}]},{"id":"m3","title":"問題3 言い換え類義","en":"Từ gần nghĩa","instr":"＿＿の言葉に意味が最も近いものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":14,"q":"父は、医者に勧められても<u>頑なに</u>入院を拒んだ。","o":["涙を浮かべながら","はっきりと","黙って","意地を張って"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 7, lần này hỏi theo dạng khác.</span><br><b>頑な (かたくな)に</b> = khăng khăng, cố chấp. Gần nhất là 意地を張って (ngang bướng giữ ý mình). Bẫy: はっきりと chỉ là rõ ràng, không có sắc thái cố chấp.","a":3}]},{"qs":[{"n":15,"q":"この制度は、手続きが<u>煩雑な</u>ことで知られている。","o":["費用が高い","複雑で面倒な","時間が短い","わかりやすい"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 8, lần này hỏi theo dạng khác.</span><br><b>煩雑 (はんざつ)</b> = rườm rà, phức tạp. Gần nhất là 複雑で面倒な.","a":1}]},{"qs":[{"n":16,"q":"彼の技術には、ベテランの職人たちも<u>一目置いて</u>いる。","o":["不満を持って","まだその実力に気づかずに","優れていると認めて","心配して"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 6, lần này hỏi theo dạng khác.</span><br><b>一目置く (いちもくおく)</b> = công nhận, nể phục. Gần nhất là 優れていると認めて.","a":2}]},{"qs":[{"n":17,"q":"新製品の売り上げは、発売三か月で<u>頭打ちに</u>なった。","o":["急に増えるように","それ以上伸びなく","大きく減るように","予想を上回るように"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 8, lần này hỏi theo dạng khác.</span><br><b>頭打ち (あたまうち)</b> = chững lại, không tăng thêm. Gần nhất là それ以上伸びなくなった. Bẫy: 大きく減る là giảm mạnh, khác với chững lại.","a":1}]},{"qs":[{"n":18,"q":"今日の部長は、<u>いやに</u>機嫌がいい。","o":["少し","妙に","いつも","やはり"],"e":"<b>いやに</b> = lạ thay, khác thường (thấy kỳ lạ). Gần nhất là 妙に (みょうに). Không liên quan đến nghĩa ghét (嫌).","a":1}]},{"qs":[{"n":19,"q":"二十年前の卒業式の光景を、今でも<u>ありありと</u>思い出す。","o":["はっきりと","ぼんやりと","ときどき","懐かしく"],"e":"<b>ありありと</b> = rõ ràng, sống động như thật. Gần nhất là はっきりと. Bẫy: ぼんやりと là trái nghĩa.","a":0}]}]},{"id":"m4","title":"問題4 用法","en":"Cách dùng từ","instr":"次の言葉の使い方として最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":20,"q":"<b>拍車</b>","o":["円安が、海外からの観光客の増加に拍車をかけている。","秋の運動会では、グラウンドを囲んだ大勢の観客が大きな拍車で選手たちを応援した。","彼は自転車に拍車をつけて、坂道を一気に下った。","社長の拍車な決断で、会社は大きく成長した。"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 7, lần này hỏi theo dạng khác.</span><br><b>拍車をかける (はくしゃ)</b> = thúc đẩy nhanh hơn. Vỗ tay cổ vũ là 拍手 (はくしゅ), dễ nhầm vì chữ 拍. Quyết định táo bạo là 大胆な決断.","a":0}]},{"qs":[{"n":21,"q":"<b>おっくう</b>","o":["この料理は材料が多くて、おっくうな味がする。","おっくうな事故に巻き込まれ、けがをした。","彼はおっくうな性格で、誰とでもすぐに打ち解ける。","寒い朝は、布団から出るのがおっくうだ。"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 5, lần này hỏi theo dạng khác.</span><br><b>おっくう (億劫)</b> = ngại làm, thấy phiền. Chỉ dùng cho cảm giác ngại hành động, không dùng cho mùi vị, sự cố hay tính cách.","a":3}]},{"qs":[{"n":22,"q":"<b>取り留め</b>","o":["この試合は、取り留めのない大差で勝った。","取り留めのない努力の結果、彼は合格した。","初めて行く町で駅までの取り留めがわからず、何度も同じ道を行ったり来たりして遠回りしてしまった。","彼女とは、取り留めのない話をして午後を過ごした。"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 3, lần này hỏi theo dạng khác.</span><br><b>取り留めのない (とりとめのない)</b> = lan man, không có trọng tâm. Thắng cách biệt lớn là 圧倒的な, nỗ lực không ngừng là 絶え間ない.","a":3}]},{"qs":[{"n":23,"q":"<b>気が置けない</b>","o":["気が置けない相手なので、話すときはいつも緊張する。","彼とは学生時代からの気が置けない仲で、何でも話せる。","あの店員は気が置けないので、もう行きたくない。","会社の大事な書類を、誰でも出入りできる気が置けない場所にうっかり置いたまま帰ってしまった。"],"e":"<b>気が置けない (きがおけない)</b> = thân thiết, thoải mái không cần giữ ý. Bẫy rất nổi tiếng: nhiều người Nhật cũng hiểu nhầm thành \"không thể tin tưởng\". Câu 2 và 3 dùng theo nghĩa sai này.","a":1}]},{"qs":[{"n":24,"q":"<b>手がける</b>","o":["混雑した朝の電車の中で、彼は片手でつり革を手がけて、ずっと立ったまま本を読んでいた。","子どもが泣いていたので、そっと頭を手がけた。","この建物は、世界的に有名な建築家が手がけたものだ。","財布を手がけたまま、店を出てしまった。"],"e":"<b>手がける (てがける)</b> = trực tiếp đảm nhận, làm ra (công trình, tác phẩm). Bám vào tay nắm là つかまる, xoa đầu là なでる, cầm ví là 持つ.","a":2}]},{"qs":[{"n":25,"q":"<b>目もくれない</b>","o":["彼は甘い物には目もくれず、黙々と仕事を続けた。","彼女は泣きすぎて、目もくれない様子だった。","この部屋は暗くて、目もくれないほどだ。","試験前で忙しく、目もくれない毎日を送っている。"],"e":"<b>Nには目もくれない</b> = không thèm ngó tới N. Khóc sưng mắt là 目が腫れる, tối không thấy gì là 何も見えない, bận tối mặt là 目が回る.","a":0}]}]},{"id":"m5","title":"問題5 文法形式の判断","en":"Ngữ pháp","instr":"次の文の（　　）に入れるのに最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":26,"q":"警察官（　　）者が、交通ルールを守らないとは何事だ。","o":["ともなると","ならではの","ともあろう","とあって"],"e":"<b>Nともあろう者が</b> = người ở vị trí như N mà lại (làm điều không xứng). Bẫy gần về hình thức: ともなると = một khi đã là N thì (đương nhiên), không đứng trước danh từ 者.","a":2}]},{"qs":[{"n":27,"q":"散歩（　　）、駅前の本屋に寄ってみた。","o":["かたわら","がてら","ながらも","なりに"],"e":"<b>Nがてら</b> = nhân tiện khi làm N. Bẫy: かたわら (ôn từ 模試 4) = vừa làm việc chính vừa làm việc khác trong thời gian dài, và phải là 散歩のかたわら.","a":1}]},{"qs":[{"n":28,"q":"先生が見ていないの（　　）、生徒たちは授業中に騒ぎ始めた。","o":["をいいことに","をよそに","をおして","をものともせず"],"e":"<b>Nをいいことに</b> = lợi dụng N (để làm điều không tốt). Bẫy: をよそに = mặc kệ (sự lo lắng của người khác), をおして và をものともせず = bất chấp (khó khăn).","a":0}]},{"qs":[{"n":29,"q":"仕事（　　）、家族と過ごす時間をおろそかにしてしまった。","o":["にひきかえ","にもまして","にかまけて","にそって"],"e":"<b>Nにかまけて</b> = mải mê N mà lơ là việc khác. Đi với おろそかにする (ôn từ 疎か, 模試 2 và 3).","a":2}]},{"qs":[{"n":30,"q":"今の実力では、合格できる可能性は五分五分（　　）。","o":["というものだ","といったらない","といったところだ","というわけにはいかない"],"e":"<b>Nといったところだ</b> = cỡ khoảng N, chỉ ở mức N (đánh giá mức độ). Bẫy: といったらない = vô cùng (cảm xúc mạnh), というものだ = chính là (nhận định chung), というわけにはいかない = không thể (làm vậy).","a":2}]},{"qs":[{"n":31,"q":"最新の医療技術（　　）、この病気を完全に治すことはできない。","o":["をもってすれば","をもってしても","をおいては","にもまして"],"e":"<b>Nをもってしても～ない</b> = dù có dùng đến N cũng không thể. Bẫy gần về hình thức: <b>をもってすれば</b> (ôn từ 模試 6) đi với kết quả TÍCH CỰC (làm được), ở đây vế sau là phủ định.","a":1}]},{"qs":[{"n":32,"q":"彼は、今にも泣き出さ（　　）顔で、私に助けを求めてきた。","o":["んばかりに","んがための","んばかりの","ずにはおかない"],"e":"<span class='rev'>【Ôn tập ngữ pháp】 Mẫu này đã xuất hiện ở 模試 1, lần này trong câu mới.</span><br><b>Vない形 + んばかりの + N</b> = như sắp V. Bẫy hình thức: đứng trước danh từ 顔 phải dùng <b>の</b>, không dùng に. んばかりに đứng trước động từ.","a":2}]},{"qs":[{"n":33,"q":"最近のテレビ番組の中には、聞く（　　）下品な言葉があふれているものもある。","o":["にたえない","にかたくない","に足りない","にあたらない"],"e":"<span class='rev'>【Ôn tập ngữ pháp】 Mẫu này đã xuất hiện ở 模試 3, lần này trong câu mới.</span><br><b>Vる にたえない</b> = không chịu nổi khi V (見るにたえない, 聞くにたえない). Bẫy: にかたくない = dễ dàng (想像にかたくない).","a":0}]},{"qs":[{"n":34,"q":"大型の台風が接近したため、その船は航路の変更（　　）。","o":["を禁じ得なかった","に至らなかった","を余儀なくされた","をものともしなかった"],"e":"<span class='rev'>【Ôn tập ngữ pháp】 Mẫu này đã xuất hiện ở 模試 5, lần này trong câu mới.</span><br><b>Nを余儀なくされる</b> = buộc phải N (do hoàn cảnh). Bẫy: を禁じ得ない chỉ đi với cảm xúc (同情を禁じ得ない), không đi với 変更.","a":2}]},{"qs":[{"n":35,"q":"これほどの功績を残したのだから、彼はもっと評価され（　　）。","o":["てしかるべきだ","てはばからない","てやまない","てもさしつかえない"],"e":"<span class='rev'>【Ôn tập ngữ pháp】 Mẫu này đã xuất hiện ở 模試 6, lần này trong câu mới.</span><br><b>Vて しかるべきだ</b> = đương nhiên phải V. Bẫy: てもさしつかえない = V cũng không sao (nghĩa quá nhẹ).","a":0}]}]},{"id":"m6","title":"問題6 文の組み立て","en":"Sắp xếp câu","instr":"次の文の ★ に入る最もよいものを、1、2、3、4から一つ選びなさい。","fixed":true,"pages":[{"qs":[{"n":36,"q":"＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 、私はどんな仕事でも引き受ける。","o":["とあれば","生活の","ため","家族の"],"a":2,"e":"<span class='rev'>【Ôn tập ngữ pháp】 Mẫu này đã xuất hiện ở 模試 3, lần này trong câu mới.</span><br>Thứ tự đúng: 家族の 生活の <b>ため</b> とあれば (4 2 3 1). <b>Nとあれば</b> = nếu là vì N. ★ ở vị trí thứ ba."}]},{"qs":[{"n":37,"q":"この町は、＿＿＿ <b>★</b> ＿＿＿ ＿＿＿ 、全国的に有名になった。","o":["なったことで","ドラマの","人気","舞台に"],"a":1,"e":"Thứ tự đúng: 人気 <b>ドラマの</b> 舞台に なったことで (3 2 4 1). 人気ドラマ là một danh từ ghép. ★ ở vị trí thứ hai."}]},{"qs":[{"n":38,"q":"彼女の歌は、＿＿＿ ＿＿＿ ＿＿＿ <b>★</b> 不思議な力を持っている。","o":["とらえる","者の","心を","聞く"],"a":0,"e":"Thứ tự đúng: 聞く 者の 心を <b>とらえる</b> (4 2 3 1). Động từ とらえる bổ nghĩa cho 力 nên phải đứng ngay trước 不思議な力. ★ ở vị trí cuối."}]},{"qs":[{"n":39,"q":"彼は ＿＿＿ <b>★</b> ＿＿＿ ＿＿＿ 、毎朝ジョギングを続けてきた。","o":["ことなく","十年間","欠かす","一日も"],"a":3,"e":"Thứ tự đúng: 十年間 <b>一日も</b> 欠かす ことなく (2 4 3 1). <b>Vる ことなく</b> = mà không V. 一日も～ない = không một ngày nào. ★ ở vị trí thứ hai."}]},{"qs":[{"n":40,"q":"この計画は、＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 実現は難しいだろう。","o":["予算が","限り","ない","十分な"],"a":2,"e":"Thứ tự đúng: 十分な 予算が <b>ない</b> 限り (4 1 3 2). <b>Vない限り</b> = chừng nào còn chưa V thì. ★ ở vị trí thứ ba."}]}]},{"id":"m7","title":"問題7 文章の文法","en":"Ngữ pháp trong đoạn văn","instr":"次の文章を読んで、文章全体の内容を考えて、41 から 45 の中に入る最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　スマートフォンの予定表を使うのをやめ、紙の手帳に切り替えて半年になる。手帳を使い始め（41）、一日の過ごし方が大きく変わった。</p><p>　以前は、予定を入れるのも確認するのも、すべて画面の中で済ませていた。便利ではあったが、通知が鳴るたびに作業が中断され、（42）一日中何かに追われているような気がしていた。</p><p>　手帳に予定を書き込むと、自然と一週間全体を見渡すことになる。どこに余裕があり、どこが詰まっているかが一目でわかる。手で書くという手間がかかる（43）、予定の一つ一つを意識するようにもなった。</p><p>　もちろん、手帳にも不便な点はある。家に忘れてくれば予定が確認できないし、急な変更を書き直すのも面倒だ。（44）、私にとっては、その不便さを補って余りある良さがある。</p><p>　道具を変えただけで生活がここまで変わるとは、思って（45）。</p>","qs":[{"n":41,"q":"（41）","o":["たとたん","てからというもの","たにもかかわらず","てからでないと"],"e":"<span class='rev'>【Ôn tập ngữ pháp】 Mẫu này đã xuất hiện ở 模試 5, lần này trong câu mới.</span><br><b>Vて からというもの</b> = kể từ khi V (thay đổi lớn, kéo dài). Bẫy: たとたん = vừa V thì ngay (sự việc bất ngờ một lần), たにもかかわらず = mặc dù đã V (ngược ý).","a":1},{"n":42,"q":"（42）","o":["なんとしても","なんらかの","なんとなく","なにしろ"],"e":"<b>なんとなく</b> = không hiểu sao, mơ hồ. Đi với ような気がする. Bẫy: なんとしても = bằng mọi giá, なんらかの = một (cái gì đó) nào đó, phải đứng trước danh từ.","a":2},{"n":43,"q":"（43）","o":["くせに","以上に","あまり","分"],"e":"<b>～分 (ぶん)</b> = bù lại, tương ứng với việc ~. 手間がかかる分 = vì tốn công nên bù lại. Bẫy: くせに = vậy mà (chê trách), あまり = quá mức đến nỗi (kết quả xấu).","a":3},{"n":44,"q":"（44）","o":["それでも","そのうえ","だからこそ","すなわち"],"e":"Câu trước nêu điểm bất tiện, câu sau nói vẫn có ưu điểm hơn. Quan hệ nhượng bộ, nên dùng <b>それでも</b>. Bẫy: だからこそ = chính vì vậy (cùng chiều).","a":0},{"n":45,"q":"（45）","o":["もみなかった","ばかりいた","しまった","いるところだ"],"e":"<b>思ってもみなかった</b> = chưa từng nghĩ tới. Cụm cố định với とは (～とは思ってもみなかった). Bẫy: 思ってしまった = lỡ nghĩ, 思っているところだ = đang nghĩ.","a":0}]}]},{"id":"r8","title":"問題8 内容理解（短文）","en":"Đọc hiểu: đoạn ngắn","instr":"次の（1）から（4）の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>（1）</p><p>　腕のいい料理人ほど、包丁の手入れを欠かさないという。どれほど高価な包丁でも、使いっぱなしにすれば、すぐに切れ味が落ちてしまう。反対に、安い包丁であっても、毎日丁寧に研いでいれば、長く使い続けることができる。道具の良し悪しを決めるのは、買ったときの値段よりも、その後の付き合い方なのである。</p>","qs":[{"n":46,"q":"筆者の考えに合うものはどれか。","o":["腕のいい料理人は、高価な包丁を選ぶべきだ。","日々の扱い方が、道具の価値を左右する。","安い包丁は、手入れをしてもすぐに切れなくなる。","包丁の切れ味は、買ったときの値段でほぼ決まってしまう。"],"e":"<b>道具の良し悪しを決めるのは、買ったときの値段よりも、その後の付き合い方</b>. 付き合い方 được nói lại thành 日々の扱い方. Bẫy: bài nói dao rẻ mà mài thường xuyên thì vẫn dùng lâu được, ngược với đáp án thứ ba.","a":1}]},{"passage":"<p>（2）</p><p>以下は、ある町内会が住民に配ったお知らせである。</p><div class='notice'><p style='text-align:center'><b>防災訓練のお知らせ</b></p><p>日時：10月18日（日）9:00～11:00（小雨決行、大雨の場合は25日に延期）<br>集合場所：みどり公園</p><p>　当日は、消火器の使い方や、けがをした人の運び方などを体験していただきます。参加を希望される方は、10月10日までに、各班の班長に人数をお伝えください。<br>　なお、小学生以下のお子様が参加される場合は、必ず保護者の方も一緒にご参加ください。訓練後には、非常食の試食会を行います。食物アレルギーのある方は、申し込みの際にお知らせください。</p></div>","qs":[{"n":47,"q":"小学3年生の息子と二人で参加したい人は、どうしなければならないか。","o":["10日までに町内会に電話で申し込み、子どもだけを参加させる。","10日までに二人で出ると班長に伝え、当日も一緒に行く。","10月18日に直接公園に行き、その場で人数を伝える。","大雨でなければ、申し込みをしなくても参加することができる。"],"e":"Hai điều kiện: báo số người cho <b>trưởng nhóm (班長) trước ngày 10</b>, và trẻ tiểu học <b>bắt buộc đi cùng phụ huynh</b>. Bẫy: đăng ký qua 班長, không phải gọi điện cho hội khu phố, và không được cho trẻ đi một mình.","a":1}]},{"passage":"<p>（3）</p><p>　会話の途中で沈黙が訪れると、慌てて何か話題を探そうとする人は多い。しかし、沈黙は必ずしも気まずいものではない。相手が言葉を選んでいる時間かもしれないし、今聞いた話をかみしめている時間かもしれない。その間を急いで埋めてしまえば、相手が言おうとしていた大切な一言を、聞き逃すことにもなりかねない。</p>","qs":[{"n":48,"q":"筆者は、会話の中の沈黙についてどう考えているか。","o":["急いで埋めず、相手に考える時間を与えたほうがよい。","気まずいものなので、すぐに新しい話題を出すべきだ。","沈黙が続くのは、相手が話を聞いていない証拠だ。","大切な話をするときは、沈黙を避けるべきだ。"],"e":"<b>その間を急いで埋めてしまえば…聞き逃すことにもなりかねない</b>. Đáp án đúng là suy ra từ cảnh báo này. Bẫy: \"vội tìm chủ đề\" là hành động của nhiều người (多い), mà tác giả phản bác.","a":0}]},{"passage":"<p>（4）</p><p>　「初心忘るべからず」という言葉は、一般に「始めたころの新鮮な気持ちを忘れてはいけない」という意味で使われている。しかし、もともとは、未熟だったころの自分の姿を忘れるなという戒めだったという説がある。うまくできなかった自分を覚えていれば、慢心することなく、成長を続けられる。忘れてはならないのは、希望に満ちた気持ちよりも、むしろ失敗ばかりしていたころの自分なのかもしれない。</p>","qs":[{"n":49,"q":"筆者が紹介している説によると、「初心忘るべからず」の本来の意味はどれか。","o":["始めたころの新鮮な気持ちを、いつまでも大切にせよ。","どんなに経験を積んでも、失敗を恐れずに新しいことに挑戦する気持ちを持ち続けよ。","未熟だったころの自分を覚えておき、思い上がらないようにせよ。","うまくいかなかったことは、早く忘れて前に進め。"],"e":"<b>未熟だったころの自分の姿を忘れるなという戒め…慢心することなく</b>. 慢心 = tự mãn, được nói lại thành 思い上がる. Bẫy: đáp án thứ hai là nghĩa thông thường (一般に), không phải nghĩa gốc mà câu hỏi hỏi.","a":2}]}]},{"id":"r9","title":"問題9 内容理解（中文）","en":"Đọc hiểu: đoạn vừa","instr":"次の（1）から（3）の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>（1）</p><p>　子どものころから通っていた近所の銭湯が、先月で閉店した。家に風呂があるのが当たり前になり、利用者が減ったうえ、燃料費も上がり続けていたという。最後の日には、長年の常連客が集まり、別れを惜しんだ。</p><p>　私にとって銭湯は、単に体を洗う場所ではなかった。湯船につかりながら、近所のおじいさんに昔の町の話を聞いたり、顔なじみの人と天気の話をしたりする。名前も知らないのに、なんとなく互いの様子を気にかけている。そんな<u>①ゆるやかなつながり</u>が、そこにはあった。</p><p>　閉店の日、番台に座っていた店主はこう言った。「お湯を売っていたつもりだったけど、本当はみんなの居場所を守っていたのかもしれないね」。その言葉を聞いて、<u>②失われたものの正体</u>が、少しわかった気がした。</p>","qs":[{"n":50,"q":"銭湯が閉店した理由として、本文に合うものはどれか。","o":["長年一人で店を切り盛りしてきた店主が高齢になり、体力的に店を続けられなくなったから","常連客の間で、トラブルが増えたから","町の再開発で、建物を壊すことになったから","家に風呂のある人が増えて客が減り、費用も上がったから"],"e":"<b>家に風呂があるのが当たり前になり、利用者が減ったうえ、燃料費も上がり続けていた</b>. Đáp án đúng phải gộp HAI lý do. Các lý do khác nghe hợp lý ngoài đời nhưng không có trong bài.","a":3},{"n":51,"q":"<u>①ゆるやかなつながり</u>とは、どのような関係か。","o":["名前も住所もよく知っていて、家族ぐるみで付き合う親しい友人関係","お互いに助け合うことを約束した関係","店主と客という、仕事上の関係","深くは知らないが、何となく気にかけ合う関係"],"e":"<b>名前も知らないのに、なんとなく互いの様子を気にかけている</b>. ゆるやか = lỏng lẻo, nhẹ nhàng. Bẫy: \"biết cả tên\" là ngược lại.","a":3},{"n":52,"q":"<u>②失われたものの正体</u>とは何か。","o":["地域の人が集まり、つながりを持てる場所","安い料金で入れる、大きなお風呂","昔の町の様子を知るための資料","店主が何十年もかけて身につけた、お湯の温度を保つための特別な技術"],"e":"Lời chủ quán: <b>本当はみんなの居場所を守っていたのかもしれない</b>. 居場所 = nơi để thuộc về, nơi mình được là chính mình. Bẫy: bồn tắm lớn giá rẻ là thứ chủ quán TƯỞNG mình đang bán (お湯を売っていたつもり).","a":0}]},{"passage":"<p>（2）</p><p>　介護の現場では、人手不足が深刻になっている。その解決策の一つとして期待されているのが、ロボットの活用だ。重い体を持ち上げる作業を助ける機械や、夜間の見守りを行うセンサーなどは、すでに多くの施設で使われている。</p><p>　こうした機械の導入に対しては、「人の温かさが失われる」という声もある。しかし、ある施設の職員は、<u>①逆の効果</u>があったと話す。力仕事や見回りを機械に任せたことで、職員が入居者と話したり、一緒に散歩したりする時間が増えたというのだ。</p><p>　もちろん、ロボットにすべてを任せられるわけではない。表情の小さな変化に気づき、相手の気持ちに寄り添うのは、やはり人の役割である。大切なのは、機械と人のどちらかを選ぶことではなく、<u>②それぞれが得意なこと</u>を分け合うことなのだろう。</p>","qs":[{"n":53,"q":"<u>①逆の効果</u>とは、どのようなことか。","o":["力仕事を機械に任せたことで、施設で働く職員の数を大幅に減らすことができた。","機械に作業を任せたことで、人と触れ合う時間が増えた。","機械に頼りすぎて、職員の技術が下がった。","入居者が、職員より機械を好むようになった。"],"e":"\"Ngược lại\" với lo ngại <b>人の温かさが失われる</b>: <b>入居者と話したり、一緒に散歩したりする時間が増えた</b>. Bẫy: giảm nhân viên nghe hợp lý nhưng bài không nói.","a":1},{"n":54,"q":"筆者によると、人にしかできない役割は何か。","o":["重い体を持ち上げる作業を行うこと","夜間に施設の中を見回ること"
