はなく、人々の暮らしの中で使われ続けることにあるのではないか。守るべきなのは、形そのものではなく、使う人のことを考えて工夫を重ねるという職人の姿勢なのだと思う。</p>","qs":[{"n":59,"q":"伝統工芸が存続の危機にある理由として、本文で述べられているものはどれか。","o":["技術が古くなり、製品が使えなくなったから","海外の製品に人気を奪われたから","需要が減り、職人として生活していくのが難しくなっているから","修業の方法が大きく変わったから"],"e":"Đoạn 1: <b>需要が減り…生活していけるだけの収入を得るのは容易ではない</b>. Hàng nước ngoài thì không được nhắc đến.","a":2},{"n":60,"q":"筆者が<u>①伝統を守ることと、何も変えないことは同じではない</u>と考えるのはなぜか。","o":["伝統は、各時代の職人が工夫を重ねることで受け継がれてきたから","昔の技術には、もう価値がないから","伝統工芸は、美術館で守られるべきだから","新しい技術のほうが、昔の技術より優れているから"],"e":"<b>それぞれの時代の職人が…工夫を重ねてきたからこそ、技術は今日まで生き残ってきた</b>. Tác giả không nói kỹ thuật cũ vô giá trị (đoạn 2 thừa nhận 知恵が詰まっている).","a":0},{"n":61,"q":"<u>②こうした変化</u>とはどのようなことか。","o":["伝統的な技法をやめて、機械で製品を作ること","伝統的な技法を守りながら、今の生活に合った製品を作ること","海外の職人に製造を任せること","製品の値段を下げて、多く売ること"],"e":"Câu ngay trước: <b>伝統的な技法は守りつつ、今の生活で使いやすい形にした</b>. Kỹ thuật truyền thống vẫn được GIỮ, nên đáp án nói bỏ kỹ thuật truyền thống là sai.","a":1},{"n":62,"q":"この文章で筆者が最も言いたいことは何か。","o":["伝統工芸は、昔のやり方を変えずに守るべきだ。","伝統工芸の作品は、美術館で大切に保存すべきだ。","伝統工芸は、暮らしの中で使われるよう工夫を続けることが大切だ。","若い職人は、海外で新しい技術を学ぶべきだ。"],"e":"Đoạn cuối là ý chính: giá trị thật là <b>暮らしの中で使われ続けること</b>, và điều cần giữ là <b>工夫を重ねるという職人の姿勢</b>. Giữ nguyên cách làm cũ là quan điểm mà tác giả phản bác.","a":2}]}]},{"id":"r11","title":"問題11 統合理解","en":"Đọc so sánh A và B","instr":"次のAとBの文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p><b>A</b></p><p>　現金を使わないキャッシュレス決済には多くの利点がある。支払いが短時間で済むため、レジの待ち時間が短くなる。店側にとっても、現金を数えたり銀行に運んだりする手間が省け、人手不足の解消につながる。さらに、支払いの記録が自動的に残るので、家計の管理もしやすい。災害で停電すると使えないという心配もあるが、全体としては社会の効率を高める仕組みであり、さらに普及を進めるべきだ。</p><p><b>B</b></p><p>　キャッシュレス化が進むのは時代の流れだろう。支払いが簡単になり、店の作業が減るのは確かだ。しかし、高齢者などスマートフォンの操作に慣れていない人にとっては、かえって不便になる場合もある。また、手軽に支払えるため、つい使いすぎてしまうという声も聞く。停電や通信障害のときに支払いができなくなる危険もある。キャッシュレス化を進めるにしても、現金を使える環境は残しておくべきだ。</p>","qs":[{"n":63,"q":"AとBのどちらの文章でも述べられていることは何か。","o":["支払いの記録が残り、家計を管理しやすいこと","高齢者にとって不便な場合があること","キャッシュレス決済によって、店の作業が減ること","手軽なため、お金を使いすぎてしまうこと"],"e":"A: <b>現金を数えたり…手間が省け</b>. B: <b>店の作業が減るのは確かだ</b>. Cả hai đều nói. Quản lý chi tiêu chỉ có ở A, người già và tiêu quá tay chỉ có ở B.","a":2},{"n":64,"q":"キャッシュレス化について、AとBはどのように述べているか。","o":["AもBも、現金を完全になくすべきだと述べている。","Aはさらに進めるべきだと述べ、Bは現金を使える環境も残すべきだと述べている。","Aは停電の問題を重視して慎重な立場をとり、Bは積極的に進めるべきだと述べている。","AもBも、高齢者への配慮が最も重要だと述べている。"],"e":"So sánh câu cuối: A <b>さらに普及を進めるべきだ</b>, B <b>現金を使える環境は残しておくべきだ</b>. A có nhắc mất điện nhưng vẫn ủng hộ (心配もあるが), nên đáp án nói A thận trọng là sai.","a":1}]}]},{"id":"r12","title":"問題12 主張理解（長文）","en":"Đọc hiểu: quan điểm tác giả","instr":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　「すぐに役に立つ知識を身につけたい」。最近、大学生からよくこう言われる。就職に有利な資格や、仕事ですぐに使える技術を学びたいという気持ちはよくわかる。社会の変化が激しく、将来が見通せない時代であればなおさらだ。</p><p>　しかし、<u>①「すぐに役に立つ」ものほど、すぐに役に立たなくなる</u>ということも忘れてはならない。特定の道具の使い方や、ある時点での制度の知識は、技術や社会が変われば、あっという間に古くなってしまう。十年前に最先端だった技術の多くが、今ではほとんど使われていないことを考えれば、それは明らかだろう。</p><p>　では、変化の激しい時代に本当に必要なのは何か。私は、すぐには役に立たないように見える学び、たとえば歴史や哲学、文学といったものの中にこそ、そのヒントがあると考えている。これらは、直接何かの作業に使えるわけではない。しかし、過去の人々がどのように問題に向き合ってきたのかを知り、物事を異なる視点から見る力を養ってくれる。こうした力は、どんなに時代が変わっても古くなることがない。</p><p>　もちろん、実用的な知識が不要だと言うつもりはない。社会で働く以上、具体的な技術は必要だ。問題は、それだけを学びの目的にしてしまうことである。目の前の役に立つかどうかだけで学ぶ内容を選んでいては、学びの幅はどんどん狭くなってしまう。</p><p>　すぐには答えの出ない問いに向き合い、遠回りに見える学びを重ねること。それが結果として、どんな変化にも対応できる、本当の意味での「役に立つ」力になるのではないだろうか。</p>","qs":[{"n":65,"q":"<u>①「すぐに役に立つ」ものほど、すぐに役に立たなくなる</u>とはどういうことか。","o":["役に立つ知識ほど、覚えるのに時間がかかる。","特定の技術や知識は、時代が変わると古くなりやすい。","資格は、就職に有利にはならない。","新しい技術ほど、使い方が難しい。"],"e":"Câu tiếp theo giải thích: <b>特定の道具の使い方や…制度の知識は…あっという間に古くなってしまう</b>. Mẫu ～ほど～ = càng ~ thì càng ~.","a":1},{"n":66,"q":"筆者は、歴史や哲学、文学のような学びについてどう述べているか。","o":["物事を異なる視点から見る力を養ってくれる。","仕事の作業に直接使うことができる。","就職に有利な資格につながる。","学ぶのに時間がかかりすぎる。"],"e":"<b>物事を異なる視点から見る力を養ってくれる</b>. Tác giả nói rõ chúng <b>直接何かの作業に使えるわけではない</b>, nên đáp án dùng trực tiếp cho công việc là sai.","a":0},{"n":67,"q":"筆者は、実用的な知識についてどう考えているか。","o":["大学で学ぶ必要はまったくない。","大学ではなく、会社に入ってから学ぶべきだ。","歴史や哲学よりも重要だ。","必要ではあるが、それだけを学ぶ目的にすべきではない。"],"e":"Đoạn 4: <b>実用的な知識が不要だと言うつもりはない…問題は、それだけを学びの目的にしてしまうこと</b>. Mẫu ～つもりはない。問題は～ rất hay gặp trong 主張理解: tác giả thừa nhận một phần rồi mới đưa ra vấn đề thật.","a":3},{"n":68,"q":"この文章で筆者が最も言いたいことは何か。","o":["大学生は、資格を取ることを最優先にすべきだ。","実用的な知識はすぐ古くなるので、学ぶ必要がない。","歴史や哲学を学べば、就職に有利になる。","すぐには役に立たないように見える学びが、変化に対応する力になる。"],"e":"Đoạn cuối: <b>遠回りに見える学びを重ねること…どんな変化にも対応できる…力になる</b>. Đáp án nói không cần học kiến thức thực dụng mâu thuẫn với đoạn 4.","a":3}]}]},{"id":"r13","title":"問題13 情報検索","en":"Tìm thông tin","instr":"次は、あるカフェのアルバイト募集のお知らせである。下の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<div class='notice'><p style='text-align:center'><b>カフェ「こもれび」　スタッフ募集</b></p><table class='tbl'><tr><th>時間帯</th><th>勤務時間</th><th>時給</th><th>募集曜日</th><th>条件</th></tr><tr><td>朝</td><td>7:00～11:00</td><td>1,150円</td><td>平日のみ</td><td>週3日以上</td></tr><tr><td>昼</td><td>11:00～16:00</td><td>1,100円</td><td>毎日</td><td>週2日以上</td></tr><tr><td>夜</td><td>17:00～22:00</td><td>1,200円</td><td>毎日</td><td>週2日以上<br>高校生不可</td></tr></table><p>※土曜、日曜、祝日は、時給が50円アップします。<br>※働き始めて最初の1か月は研修期間のため、時給は表の金額から100円引きとなります。<br>※交通費は1日500円まで支給します。<br>※留学生も歓迎します（日本語で日常会話ができる方）。</p><p>【応募方法】12月15日までに、電話またはメールでご連絡ください。</p></div>","qs":[{"n":69,"q":"大学生のマイさんは、土曜日と日曜日の夜に働きたいと考えている。働き始めて最初の月、マイさんの時給はいくらか。","o":["1,150円","1,200円","1,250円","1,100円"],"e":"Ca tối: 1,200円. Thứ 7 và Chủ nhật: <b>+50円</b>, thành 1,250円. Tháng đầu là thời gian đào tạo: <b>−100円</b>. Vậy 1,200 + 50 − 100 = <b>1,150円</b>. 1,250円 là bẫy cho người quên trừ tiền đào tạo. Dạng 情報検索 luôn giấu điều kiện trong phần ※.","a":0},{"n":70,"q":"高校生の健太さんは、平日は授業が16時に終わるため、働けるのは平日の17時以降と土曜日だけだ。健太さんが応募できる時間帯はどれか。","o":["昼だけ","応募できる時間帯はない","夜だけ","昼と夜"],"e":"Ngày thường sau 17h chỉ có <b>ca tối</b>, nhưng ca tối <b>高校生不可</b> (không nhận học sinh cấp 3). Còn lại thứ 7 ca trưa, nhưng ca trưa yêu cầu <b>週2日以上</b>, mà cậu ấy chỉ làm được 1 ngày (thứ 7). Vì vậy <b>không ứng tuyển được ca nào</b>. Câu hỏi này cần kiểm tra lần lượt từng điều kiện.","a":1}]}]}];
const SET4 = [{"id":"m1","title":"問題1 漢字読み","en":"Đọc kanji","instr":"＿＿の言葉の読み方として最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":1,"q":"この薬は、治療の方法を大きく変える<u>画期的</u>な発明だ。","o":["かっきてき","がきてき","かくきてき","がっきてき"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 2, lần này hỏi theo dạng khác.</span><br><b>画期的 (かっきてき)</b> = mang tính đột phá. 画 ở đây đọc là <b>かく</b>, đứng trước き nên biến thành âm ngắt <b>かっ</b>. Không đọc là が (như 画家 がか).","a":0}]},{"qs":[{"n":2,"q":"彼は手で<u>拍子</u>を取りながら、楽しそうに歌った。","o":["はくし","びょうし","ひょうし","はくす"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 3, lần này hỏi theo dạng khác.</span><br><b>拍子 (ひょうし)</b> = nhịp, phách. 拍子を取る = giữ nhịp. Bẫy là はく vì 拍手 đọc là はくしゅ, nhưng trong 拍子 thì 拍 đọc là <b>ひょう</b>.","a":2}]},{"qs":[{"n":3,"q":"景気がさらに悪化することが<u>懸念</u>されている。","o":["けんねん","かねん","けねん","けいねん"],"e":"<b>懸念 (けねん)</b> = lo ngại. 懸 thường đọc là けん (懸命 けんめい), nhưng trong 懸念 thì đọc là <b>け</b>. Đây là cách đọc đặc biệt hay ra thi.","a":2}]},{"qs":[{"n":4,"q":"大雪の影響で、荷物の配達が<u>滞って</u>いる。","o":["とどまって","こおって","さえぎって","とどこおって"],"e":"<b>滞る (とどこおる)</b> = bị đình trệ, chậm trễ. とどまる = 留まる (dừng lại, ở lại), こおる = 凍る (đóng băng), さえぎる = 遮る (chắn, ngăn).","a":3}]},{"qs":[{"n":5,"q":"この会社は資金が<u>潤沢</u>で、新しい事業にも積極的だ。","o":["じゅんたく","じゅんだく","うるたく","にんたく"],"e":"<b>潤沢 (じゅんたく)</b> = dồi dào (tiền vốn, tài nguyên). 潤 = じゅん, 沢 = たく (không biến âm thành だく).","a":0}]},{"qs":[{"n":6,"q":"長年の経験で<u>培って</u>きた技術を、若い世代に伝えたい。","o":["やしなって","はぐくんで","まかなって","つちかって"],"e":"<b>培う (つちかう)</b> = vun đắp, bồi dưỡng (kỹ năng, kinh nghiệm). やしなう = 養う (nuôi dưỡng), はぐくむ = 育む (ấp ủ, nuôi dưỡng), まかなう = 賄う (trang trải, đã học ở 模試 2).","a":3}]}]},{"id":"m2","title":"問題2 文脈規定","en":"Từ theo ngữ cảnh","instr":"（　　）に入れるのに最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":7,"q":"この調査結果は、若者の意識の変化を（　　）に表している。","o":["如実","着実","堅実","誠実"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>如実 (にょじつ)に表す</b> = thể hiện một cách rõ ràng, chân thực. 着実 = vững chắc từng bước (着実に進む), 堅実 = chắc chắn, an toàn, 誠実 = thành thật (tính cách).","a":0}]},{"qs":[{"n":8,"q":"医師が不足し、地方の医療は（　　）した状況にある。","o":["圧迫","束縛","緊縮","逼迫"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 3, lần này hỏi theo dạng khác.</span><br><b>逼迫 (ひっぱく)</b> = (tình hình) căng thẳng, thiếu thốn nghiêm trọng. 圧迫 = chèn ép, đè nén, 束縛 = trói buộc, 緊縮 = thắt chặt (ngân sách).","a":3}]},{"qs":[{"n":9,"q":"彼は成長のためなら何でも学ぼうとする、（　　）な姿勢の持ち主だ。","o":["無欲","臆病","貪欲","怠慢"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 2, lần này hỏi theo dạng khác.</span><br><b>貪欲 (どんよく)</b> = tham lam, ở đây mang nghĩa tốt: ham học hỏi. 無欲 = không ham muốn, 臆病 (おくびょう) = nhút nhát, 怠慢 (たいまん) = lười biếng, tắc trách.","a":2}]},{"qs":[{"n":10,"q":"「絶対に遅刻しないように」と、部長に（　　）を刺された。","o":["釘","針","棘","杭"],"e":"<b>釘を刺す (くぎをさす)</b> = nhắc nhở, cảnh cáo trước để người ta không làm sai. Thành ngữ cố định, chỉ dùng 釘 (cái đinh).","a":0}]},{"qs":[{"n":11,"q":"半年かかった工事も、ようやく来月完成する（　　）が立った。","o":["めど","めやす","けじめ","きざし"],"e":"<b>めどが立つ (目処が立つ)</b> = đã thấy được triển vọng hoàn thành. めやす (目安) = tiêu chuẩn tham khảo, けじめ = sự phân định rõ ràng (けじめをつける), きざし (兆し) = dấu hiệu (兆しが見える).","a":0}]},{"qs":[{"n":12,"q":"あの監督は選手に対する評価が（　　）で、小さなミスも見逃さない。","o":["ルーズ","シビア","ナイーブ","マイルド"],"e":"<b>シビア</b> = nghiêm khắc, khắt khe. ルーズ = lỏng lẻo, cẩu thả, ナイーブ = nhạy cảm, ngây thơ, マイルド = nhẹ nhàng, dịu.","a":1}]},{"qs":[{"n":13,"q":"台風の接近で、今日の午後の便は（　　）欠航となった。","o":["軒並み","人並み","月並み","足並み"],"e":"<b>軒並み (のきなみ)</b> = đồng loạt, tất cả đều. 人並み = như người bình thường, 月並み = tầm thường, 足並み = bước chân, sự đồng bộ (足並みをそろえる).","a":0}]}]},{"id":"m3","title":"問題3 言い換え類義","en":"Từ gần nghĩa","instr":"＿＿の言葉に意味が最も近いものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":14,"q":"平日の遊園地は<u>閑散としていた</u>。","o":["にぎやかだった","閉まっていた","古びていた","人が少なかった"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>閑散 (かんさん)としている</b> = vắng vẻ, thưa người. Gần nhất là 人が少なかった. にぎやかだった là trái nghĩa.","a":3}]},{"qs":[{"n":15,"q":"田中さんは<u>寡黙な</u>人だ。","o":["口数が少ない","友人が少ない","まじめな","気が短い"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 3, lần này hỏi theo dạng khác.</span><br><b>寡黙 (かもく)</b> = ít nói. Gần nhất là 口数が少ない (くちかず = số lời nói). 寡 nghĩa là ít, 黙 nghĩa là im lặng.","a":0}]},{"qs":[{"n":16,"q":"空が<u>にわかに</u>暗くなった。","o":["少しずつ","完全に","急に","再び"],"e":"<b>にわかに (俄かに)</b> = đột nhiên, bất chợt. Gần nhất là 急に. Từ liên quan: にわか雨 = mưa rào bất chợt.","a":2}]},{"qs":[{"n":17,"q":"彼女は料理の<u>手際がいい</u>。","o":["やり方が上手で速い","味つけがうまい","知識が多い","道具がそろっている"],"e":"<b>手際 (てぎわ)がいい</b> = làm việc khéo và nhanh gọn. Nói về cách làm, không phải về mùi vị (味つけ).","a":0}]},{"qs":[{"n":18,"q":"事故の状況を<u>つぶさに</u>報告した。","o":["詳しく","すぐに","簡単に","正直に"],"e":"<b>つぶさに</b> = một cách chi tiết, tỉ mỉ. Gần nhất là 詳しく, 細かく.","a":0}]},{"qs":[{"n":19,"q":"請求書の金額を見て<u>仰天した</u>。","o":["腹が立った","非常に驚いた","がっかりした","安心した"],"e":"<b>仰天 (ぎょうてん)する</b> = vô cùng kinh ngạc. Hay gặp: びっくり仰天.","a":1}]}]},{"id":"m4","title":"問題4 用法","en":"Cách dùng từ","instr":"次の言葉の使い方として最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":20,"q":"<b>捻出</b>","o":["工場から汚れた水が川に捻出している。","この地方は、おいしい米を捻出することで有名だ。","足首を捻出して、歩けなくなった。","忙しい中、なんとか時間を捻出して、資格の勉強を続けている。"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>捻出 (ねんしゅつ)</b> = xoay xở để có được (thời gian, tiền). Nước chảy ra là 流出, sản xuất gạo là 産出 hoặc 生産, trật mắt cá là 捻挫 (ねんざ).","a":3}]},{"qs":[{"n":21,"q":"<b>覆す</b>","o":["寒いので、子どもに毛布を覆してあげた。","彼は周囲の予想を覆して、見事に優勝した。","雪が町全体を白く覆している。","本のページを覆して、続きを読んだ。"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 3, lần này hỏi theo dạng khác.</span><br><b>覆す (くつがえす)</b> = lật ngược (dự đoán, quyết định, lẽ thường). Đắp chăn là かける, tuyết phủ là 覆う (おおう, cùng chữ kanji nhưng khác động từ), lật trang là めくる.","a":1}]},{"qs":[{"n":22,"q":"<b>ありきたり</b>","o":["彼はありきたりに遅刻するので、もう誰も驚かない。","この店は人気で、ありきたりに客が並んでいる。","ありきたりの言葉では、この感動は伝えられない。","祖母からもらった、世界に一つのありきたりの指輪だ。"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 2, lần này hỏi theo dạng khác.</span><br><b>ありきたり</b> = tầm thường, đâu cũng có. Dùng dạng ありきたりの + danh từ. Không dùng như trạng từ chỉ tần suất (いつも). Câu về chiếc nhẫn thì mâu thuẫn với 世界に一つ (duy nhất trên đời).","a":2}]},{"qs":[{"n":23,"q":"<b>裏腹</b>","o":["このコインは、裏腹が同じ模様になっている。","彼とは子どものころからの裏腹の友人だ。","強気な言葉とは裏腹に、彼の手は震えていた。","急いでいて、シャツを裏腹に着てしまった。"],"e":"<b>～とは裏腹に (うらはらに)</b> = trái ngược với ~. Hai mặt đồng xu là 表と裏 (裏表), mặc áo trái là 裏返し (うらがえし).","a":2}]},{"qs":[{"n":24,"q":"<b>怠る</b>","o":["休日は、家で一日中怠っていた。","準備を怠ったせいで、発表は失敗に終わった。","風邪のせいで、体が怠っている。","この時計は、毎日五分ずつ怠っている。"],"e":"<b>怠る (おこたる)</b> = lơ là, không làm việc cần làm. Luôn có tân ngữ: 準備を怠る, 注意を怠る. Lười biếng nằm nhà là 怠ける (なまける), người mệt mỏi là だるい, đồng hồ chậm là 遅れる.","a":1}]},{"qs":[{"n":25,"q":"<b>当てはまる</b>","o":["ボールが窓に当てはまって、ガラスが割れた。","予想が当てはまって、宝くじに当選した。","次の条件に当てはまる人は、受付に申し出てください。","彼は新しい仕事によく当てはまっている。"],"e":"<b>当てはまる</b> = phù hợp, đúng với (điều kiện, quy tắc, trường hợp). Bóng trúng cửa sổ là 当たる, dự đoán trúng là 当たる, hợp với công việc là 向いている.","a":2}]}]},{"id":"m5","title":"問題5 文法形式の判断","en":"Ngữ pháp","instr":"次の文の（　　）に入れるのに最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":26,"q":"東京公演（　　）、全国十都市でコンサートが行われる。","o":["を皮切りに","を限りに","をおして","をよそに"],"e":"<b>Nを皮切りに (かわきりに)</b> = bắt đầu từ N, sau đó liên tiếp diễn ra. を限りに = kể từ N là chấm dứt, をおして = bất chấp (bệnh, phản đối), をよそに = mặc kệ.","a":0}]},{"qs":[{"n":27,"q":"この祭りでは、この地方（　　）の料理が楽しめる。","o":["なりの","ごとき","まみれ","ならでは"],"e":"<b>Nならではの</b> = chỉ N mới có, đặc trưng của N. なりの = theo cách riêng của (私なりの考え), ごとき = như là, cỡ như (coi thường), まみれ = dính đầy.","a":3}]},{"qs":[{"n":28,"q":"夜中に大声で騒ぐなんて、迷惑（　　）。","o":["の至りだ","にあたらない","までもない","極まりない"],"e":"<b>Na + 極まりない (きわまりない)</b> = vô cùng, hết sức (thường là chê trách): 迷惑極まりない, 失礼極まりない. の至りだ dùng với 光栄, 感激 (光栄の至り). にあたらない = không đáng phải.","a":3}]},{"qs":[{"n":29,"q":"彼は会社に勤める（　　）、小説を書いている。","o":["がてら","そばから","かたわら","なり"],"e":"<b>Vる かたわら</b> = vừa làm công việc chính, vừa làm thêm việc khác (trong thời gian dài). がてら đi với danh từ hoặc Vます bỏ ます (散歩がてら). そばから = vừa làm xong đã lại, なり = vừa mới làm thì ngay lập tức.","a":2}]},{"qs":[{"n":30,"q":"彼は部屋に入る（　　）、大声で怒鳴り始めた。","o":["べく","なり","ものの","ゆえ"],"e":"<b>Vる なり</b> = vừa V xong thì ngay lập tức (hành động bất ngờ, cùng một chủ ngữ). べく = để (mục đích), ものの = tuy nhưng, ゆえ = vì.","a":1}]},{"qs":[{"n":31,"q":"彼は若さ（　　）、無謀な挑戦をしてしまうことがある。","o":["ながらに","なりに","ごとく","ゆえに"],"e":"<b>Nゆえに</b> = vì N (văn viết, trang trọng). 若さゆえに = vì còn trẻ. ながらに = trong trạng thái (涙ながらに), なりに = theo cách của, ごとく = giống như.","a":3}]},{"qs":[{"n":32,"q":"君の将来を思え（　　）、こんなに厳しいことを言うのだ。","o":["ども","ば最後","ばまだしも","ばこそ"],"e":"<b>Vば こそ</b> = chính vì V (nhấn mạnh lý do tích cực). 思えばこそ = chính vì nghĩ cho em. ども = dù có, たら最後 = một khi đã thì hết, ならまだしも = nếu là thì còn được.","a":3}]},{"qs":[{"n":33,"q":"誰も手伝ってくれないのなら、一人でやる（　　）。","o":["しまつだ","かぎりだ","までだ","までもない"],"e":"<b>Vる までだ</b> = thì chỉ còn cách V thôi (thể hiện quyết tâm). しまつだ = rốt cuộc đến nỗi (kết quả xấu), かぎりだ = vô cùng (うれしいかぎりだ), までもない = không cần phải.","a":2}]},{"qs":[{"n":34,"q":"本日（　　）、当店は閉店いたします。長い間ありがとうございました。","o":["をおいて","をめぐって","をもって","をかねて"],"e":"<b>Nをもって</b> = tính đến N là (kết thúc). Dùng trong thông báo trang trọng: 本日をもって閉店. をおいて = ngoài ra không, をめぐって = xoay quanh, をかねて = kiêm.","a":2}]},{"qs":[{"n":35,"q":"いくら親しい友人（　　）、礼儀は守るべきだ。","o":["とあって","ともなると","ときたら","といえども"],"e":"<b>Nといえども</b> = cho dù là N đi nữa. Thường đi với いくら, たとえ. とあって = vì là, ともなると = một khi đã là, ときたら = nói đến (chê).","a":3}]}]},{"id":"m6","title":"問題6 文の組み立て","en":"Sắp xếp câu","instr":"次の文の ★ に入る最もよいものを、1、2、3、4から一つ選びなさい。","fixed":true,"pages":[{"qs":[{"n":36,"q":"今年の冬の寒さは、＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ なりそうだ。","o":["厳しい","例年","ものに","にもまして"],"a":0,"e":"Thứ tự đúng: 例年 にもまして <b>厳しい</b> ものに (2 4 1 3). <b>Nにもまして</b> = hơn cả N. ★ là 厳しい."}]},{"qs":[{"n":37,"q":"この製品は、実際に ＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ わからない。","o":["良さは","使って","みない","ことには"],"a":3,"e":"Thứ tự đúng: 使って みない <b>ことには</b> 良さは (2 3 4 1). <b>Vない ことには～ない</b> = nếu không V thì không thể. ★ là ことには."}]},{"qs":[{"n":38,"q":"この大会には、＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 選手が参加する。","o":["二十か国の","とする","日本","をはじめ"],"a":1,"e":"Thứ tự đúng: 日本 をはじめ <b>とする</b> 二十か国の (3 4 2 1). <b>NをはじめとするN</b> = N, tiêu biểu là N. ★ là とする."}]},{"qs":[{"n":39,"q":"彼は ＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 、料理の味にはうるさい。","o":["長年","だけに","していた","シェフを"],"a":2,"e":"Thứ tự đúng: 長年 シェフを <b>していた</b> だけに (1 4 3 2). <b>～だけに</b> = chính vì ~ nên (đương nhiên). ★ là していた."}]},{"qs":[{"n":40,"q":"今から ＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 間に合わないだろう。","o":["とても","行った","タクシーで","ところで"],"a":3,"e":"Thứ tự đúng: タクシーで 行った <b>ところで</b> とても (3 2 4 1). <b>Vたところで～ない</b> = dù có V cũng không. とても～ない = hoàn toàn không thể. ★ là ところで."}]}]},{"id":"m7","title":"問題7 文章の文法","en":"Ngữ pháp trong đoạn văn","instr":"次の文章を読んで、文章全体の内容を考えて、41 から 45 の中に入る最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　三年前から、毎晩寝る前に日記をつけている。（41）、立派なことを書いているわけではない。その日に食べたものや、会った人、ふと感じたことを、数行書くだけだ。</p><p>　始めたころは、三日も続けば（42）と思っていた。子どものころから、何をやっても長続きしなかったからだ。ところが、不思議なことに今回は続いている。おそらく、うまく書こうと（43）のがよかったのだろう。</p><p>　先日、一年前の日記を読み返してみた。当時、仕事のことでひどく悩んでいたことが書かれていたが、今となっては、何をそんなに悩んでいたのか思い出せない（44）。そのとき、今抱えている悩みも、一年後にはきっと小さなものになっているだろうと思えた。</p><p>　日記は、過去の自分からの手紙のようなものだ。これからも、無理のない範囲で書き（45）。</p>","qs":[{"n":41,"q":"（41）","o":["そのうえ","といっても","したがって","それどころか"],"e":"Câu trước: tôi viết nhật ký mỗi tối. Câu sau: nhưng không phải viết điều gì to tát. Đây là ý đính chính, giảm nhẹ câu trước, nên dùng <b>といっても</b> (nói vậy chứ). そのうえ = hơn nữa, したがって = do đó.","a":1},{"n":42,"q":"（42）","o":["いいものだ","いいほうだ","いいはずだ","いいわけだ"],"e":"<b>三日も続けばいいほうだ</b> = kéo dài được ba ngày đã là khá rồi. ～ばいいほうだ là mẫu nói về kỳ vọng thấp. Câu sau giải thích: từ nhỏ làm gì cũng không bền.","a":1},{"n":43,"q":"（43）","o":["しなかった","したかった","しすぎた","するしかなかった"],"e":"Lý do duy trì được: vì <b>không cố viết cho hay</b> (うまく書こうとしなかった). Khớp với đoạn 1: chỉ viết vài dòng đơn giản.","a":0},{"n":44,"q":"（44）","o":["べきだ","ためだ","ものか","ほどだ"],"e":"<b>思い出せないほどだ</b> = đến mức không nhớ nổi. ～ほどだ diễn tả mức độ. べきだ = nên, ためだ = là vì, ものか = làm gì có chuyện.","a":3},{"n":45,"q":"（45）","o":["続けていきたい","続けてきた","続けるところだった","続けたものだ"],"e":"これからも = từ nay về sau, nên cần ý hướng tới tương lai: <b>書き続けていきたい</b>. てきた là từ trước đến nay, るところだった = suýt nữa, たものだ = ngày xưa thường.","a":0}]}]},{"id":"r8","title":"問題8 内容理解（短文）","en":"Đọc hiểu: đoạn ngắn","instr":"次の（1）から（4）の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>（1）</p><p>　完璧を目指すことは、一見よいことのように思える。しかし、完璧でなければ意味がないと考える人は、失敗を恐れるあまり、なかなか物事を始められない。始めたとしても、細かい部分にこだわりすぎて、期限に間に合わないこともある。まずは六割の出来でもよいから形にし、そこから直していくほうが、結果としてよいものができることが多い。</p>","qs":[{"n":46,"q":"筆者の考えに合うものはどれか。","o":["何事も、完璧にできるまで人に見せるべきではない。","期限を守るためには、質が低くてもしかたがない。","最初から完璧を求めず、まず形にしてから改善するのがよい。","失敗を恐れる人は、新しいことを始めないほうがよい。"],"e":"Câu cuối: <b>まずは六割の出来でもよいから形にし、そこから直していく</b>. Tác giả không nói chất lượng thấp cũng được, mà nói sửa dần thì kết quả sẽ TỐT hơn (結果としてよいものができる).","a":2}]},{"passage":"<p>（2）</p><p>以下は、ある市が住民に出したお知らせである。</p><div class='notice'><p style='text-align:center'><b>年末年始のごみ収集について</b></p><p>　年末年始は、ごみの収集日が下記のとおり変更になります。</p><p>燃えるごみ：年内は12月29日（火）が最終、年始は1月5日（火）から<br>資源ごみ：年内は12月24日（木）が最終、年始は1月7日（木）から</p><p>　なお、12月30日から1月3日までは、清掃センターへの持ち込みも受け付けておりません。年内に持ち込みを希望される方は、12月29日までに、電話で予約のうえお越しください。予約のない持ち込みはお断りしています。</p></div>","qs":[{"n":47,"q":"年内に清掃センターへごみを持ち込みたい人は、どうしなければならないか。","o":["12月30日までに、直接センターへ持っていく。","12月24日までに、電話で予約をする。","電話で予約をして、12月29日までに持っていく。","予約をせずに、12月29日に持っていく。"],"e":"Phần <b>なお</b>: <b>12月29日までに、電話で予約のうえお越しください</b>. ～のうえ = sau khi đã ~. Không đặt trước thì bị từ chối (予約のない持ち込みはお断り). 12月24日 là ngày thu rác tài nguyên, không liên quan đến việc mang rác đến.","a":2}]},{"passage":"<p>（3）</p><p>　天気予報で「降水確率50％」と聞くと、一日の半分の時間、雨が降ると思う人がいる。あるいは、地域の半分で雨が降ると考える人もいる。しかし、これはどちらも誤解だ。降水確率とは、同じような気象条件の日が100回あった場合、そのうち何回、1ミリ以上の雨が降るかを示したものである。雨の強さや降る時間の長さは、この数字からはわからない。</p>","qs":[{"n":48,"q":"降水確率について、本文の内容と合うものはどれか。","o":["50％なら、一日の半分の時間、雨が降る。","数字が高くても、強い雨が降るとは限らない。","50％なら、その地域の半分で雨が降る。","数字が高いほど、雨が長く降り続く。"],"e":"Câu cuối: <b>雨の強さや降る時間の長さは、この数字からはわからない</b>. Vậy xác suất cao không có nghĩa là mưa to hay mưa lâu. Hai cách hiểu về nửa ngày và nửa khu vực đều bị tác giả gọi là 誤解 (hiểu lầm).","a":1}]},{"passage":"<p>（4）</p><p>　幼い子どもは、「なぜ空は青いの」「なぜ夜は暗いの」と、大人を質問攻めにする。忙しいときには、つい「そういうものなの」と片付けてしまいがちだ。しかし、正確な答えを教えることよりも大切なのは、「どうしてだと思う？」と一緒に考える姿勢ではないだろうか。答えそのものより、不思議に思う気持ちを受け止めてもらった経験が、子どもの学ぶ意欲を育てるのだ。</p>","qs":[{"n":49,"q":"筆者が最も言いたいことは何か。","o":["子どもの質問には、常に正確に答えるべきだ。","子どもの疑問を受け止め、一緒に考えることが大切だ。","忙しいときは、質問に答えなくてもしかたがない。","子どもには、自分で答えを調べさせるべきだ。"],"e":"<b>正確な答えを教えることよりも大切なのは…一緒に考える姿勢</b>. Mẫu AよりもB = B quan trọng hơn A, nên đáp án nói phải luôn trả lời chính xác là sai.","a":1}]}]},{"id":"r9","title":"問題9 内容理解（中文）","en":"Đọc hiểu: đoạn vừa","instr":"次の（1）から（3）の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>（1）</p><p>　四十歳を過ぎたころ、健康診断の結果をきっかけに走り始めた。最初は五分走っただけで息が上がり、情けない思いをした。それでも、週に三回、近所の川沿いを走ることだけは続けた。</p><p>　三か月ほどたったころ、<u>①変化</u>に気づいた。体重はほとんど減っていなかったが、朝すっきりと目が覚めるようになり、仕事中にいらいらすることが減ったのだ。体を動かすことが、これほど気分に影響するとは思ってもみなかった。</p><p>　走っている間は、不思議と頭の中が静かになる。仕事の心配事や人間関係の悩みも、足を前に出すことに集中しているうちに、どこかへ消えていく。走り終えたころには、問題そのものは何も解決していないのに、<u>②なんとかなるだろうという気持ち</u>になっている。</p><p>　今では、タイムを縮めたいとも、大会に出たいとも思わない。ただ、走ることが、私にとって心を整えるための大切な時間になっている。</p>","qs":[{"n":50,"q":"筆者が走り始めたきっかけは何か。","o":["健康診断の結果を見たこと","友人に大会に誘われたこと","仕事でいらいらすることが増えたこと","朝すっきり起きられなくなったこと"],"e":"Câu đầu: <b>健康診断の結果をきっかけに走り始めた</b>. ～をきっかけに = nhân dịp, từ việc ~. Bớt cáu gắt và ngủ dậy sảng khoái là KẾT QUẢ sau khi chạy, không phải lý do bắt đầu.","a":0},{"n":51,"q":"<u>①変化</u>とはどのようなことか。","o":["体重はあまり変わらないが、目覚めや気分がよくなったこと","体重が大きく減ったこと","五分以上走れるようになったこと","仕事の量が減ったこと"],"e":"<b>体重はほとんど減っていなかったが、朝すっきりと目が覚める…いらいらすることが減った</b>. Cân nặng gần như không giảm, nên đáp án giảm cân nhiều là sai.","a":0},{"n":52,"q":"<u>②なんとかなるだろうという気持ち</u>とはどのような気持ちか。","o":["問題がすべて解決したという安心した気持ち","問題は残っていても、前向きに考えられる気持ち","もっと速く走りたいという気持ち","悩みを誰かに相談したいという気持ち"],"e":"Ngay trước đó: <b>問題そのものは何も解決していないのに</b> = dù vấn đề chưa được giải quyết. なんとかなる = rồi sẽ ổn thôi. Vậy là tâm trạng tích cực dù vấn đề vẫn còn.","a":1}]},{"passage":"<p>（2）</p><p>　まだ食べられるのに捨てられてしまう食品、いわゆる「食品ロス」が問題になっている。その原因の一つに、食品の期限表示に対する誤解がある。</p><p>　食品の期限には、「消費期限」と「賞味期限」の二種類がある。消費期限は、弁当や生肉など傷みやすい食品に表示され、その日を過ぎたら食べないほうがよいという期限だ。一方、賞味期限は、スナック菓子や缶詰など比較的長持ちする食品に表示され、おいしく食べられる期限を示している。つまり、<u>①賞味期限を過ぎても、すぐに食べられなくなるわけではない</u>。</p><p>　ところが、この二つを区別せず、賞味期限が一日でも過ぎた食品を捨ててしまう人は少なくない。また、店で買うときに、少しでも期限の長い商品を棚の奥から取る人も多い。その結果、手前の商品が売れ残り、捨てられることになる。</p><p>　最近では、すぐに食べる場合は手前の商品から取るよう呼びかける店も増えてきた。<u>②一人一人の小さな行動</u>が、食品ロスを減らすことにつながるのである。</p>","qs":[{"n":53,"q":"「消費期限」の説明として正しいものはどれか。","o":["長持ちする食品に表示され、おいしく食べられる期限","すべての食品に表示しなければならない期限","店が商品を棚に並べておける期限","傷みやすい食品に表示され、過ぎたら食べないほうがよい期限"],"e":"<b>消費期限は…傷みやすい食品に表示され、その日を過ぎたら食べないほうがよい</b>. Đáp án về thực phẩm để được lâu là mô tả của 賞味期限. Hai từ này rất dễ nhầm, và đề thi hay đổi chỗ chúng.","a":3},{"n":54,"q":"<u>①賞味期限を過ぎても、すぐに食べられなくなるわけではない</u>のはなぜか。","o":["賞味期限は、実際より短く表示されているから","賞味期限は、傷みやすい食品に表示されるものだから","賞味期限は、店が自由に決めているものだから","賞味期限は、おいしく食べられる期限を示すものだから"],"e":"つまり = tóm lại, nên lý do nằm ở câu trước: 賞味期限 là <b>おいしく食べられる期限</b> (hạn ăn ngon), không phải hạn an toàn. Chỉ chọn điều CÓ trong bài, kể cả khi đáp án khác nghe có vẻ hợp lý ngoài đời.","a":3},{"n":55,"q":"<u>②一人一人の小さな行動</u>の例として、本文に合うものはどれか。","o":["すぐに食べるものは、手前に並んだ商品から買うこと","期限の長い商品を、棚の奥から選ぶこと","賞味期限を過ぎた食品を、すぐに捨てること","傷みやすい食品を買わないようにすること"],"e":"Câu ngay trước: <b>すぐに食べる場合は手前の商品から取る</b>. Lấy hàng ở phía trong kệ và vứt đồ quá 賞味期限 chính là hai NGUYÊN NHÂN gây lãng phí được nêu ở đoạn 3.","a":0}]},{"passage":"<p>（3）</p><p>　年を取ると物忘れが増え、落ち込む人は多い。人の名前が出てこない、昨日の夕食が思い出せない。記憶力の低下は、誰にとってもうれしいことではないだろう。</p><p>　しかし、<u>①忘れることは、必ずしも悪いことではない</u>。もし、見たもの聞いたものをすべて覚えていたら、どうなるだろうか。頭の中は不要な情報であふれ、本当に必要なことを取り出すのに時間がかかってしまうに違いない。脳は、重要でない情報を捨てることで、大切な情報を使いやすくしているのである。</p><p>　また、つらい経験をいつまでも鮮明に覚えていたら、人は前に進むことができない。時間がたつにつれて記憶が薄れていくからこそ、私たちは悲しみから立ち直ることができる。</p><p>　覚えることと忘れることは、対立するものではない。<u>②両方がうまく働いて</u>はじめて、記憶は役に立つものになるのだ。</p>","qs":[{"n":56,"q":"<u>①忘れることは、必ずしも悪いことではない</u>と筆者が考える理由として、合っているものはどれか。","o":["年を取れば、誰でも物忘れが増えるから","忘れたことは、後で必ず思い出せるから","覚えることより、忘れることのほうが難しいから","不要な情報を捨てることで、必要な情報が使いやすくなるから"],"e":"<b>重要でない情報を捨てることで、大切な情報を使いやすくしている</b>. 必ずしも～ない = không hẳn là. Ai già cũng hay quên là sự thật trong bài, nhưng không phải LÝ DO cho ý kiến này.","a":3},{"n":57,"q":"つらい経験の記憶について、筆者はどう述べているか。","o":["記憶が薄れることで、人は立ち直ることができる。","いつまでも鮮明に覚えておくべきだ。","時間がたっても、決して薄れることはない。","忘れようとするほど、鮮明になる。"],"e":"Đoạn 3: <b>記憶が薄れていくからこそ…悲しみから立ち直ることができる</b>. ～からこそ = chính vì ~. 立ち直る = vực dậy, hồi phục.","a":0},{"n":58,"q":"<u>②両方がうまく働いて</u>とはどういうことか。","o":["若い人と年を取った人の両方が、記憶力を鍛えること","重要な情報と重要でない情報の両方を覚えること","覚える働きと忘れる働きの両方が、うまく機能すること","うれしい経験とつらい経験の両方を忘れること"],"e":"両方 chỉ hai thứ ở câu ngay trước: <b>覚えることと忘れること</b>. Vてはじめて = chỉ khi V thì mới.","a":2}]}]},{"id":"r10","title":"問題10 内容理解（長文）","en":"Đọc hiểu: đoạn dài","instr":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　スーパーの棚には何十種類ものジャムが並び、動画配信サービスでは数え切れないほどの映画が見られる。現代は、かつてないほど選択肢の多い時代である。選べるものが多いほど、自分にぴったりのものが見つかり、満足も大きくなるはずだ。多くの人はそう考えるだろう。</p><p>　ところが、ある有名な実験は、<u>①それとは異なる結果</u>を示している。店頭に二十四種類のジャムを並べた場合と、六種類だけを並べた場合とで、客の行動を比べたのだ。足を止める客は二十四種類のときのほうが多かったが、実際に買った客の割合は、六種類のときのほうがはるかに高かった。選択肢が多すぎると、人は選ぶこと自体をやめてしまうのである。</p><p>　なぜ、このようなことが起こるのか。一つには、比べるものが増えるほど、選ぶための労力が大きくなるからだ。さらに、どれか一つを選んだ後も、「ほかのもののほうがよかったのではないか」という思いが残りやすい。選ばなかったものが多いほど、<u>②その後悔も大きくなる</u>。</p><p>　私自身、休日に映画を見ようとして、何を見るか決められないまま一時間が過ぎてしまったことがある。結局、疲れて何も見ずに寝てしまった。選ぶ自由があることと、満足できることは、どうやら別の問題らしい。</p><p>　では、どうすればよいのか。私は、最高のものを探そうとするのをやめることだと思う。「これで十分だ」と思える基準をあらかじめ決めておき、それを満たすものに出会ったら、そこで選ぶのをやめる。すべてを比べ尽くすことはできないのだから、自分なりの基準で決めたことに納得する。それが、選択肢のあふれる時代を気楽に生きるこつではないだろうか。</p>","qs":[{"n":59,"q":"<u>①それとは異なる結果</u>とはどのような結果か。","o":["選択肢が多いほうが、足を止める客が少なかったこと","選択肢が多いほうが、実際に買う客の割合が低かったこと","選択肢が少ないと、客が満足しなかったこと","選択肢の数は、客の行動に影響しなかったこと"],"e":"それ = suy nghĩ ở đoạn 1 (càng nhiều lựa chọn càng hài lòng). Kết quả thí nghiệm: <b>実際に買った客の割合は、六種類のときのほうがはるかに高かった</b>. Chú ý: số khách DỪNG LẠI xem thì 24 loại nhiều hơn, nên đáp án nói ít khách dừng lại là sai.","a":1},{"n":60,"q":"<u>②その後悔も大きくなる</u>のはなぜか。","o":["選ばなかったもののほうがよかったかもしれないと思うから","選ぶのに時間がかかりすぎたと感じるから","選んだものの値段が高かったと感じるから","他人に選んでもらえばよかったと思うから"],"e":"その後悔 chỉ câu trước: <b>「ほかのもののほうがよかったのではないか」という思い</b>. Càng nhiều thứ không được chọn thì càng dễ tiếc.","a":0},{"n":61,"q":"筆者自身の映画の経験は、何を示す例として挙げられているか。","o":["映画は、選択肢が少ないほうが面白い。","休日には、何もしないほうが疲れない。","選択肢が多いと、かえって選べなくなることがある。","選ぶ自由があれば、必ず満足できる。"],"e":"Tác giả mất một tiếng không chọn được phim rồi đi ngủ. Đây là ví dụ cá nhân cho ý ở đoạn 2: <b>選択肢が多すぎると、人は選ぶこと自体をやめてしまう</b>. Câu kết đoạn: tự do lựa chọn và sự hài lòng là hai chuyện khác nhau.","a":2},{"n":62,"q":"この文章で筆者が最も言いたいことは何か。","o":["選択肢の多い店では、買い物をしないほうがよい。","時間をかけてすべてを比べれば、後悔しない。","最高のものを求めず、自分の基準を満たすもので納得するのがよい。","選択肢は、少なければ少ないほどよい。"],"e":"Đoạn cuối: <b>最高のものを探そうとするのをやめる…自分なりの基準で決めたことに納得する</b>. Tác giả nói không thể so sánh hết mọi thứ (すべてを比べ尽くすことはできない), nên đáp án so sánh tất cả là sai.","a":2}]}]},{"id":"r11","title":"問題11 統合理解","en":"Đọc so sánh A và B","instr":"次のAとBの文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p><b>A</b></p><p>　小学生にスマートフォンを持たせることには、慎重であるべきだ。子どもは自分で使用時間を管理することが難しく、気づけば何時間も画面を見続けてしまう。睡眠不足や視力の低下も心配だ。また、インターネット上には子どもにふさわしくない情報も多く、知らない人とのやり取りから事件に巻き込まれる危険もある。連絡手段が必要なら、通話と位置確認だけができる子ども用の携帯電話で十分だろう。スマートフォンは、自分で判断できる年齢になってからでも遅くない。</p><p><b>B</b></p><p>　小学生にスマートフォンを持たせることを心配する声は多い。確かに、使いすぎやインターネット上の危険には注意が必要だ。しかし、今の子どもたちは、将来、情報機器を使いこなすことが求められる社会で生きていく。危険だからと遠ざけるだけでは、正しい使い方を学ぶ機会も失われてしまう。大切なのは、使う時間や場所について親子で話し合い、ルールを決めることだ。親の目が届く小学生のうちにこそ、失敗しながら使い方を身につけさせるべきではないか。</p>","qs":[{"n":63,"q":"AとBのどちらの文章でも触れられていることは何か。","o":["子ども用の携帯電話で十分であること","子どもがスマートフォンを使いすぎるおそれがあること","親子でルールを決めることが大切であること","将来、情報機器を使う力が必要になること"],"e":"A: <b>気づけば何時間も画面を見続けてしまう</b>. B: <b>使いすぎ…には注意が必要だ</b>. Cả hai đều nhắc việc dùng quá nhiều. Điện thoại trẻ em chỉ có ở A. Đặt quy tắc và kỹ năng tương lai chỉ có ở B.","a":1},{"n":64,"q":"小学生にスマートフォンを持たせることについて、AとBはどのように述べているか。","o":["AもBも、小学生には持たせるべきではないと述べている。","Aはルールを決めれば持たせてもよいと述べ、Bは危険なので持たせるべきではないと述べている。","AもBも、子どもに自由に使わせるべきだと述べている。","Aは持たせるのはまだ早いと述べ、Bはルールを決めたうえで持たせるべきだと述べている。"],"e":"Câu cuối của A: <b>自分で判断できる年齢になってからでも遅くない</b> (đợi lớn hơn cũng chưa muộn). Câu cuối của B: <b>小学生のうちにこそ…身につけさせるべき</b>. Có một đáp án đảo ngược A và B, cần đọc kỹ.","a":3}]}]},{"id":"r12","title":"問題12 主張理解（長文）","en":"Đọc hiểu: quan điểm tác giả","instr":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　人はなぜ、他人と自分を比べてしまうのだろうか。同僚の昇進を聞いて落ち込み、友人の楽しそうな旅行の写真を見てうらやましくなる。比べても仕方がないとわかっていながら、やめられない。そういう経験は誰にでもあるだろう。</p><p>　<u>①比べること自体</u>は、人間にとって自然な行為である。自分の能力や立場を知るには、周りの人を基準にするしかないからだ。自分より優れた人を見て、「あの人のようになりたい」と努力することもある。その意味で、比較は成長のきっかけにもなりうる。</p><p>　問題は、比べる相手と、比べ方にある。SNSが普及した現在、私たちは一日に何十人、何百人もの他人の生活を目にする。しかも、そこに並ぶのは、それぞれの人生の中で最も輝いている瞬間ばかりだ。<u>②そうしたもの</u>と、自分のごく普通の日常を比べれば、自分が劣っているように感じるのは当然だろう。他人の「一番よい場面」と自分の「いつもの場面」を比べるのは、そもそも公平な比較ではない。</p><p>　では、どうすればよいか。私が勧めたいのは、比べる相手を他人から過去の自分に変えることだ。一年前の自分にはできなかったことが、今はできるようになっている。去年は知らなかったことを、今は知っている。そうした小さな変化に目を向けると、他人がどうであれ、自分が確かに前に進んでいることがわかる。</p><p>　他人との比較には終わりがない。どれだけ上に行っても、さらに上の人がいるからだ。しかし、過去の自分との比較は、努力した分だけ必ず結果が見える。自分の歩みを測る物差しは、自分の中に持っておきたいものだ。</p>","qs":[{"n":65,"q":"<u>①比べること自体</u>について、筆者はどう考えているか。","o":["人間にとって不自然で、やめるべきことだ。","自然なことで、成長のきっかけになることもある。","能力の高い人だけがすることだ。","努力しない人がすることだ。"],"e":"Đoạn 2: <b>人間にとって自然な行為…比較は成長のきっかけにもなりうる</b>. ～うる = có thể. Tác giả không phủ nhận việc so sánh, vấn đề nằm ở đối tượng và cách so sánh (đoạn 3).","a":1},{"n":66,"q":"<u>②そうしたもの</u>とは何か。","o":["自分のごく普通の毎日の生活","自分より劣っている人の生活","同僚の昇進や仕事の成果","他人がSNSで見せている、人生の特によい場面"],"e":"そうした chỉ câu ngay trước: <b>それぞれの人生の中で最も輝いている瞬間</b> trên SNS. 自分のごく普通の日常 là thứ ĐƯỢC đem ra so với nó, nên không phải đáp án.","a":3},{"n":67,"q":"筆者が勧めている方法はどれか。","o":["SNSを見るのをやめること","過去の自分と今の自分を比べること","自分より優れた人と比べないこと","他人のよい点を見つけること"],"e":"Đoạn 4: <b>比べる相手を他人から過去の自分に変えること</b>. Tác giả không hề nói nên bỏ SNS.","a":1},{"n":68,"q":"筆者の考えに最も近いものはどれか。","o":["他人と比べることは、どんな場合も避けるべきだ。","自分の成長は、他人ではなく過去の自分を基準にして測るのがよい。","上を目指して、他人との比較を続けるべきだ。","SNSは人を不幸にするので、使うべきではない。"],"e":"Câu cuối: <b>自分の歩みを測る物差しは、自分の中に持っておきたい</b>. 物差し = cái thước, ở đây là tiêu chuẩn đánh giá. Đáp án có どんな場合も (trong mọi trường hợp) quá tuyệt đối, vì đoạn 2 nói so sánh cũng có mặt tốt.","a":1}]}]},{"id":"r13","title":"問題13 情報検索","en":"Tìm thông tin","instr":"次は、あるスポーツクラブの会員プランの案内である。下の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<div class='notice'><p style='text-align:center'><b>スポーツクラブ「アクティブ」　会員プランのご案内</b></p><p>【営業時間】平日 9:00～23:00 ／ 土曜、日曜、祝日 9:00～20:00</p><table class='tbl'><tr><th>プラン</th><th>利用できる時間</th><th>月会費</th><th>備考</th></tr><tr><td>レギュラー</td><td>全営業時間</td><td>9,800円</td><td></td></tr><tr><td>デイタイム</td><td>平日 9:00～17:00</td><td>6,500円</td><td>土日祝は利用不可</td></tr><tr><td>ナイト</td><td>営業日の 19:00～閉館</td><td>7,000円</td><td></td></tr><tr><td>ウィークエンド</td><td>土日祝の全営業時間</td><td>5,500円</td><td></td></tr><tr><td>学生</td><td>全営業時間</td><td>6,000円</td><td>入会時に学生証が必要</td></tr></table><p>※入会金は5,000円です（学生プランは無料）。<br>※プールを利用する場合は、どのプランも月1,000円が別に必要です。<br>※毎週水曜日は休館日です。<br>※11月中に入会された方は、最初の月の月会費が半額になります。</p></div>","qs":[{"n":69,"q":"会社員の山田さんは、平日は仕事が18時に終わるので、その後に週2回ほど通いたいと考えている。土日は利用しないが、プールは利用したい。2か月目以降、毎月の支払いが最も安くなるプランと金額はどれか。","o":["ナイトで7,000円","デイタイムで7,500円","ナイトで8,000円","レギュラーで10,800円"],"e":"Sau 18h ngày thường: デイタイム (đến 17h) không dùng được. Còn ナイト (từ 19h) và レギュラー. ナイト rẻ hơn: 7,000円. Dùng hồ bơi: <b>+1,000円</b>. Tổng <b>8,000円</b>. 7,000円 là bẫy cho người quên phí hồ bơi trong phần ※.","a":2},{"n":70,"q":"大学生のリーさんは、11月に学生プランで入会する。プールは利用しない。入会した月にリーさんが支払う金額はいくらか。","o":["6,000円","3,000円","8,000円","11,000円"],"e":"Gói sinh viên: phí hàng tháng 6,000円, <b>phí gia nhập miễn phí</b> (学生プランは無料). Gia nhập trong tháng 11: tháng đầu <b>giảm một nửa</b>. Vậy 6,000 ÷ 2 = <b>3,000円</b>. 8,000円 là bẫy cho người cộng thêm 5,000円 phí gia nhập.","a":1}]}]}];
const SET5 = [{"id":"m1","title":"問題1 漢字読み","en":"Đọc kanji","instr":"＿＿の言葉の読み方として最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":1,"q":"原材料費の高騰で、食料品が<u>軒並み</u>値上がりしている。","o":["けんなみ","のきならび","けんべい","のきなみ"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 4, lần này hỏi theo dạng khác.</span><br><b>軒並み (のきなみ)</b> = đồng loạt. 軒 đọc theo âm Nhật là <b>のき</b> (mái hiên), 並み = なみ. Không đọc theo âm Hán けん (như 一軒 いっけん).","a":3}]},{"qs":[{"n":2,"q":"このレストランは、季節ごとに趣向を<u>凝らした</u>料理を出している。","o":["さらした","ぬらした","そらした","こらした"],"e":"<b>凝らす (こらす)</b> = dồn tâm sức, làm công phu. 趣向を凝らす, 工夫を凝らす là cụm cố định. さらす = 晒す (phơi), ぬらす = 濡らす (làm ướt), そらす = 逸らす (đánh lạc hướng).","a":3}]},{"qs":[{"n":3,"q":"男女の賃金格差を<u>是正</u>するための法律が作られた。","o":["ぜせい","しせい","ぜしょう","ていせい"],"e":"<b>是正 (ぜせい)</b> = điều chỉnh cho đúng, khắc phục (bất bình đẳng, sai lệch). 是 = <b>ぜ</b> (như 是非 ぜひ), 正 = <b>せい</b>. ていせい là 訂正 (đính chính chữ viết, lời nói).","a":0}]},{"qs":[{"n":4,"q":"今月の利益は、先月の損失と<u>相殺</u>されてしまった。","o":["そうさつ","あいさつ","そうさい","しょうさい"],"e":"<b>相殺 (そうさい)</b> = bù trừ lẫn nhau. Chữ 殺 thường đọc là さつ (殺人), nhưng trong từ này đọc là <b>さい</b>. Đây là cách đọc đặc biệt rất hay ra thi.","a":2}]},{"qs":[{"n":5,"q":"この国は、ここ十年で急速な発展を<u>遂げた</u>。","o":["つげた","とげた","しとげた","あげた"],"e":"<b>遂げる (とげる)</b> = đạt được, hoàn thành. 発展を遂げる, 進歩を遂げる, 目的を遂げる. つげる = 告げる (thông báo), あげる = 上げる.","a":1}]},{"qs":[{"n":6,"q":"この地域は災害に対して<u>脆弱</u>で、早急な対策が必要だ。","o":["ぜいじゃく","きじゃく","ぜいにゃく","もろじゃく"],"e":"<b>脆弱 (ぜいじゃく)</b> = yếu ớt, dễ tổn thương. 脆 đọc âm Hán là <b>ぜい</b> (âm Nhật là もろい), 弱 = <b>じゃく</b>.","a":0}]}]},{"id":"m2","title":"問題2 文脈規定","en":"Từ theo ngữ cảnh","instr":"（　　）に入れるのに最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":7,"q":"容疑者の話は（　　）が合わず、警察はさらに詳しく調べることにした。","o":["見当","拍車","相場","辻褄"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>辻褄が合わない (つじつまがあわない)</b> = không khớp, không nhất quán. 見当 dùng với 見当がつく (đoán được), 拍車 dùng với 拍車をかける (thúc đẩy), 相場 = giá thị trường.","a":3}]},{"qs":[{"n":8,"q":"事故現場には、（　　）数のガラスの破片が散らばっていた。","o":["おびただしい","はなはだしい","あわただしい","そそっかしい"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>おびただしい数</b> = số lượng cực kỳ nhiều. はなはだしい = quá mức (誤解もはなはだしい), không đi với 数. あわただしい = vội vã, bận rộn, そそっかしい = hấp tấp.","a":0}]},{"qs":[{"n":9,"q":"市長は、改革に向けた機運を（　　）するため、各地で説明会を開いた。","o":["醸成","養成","熟成","結成"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 2, lần này hỏi theo dạng khác.</span><br><b>醸成 (じょうせい)する</b> = tạo dựng dần (bầu không khí, xu thế: 機運, 雰囲気). 養成 = đào tạo (người), 熟成 = ủ chín (rượu, thịt), 結成 = thành lập (nhóm, đảng).","a":0}]},{"qs":[{"n":10,"q":"大型の台風が近づいており、農作物への被害が（　　）されている。","o":["執念","懸念","断念","観念"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 4, lần này hỏi theo dạng khác.</span><br><b>懸念 (けねん)される</b> = bị lo ngại. 執念 (しゅうねん) = sự cố chấp, quyết tâm dai dẳng, 断念 = từ bỏ, 観念 = quan niệm, hoặc cam chịu.","a":1}]},{"qs":[{"n":11,"q":"政府は対策を打ち出したが、物価の上昇に（　　）がかからない。","o":["歯止め","足止め","口止め","差し止め"],"e":"<b>歯止めがかからない (はどめ)</b> = không kìm hãm được. 足止め = bị giữ chân, kẹt lại, 口止め = bịt miệng, cấm nói, 差し止め = đình chỉ (xuất bản, thi công).","a":0}]},{"qs":[{"n":12,"q":"この二つの言葉は意味が似ているが、（　　）が微妙に異なる。","o":["スケール","レイアウト","ニュアンス","ノルマ"],"e":"<b>ニュアンス</b> = sắc thái ý nghĩa. スケール = quy mô, レイアウト = bố cục, ノルマ = chỉ tiêu.","a":2}]},{"qs":[{"n":13,"q":"あれほど強く反対していた父が、（　　）認めてくれたので驚いた。","o":["がっしり","あっさり","びっしり","ずっしり"],"e":"<b>あっさり</b> = một cách dễ dàng, nhanh gọn (không như dự đoán). がっしり = vạm vỡ, chắc chắn, びっしり = dày đặc, kín mít, ずっしり = nặng trĩu.","a":1}]}]},{"id":"m3","title":"問題3 言い換え類義","en":"Từ gần nghĩa","instr":"＿＿の言葉に意味が最も近いものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":14,"q":"<u>拙い</u>文章ですが、最後まで読んでいただければ幸いです。","o":["短い","古い","下手な","難しい"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 2, lần này hỏi theo dạng khác.</span><br><b>拙い (つたない)</b> = vụng về, kém. Gần nhất là 下手な. Thường dùng để nói khiêm tốn về bản thân.","a":2}]},{"qs":[{"n":15,"q":"住民たちは、市の対応に強い<u>憤り</u>を覚えた。","o":["不安","悲しみ","疑い","怒り"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 3, lần này hỏi theo dạng khác.</span><br><b>憤り (いきどおり)</b> = sự phẫn nộ. Gần nhất là 怒り. 憤りを覚える, 憤りを感じる là cách nói trang trọng.","a":3}]},{"qs":[{"n":16,"q":"雨の日は、外出するのが<u>おっくうだ</u>。","o":["面倒だ","危険だ","楽しみだ","不可能だ"],"e":"<b>おっくう (億劫)</b> = ngại, lười làm vì thấy phiền. Gần nhất là 面倒だ.","a":0}]},{"qs":[{"n":17,"q":"このかばんは軽くて丈夫なので、<u>重宝している</u>。","o":["大切にしまってある","高く評価されている","便利で役に立っている","少し重く感じている"],"e":"<b>重宝 (ちょうほう)する</b> = thấy tiện lợi và dùng thường xuyên. Bẫy: chữ 重 và 宝 khiến dễ nghĩ đến nặng hoặc cất giữ như báu vật, nhưng nghĩa thật là tiện dụng.","a":2}]},{"qs":[{"n":18,"q":"友人の活躍に<u>触発されて</u>、私も資格の勉強を始めた。","o":["誘われて","驚かされて","刺激を受けて","頼まれて"],"e":"<b>触発 (しょくはつ)される</b> = được khơi gợi, lấy cảm hứng từ. Gần nhất là 刺激を受けて. Không phải được rủ (誘われて).","a":2}]},{"qs":[{"n":19,"q":"駅まで走って、<u>かろうじて</u>終電に間に合った。","o":["余裕で","偶然","予定どおり","なんとか"],"e":"<b>かろうじて (辛うじて)</b> = vừa đủ, suýt soát mới được. Gần nhất là なんとか, やっと. 余裕で là trái nghĩa.","a":3}]}]},{"id":"m4","title":"問題4 用法","en":"Cách dùng từ","instr":"次の言葉の使い方として最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":20,"q":"<b>潔い</b>","o":["掃除をしたばかりなので、部屋がとても潔い。","山の上の空気は潔くて、気持ちがいい。","負けが決まると、彼は潔く相手の勝利をたたえた。","彼は潔い服装で、面接に出かけた。"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>潔い (いさぎよい)</b> = dứt khoát, đàng hoàng chấp nhận (thua, lỗi, từ chức). Không dùng cho sạch sẽ: phòng sạch là きれい, không khí trong lành là すがすがしい, quần áo sạch sẽ là 清潔な.","a":2}]},{"qs":[{"n":21,"q":"<b>うろたえる</b>","o":["初めての町で道にうろたえて、約束の時間に遅れた。","面接で予想外の質問をされ、うろたえて何も答えられなかった。","強い風で、木の枝が大きくうろたえている。","休日は、近所の公園をうろたえるのが好きだ。"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>うろたえる</b> = luống cuống, mất bình tĩnh. Lạc đường là 道に迷う, cành cây lay động là 揺れる, đi dạo loanh quanh là ぶらぶらする (hoặc うろうろする, phát âm gần giống nên dễ nhầm).","a":1}]},{"qs":[{"n":22,"q":"<b>おおむね</b>","o":["今回の実験は、おおむね予想どおりの結果になった。","おおむね、明日は雨が降るかもしれない。","彼はおおむね一人で、その仕事を全部やり遂げた。","駅まで走って、おおむね電車に間に合った。"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 2, lần này hỏi theo dạng khác.</span><br><b>おおむね (概ね)</b> = nhìn chung, phần lớn. Dùng để đánh giá tổng thể: おおむね順調, おおむね予想どおり. Phỏng đoán là おそらく, chỉ một mình là たった一人で, vừa kịp là なんとか.","a":0}]},{"qs":[{"n":23,"q":"<b>無造作</b>","o":["この機械は無造作なので、誰でも簡単に使える。","彼は無造作な人で、絵や工作が苦手だ。","材料が無造作になったので、買いに行った。","彼は大切な書類を、机の上に無造作に置いていた。"],"e":"<b>無造作 (むぞうさ)</b> = một cách tùy tiện, không cẩn thận, không để ý. Máy dễ dùng là 操作が簡単, vụng về là 不器用 (ぶきよう), hết nguyên liệu là なくなる.","a":3}]},{"qs":[{"n":24,"q":"<b>食い違う</b>","o":["二人の証言が食い違っていて、どちらが正しいのかわからない。","犬に手を食い違われて、けがをした。","道を食い違って、目的地に着けなかった。","昼ご飯を食い違って、おなかがすいた。"],"e":"<b>食い違う (くいちがう)</b> = (ý kiến, lời khai, con số) không khớp nhau. Bị chó cắn là かまれる, nhầm đường là 間違える, lỡ bữa trưa là 食べ損ねる.","a":0}]},{"qs":[{"n":25,"q":"<b>円滑</b>","o":["会議が円滑に進むよう、事前に資料を配っておいた。","このテーブルは角が円滑で、子どもにも安全だ。","彼は円滑な性格で、めったに怒らない。","雨で道が円滑になっているので、気をつけてください。"],"e":"<b>円滑 (えんかつ)</b> = trôi chảy, suôn sẻ (công việc, giao tiếp, cuộc họp). Góc bàn tròn là 丸い, tính cách ôn hòa là 穏やか hoặc 温厚, đường trơn là 滑りやすい.","a":0}]}]},{"id":"m5","title":"問題5 文法形式の判断","en":"Ngữ pháp","instr":"次の文の（　　）に入れるのに最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":26,"q":"狭い（　　）、ようやく自分の家を持つことができた。","o":["ばかりか","ながらも","ものなら","とあって"],"e":"<b>～ながらも</b> = tuy ~ nhưng. 狭いながらも = tuy chật nhưng. ばかりか = không chỉ mà còn, ものなら = nếu có thể, とあって = vì là.","a":1}]},{"qs":[{"n":27,"q":"彼は高熱（　　）、大事な会議に出席した。","o":["をおして","をこめて","をかねて","をへて"],"e":"<b>Nをおして</b> = bất chấp N (bệnh tật, phản đối) mà vẫn làm. をこめて = gửi gắm (心をこめて), をかねて = kiêm, をへて = trải qua.","a":0}]},{"qs":[{"n":28,"q":"よく勉強する兄（　　）、弟は遊んでばかりいる。","o":["にもまして","にそくして","にかけては","にひきかえ"],"e":"<b>Nにひきかえ</b> = trái ngược hẳn với N (so sánh hai thứ đối lập). にもまして = hơn cả, にそくして = dựa theo, にかけては = về mặt (giỏi nhất).","a":3}]},{"qs":[{"n":29,"q":"ラジオを聞く（　　）聞いていたら、懐かしい曲が流れてきた。","o":["までもなく","ことなく","どころか","ともなく"],"e":"<b>Vる ともなく V</b> = làm một cách vô thức, không chủ ý. 聞くともなく聞く, 見るともなく見る. までもなく = không cần phải, ことなく = mà không.","a":3}]},{"qs":[{"n":30,"q":"忙しくて、せっかく買った本を結局読ま（　　）。","o":["ずにはいられなかった","ずじまいだった","ざるを得なかった","ないではおかなかった"],"e":"<b>Vず じまい</b> = rốt cuộc đã không V được (tiếc nuối). ずにはいられない = không thể không, ざるを得ない = buộc phải, ないではおかない = nhất định sẽ.","a":1}]},{"qs":[{"n":31,"q":"私（　　）が、このような賞をいただけるとは思いませんでした。","o":["ごとき","めいた","ぶり","がらみ"],"e":"<b>Nごとき</b> = cỡ như N. Dùng với 私 thì là khiêm tốn (私ごときが), dùng với người khác thì là coi thường. めいた = có vẻ như (春めいた), がらみ = liên quan đến.","a":0}]},{"qs":[{"n":32,"q":"記録的な大雨のため、大会は中止（　　）。","o":["を禁じ得なかった","を余儀なくされた","にたえなかった","をものともしなかった"],"e":"<b>Nを余儀なくされる (よぎなくされる)</b> = buộc phải N (do hoàn cảnh, không còn cách khác). を禁じ得ない = không kìm được (cảm xúc), をものともしない = bất chấp.","a":1}]},{"qs":[{"n":33,"q":"社員（　　）アルバイトであれ、お客様に対する責任は同じだ。","o":["なり","であれ","やら","だの"],"e":"<b>NであれNであれ</b> = dù là N hay N. Hai vế phải cùng dạng であれ. なり～なり, やら～やら, だの～だの cũng là mẫu lặp nhưng phải lặp đúng cặp và mang nghĩa khác.","a":1}]},{"qs":[{"n":34,"q":"今日は一日中雨（　　）、午後からよく晴れた。","o":["にしては","ばかりか","だけあって","かと思いきや"],"e":"<b>～かと思いきや</b> = cứ tưởng là ~ nhưng (kết quả bất ngờ). にしては = so với, ばかりか = không chỉ, だけあって = quả đúng là.","a":3}]},{"qs":[{"n":35,"q":"子どもが生まれ（　　）、生活がすっかり変わった。","o":["てこそ","てからというもの","ては","てまで"],"e":"<b>Vて からというもの</b> = kể từ khi V (thì thay đổi hẳn và kéo dài). てこそ = chỉ khi V thì mới, てまで = đến mức phải V.","a":1}]}]},{"id":"m6","title":"問題6 文の組み立て","en":"Sắp xếp câu","instr":"次の文の ★ に入る最もよいものを、1、2、3、4から一つ選びなさい。","fixed":true,"pages":[{"qs":[{"n":36,"q":"彼は、＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 、決して希望を失わなかった。","o":["厳しい","あっても","状況に","どんなに"],"a":2,"e":"Thứ tự đúng: どんなに 厳しい <b>状況に</b> あっても (4 1 3 2). <b>Nにあっても</b> = dù ở trong N. どんなに đi với ても. ★ là 状況に."}]},{"qs":[{"n":37,"q":"急いで ＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 来ない。","o":["バスが","ときに","いる","限って"],"a":3,"e":"Thứ tự đúng: いる ときに <b>限って</b> バスが (3 2 4 1). <b>～ときに限って</b> = cứ đúng lúc ~ thì lại (chuyện không may). ★ là 限って."}]},{"qs":[{"n":38,"q":"大事な試合なので、＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ いかない。","o":["わけには","熱がある","からといって","休む"],"a":3,"e":"Thứ tự đúng: 熱がある からといって <b>休む</b> わけには (2 3 4 1). <b>Vる わけにはいかない</b> = không thể V được. ★ là 休む."}]},{"qs":[{"n":39,"q":"日本に来たばかりのころ、彼は ＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 読めなかった。","o":["漢字","ひらがな","どころか","さえ"],"a":1,"e":"Thứ tự đúng: 漢字 どころか <b>ひらがな</b> さえ (1 3 2 4). <b>AどころかBさえ～ない</b> = đừng nói A, ngay cả B cũng không. A là thứ khó hơn (漢字), B là thứ dễ hơn (ひらがな). ★ là ひらがな."}]},{"qs":[{"n":40,"q":"彼の連絡先が ＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ ない。","o":["知らせ","ようが","ので","わからない"],"a":0,"e":"Thứ tự đúng: わからない ので <b>知らせ</b> ようが (4 3 1 2). <b>Vます bỏ ます + ようがない</b> = không có cách nào để V. ★ là 知らせ."}]}]},{"id":"m7","title":"問題7 文章の文法","en":"Ngữ pháp trong đoạn văn","instr":"次の文章を読んで、文章全体の内容を考えて、41 から 45 の中に入る最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　先月、思い切って部屋の片付けをした。引っ越してから五年、物は増える（41）で、棚も押し入れもいっぱいになっていたからだ。</p><p>　始めてみると、何年も使っていない物が次々と出てきた。着なくなった服、読み終えた雑誌、いつか使うだろうと思って取っておいた空き箱。捨てようとするたびに、「まだ使えるのに」という気持ちが邪魔をする。（42）、一年以上使わなかった物は、これからも使わない可能性が高い。そう自分に言い聞かせて、少しずつ手放していった。</p><p>　片付けを終えて気づいたのは、物が減ると、探し物をする時間も減るということだ。以前は、はさみ一つ見つける（43）、あちこちの引き出しを開けなければならなかった。今は、どこに何があるかがすぐにわかる。</p><p>　物を持つことは、それを管理する手間を持つこと（44）。本当に必要な物だけに囲まれた暮らしは、思っていた以上に快適だ。これからは、何かを買う前に、それが本当に必要かどうかをよく考える（45）。</p>","qs":[{"n":41,"q":"（41）","o":["限り","次第","一方","以上"],"e":"<b>Vる 一方だ</b> = ngày càng V (chỉ theo một chiều). 物は増える一方で = đồ đạc cứ tăng mãi. 限り = chừng nào còn, 次第 = ngay sau khi, 以上 = một khi đã.","a":2},{"n":42,"q":"（42）","o":["そのため","さらに","すなわち","とはいえ"],"e":"Câu trước: tiếc vì đồ còn dùng được. Câu sau: nhưng đồ không dùng hơn một năm thì sau này cũng khó dùng. Đây là ý phản bác lại cảm giác tiếc, nên dùng <b>とはいえ</b> (tuy vậy). そのため = vì thế, すなわち = tức là.","a":3},{"n":43,"q":"（43）","o":["からには","のにも","ものの","ことなく"],"e":"<b>見つけるのにも</b> = ngay cả để tìm (một cái kéo) cũng phải. Vる のに = để làm V, thêm も để nhấn mạnh ngay cả việc nhỏ. からには = một khi đã, ものの = tuy nhưng.","a":1},{"n":44,"q":"（44）","o":["ではあるまい","とは限らない","どころではない","でもある"],"e":"<b>AことはBことでもある</b> = việc A cũng chính là việc B. Sở hữu đồ cũng có nghĩa là mang thêm công quản lý. ではあるまい = chắc không phải, とは限らない = chưa chắc.","a":3},{"n":45,"q":"（45）","o":["ことになっていた","ようにしたい","ところだった","わけがない"],"e":"これからは = từ nay, nên cần ý định cho tương lai: <b>考えるようにしたい</b> = muốn cố gắng tập thói quen suy nghĩ. ところだった = suýt nữa, わけがない = không đời nào.","a":1}]}]},{"id":"r8","title":"問題8 内容理解（短文）","en":"Đọc hiểu: đoạn ngắn","instr":"次の（1）から（4）の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>（1）</p><p>　話し上手になりたいと願う人は多いが、聞き上手になろうとする人は意外に少ない。しかし、人が「この人とまた話したい」と感じるのは、面白い話をしてくれた相手よりも、自分の話を熱心に聞いてくれた相手であることが多い。人は誰でも、自分のことをわかってほしいと思っているからだ。会話を弾ませたいなら、うまく話そうとする前に、まず相手の話に耳を傾けることである。</p>","qs":[{"n":46,"q":"筆者の考えに合うものはどれか。","o":["面白い話ができる人ほど、人から好かれる。","聞き上手な人は、話すのが苦手なことが多い。","自分のことをわかってもらうには、たくさん話すべきだ。","よい会話のためには、まず相手の話をよく聞くことが大切だ。"],"e":"Câu cuối: <b>うまく話そうとする前に、まず相手の話に耳を傾けること</b>. 耳を傾ける = lắng nghe. Tác giả nói người ta thích người chịu NGHE hơn là người nói chuyện thú vị (AよりもB).","a":3}]},{"passage":"<p>（2）</p><p>以下は、ある大学が学生に送ったメールである。</p><div class='notice'><p>件名：奨学金説明会の日程変更について</p><p>学生の皆さん</p><p>　4月15日（木）に予定していた奨学金説明会は、会場の都合により、4月20日（火）16:30からに変更になりました。会場は、3号館201教室から5号館大ホールに変わります。<br>　すでに参加を申し込んでいる人は、改めて申し込む必要はありません。ただし、変更後の日程で参加できない人は、4月16日までに学生課にメールで連絡してください。後日、説明会の録画を見られるようにします。<br>　なお、申請書類の提出期限（4月30日）に変更はありません。</p><p style='text-align:right'>学生課</p></div>","qs":[{"n":47,"q":"すでに参加を申し込んでいて、4月20日には参加できない学生は、どうすればよいか。","o":["もう一度、参加の申し込みをする。","4月15日に、3号館201教室へ行く。","何もしなくても、録画が自動的に見られるようになる。","4月16日までに、学生課にメールで知らせる。"],"e":"Phần <b>ただし</b>: người không tham gia được lịch mới thì <b>4月16日までに学生課にメールで連絡</b>, sau đó mới được xem bản ghi hình. Đăng ký lại là không cần (改めて申し込む必要はありません). Trong thông báo, ただし và なお thường chứa điều kiện quan trọng.","a":3}]},{"passage":"<p>（3）</p><p>　早起きは健康によく、成功する人はみな朝型だ、とよく言われる。しかし、朝に強いか夜に強いかは、努力や意志だけの問題ではなく、生まれつきの体質も大きく関係していることがわかってきた。夜型の人が無理に早起きを続けても、かえって集中力が落ちてしまうことがある。大切なのは、世間の理想に自分を合わせることではなく、自分が最も力を発揮できる時間帯を知ることだろう。</p>","qs":[{"n":48,"q":"筆者の考えに合うものはどれか。","o":["成功するためには、朝型の生活に変えるべきだ。","自分が力を出しやすい時間帯を知ることが大切だ。","夜型の人は、努力が足りない。","早起きは、誰にとっても健康に悪い。"],"e":"Câu cuối: <b>AではなくB</b>, điều quan trọng là B = <b>自分が最も力を発揮できる時間帯を知ること</b>. Tác giả chỉ nói dậy sớm có thể phản tác dụng với người 夜型, không nói dậy sớm có hại cho mọi người.","a":1}]},{"passage":"<p>（4）</p><p>　会議で「エビデンス」「コンセンサス」などのカタカナ語が飛び交うことが増えた。新しい概念を表すのに便利な場合もあるが、「根拠」「合意」と言えば済むものまでカタカナにする必要があるだろうか。聞き手がその言葉を知らなければ、内容は伝わらない。言葉は、相手に伝わってはじめて意味を持つ。難しそうな言葉で自分を大きく見せるより、誰にでもわかる言葉を選ぶほうが、よほど知的ではないかと思う。</p>","qs":[{"n":49,"q":"筆者が最も言いたいことは何か。","o":["相手に伝わる、わかりやすい言葉を選ぶべきだ。","カタカナ語は、すべて日本語に言い換えるべきだ。","会議では、新しい概念を表す言葉を使うべきだ。","カタカナ語を知らない人は、もっと勉強すべきだ。"],"e":"<b>言葉は、相手に伝わってはじめて意味を持つ…誰にでもわかる言葉を選ぶほうが、よほど知的</b>. Tác giả thừa nhận từ katakana có lúc tiện (便利な場合もある), nên đáp án có すべて (tất cả) là quá tuyệt đối.","a":0}]}]},{"id":"r9","title":"問題9 内容理解（中文）","en":"Đọc hiểu: đoạn vừa","instr":"次の（1）から（3）の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>（1）</p><p>　祖母の作る煮物は、家族みんなの好物だった。祖母が亡くなる前の年、私は作り方を教えてほしいと頼んだ。ところが、祖母は「しょうゆは少し、砂糖はこのくらい」と言うばかりで、<u>①はっきりした分量を教えてくれなかった</u>。意地悪をしているのではない。長年、目と舌で覚えてきたので、数字では説明できなかったのだ。</p><p>　そこで私は、祖母が料理をする横に立ち、調味料を入れるたびにこっそり量って書き留めた。そうして完成したレシピのとおりに作ってみたが、何かが違う。味は似ているのに、祖母の煮物にはならないのである。</p><p>　何度も作るうちに、ようやく<u>②その理由</u>がわかってきた。祖母は、その日の野菜の状態を見て、火加減や煮る時間を少しずつ変えていたのだ。固い大根の日は長めに煮て、水分の多い日は調味料を控える。レシピに書けるのは料理の骨組みだけで、本当の味は、目の前の材料と向き合う中で決まっていく。</p><p>　今でも祖母の味を完全に再現できたとは思わない。それでも、台所に立って野菜の様子を確かめるとき、私は祖母の隣にいるような気がする。</p>","qs":[{"n":50,"q":"祖母が<u>①はっきりした分量を教えてくれなかった</u>のはなぜか。","o":["作り方を秘密にしておきたかったから","感覚で覚えていて、数字では説明できなかったから","分量を忘れてしまっていたから","筆者には料理ができないと思っていたから"],"e":"<b>長年、目と舌で覚えてきたので、数字では説明できなかった</b>. Tác giả nói rõ không phải bà cố tình giấu (意地悪をしているのではない).","a":1},{"n":51,"q":"<u>②その理由</u>とは、何の理由か。また、それはどのようなことか。","o":["レシピどおりでも祖母の味にならない理由で、祖母は材料の状態に合わせて作り方を変えていた。","レシピどおりでも祖母の味にならない理由で、筆者が調味料を量り間違えていた。","祖母が分量を教えなかった理由で、特別な調味料を使っていた。","祖母が分量を教えなかった理由で、毎回違う野菜を使っていた。"],"e":"その理由 chỉ câu trước: làm đúng công thức mà <b>祖母の煮物にはならない</b>. Lý do: bà <b>その日の野菜の状態を見て、火加減や煮る時間を少しずつ変えていた</b>.","a":0},{"n":52,"q":"筆者の考えに合うものはどれか。","o":["レシピを正確に書けば、誰でも同じ味を再現できる。","祖母の味は、今では完全に再現できるようになった。","料理の味は、レシピだけでなく、材料を見て調整する中で決まる。","料理では、分量を数字で覚えることが最も大切だ。"],"e":"<b>レシピに書けるのは料理の骨組みだけで、本当の味は、目の前の材料と向き合う中で決まっていく</b>. 骨組み = bộ khung. Tác giả cũng nói đến giờ vẫn chưa tái hiện hoàn toàn (完全に再現できたとは思わない).","a":2}]},{"passage":"<p>（2）</p><p>　道路沿いに植えられた街路樹は、都市の景観をよくするだけでなく、さまざまな役割を果たしている。夏には木陰を作って路面の温度を下げ、葉は空気中の汚れを吸着する。車の騒音を和らげ、歩行者と車道を分ける役目もある。</p><p>　一方で、街路樹には<u>①維持の難しさ</u>もある。大きく育った木の根が歩道を持ち上げ、通行の妨げになることがある。秋には大量の落ち葉が出て、近くの住民や店が掃除に追われる。枝が信号や標識を隠さないよう、定期的に切る費用もかかる。このため、苦情を受けて木を切ってしまう自治体も少なくない。</p><p>　しかし、最近では、<u>②住民が街路樹の管理に参加する取り組み</u>が各地で始まっている。ある町では、住民が落ち葉を集めて肥料にし、地域の花壇で使っている。落ち葉掃除を地域の行事にしたところ、近所同士の交流が生まれたという例もある。</p><p>　街路樹を、行政が管理する「設備」と見るか、地域で育てる「財産」と見るか。その見方の違いが、町の風景を大きく変えていくのではないだろうか。</p>","qs":[{"n":53,"q":"街路樹の役割として、本文で述べられているものはどれか。","o":["木陰を作って、路面の温度を下げる。","雨水を吸収して、洪水を防ぐ。","鳥や虫のすみかになる。","周辺の土地の値段を上げる。"],"e":"Đoạn 1: <b>夏には木陰を作って路面の温度を下げ</b>. Các đáp án khác có thể đúng ngoài đời nhưng KHÔNG có trong bài. Với câu hỏi 本文で述べられているもの, chỉ chọn điều bài viết nói.","a":0},{"n":54,"q":"<u>①維持の難しさ</u>の例として、本文に合うものはどれか。","o":["木がなかなか大きく育たないこと","木を植える場所が足りないこと","根が歩道を持ち上げたり、落ち葉の掃除が必要になったりすること","車の騒音で木が枯れてしまうこと"],"e":"Đoạn 2 nêu ba khó khăn: rễ làm nhô vỉa hè, lá rụng nhiều phải dọn, và chi phí cắt cành. Cây KHÔNG khó lớn, mà chính vì lớn quá nên mới có vấn đề.","a":2},{"n":55,"q":"<u>②住民が街路樹の管理に参加する取り組み</u>の例として、本文に合うものはどれか。","o":["住民が落ち葉を集めて肥料にし、花壇で使う。","住民が費用を出し合って、枝を切る業者を雇う。","住民が苦情を出して、木を切ってもらう。","住民が新しい木を買って、道路に植える。"],"e":"Câu ngay sau: <b>住民が落ち葉を集めて肥料にし、地域の花壇で使っている</b>. Khiếu nại để chặt cây là chuyện ở đoạn 2, trái ngược với 取り組み này.","a":0}]},{"passage":"<p>（3）</p><p>　仕事でミスをしたとき、すぐに謝ることができる人と、まず言い訳をしてしまう人がいる。「時間がなかったので」「指示がはっきりしなかったので」。本人は事情を説明しているつもりでも、聞く側には、責任を逃れようとしているように聞こえる。</p><p>　言い訳をしたくなるのは、<u>①自分を守りたい</u>からだ。ミスを認めれば、能力が低いと思われるのではないか。そう恐れる気持ちは理解できる。しかし、実際には逆である。素直に非を認める人のほうが、信頼できる人だと評価されることが多い。誰でもミスはする。問われているのは、ミスをしたかどうかよりも、その後どう行動するかなのだ。</p><p>　ただし、謝ればそれで終わりというわけではない。「申し訳ありません」を繰り返すだけで、同じミスを何度もする人がいる。<u>②それでは謝罪の意味がない</u>。なぜミスが起きたのかを考え、次にどう防ぐかを伝える。そこまでして、はじめて謝罪は相手に届くのである。</p><p>　事情の説明が必要な場合もあるだろう。しかし、それは謝った後でよい。順番を間違えないことだ。</p>","qs":[{"n":56,"q":"<u>①自分を守りたい</u>とは、ここではどういうことか。","o":["ミスを認めて、能力が低いと思われるのを避けたい。","ミスの責任を、ほかの人に取らせたい。","ミスをしたことを、誰にも知られたくない。","ミスの原因を、正確に説明したい。"],"e":"Câu ngay sau: <b>ミスを認めれば、能力が低いと思われるのではないか</b>. Đó là nỗi sợ khiến người ta biện minh.","a":0},{"n":57,"q":"<u>②それでは謝罪の意味がない</u>のはなぜか。","o":["謝る回数が少なすぎるから","謝る言葉が丁寧ではないから","謝るだけで、同じミスを防ぐ行動につながっていないから","謝る相手を間違えているから"],"e":"それ = <b>「申し訳ありません」を繰り返すだけで、同じミスを何度もする</b>. Xin lỗi mà không tìm nguyên nhân và cách phòng tránh thì vô nghĩa.","a":2},{"n":58,"q":"筆者の考えに合うものはどれか。","o":["ミスをしたときは、事情を先に説明すべきだ。","謝罪の言葉は、何度も繰り返すほどよい。","まず謝り、そのうえで原因と今後の対策を伝えることが大切だ。","事情の説明は、どんな場合もすべきではない。"],"e":"Đoạn 3 và 4: xin lỗi trước, rồi nói nguyên nhân và cách phòng tránh, còn giải thích hoàn cảnh thì <b>謝った後でよい</b>. Tác giả nói cũng có lúc cần giải thích (必要な場合もある), nên どんな場合も là sai.","a":2}]}]},{"id":"r10","title":"問題10 内容理解（長文）","en":"Đọc hiểu: đoạn dài","instr":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　観光は、地域に大きな利益をもたらす。宿泊施設や飲食店、土産物店がにぎわい、新しい仕事が生まれる。人口が減り続ける地方の町にとって、観光客を呼び込むことは、地域を維持するための重要な手段となっている。</p><p>　しかし近年、<u>①観光客が増えすぎることによる問題</u>が、各地で深刻になっている。有名な観光地では、バスや電車が混雑して住民が乗れない、ごみが道に捨てられる、写真を撮るために私有地に入り込む人がいる、といった事態が起きている。住民の日常生活が脅かされ、「観光客にはもう来てほしくない」という声さえ上がるようになった。</p><p>　皮肉なことに、こうした混雑は観光客自身の満足度も下げてしまう。静かな寺の庭を楽しみに来たのに、人が多すぎてゆっくり見ることもできない。そうなれば、その土地の魅力そのものが失われていく。<u>②観光が観光資源を壊してしまう</u>のである。</p><p>　対策として、入場者数を制限したり、混雑する時間帯の料金を高くしたりする地域が出てきた。また、有名な場所に集中する観光客を、周辺のあまり知られていない地域へ誘導する試みもある。いずれも一定の効果は上げているが、それだけで十分とは言えない。</p><p>　根本的に必要なのは、観光の成功を何で測るのかという考え方を見直すことではないだろうか。これまでは、訪れた人の数が多ければ多いほどよいとされてきた。しかし、数だけを追い求めれば、住民の暮らしも、訪れる人の体験も損なわれてしまう。住む人が自分の町に誇りを持ち、訪れる人がその土地の文化に敬意を払う。そうした関係を築けるかどうかが、これからの観光地に問われているのだと思う。</p>","qs":[{"n":59,"q":"筆者は、観光が地域にもたらす利点をどのように述べているか。","o":["住民の数が増えて、町が大きくなる。","交通機関が整備されて、住民の生活が便利になる。","町が有名になり、住民の誇りが高まる。","店がにぎわって仕事が生まれ、地域の維持につながる。"],"e":"Đoạn 1: <b>宿泊施設や飲食店…がにぎわい、新しい仕事が生まれる…地域を維持するための重要な手段</b>. Bài không nói dân số tăng hay giao thông được cải thiện, ngược lại giao thông còn bị quá tải.","a":3},{"n":60,"q":"<u>①観光客が増えすぎることによる問題</u>の例として、本文に合うものはどれか。","o":["宿泊施設や飲食店の数が足りなくなること","観光客が減って、店の売り上げが落ちること","交通機関が混雑して、住民が利用できないこと","住民が観光客に高い料金を求めること"],"e":"<b>バスや電車が混雑して住民が乗れない</b>. Ngoài ra còn có rác và việc vào đất tư nhân để chụp ảnh.","a":2},{"n":61,"q":"<u>②観光が観光資源を壊してしまう</u>とはどういうことか。","o":["観光客が、寺や庭の建物を壊してしまうこと","混雑によって、その土地の魅力が失われてしまうこと","観光地が増えすぎて、客の取り合いになること","入場料が高くなり、観光客が来なくなること"],"e":"Câu ngay trước: đông quá nên không thể thong thả ngắm, <b>その土地の魅力そのものが失われていく</b>. 壊す ở đây là nghĩa bóng (mất sức hấp dẫn), không phải phá hỏng công trình.","a":1},{"n":62,"q":"この文章で筆者が最も言いたいことは何か。","o":["観光客の数を、できるだけ増やすべきだ。","有名な観光地は、観光客の受け入れをやめるべきだ。","観光客の数ではなく、住民と観光客のよい関係を重視すべきだ。","入場者数を制限すれば、問題はすべて解決できる。"],"e":"Đoạn cuối: cần xem lại cách đo thành công của du lịch, không chỉ chạy theo số lượng, mà là <b>住む人が…誇りを持ち、訪れる人が…敬意を払う。そうした関係</b>. Về các biện pháp hạn chế, tác giả nói <b>それだけで十分とは言えない</b>.","a":2}]}]},{"id":"r11","title":"問題11 統合理解","en":"Đọc so sánh A và B","instr":"次のAとBの文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p><b>A</b></p><p>　小学校の宿題は必要だと思う。授業で習ったことは、その日のうちに復習しなければ、すぐに忘れてしまう。宿題があることで、家で机に向かう習慣もつく。この学習習慣は、中学や高校に進んでから大きな力になるはずだ。確かに、量が多すぎると子どもの負担になる。しかし、だからといって宿題そのものをなくしてしまうと、家庭によって学習量に大きな差が出てしまうだろう。量や内容を工夫したうえで、宿題は続けるべきだ。</p><p><b>B</b></p><p>　全員に同じ宿題を出すやり方は、見直す時期に来ている。すでに理解している子どもにとっては時間の無駄であり、理解できていない子どもにとっては、一人では解けずに苦痛なだけだ。宿題に追われて、遊びや読書、家族と過ごす時間が削られていることも気になる。家で学ぶ習慣は確かに大切だが、それは一律の宿題でなくても身につけられる。自分で課題を決めて取り組む自主学習に切り替えれば、学ぶ意欲も育つのではないか。</p>","qs":[{"n":63,"q":"AとBのどちらの文章でも述べられていることは何か。","o":["宿題をなくすと、家庭によって差が出ること","家で学習する習慣は大切であること","理解している子どもには、宿題が時間の無駄であること","自主学習によって、学ぶ意欲が育つこと"],"e":"A: <b>家で机に向かう習慣…大きな力になる</b>. B: <b>家で学ぶ習慣は確かに大切だ</b>. Chênh lệch giữa các gia đình chỉ có ở A. Lãng phí thời gian và tự học chỉ có ở B.","a":1},{"n":64,"q":"宿題について、AとBはどのように述べているか。","o":["AもBも、宿題は今のまま続けるべきだと述べている。","Aは宿題をなくすべきだと述べ、Bは宿題の量を増やすべきだと述べている。","Aは工夫しながら続けるべきだと述べ、Bは全員同じ宿題をやめて自主学習に変えるべきだと述べている。","AもBも、家庭での学習は必要ないと述べている。"],"e":"Câu cuối của A: <b>量や内容を工夫したうえで、宿題は続けるべきだ</b>. Câu cuối của B: <b>自主学習に切り替えれば</b>. B không nói bỏ việc học ở nhà, chỉ phản đối bài tập giống nhau cho mọi người (一律 = đồng loạt như nhau).","a":2}]}]},{"id":"r12","title":"問題12 主張理解（長文）","en":"Đọc hiểu: quan điểm tác giả","instr":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　「普通はこうするでしょう」「普通に考えればわかるはずだ」。私たちは日常的に「普通」という言葉を使う。しかし、この言葉ほど、便利で、同時に危うい言葉もないのではないか。</p><p>　そもそも、「普通」とは何だろうか。多くの人がそうしていること、という意味で使われることが多い。だが、<u>①その「多くの人」とは誰のことか</u>。たいていの場合、それは話し手の周りにいる人々、つまり、同じ地域で育ち、同じような環境で暮らしてきた人々にすぎない。家庭によって朝食の内容が違うように、「普通」の中身は、育った環境によって驚くほど異なる。</p><p>　私がそれを痛感したのは、海外で暮らしたときだった。約束の時間に十分遅れて来た友人に不満を言うと、「十分は遅刻のうちに入らない」と笑われた。私にとっての「普通」は、そこでは少しも普通ではなかったのである。</p><p>　問題は、「普通」という言葉が、<u>②相手を黙らせる力</u>を持っていることだ。「それは普通ではない」と言われると、言われた側は、自分がおかしいのだと感じてしまう。理由を説明されたわけでもないのに、反論しにくくなる。言う側は、自分の考えを述べているだけなのに、あたかも世の中全体の意見であるかのように聞こえるからだ。</p><p>　だから私は、「普通は」と言いたくなったとき、「私はこう思う」と言い換えるようにしている。そうすると、なぜそう思うのか、理由を説明しなければならなくなる。面倒ではあるが、そのほうが相手と対等に話ができる。</p><p>　自分の「普通」が、ほかの人の「普通」と同じとは限らない。その当たり前のことを忘れずにいたいと思う。</p>","qs":[{"n":65,"q":"<u>①その「多くの人」とは誰のことか</u>とあるが、筆者はどう考えているか。","o":["世界中のほとんどの人々のことである。","その分野に詳しい専門家のことである。","話し手より年上の人々のことである。","話し手の身近にいる、似た環境の人々にすぎない。"],"e":"Câu ngay sau: <b>話し手の周りにいる人々…同じような環境で暮らしてきた人々にすぎない</b>. ～にすぎない = chỉ là ~ mà thôi.","a":3},{"n":66,"q":"筆者の海外での経験は、何を示す例として挙げられているか。","o":["海外の人は、時間を守らないことが多い。","遅刻をしても、謝る必要はない。","海外で暮らすと、友人ができにくい。","自分の「普通」が、ほかの場所では通用しないことがある。"],"e":"<b>私にとっての「普通」は、そこでは少しも普通ではなかった</b>. Đây là ví dụ cho ý ở đoạn 2 (普通 khác nhau tùy môi trường). Tác giả không phê phán người nước ngoài.","a":3},{"n":67,"q":"「普通」という言葉が<u>②相手を黙らせる力</u>を持つのはなぜか。","o":["理由が詳しく説明されるから","言う側の立場が、いつも上だから","個人の考えが、世の中全体の意見のように聞こえるから","言われた側が、実際に間違っているから"],"e":"Cuối đoạn 4: <b>自分の考えを述べているだけなのに、あたかも世の中全体の意見であるかのように聞こえるから</b>. あたかも～かのように = cứ như thể là ~. Lý do KHÔNG hề được giải thích (理由を説明されたわけでもないのに).","a":2},{"n":68,"q":"筆者の考えに最も近いものはどれか。","o":["「普通」という言葉は便利なので、積極的に使うべきだ。","海外で暮らせば、「普通」の本当の意味がわかる。","「普通」は人によって異なるので、自分の考えとして理由とともに伝えるのがよい。","相手と意見が違うときは、何も言わないほうがよい。"],"e":"Đoạn 5: đổi 普通は thành <b>「私はこう思う」</b> và giải thích lý do, như vậy mới nói chuyện bình đẳng. Câu cuối: 普通 của mình <b>同じとは限らない</b> với người khác.","a":2}]}]},{"id":"r13","title":"問題13 情報検索","en":"Tìm thông tin","instr":"次は、ある市のマラソン大会の参加者募集の案内である。下の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<div class='notice'><p style='text-align:center'><b>第10回　みなと市民マラソン大会　参加者募集</b></p><p>開催日：3月14日（日）　雨天決行</p><table class='tbl'><tr><th>種目</th><th>参加資格</th><th>参加費</th><th>スタート</th><th>定員</th></tr><tr><td>フルマラソン<br>(42.195km)</td><td>18歳以上</td><td>8,000円</td><td>9:00</td><td>3,000名</td></tr><tr><td>ハーフマラソン<br>(約21km)</td><td>16歳以上</td><td>5,000円</td><td>9:30</td><td>2,000名</td></tr><tr><td>10km</td><td>中学生以上</td><td>3,000円</td><td>10:30</td><td>1,000名</td></tr><tr><td>ファミリーラン<br>(2km)</td><td>小学生と保護者のペア</td><td>1組 2,000円</td><td>11:30</td><td>300組</td></tr></table><p>※市内在住の方は、参加費が1,000円引きになります（ファミリーランは500円引き）。<br>※申し込みは1月31日まで。定員になり次第、締め切ります。<br>※申し込み後の種目変更、返金はできません。<br>※高校生以下の方が参加する場合は、保護者の同意書が必要です。</p></div>","qs":[{"n":69,"q":"市内に住む17歳の高校生のユイさんは、できるだけ長い距離の種目に出たいと考えている。ユイさんが参加できる種目と参加費はどれか。","o":["フルマラソンで7,000円","ハーフマラソンで4,000円","ハーフマラソンで5,000円","10kmで2,000円"],"e":"フルマラソン yêu cầu <b>18歳以上</b>, Yui 17 tuổi nên không được. Dài nhất có thể là ハーフマラソン (16歳以上): 5,000円. Sống trong thành phố: <b>−1,000円</b>. Vậy <b>4,000円</b>. 5,000円 là bẫy cho người quên giảm giá trong phần ※.","a":1},{"n":70,"q":"市外に住む会社員の木村さんは、小学生の息子と二人でファミリーランに申し込む。木村さんについて正しいものはどれか。","o":["参加費は1,500円で、保護者の同意書が必要だ。","参加費は4,000円で、同意書は必要ない。","参加費は2,000円で、同意書は必要ない。","参加費は2,000円で、保護者の同意書が必要だ。"],"e":"ファミリーラン là <b>1組 2,000円</b> (tính theo cặp, không phải mỗi người, nên không phải 4,000円). Sống ngoài thành phố nên không được giảm 500円. Con trai là học sinh tiểu học, thuộc <b>高校生以下</b>, nên cần 同意書 của phụ huynh.","a":3}]}]}];
const SET6 = [{"id":"m1","title":"問題1 漢字読み","en":"Đọc kanji","instr":"＿＿の言葉の読み方として最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":1,"q":"両国の交渉は、ここに来て<u>暗礁</u>に乗り上げている。","o":["あんそう","あんしょ","あんしょう","やみしょう"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>暗礁 (あんしょう)</b> = đá ngầm. 暗礁に乗り上げる = (đàm phán, kế hoạch) đi vào bế tắc. 礁 đọc là <b>しょう</b>, có trường âm.","a":2}]},{"qs":[{"n":2,"q":"新しい研究会が、来月正式に<u>発足</u>する。","o":["はっそく","ほっそく","はっあし","ほっあし"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 2, lần này hỏi theo dạng khác.</span><br><b>発足 (ほっそく)</b> = thành lập, ra mắt (tổ chức). 発 đọc là <b>ほっ</b> chứ không phải はっ. Đây là cách đọc đặc biệt, rất hay bị bẫy bằng はっそく.","a":1}]},{"qs":[{"n":3,"q":"彼女は<u>手際</u>よく料理を作り、あっという間にテーブルに並べた。","o":["てさい","しゅさい","てぎわ","てきわ"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 4, lần này hỏi theo dạng khác.</span><br><b>手際 (てぎわ)</b> = sự khéo léo, nhanh gọn khi làm việc. 際 thường đọc là さい (国際), nhưng ở đây là âm Nhật <b>きわ</b>, biến âm thành <b>ぎわ</b>.","a":2}]},{"qs":[{"n":4,"q":"顧客の個人情報が外部に<u>漏洩</u>する事件が起きた。","o":["もうえい","ろうせつ","ろうえい","ろえい"],"e":"<b>漏洩 (ろうえい)</b> = rò rỉ (thông tin, bí mật). 漏 = <b>ろう</b> (như 漏水 ろうすい), 洩 = <b>えい</b>.","a":2}]},{"qs":[{"n":5,"q":"次の条件に<u>該当</u>する方は、窓口までお申し出ください。","o":["かいとう","がいどう","けいとう","がいとう"],"e":"<b>該当 (がいとう)</b> = thuộc diện, phù hợp với (điều kiện). 該 đọc là <b>がい</b> (có dakuten). かいとう là 回答 hoặc 解答.","a":3}]},{"qs":[{"n":6,"q":"父は四十年間、病院の建設に<u>携わって</u>きた。","o":["かかわって","たくわえて","たずねて","たずさわって"],"e":"<b>携わる (たずさわる)</b> = tham gia vào, làm công việc gì đó lâu dài. かかわる = 関わる (liên quan), cũng gần nghĩa nhưng chữ kanji khác. たくわえる = 蓄える (tích trữ).","a":3}]}]},{"id":"m2","title":"問題2 文脈規定","en":"Từ theo ngữ cảnh","instr":"（　　）に入れるのに最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":7,"q":"監督の見事な（　　）で、チームは逆転勝利を収めた。","o":["配置","手配","采配","分配"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 2, lần này hỏi theo dạng khác.</span><br><b>采配 (さいはい)</b> = sự chỉ huy, điều binh khiển tướng. Rất hay dùng cho huấn luyện viên. 配置 = bố trí, 手配 = sắp xếp, chuẩn bị (vé, xe), 分配 = phân chia.","a":2}]},{"qs":[{"n":8,"q":"海外での十年間の経験で（　　）た語学力を、今の仕事に生かしている。","o":["培っ","耕し","育て","蓄え"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 4, lần này hỏi theo dạng khác.</span><br><b>培う (つちかう)</b> = vun đắp (năng lực, kinh nghiệm qua thời gian dài). 培った語学力 rất tự nhiên. 耕す = cày (ruộng), 育てる thường dùng cho người, cây. 蓄える dùng cho tiền, năng lượng, tri thức đều được nhưng không tự nhiên với 語学力 bằng 培う.","a":0}]},{"qs":[{"n":9,"q":"会議で反対されないよう、部長は事前に関係者への（　　）を済ませていた。","o":["根回し","下準備","下見","手回し"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 3, lần này hỏi theo dạng khác.</span><br><b>根回し (ねまわし)</b> = vận động, thuyết phục trước với những người liên quan. 下見 = đi xem trước (địa điểm), 下準備 = chuẩn bị trước (công việc, nấu ăn), không dùng với 関係者への.","a":0}]},{"qs":[{"n":10,"q":"新システムを導入したいが、費用の高さが（　　）になっている。","o":["ピーク","ネック","ギャップ","ノルマ"],"e":"<b>ネック</b> = điểm nghẽn, trở ngại chính (từ bottleneck). ～がネックになる. ピーク = đỉnh điểm, ギャップ = khoảng cách, chênh lệch, ノルマ = chỉ tiêu.","a":1}]},{"qs":[{"n":11,"q":"上司と部下の意見が対立し、課長は二人の（　　）になって苦しんでいる。","o":["足止め","板挟み","手詰まり","骨抜き"],"e":"<b>板挟み (いたばさみ)</b> = bị kẹt ở giữa hai bên. 手詰まり = bế tắc, hết cách, 骨抜き = bị làm mất tác dụng (luật, kế hoạch), 足止め = bị giữ chân.","a":1}]},{"qs":[{"n":12,"q":"彼の分析力には、ベテランの記者たちも（　　）置いている。","o":["一歩","一線","一役","一目"],"e":"<b>一目置く (いちもくおく)</b> = nể phục, công nhận ai đó giỏi hơn. 一線を画す = vạch ranh giới, 一役買う = góp một tay.","a":3}]},{"qs":[{"n":13,"q":"このイベントのために、地元の企業が費用の一部を（　　）くれた。","o":["負傷して","負荷して","負債して","負担して"],"e":"<b>負担 (ふたん)する</b> = gánh chịu (chi phí). 負傷 = bị thương, 負荷 = tải trọng (danh từ), 負債 = nợ (danh từ, không dùng với する).","a":3}]}]},{"id":"m3","title":"問題3 言い換え類義","en":"Từ gần nghĩa","instr":"＿＿の言葉に意味が最も近いものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":14,"q":"システムの不具合で、商品の発送が<u>滞って</u>いる。","o":["増えて","中止されて","遅れて","確認されて"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 4, lần này hỏi theo dạng khác.</span><br><b>滞る (とどこおる)</b> = bị đình trệ, chậm trễ. Gần nhất là 遅れている. Không phải là dừng hẳn (中止).","a":2}]},{"qs":[{"n":15,"q":"どちらの方法が良いかは、<u>一概には</u>言えない。","o":["はっきりとした声で","誰に対しても","今の時点では","簡単に決めつけて"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>一概に (いちがいに)</b> = một cách đánh đồng, vơ đũa cả nắm. 一概には言えない = không thể kết luận đơn giản như vậy. Gần nhất là 簡単に決めつけて.","a":3}]},{"qs":[{"n":16,"q":"今日の作業は、<u>ひとまず</u>ここで終わりにしよう。","o":["すっかり","ようやく","いっそ","とりあえず"],"e":"<b>ひとまず</b> = tạm thời, trước mắt. Gần nhất là とりあえず. すっかり = hoàn toàn, ようやく = cuối cùng thì, いっそ = thà rằng.","a":3}]},{"qs":[{"n":17,"q":"その問題は、結局<u>うやむやに</u>なってしまった。","o":["すっかり解決して","はっきりしないまま終わって","さらに大きくなって","誰にも知られずに"],"e":"<b>うやむや</b> = mập mờ, bỏ lửng không rõ ràng. うやむやになる = vấn đề bị bỏ lửng mà không giải quyết.","a":1}]},{"qs":[{"n":18,"q":"彼は客に対して<u>ぞんざいな</u>口のきき方をする。","o":["失礼で乱暴な","丁寧すぎる","声の大きい","早口の"],"e":"<b>ぞんざい</b> = thô lỗ, cẩu thả (trong cách nói, cách đối xử). Gần nhất là 失礼で乱暴な. Trái nghĩa là 丁寧.","a":0}]},{"qs":[{"n":19,"q":"相手のミスを見て、彼は<u>すかさず</u>攻撃に出た。","o":["慎重に","仕方なく","間を置かずに","思い切って"],"e":"<b>すかさず</b> = ngay lập tức, không để lỡ cơ hội. Gần nhất là 間を置かずに (không để khoảng trống).","a":2}]}]},{"id":"m4","title":"問題4 用法","en":"Cách dùng từ","instr":"次の言葉の使い方として最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":20,"q":"<b>賄う</b>","o":["大学の学費は、アルバイトの収入で賄っている。","友人の誕生日に、花束を賄ってあげた。","迷惑をかけた相手に、心から賄った。","雨が降ってきたので、洗濯物を賄った。"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 2, lần này hỏi theo dạng khác.</span><br><b>賄う (まかなう)</b> = trang trải, chi trả (chi phí bằng nguồn tiền nào đó). Tặng hoa là 贈る, xin lỗi là 謝る (hoặc 償う = đền bù), cất đồ phơi là 取り込む.","a":0}]},{"qs":[{"n":21,"q":"<b>まちまち</b>","o":["彼は約束の時間にまちまち遅れてくる。","まちまち雨が降り出しそうな空だ。","この町は道がまちまちで、迷いやすい。","同じ商品でも、店によって値段がまちまちだ。"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 3, lần này hỏi theo dạng khác.</span><br><b>まちまち</b> = mỗi nơi, mỗi người một khác, không thống nhất. Không dùng như trạng từ tần suất (たびたび) hay mô tả đường phức tạp (入り組んでいる).","a":3}]},{"qs":[{"n":22,"q":"<b>打ち込む</b>","o":["彼女は試験に打ち込んで、合格した。","彼は退職後、陶芸に打ち込んでいる。","道で知人に打ち込んで、挨拶した。","雨が窓に打ち込んで、目が覚めた。"],"e":"<b>打ち込む (うちこむ)</b> = dồn hết tâm sức vào (sở thích, công việc). Đỗ kỳ thi là 合格する, gặp người quen là 出会う. Mưa đập vào cửa thì dùng 打ちつける.","a":1}]},{"qs":[{"n":23,"q":"<b>見計らう</b>","o":["駅で友人を見計らって、声をかけた。","この荷物の重さを見計らってください。","彼は人の話をよく見計らう人だ。","客が少なくなる時間を見計らって、店に入った。"],"e":"<b>見計らう (みはからう)</b> = canh, chọn đúng thời điểm thích hợp. 頃合いを見計らう, 時間を見計らう. Tìm thấy bạn là 見つける, đo cân nặng là 量る.","a":3}]},{"qs":[{"n":24,"q":"<b>踏まえる</b>","o":["雪の道を踏まえて、ゆっくり歩いた。","彼は約束を踏まえて、遅れてきた。","前回の反省を踏まえて、今年の計画を立てた。","この机は古いので、踏まえないでください。"],"e":"<b>踏まえる (ふまえる)</b> = dựa trên, căn cứ vào (kinh nghiệm, kết quả, ý kiến). Đi trên tuyết là 踏みしめる, thất hứa là 約束を破る.","a":2}]},{"qs":[{"n":25,"q":"<b>一環</b>","o":["家族の一環として、犬を大切にしている。","この植樹は、環境保護活動の一環として行われている。","このネックレスは、金の一環でできている。","一環の間違いが、大きな事故につながった。"],"e":"<b>Nの一環として (いっかん)</b> = như một phần của (kế hoạch, hoạt động). Thành viên gia đình là 家族の一員, một chỗ sai sót nhỏ là 一つのミス.","a":1}]}]},{"id":"m5","title":"問題5 文法形式の判断","en":"Ngữ pháp","instr":"次の文の（　　）に入れるのに最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":26,"q":"今日（　　）、二十年続けてきたこの仕事を引退する。","o":["を皮切りに","をよそに","を限りに","をおいて"],"e":"<b>Nを限りに (をかぎりに)</b> = lấy N làm mốc cuối cùng, từ N trở đi thì không nữa. を皮切りに = bắt đầu từ (đã học ở 模試 4), có nghĩa ngược lại.","a":2}]},{"qs":[{"n":27,"q":"混乱した状況（　　）、彼は最後まで冷静さを失わなかった。","o":["にかけて","にわたって","にあって","にそって"],"e":"<b>Nにあって</b> = ở trong tình huống N (văn viết). にかけて = trong khoảng (từ ~ đến ~), にわたって = suốt (khoảng thời gian, phạm vi), にそって = dọc theo, theo.","a":2}]},{"qs":[{"n":28,"q":"彼は、自分こそが世界一の料理人だと言っ（　　）。","o":["てやまない","てはばからない","てならない","てたまらない"],"e":"<b>Vて はばからない</b> = nói (làm) một cách không ngần ngại, không e dè. てやまない = luôn mong (願ってやまない), てならない và てたまらない = rất (cảm xúc).","a":1}]},{"qs":[{"n":29,"q":"休み時間のベルが鳴ると、子どもたちは待ってました（　　）校庭へ飛び出した。","o":["とばかりに","とあって","ともなく","といえども"],"e":"<b>～とばかりに</b> = như thể muốn nói ~. 待ってましたとばかりに = như thể đã đợi sẵn. とあって = vì là, ともなく = vô thức, といえども = dù là.","a":0}]},{"qs":[{"n":30,"q":"この程度の問題なら、わざわざ先生に聞く（　　）。","o":["べくもない","にかたくない","ほかない","までもない"],"e":"<b>Vる までもない</b> = không cần phải V. べくもない = không thể nào V được, にかたくない = dễ dàng (tưởng tượng), ほかない = chỉ còn cách.","a":3}]},{"qs":[{"n":31,"q":"困っていたなら、言ってくれれば手伝った（　　）。","o":["ものの","ものを","もので","ものなら"],"e":"<b>～ば～ものを</b> = nếu ~ thì đã ~ rồi (vậy mà, tiếc nuối hoặc trách nhẹ). ものの = tuy nhưng, もので = vì (biện minh), ものなら = nếu có thể.","a":1}]},{"qs":[{"n":32,"q":"彼の実力（　　）、優勝も決して夢ではないだろう。","o":["をおいては","をよそにすれば","をもってすれば","をめぐれば"],"e":"<b>Nをもってすれば</b> = nếu dùng đến N (năng lực, kỹ thuật) thì. Thể hiện đánh giá cao N. Các đáp án còn lại không phải mẫu ngữ pháp có thật.","a":2}]},{"qs":[{"n":33,"q":"事故の被害者には、十分な補償がなされ（　　）。","o":["てしかるべきだ","てやまない","ないではいられない","てもかまわない"],"e":"<b>Vて しかるべきだ</b> = đương nhiên phải V, V là hợp lý. Văn viết, dùng khi nói điều nên làm. てもかまわない = cũng không sao, nghĩa quá nhẹ.","a":0}]},{"qs":[{"n":34,"q":"彼は、どんな仕事でも安心して任せる（　　）人物だ。","o":["に至る","にかたい","にあたる","に足る"],"e":"<b>Vる に足る (にたる)</b> = đáng để V. 信頼に足る, 任せるに足る. に至る = đi đến, にあたる = tương đương.","a":3}]},{"qs":[{"n":35,"q":"他人の大切な物を壊したのだから、弁償せ（　　）だろう。","o":["ずにはおかない","ずじまいだ","ずにはすまない","ずにすむ"],"e":"<b>Vず にはすまない</b> = không thể không V (theo lẽ phải, nghĩa vụ). ずにはおかない = nhất định sẽ gây ra (cảm xúc), ずじまい = rốt cuộc không V, ずにすむ = không cần V cũng được.","a":2}]}]},{"id":"m6","title":"問題6 文の組み立て","en":"Sắp xếp câu","instr":"次の文の ★ に入る最もよいものを、1、2、3、4から一つ選びなさい。","fixed":true,"pages":[{"qs":[{"n":36,"q":"彼女は、＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 、一度も弱音を吐かなかった。","o":["あっても","つらい","ときで","どんなに"],"a":2,"e":"Thứ tự đúng: どんなに つらい <b>ときで</b> あっても (4 2 3 1). <b>どんなに～であっても</b> = dù ~ đến đâu. ★ là ときで."}]},{"qs":[{"n":37,"q":"この映画は、＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 、大ヒットした。","o":["反して","予想","関係者の","に"],"a":3,"e":"Thứ tự đúng: 関係者の 予想 <b>に</b> 反して (3 2 4 1). <b>Nに反して</b> = trái với N. ★ là に."}]},{"qs":[{"n":38,"q":"試験に ＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 勉強を続けている。","o":["欠かさず","一日も","合格","すべく"],"a":1,"e":"Thứ tự đúng: 合格 すべく <b>一日も</b> 欠かさず (3 4 2 1). <b>～べく</b> = để (văn viết). 一日も欠かさず = không bỏ ngày nào. ★ là 一日も."}]},{"qs":[{"n":39,"q":"彼の説明は、＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 。","o":["わからなく","聞けば","なる","聞くほど"],"a":0,"e":"Thứ tự đúng: 聞けば 聞くほど <b>わからなく</b> なる (2 4 1 3). <b>VばVほど</b> = càng V càng. ★ là わからなく."}]},{"qs":[{"n":40,"q":"この料理は、＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 簡単に作れる。","o":["誰でも","あれば","さえ","材料"],"a":1,"e":"Thứ tự đúng: 材料 さえ <b>あれば</b> 誰でも (4 3 2 1). <b>Nさえ～ば</b> = chỉ cần có N là. ★ là あれば."}]}]},{"id":"m7","title":"問題7 文章の文法","en":"Ngữ pháp trong đoạn văn","instr":"次の文章を読んで、文章全体の内容を考えて、41 から 45 の中に入る最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　大学進学をきっかけに一人暮らしを始めて、三か月がたった。実家にいたころは、食事も洗濯も、すべて母に任せきりだった。（41）、今はすべて自分でやらなければならない。</p><p>　最初の一か月は、毎日が失敗の連続だった。ご飯を炊けば水の量を間違え、洗濯をすれば白いシャツを青く染めてしまう。料理（42）、レシピを見ながら作っても、なぜか食べられたものではなかった。</p><p>　それでも、少しずつできることが増えてきた。今では、一週間分の献立を考えて買い物をすることもできる。自分でやってみて初めて、母がどれほど大変だったかが（43）。</p><p>　先週、久しぶりに実家に帰ったとき、母に「いつもありがとう」と伝えた。母は驚いたような顔をしていたが、（44）うれしそうだった。一人暮らしは、家事の技術だけでなく、感謝する気持ちも教えてくれた。これからも、自分の生活を自分で作っていく喜びを（45）。</p>","qs":[{"n":41,"q":"（41）","o":["それとも","しかし","ちなみに","すなわち"],"e":"Trước đây mọi việc đều do mẹ làm, <b>しかし</b> bây giờ phải tự làm hết. Đây là quan hệ đối lập. それとも = hay là (câu hỏi lựa chọn), ちなみに = nhân tiện, すなわち = tức là.","a":1},{"n":42,"q":"（42）","o":["にとって","に限らず","について","に至っては"],"e":"<b>Nに至っては</b> = còn N thì (tệ nhất, đến mức). Sau khi kể lỗi nấu cơm, giặt đồ, đến nấu ăn thì còn tệ hơn: không ăn nổi. に限らず = không chỉ.","a":3},{"n":43,"q":"（43）","o":["身にしみてわかった","わかったつもりだった","わかるはずがなかった","わかってもらえなかった"],"e":"<b>身にしみてわかる</b> = thấm thía, hiểu sâu sắc. Vてみて初めて = chỉ khi tự làm mới, nên đi với việc thật sự hiểu ra.","a":0},{"n":44,"q":"（44）","o":["まるで","かえって","せめて","どこか"],"e":"<b>どこかうれしそうだった</b> = trông có phần vui. どこか = đâu đó, phần nào. まるで phải đi với ようだ, かえって = ngược lại, せめて = ít nhất thì.","a":3},{"n":45,"q":"（45）","o":["大切にしていきたい","大切にしてきた","大切にしたものだ","大切にするところだった"],"e":"これからも = từ nay về sau, nên cần ý chí hướng tới tương lai: <b>大切にしていきたい</b>. てきた = từ trước đến nay, たものだ = ngày xưa thường.","a":0}]}]},{"id":"r8","title":"問題8 内容理解（短文）","en":"Đọc hiểu: đoạn ngắn","instr":"次の（1）から（4）の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>（1）</p><p>　締め切りが近づくと、不思議と作業がはかどる。時間がたっぷりあるときは、つい後回しにしてしまうのに、残り時間が少なくなると、驚くほど集中できるのだ。これを利用しない手はない。大きな仕事を任されたら、最終的な締め切りとは別に、自分で小さな締め切りをいくつも設けてみるとよい。そうすれば、最後に慌てることなく、集中した状態で作業を進められる。</p>","qs":[{"n":46,"q":"筆者は、どうするのがよいと言っているか。","o":["自分で途中にいくつか締め切りを作る。","締め切りの直前まで作業を始めない。","時間がたっぷりあるうちに、すべて終わらせる。","締め切りを延ばしてもらうよう頼む。"],"e":"<b>最終的な締め切りとは別に、自分で小さな締め切りをいくつも設けてみるとよい</b>. ～しない手はない = không tận dụng thì phí. Tác giả không khuyên đợi đến phút chót.","a":0}]},{"passage":"<p>（2）</p><p>以下は、ある美容院から客に届いたメールである。</p><div class='notice'><p>件名：ご予約の変更、キャンセルについてのお願い</p><p>いつもご利用いただき、ありがとうございます。<br>　ご予約の変更、キャンセルは、ご予約日の前日の18時までに、お電話またはウェブサイトからお願いいたします。<br>　前日の18時を過ぎてからのキャンセル、およびご連絡のないキャンセルにつきましては、次回のご来店時に、キャンセル料として施術料金の50％をいただきます。<br>　なお、体調不良など、やむを得ない事情の場合は、当日でもご相談ください。</p></div>","qs":[{"n":47,"q":"予約日の前日の夜9時に、急な仕事でキャンセルすることになった客は、どうなるか。","o":["キャンセル料は払わなくてよい。","次に店に行ったとき、料金の半額を払う。","その日のうちに、料金の全額を払う。","ウェブサイトからなら、無料でキャンセルできる。"],"e":"21h ngày hôm trước là <b>sau 18h</b>, nên mất <b>phí hủy 50%</b>, trả <b>次回のご来店時</b> (lần đến tiếp theo). Việc gấp ở công ty không phải là lý do bất khả kháng như ốm đau (体調不良) được nêu trong なお.","a":1}]},{"passage":"<p>（3）</p><p>　スマートフォンの地図アプリは便利だが、頼りすぎると、自分で道を覚える力が衰えるという指摘がある。画面の指示どおりに歩いていると、周りの景色や建物の位置関係に注意を払わなくなるからだ。実際、毎日通る道なのに、アプリがなければ一人で行けないという人もいる。たまにはアプリを閉じて、目印を確かめながら歩いてみてはどうだろうか。</p>","qs":[{"n":48,"q":"筆者によると、地図アプリに頼りすぎると、なぜ道を覚える力が衰えるのか。","o":["画面を見ながら歩くと、危険だから","周りの景色や建物の位置に注意を向けなくなるから","アプリの指示が、ときどき間違っているから","毎日違う道を通るようになるから"],"e":"<b>周りの景色や建物の位置関係に注意を払わなくなるから</b>. Đi bộ nhìn điện thoại nguy hiểm là chuyện có thật, nhưng bài viết không nói đến.","a":1}]},{"passage":"<p>（4）</p><p>　「急がば回れ」ということわざがある一方で、「善は急げ」ということわざもある。一見、正反対のことを言っているようだが、矛盾しているわけではない。前者は、危険な近道より確実な方法を選べという教えであり、後者は、よいと思ったことはためらわずに始めよという教えである。ことわざは、それぞれ異なる場面に向けた知恵なのだ。大切なのは、今の状況にどちらが当てはまるかを見極めることだろう。</p>","qs":[{"n":49,"q":"筆者が最も言いたいことは何か。","o":["ことわざは、状況に合わせて使い分けることが大切だ。","二つのことわざは、正反対で矛盾している。","「急がば回れ」のほうが、正しい教えだ。","ことわざは古いので、今の時代には合わない。"],"e":"Câu cuối: <b>今の状況にどちらが当てはまるかを見極めること</b>. Tác giả nói rõ 矛盾しているわけではない (không mâu thuẫn), nên đáp án nói hai câu mâu thuẫn là sai.","a":0}]}]},{"id":"r9","title":"問題9 内容理解（中文）","en":"Đọc hiểu: đoạn vừa","instr":"次の（1）から（3）の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>（1）</p><p>　去年の夏、大雨の被害を受けた町で、災害ボランティアに参加した。泥に埋まった家から家具を運び出し、床下の泥をかき出す。真夏の暑さの中での作業は、想像以上に厳しかった。</p><p>　作業を始めてすぐに、私は<u>①自分の考えの甘さ</u>を思い知らされた。困っている人を助けたいという気持ちさえあれば、役に立てると思っていた。しかし、現地では、言われたとおりに体を動かすことしかできず、むしろ慣れた人の足を引っ張っているのではないかと感じた。</p><p>　ところが、作業の最終日、ある家の主人から「来てくれて、本当に心強かった」と声をかけられた。家の片付けそのものよりも、遠くから人が手伝いに来てくれたことが、何よりも励みになったのだという。</p><p>　その言葉を聞いて、私は<u>②ボランティアの意味</u>を考え直した。専門的な技術がなくても、そこにいて一緒に汗を流すことで、相手の心を支えることができる。助けるつもりで行った私のほうが、実は多くのことを教えてもらったのかもしれない。</p>","qs":[{"n":50,"q":"<u>①自分の考えの甘さ</u>とはどういうことか。","o":["暑さに対する準備をしていなかったこと","気持ちさえあれば役に立てると簡単に考えていたこと","作業がすぐに終わると思っていたこと","専門的な技術を持っていると思っていたこと"],"e":"Câu ngay sau: <b>助けたいという気持ちさえあれば、役に立てると思っていた</b>. 甘い ở đây = ngây thơ, suy nghĩ đơn giản.","a":1},{"n":51,"q":"家の主人が「心強かった」と言ったのはなぜか。","o":["遠くから人が手伝いに来てくれたこと自体が、励みになったから","家の片付けがすべて終わったから","筆者が専門的な技術を持っていたから","筆者が最後まで休まずに働いたから"],"e":"<b>家の片付けそのものよりも、遠くから人が手伝いに来てくれたことが、何よりも励みになった</b>. 心強い = thấy vững dạ, được tiếp thêm sức.","a":0},{"n":52,"q":"<u>②ボランティアの意味</u>について、筆者はどう考えるようになったか。","o":["専門的な技術がなければ、参加すべきではない。","ボランティアは、体力のある人だけがすべきだ。","一緒にいて作業することが、相手の心の支えにもなる。","助けてもらう側が、ボランティアに感謝すべきだ。"],"e":"<b>専門的な技術がなくても、そこにいて一緒に汗を流すことで、相手の心を支えることができる</b>. Đáp án về kỹ thuật chuyên môn là điều ngược lại.","a":2}]},{"passage":"<p>（2）</p><p>　かつて動物園は、珍しい動物を見せて人々を楽しませる場所だった。しかし今、動物園の役割は大きく変わりつつある。その一つが、<u>①絶滅のおそれがある動物を守ること</u>である。野生での数が減った動物を園内で繁殖させ、その一部を自然に帰す取り組みが、世界各地で進められている。</p><p>　展示の方法も変わってきた。以前は、狭いおりの中に動物を入れて見せることが多かった。最近では、動物が本来暮らしている環境に近づけた空間をつくり、その中で自然な行動を見られるようにする動物園が増えている。泳ぐ、木に登る、獲物を探すといった姿を見ることで、来園者はその動物が野生でどのように生きているのかを知ることができる。</p><p>　もちろん、動物を囲いの中で飼うこと自体を疑問視する声もある。しかし、多くの人が実際に動物を見て、その魅力や置かれている状況を知ることが、自然を守ろうとする意識につながるのも事実だ。<u>②動物園は、人と野生をつなぐ窓</u>としての役割を担っているのである。</p>","qs":[{"n":53,"q":"<u>①絶滅のおそれがある動物を守ること</u>のために、動物園は何をしているか。","o":["珍しい動物を、世界中から集めている。","動物を狭いおりに入れて、安全に管理している。","来園者の数を制限している。","園内で動物を増やし、一部を自然に帰している。"],"e":"Câu ngay sau: <b>園内で繁殖させ、その一部を自然に帰す</b>. 繁殖 (はんしょく) = sinh sản, nhân giống.","a":3},{"n":54,"q":"最近の動物園の展示について、本文に合うものはどれか。","o":["動物が自然な行動をとれる環境をつくっている。","以前より狭い空間で、動物を近くから見せている。","動物に芸をさせて、来園者を楽しませている。","野生の動物を、そのまま園内に放している。"],"e":"<b>本来暮らしている環境に近づけた空間をつくり、その中で自然な行動を見られるようにする</b>. Lồng chật là cách làm cũ (以前は).","a":0},{"n":55,"q":"<u>②動物園は、人と野生をつなぐ窓</u>とはどういうことか。","o":["動物園は、野生の動物が自由に出入りできる場所だ。","動物園の窓から、野生の動物を観察できる。","動物園は、人と動物が一緒に暮らす場所だ。","動物を実際に見ることで、自然を守る意識が生まれる場所だ。"],"e":"Câu trước giải thích: <b>実際に動物を見て…知ることが、自然を守ろうとする意識につながる</b>. 窓 ở đây là nghĩa bóng: cánh cửa giúp con người hiểu về thế giới hoang dã.","a":3}]},{"passage":"<p>（3）</p><p>　「やる気が出たら始めよう」。そう思っているうちに、一日が終わってしまった経験は誰にでもあるだろう。多くの人は、やる気があるから行動できるのだと考えている。しかし、実際には<u>①その逆</u>であることが多いという。</p><p>　脳は、何かを始めると、それを続けようとする性質を持っているとされる。最初は気が進まなくても、手を動かしているうちに、だんだん集中してくる。掃除をするつもりはなかったのに、机の上を少し片付け始めたら、気づけば部屋中をきれいにしていた、ということはないだろうか。やる気は、行動する前ではなく、<u>②行動した後</u>についてくるものなのだ。</p><p>　だとすれば、やる気が出ないときにすべきことは、やる気が出るのを待つことではない。まずは五分だけ、あるいは一行だけと決めて、とにかく始めてしまうことだ。小さな一歩が、次の一歩を呼んでくれる。</p>","qs":[{"n":56,"q":"<u>①その逆</u>とはどういうことか。","o":["行動するから、やる気が出てくるということ","やる気があっても、行動できないということ","やる気がないと、何もできないということ","行動しても、やる気は出ないということ"],"e":"Ngược với suy nghĩ có động lực mới hành động là <b>hành động rồi mới có động lực</b>. Đoạn 2 xác nhận: <b>やる気は…行動した後についてくる</b>.","a":0},{"n":57,"q":"掃除の例は、何を説明するために挙げられているか。","o":["掃除は、気分を変えるのに役立つこと","部屋が汚いと、やる気が出ないこと","少し始めると、その作業を続けたくなること","計画を立ててから作業するべきこと"],"e":"Ví dụ dọn bàn một chút rồi dọn cả phòng minh họa cho ý <b>何かを始めると、それを続けようとする性質</b> của não bộ.","a":2},{"n":58,"q":"筆者によると、やる気が出ないときはどうすればよいか。","o":["やる気が出るまで、ゆっくり休む。","やる気が出る方法を、本で調べる。","作業の目標を、できるだけ高く設定する。","短い時間でもよいので、まず始めてみる。"],"e":"<b>まずは五分だけ、あるいは一行だけと決めて、とにかく始めてしまうこと</b>. Tác giả nói rõ không nên chờ động lực đến (待つことではない).","a":3}]}]},{"id":"r10","title":"問題10 内容理解（長文）","en":"Đọc hiểu: đoạn dài","instr":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　新しい感染症が広がったとき、専門家の発言が日によって変わることに、不信感を抱いた人は多かったのではないか。昨日は「マスクは効果が薄い」と言っていたのに、今日は「マスクをすべきだ」と言う。いったい何を信じればいいのかと、戸惑った人もいるだろう。</p><p>　しかし、<u>①専門家の意見が変わること</u>は、必ずしも悪いことではない。科学とは、もともとそういうものだからだ。科学者は、その時点で手に入るデータをもとに、最も確からしい説明を考える。新しいデータが得られれば、それに合わせて考えを修正する。意見が変わるのは、科学が正しく機能している証拠でもあるのだ。</p><p>　問題は、私たちが科学に「絶対に正しい答え」を求めすぎていることにある。病気や災害のように、生活や命に関わる場面ではなおさらだ。不安な状況にいると、人ははっきりとした答えを欲しがる。そのため、「わかっていないことがある」と正直に言う専門家よりも、自信を持って断言する人の言葉のほうが、信頼できるように聞こえてしまう。<u>②これは危うい</u>。</p><p>　専門家の側にも、伝え方の工夫が必要だろう。何がわかっていて、何がまだわかっていないのか。なぜ以前の意見を変えたのか。そうしたことを丁寧に説明すれば、意見の変化に対する不信感は和らぐはずだ。</p><p>　科学は、完成した答えの集まりではなく、答えに近づくための方法である。その性質を理解していれば、専門家の意見が変わったときにも、慌てずに受け止めることができる。不確かさを含めて科学と付き合うこと。それが、情報があふれる時代に私たちに求められている姿勢なのではないだろうか。</p>","qs":[{"n":59,"q":"<u>①専門家の意見が変わること</u>について、筆者はどう考えているか。","o":["専門家の能力が足りないことを示している。","人々を混乱させるので、避けるべきだ。","新しいデータに合わせて考えを直すのは、科学として当然のことだ。","政府の指示によって起こることが多い。"],"e":"<b>新しいデータが得られれば…修正する。意見が変わるのは、科学が正しく機能している証拠</b>. 必ずしも悪いことではない = không hẳn là xấu.","a":2},{"n":60,"q":"<u>②これは危うい</u>とあるが、何が危ういのか。","o":["専門家が、わからないことを正直に言うこと","断言する人の言葉のほうが、信頼できるように感じてしまうこと","不安なときに、専門家の意見を聞くこと","科学のデータが、毎日変わってしまうこと"],"e":"これ chỉ câu ngay trước: <b>自信を持って断言する人の言葉のほうが、信頼できるように聞こえてしまう</b>. Nói thật là chưa biết thì tác giả coi là trung thực, không phải nguy hiểm.","a":1},{"n":61,"q":"筆者は、専門家にどのようなことを求めているか。","o":["できるだけ意見を変えないようにすること","わかっていることといないこと、意見を変えた理由を丁寧に説明すること","わからないことがあっても、はっきり断言すること","新しいデータを、一般の人に公開しないこと"
