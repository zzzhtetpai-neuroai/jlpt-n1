はなく、人々の暮らしの中で使われ続けることにあるのではないか。守るべきなのは、形そのものではなく、使う人のことを考えて工夫を重ねるという職人の姿勢なのだと思う。</p>","qs":[{"n":59,"q":"伝統工芸が存続の危機にある理由として、本文で述べられているものはどれか。","o":["技術が古くなり、製品が使えなくなったから","海外の製品に人気を奪われたから","需要が減り、職人として生活していくのが難しくなっているから","修業の方法が大きく変わったから"],"e":"Đoạn 1: <b>需要が減り…生活していけるだけの収入を得るのは容易ではない</b>. Hàng nước ngoài thì không được nhắc đến.","a":2},{"n":60,"q":"筆者が<u>①伝統を守ることと、何も変えないことは同じではない</u>と考えるのはなぜか。","o":["伝統は、各時代の職人が工夫を重ねることで受け継がれてきたから","昔の技術には、もう価値がないから","伝統工芸は、美術館で守られるべきだから","新しい技術のほうが、昔の技術より優れているから"],"e":"<b>それぞれの時代の職人が…工夫を重ねてきたからこそ、技術は今日まで生き残ってきた</b>. Tác giả không nói kỹ thuật cũ vô giá trị (đoạn 2 thừa nhận 知恵が詰まっている).","a":0},{"n":61,"q":"<u>②こうした変化</u>とはどのようなことか。","o":["伝統的な技法をやめて、機械で製品を作ること","伝統的な技法を守りながら、今の生活に合った製品を作ること","海外の職人に製造を任せること","製品の値段を下げて、多く売ること"],"e":"Câu ngay trước: <b>伝統的な技法は守りつつ、今の生活で使いやすい形にした</b>. Kỹ thuật truyền thống vẫn được GIỮ, nên đáp án nói bỏ kỹ thuật truyền thống là sai.","a":1},{"n":62,"q":"この文章で筆者が最も言いたいことは何か。","o":["伝統工芸は、昔のやり方を変えずに守るべきだ。","伝統工芸の作品は、美術館で大切に保存すべきだ。","伝統工芸は、暮らしの中で使われるよう工夫を続けることが大切だ。","若い職人は、海外で新しい技術を学ぶべきだ。"],"e":"Đoạn cuối là ý chính: giá trị thật là <b>暮らしの中で使われ続けること</b>, và điều cần giữ là <b>工夫を重ねるという職人の姿勢</b>. Giữ nguyên cách làm cũ là quan điểm mà tác giả phản bác.","a":2}]}]},{"id":"r11","title":"問題11 統合理解","en":"Đọc so sánh A và B","instr":"次のAとBの文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p><b>A</b></p><p>　現金を使わないキャッシュレス決済には多くの利点がある。支払いが短時間で済むため、レジの待ち時間が短くなる。店側にとっても、現金を数えたり銀行に運んだりする手間が省け、人手不足の解消につながる。さらに、支払いの記録が自動的に残るので、家計の管理もしやすい。災害で停電すると使えないという心配もあるが、全体としては社会の効率を高める仕組みであり、さらに普及を進めるべきだ。</p><p><b>B</b></p><p>　キャッシュレス化が進むのは時代の流れだろう。支払いが簡単になり、店の作業が減るのは確かだ。しかし、高齢者などスマートフォンの操作に慣れていない人にとっては、かえって不便になる場合もある。また、手軽に支払えるため、つい使いすぎてしまうという声も聞く。停電や通信障害のときに支払いができなくなる危険もある。キャッシュレス化を進めるにしても、現金を使える環境は残しておくべきだ。</p>","qs":[{"n":63,"q":"AとBのどちらの文章でも述べられていることは何か。","o":["支払いの記録が残り、家計を管理しやすいこと","高齢者にとって不便な場合があること","キャッシュレス決済によって、店の作業が減ること","手軽なため、お金を使いすぎてしまうこと"],"e":"A: <b>現金を数えたり…手間が省け</b>. B: <b>店の作業が減るのは確かだ</b>. Cả hai đều nói. Quản lý chi tiêu chỉ có ở A, người già và tiêu quá tay chỉ có ở B.","a":2},{"n":64,"q":"キャッシュレス化について、AとBはどのように述べているか。","o":["AもBも、現金を完全になくすべきだと述べている。","Aはさらに進めるべきだと述べ、Bは現金を使える環境も残すべきだと述べている。","Aは停電の問題を重視して慎重な立場をとり、Bは積極的に進めるべきだと述べている。","AもBも、高齢者への配慮が最も重要だと述べている。"],"e":"So sánh câu cuối: A <b>さらに普及を進めるべきだ</b>, B <b>現金を使える環境は残しておくべきだ</b>. A có nhắc mất điện nhưng vẫn ủng hộ (心配もあるが), nên đáp án nói A thận trọng là sai.","a":1}]}]},{"id":"r12","title":"問題12 主張理解（長文）","en":"Đọc hiểu: quan điểm tác giả","instr":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　「すぐに役に立つ知識を身につけたい」。最近、大学生からよくこう言われる。就職に有利な資格や、仕事ですぐに使える技術を学びたいという気持ちはよくわかる。社会の変化が激しく、将来が見通せない時代であればなおさらだ。</p><p>　しかし、<u>①「すぐに役に立つ」ものほど、すぐに役に立たなくなる</u>ということも忘れてはならない。特定の道具の使い方や、ある時点での制度の知識は、技術や社会が変われば、あっという間に古くなってしまう。十年前に最先端だった技術の多くが、今ではほとんど使われていないことを考えれば、それは明らかだろう。</p><p>　では、変化の激しい時代に本当に必要なのは何か。私は、すぐには役に立たないように見える学び、たとえば歴史や哲学、文学といったものの中にこそ、そのヒントがあると考えている。これらは、直接何かの作業に使えるわけではない。しかし、過去の人々がどのように問題に向き合ってきたのかを知り、物事を異なる視点から見る力を養ってくれる。こうした力は、どんなに時代が変わっても古くなることがない。</p><p>　もちろん、実用的な知識が不要だと言うつもりはない。社会で働く以上、具体的な技術は必要だ。問題は、それだけを学びの目的にしてしまうことである。目の前の役に立つかどうかだけで学ぶ内容を選んでいては、学びの幅はどんどん狭くなってしまう。</p><p>　すぐには答えの出ない問いに向き合い、遠回りに見える学びを重ねること。それが結果として、どんな変化にも対応できる、本当の意味での「役に立つ」力になるのではないだろうか。</p>","qs":[{"n":65,"q":"<u>①「すぐに役に立つ」ものほど、すぐに役に立たなくなる</u>とはどういうことか。","o":["役に立つ知識ほど、覚えるのに時間がかかる。","特定の技術や知識は、時代が変わると古くなりやすい。","資格は、就職に有利にはならない。","新しい技術ほど、使い方が難しい。"],"e":"Câu tiếp theo giải thích: <b>特定の道具の使い方や…制度の知識は…あっという間に古くなってしまう</b>. Mẫu ～ほど～ = càng ~ thì càng ~.","a":1},{"n":66,"q":"筆者は、歴史や哲学、文学のような学びについてどう述べているか。","o":["物事を異なる視点から見る力を養ってくれる。","仕事の作業に直接使うことができる。","就職に有利な資格につながる。","学ぶのに時間がかかりすぎる。"],"e":"<b>物事を異なる視点から見る力を養ってくれる</b>. Tác giả nói rõ chúng <b>直接何かの作業に使えるわけではない</b>, nên đáp án dùng trực tiếp cho công việc là sai.","a":0},{"n":67,"q":"筆者は、実用的な知識についてどう考えているか。","o":["大学で学ぶ必要はまったくない。","大学ではなく、会社に入ってから学ぶべきだ。","歴史や哲学よりも重要だ。","必要ではあるが、それだけを学ぶ目的にすべきではない。"],"e":"Đoạn 4: <b>実用的な知識が不要だと言うつもりはない…問題は、それだけを学びの目的にしてしまうこと</b>. Mẫu ～つもりはない。問題は～ rất hay gặp trong 主張理解: tác giả thừa nhận một phần rồi mới đưa ra vấn đề thật.","a":3},{"n":68,"q":"この文章で筆者が最も言いたいことは何か。","o":["大学生は、資格を取ることを最優先にすべきだ。","実用的な知識はすぐ古くなるので、学ぶ必要がない。","歴史や哲学を学べば、就職に有利になる。","すぐには役に立たないように見える学びが、変化に対応する力になる。"],"e":"Đoạn cuối: <b>遠回りに見える学びを重ねること…どんな変化にも対応できる…力になる</b>. Đáp án nói không cần học kiến thức thực dụng mâu thuẫn với đoạn 4.","a":3}]}]},{"id":"r13","title":"問題13 情報検索","en":"Tìm thông tin","instr":"次は、あるカフェのアルバイト募集のお知らせである。下の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<div class='notice'><p style='text-align:center'><b>カフェ「こもれび」　スタッフ募集</b></p><table class='tbl'><tr><th>時間帯</th><th>勤務時間</th><th>時給</th><th>募集曜日</th><th>条件</th></tr><tr><td>朝</td><td>7:00～11:00</td><td>1,150円</td><td>平日のみ</td><td>週3日以上</td></tr><tr><td>昼</td><td>11:00～16:00</td><td>1,100円</td><td>毎日</td><td>週2日以上</td></tr><tr><td>夜</td><td>17:00～22:00</td><td>1,200円</td><td>毎日</td><td>週2日以上<br>高校生不可</td></tr></table><p>※土曜、日曜、祝日は、時給が50円アップします。<br>※働き始めて最初の1か月は研修期間のため、時給は表の金額から100円引きとなります。<br>※交通費は1日500円まで支給します。<br>※留学生も歓迎します（日本語で日常会話ができる方）。</p><p>【応募方法】12月15日までに、電話またはメールでご連絡ください。</p></div>","qs":[{"n":69,"q":"大学生のマイさんは、土曜日と日曜日の夜に働きたいと考えている。働き始めて最初の月、マイさんの時給はいくらか。","o":["1,150円","1,200円","1,250円","1,100円"],"e":"Ca tối: 1,200円. Thứ 7 và Chủ nhật: <b>+50円</b>, thành 1,250円. Tháng đầu là thời gian đào tạo: <b>−100円</b>. Vậy 1,200 + 50 − 100 = <b>1,150円</b>. 1,250円 là bẫy cho người quên trừ tiền đào tạo. Dạng 情報検索 luôn giấu điều kiện trong phần ※.","a":0},{"n":70,"q":"高校生の健太さんは、平日は授業が16時に終わるため、働けるのは平日の17時以降と土曜日だけだ。健太さんが応募できる時間帯はどれか。","o":["昼だけ","応募できる時間帯はない","夜だけ","昼と夜"],"e":"Ngày thường sau 17h chỉ có <b>ca tối</b>, nhưng ca tối <b>高校生不可</b> (không nhận học sinh cấp 3). Còn lại thứ 7 ca trưa, nhưng ca trưa yêu cầu <b>週2日以上</b>, mà cậu ấy chỉ làm được 1 ngày (thứ 7). Vì vậy <b>không ứng tuyển được ca nào</b>. Câu hỏi này cần kiểm tra lần lượt từng điều kiện.","a":1}]}]}];
const SET4 = [{"id":"m1","title":"問題1 漢字読み","en":"Đọc kanji","instr":"＿＿の言葉の読み方として最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":1,"q":"この薬は、治療の方法を大きく変える<u>画期的</u>な発明だ。","o":["かっきてき","がきてき","かくきてき","がっきてき"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 2, lần này hỏi theo dạng khác.</span><br><b>画期的 (かっきてき)</b> = mang tính đột phá. 画 ở đây đọc là <b>かく</b>, đứng trước き nên biến thành âm ngắt <b>かっ</b>. Không đọc là が (như 画家 がか).","a":0}]},{"qs":[{"n":2,"q":"彼は手で<u>拍子</u>を取りながら、楽しそうに歌った。","o":["はくし","びょうし","ひょうし","はくす"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 3, lần này hỏi theo dạng khác.</span><br><b>拍子 (ひょうし)</b> = nhịp, phách. 拍子を取る = giữ nhịp. Bẫy là はく vì 拍手 đọc là はくしゅ, nhưng trong 拍子 thì 拍 đọc là <b>ひょう</b>.","a":2}]},{"qs":[{"n":3,"q":"景気がさらに悪化することが<u>懸念</u>されている。","o":["けんねん","かねん","けねん","けいねん"],"e":"<b>懸念 (けねん)</b> = lo ngại. 懸 thường đọc là けん (懸命 けんめい), nhưng trong 懸念 thì đọc là <b>け</b>. Đây là cách đọc đặc biệt hay ra thi.","a":2}]},{"qs":[{"n":4,"q":"大雪の影響で、荷物の配達が<u>滞って</u>いる。","o":["とどまって","こおって","さえぎって","とどこおって"],"e":"<b>滞る (とどこおる)</b> = bị đình trệ, chậm trễ. とどまる = 留まる (dừng lại, ở lại), こおる = 凍る (đóng băng), さえぎる = 遮る (chắn, ngăn).","a":3}]},{"qs":[{"n":5,"q":"この会社は資金が<u>潤沢</u>で、新しい事業にも積極的だ。","o":["じゅんたく","じゅんだく","うるたく","にんたく"],"e":"<b>潤沢 (じゅんたく)</b> = dồi dào (tiền vốn, tài nguyên). 潤 = じゅん, 沢 = たく (không biến âm thành だく).","a":0}]},{"qs":[{"n":6,"q":"長年の経験で<u>培って</u>きた技術を、若い世代に伝えたい。","o":["やしなって","はぐくんで","まかなって","つちかって"],"e":"<b>培う (つちかう)</b> = vun đắp, bồi dưỡng (kỹ năng, kinh nghiệm). やしなう = 養う (nuôi dưỡng), はぐくむ = 育む (ấp ủ, nuôi dưỡng), まかなう = 賄う (trang trải, đã học ở 模試 2).","a":3}]}]},{"id":"m2","title":"問題2 文脈規定","en":"Từ theo ngữ cảnh","instr":"（　　）に入れるのに最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":7,"q":"この調査結果は、若者の意識の変化を（　　）に表している。","o":["如実","着実","堅実","誠実"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>如実 (にょじつ)に表す</b> = thể hiện một cách rõ ràng, chân thực. 着実 = vững chắc từng bước (着実に進む), 堅実 = chắc chắn, an toàn, 誠実 = thành thật (tính cách).","a":0}]},{"qs":[{"n":8,"q":"医師が不足し、地方の医療は（　　）した状況にある。","o":["圧迫","束縛","緊縮","逼迫"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 3, lần này hỏi theo dạng khác.</span><br><b>逼迫 (ひっぱく)</b> = (tình hình) căng thẳng, thiếu thốn nghiêm trọng. 圧迫 = chèn ép, đè nén, 束縛 = trói buộc, 緊縮 = thắt chặt (ngân sách).","a":3}]},{"qs":[{"n":9,"q":"彼は成長のためなら何でも学ぼうとする、（　　）な姿勢の持ち主だ。","o":["無欲","臆病","貪欲","怠慢"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 2, lần này hỏi theo dạng khác.</span><br><b>貪欲 (どんよく)</b> = tham lam, ở đây mang nghĩa tốt: ham học hỏi. 無欲 = không ham muốn, 臆病 (おくびょう) = nhút nhát, 怠慢 (たいまん) = lười biếng, tắc trách.","a":2}]},{"qs":[{"n":10,"q":"「絶対に遅刻しないように」と、部長に（　　）を刺された。","o":["釘","針","棘","杭"],"e":"<b>釘を刺す (くぎをさす)</b> = nhắc nhở, cảnh cáo trước để người ta không làm sai. Thành ngữ cố định, chỉ dùng 釘 (cái đinh).","a":0}]},{"qs":[{"n":11,"q":"半年かかった工事も、ようやく来月完成する（　　）が立った。","o":["めど","めやす","けじめ","きざし"],"e":"<b>めどが立つ (目処が立つ)</b> = đã thấy được triển vọng hoàn thành. めやす (目安) = tiêu chuẩn tham khảo, けじめ = sự phân định rõ ràng (けじめをつける), きざし (兆し) = dấu hiệu (兆しが見える).","a":0}]},{"qs":[{"n":12,"q":"あの監督は選手に対する評価が（　　）で、小さなミスも見逃さない。","o":["ルーズ","シビア","ナイーブ","マイルド"],"e":"<b>シビア</b> = nghiêm khắc, khắt khe. ルーズ = lỏng lẻo, cẩu thả, ナイーブ = nhạy cảm, ngây thơ, マイルド = nhẹ nhàng, dịu.","a":1}]},{"qs":[{"n":13,"q":"台風の接近で、今日の午後の便は（　　）欠航となった。","o":["軒並み","人並み","月並み","足並み"],"e":"<b>軒並み (のきなみ)</b> = đồng loạt, tất cả đều. 人並み = như người bình thường, 月並み = tầm thường, 足並み = bước chân, sự đồng bộ (足並みをそろえる).","a":0}]}]},{"id":"m3","title":"問題3 言い換え類義","en":"Từ gần nghĩa","instr":"＿＿の言葉に意味が最も近いものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":14,"q":"平日の遊園地は<u>閑散としていた</u>。","o":["にぎやかだった","閉まっていた","古びていた","人が少なかった"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>閑散 (かんさん)としている</b> = vắng vẻ, thưa người. Gần nhất là 人が少なかった. にぎやかだった là trái nghĩa.","a":3}]},{"qs":[{"n":15,"q":"田中さんは<u>寡黙な</u>人だ。","o":["口数が少ない","友人が少ない","まじめな","気が短い"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 3, lần này hỏi theo dạng khác.</span><br><b>寡黙 (かもく)</b> = ít nói. Gần nhất là 口数が少ない (くちかず = số lời nói). 寡 nghĩa là ít, 黙 nghĩa là im lặng.","a":0}]},{"qs":[{"n":16,"q":"空が<u>にわかに</u>暗くなった。","o":["少しずつ","完全に","急に","再び"],"e":"<b>にわかに (俄かに)</b> = đột nhiên, bất chợt. Gần nhất là 急に. Từ liên quan: にわか雨 = mưa rào bất chợt.","a":2}]},{"qs":[{"n":17,"q":"彼女は料理の<u>手際がいい</u>。","o":["やり方が上手で速い","味つけがうまい","知識が多い","道具がそろっている"],"e":"<b>手際 (てぎわ)がいい</b> = làm việc khéo và nhanh gọn. Nói về cách làm, không phải về mùi vị (味つけ).","a":0}]},{"qs":[{"n":18,"q":"事故の状況を<u>つぶさに</u>報告した。","o":["詳しく","すぐに","簡単に","正直に"],"e":"<b>つぶさに</b> = một cách chi tiết, tỉ mỉ. Gần nhất là 詳しく, 細かく.","a":0}]},{"qs":[{"n":19,"q":"請求書の金額を見て<u>仰天した</u>。","o":["腹が立った","非常に驚いた","がっかりした","安心した"],"e":"<b>仰天 (ぎょうてん)する</b> = vô cùng kinh ngạc. Hay gặp: びっくり仰天.","a":1}]}]},{"id":"m4","title":"問題4 用法","en":"Cách dùng từ","instr":"次の言葉の使い方として最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":20,"q":"<b>捻出</b>","o":["工場から汚れた水が川に捻出している。","この地方は、おいしい米を捻出することで有名だ。","足首を捻出して、歩けなくなった。","忙しい中、なんとか時間を捻出して、資格の勉強を続けている。"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>捻出 (ねんしゅつ)</b> = xoay xở để có được (thời gian, tiền). Nước chảy ra là 流出, sản xuất gạo là 産出 hoặc 生産, trật mắt cá là 捻挫 (ねんざ).","a":3}]},{"qs":[{"n":21,"q":"<b>覆す</b>","o":["寒いので、子どもに毛布を覆してあげた。","彼は周囲の予想を覆して、見事に優勝した。","雪が町全体を白く覆している。","本のページを覆して、続きを読んだ。"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 3, lần này hỏi theo dạng khác.</span><br><b>覆す (くつがえす)</b> = lật ngược (dự đoán, quyết định, lẽ thường). Đắp chăn là かける, tuyết phủ là 覆う (おおう, cùng chữ kanji nhưng khác động từ), lật trang là めくる.","a":1}]},{"qs":[{"n":22,"q":"<b>ありきたり</b>","o":["彼はありきたりに遅刻するので、もう誰も驚かない。","この店は人気で、ありきたりに客が並んでいる。","ありきたりの言葉では、この感動は伝えられない。","祖母からもらった、世界に一つのありきたりの指輪だ。"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 2, lần này hỏi theo dạng khác.</span><br><b>ありきたり</b> = tầm thường, đâu cũng có. Dùng dạng ありきたりの + danh từ. Không dùng như trạng từ chỉ tần suất (いつも). Câu về chiếc nhẫn thì mâu thuẫn với 世界に一つ (duy nhất trên đời).","a":2}]},{"qs":[{"n":23,"q":"<b>裏腹</b>","o":["このコインは、裏腹が同じ模様になっている。","彼とは子どものころからの裏腹の友人だ。","強気な言葉とは裏腹に、彼の手は震えていた。","急いでいて、シャツを裏腹に着てしまった。"],"e":"<b>～とは裏腹に (うらはらに)</b> = trái ngược với ~. Hai mặt đồng xu là 表と裏 (裏表), mặc áo trái là 裏返し (うらがえし).","a":2}]},{"qs":[{"n":24,"q":"<b>怠る</b>","o":["休日は、家で一日中怠っていた。","準備を怠ったせいで、発表は失敗に終わった。","風邪のせいで、体が怠っている。","この時計は、毎日五分ずつ怠っている。"],"e":"<b>怠る (おこたる)</b> = lơ là, không làm việc cần làm. Luôn có tân ngữ: 準備を怠る, 注意を怠る. Lười biếng nằm nhà là 怠ける (なまける), người mệt mỏi là だるい, đồng hồ chậm là 遅れる.","a":1}]},{"qs":[{"n":25,"q":"<b>当てはまる</b>","o":["ボールが窓に当てはまって、ガラスが割れた。","予想が当てはまって、宝くじに当選した。","次の条件に当てはまる人は、受付に申し出てください。","彼は新しい仕事によく当てはまっている。"],"e":"<b>当てはまる</b> = phù hợp, đúng với (điều kiện, quy tắc, trường hợp). Bóng trúng cửa sổ là 当たる, dự đoán trúng là 当たる, hợp với công việc là 向いている.","a":2}]}]},{"id":"m5","title":"問題5 文法形式の判断","en":"Ngữ pháp","instr":"次の文の（　　）に入れるのに最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":26,"q":"東京公演（　　）、全国十都市でコンサートが行われる。","o":["を皮切りに","を限りに","をおして","をよそに"],"e":"<b>Nを皮切りに (かわきりに)</b> = bắt đầu từ N, sau đó liên tiếp diễn ra. を限りに = kể từ N là chấm dứt, をおして = bất chấp (bệnh, phản đối), をよそに = mặc kệ.","a":0}]},{"qs":[{"n":27,"q":"この祭りでは、この地方（　　）の料理が楽しめる。","o":["なりの","ごとき","まみれ","ならでは"],"e":"<b>Nならではの</b> = chỉ N mới có, đặc trưng của N. なりの = theo cách riêng của (私なりの考え), ごとき = như là, cỡ như (coi thường), まみれ = dính đầy.","a":3}]},{"qs":[{"n":28,"q":"夜中に大声で騒ぐなんて、迷惑（　　）。","o":["の至りだ","にあたらない","までもない","極まりない"],"e":"<b>Na + 極まりない (きわまりない)</b> = vô cùng, hết sức (thường là chê trách): 迷惑極まりない, 失礼極まりない. の至りだ dùng với 光栄, 感激 (光栄の至り). にあたらない = không đáng phải.","a":3}]},{"qs":[{"n":29,"q":"彼は会社に勤める（　　）、小説を書いている。","o":["がてら","そばから","かたわら","なり"],"e":"<b>Vる かたわら</b> = vừa làm công việc chính, vừa làm thêm việc khác (trong thời gian dài). がてら đi với danh từ hoặc Vます bỏ ます (散歩がてら). そばから = vừa làm xong đã lại, なり = vừa mới làm thì ngay lập tức.","a":2}]},{"qs":[{"n":30,"q":"彼は部屋に入る（　　）、大声で怒鳴り始めた。","o":["べく","なり","ものの","ゆえ"],"e":"<b>Vる なり</b> = vừa V xong thì ngay lập tức (hành động bất ngờ, cùng một chủ ngữ). べく = để (mục đích), ものの = tuy nhưng, ゆえ = vì.","a":1}]},{"qs":[{"n":31,"q":"彼は若さ（　　）、無謀な挑戦をしてしまうことがある。","o":["ながらに","なりに","ごとく","ゆえに"],"e":"<b>Nゆえに</b> = vì N (văn viết, trang trọng). 若さゆえに = vì còn trẻ. ながらに = trong trạng thái (涙ながらに), なりに = theo cách của, ごとく = giống như.","a":3}]},{"qs":[{"n":32,"q":"君の将来を思え（　　）、こんなに厳しいことを言うのだ。","o":["ども","ば最後","ばまだしも","ばこそ"],"e":"<b>Vば こそ</b> = chính vì V (nhấn mạnh lý do tích cực). 思えばこそ = chính vì nghĩ cho em. ども = dù có, たら最後 = một khi đã thì hết, ならまだしも = nếu là thì còn được.","a":3}]},{"qs":[{"n":33,"q":"誰も手伝ってくれないのなら、一人でやる（　　）。","o":["しまつだ","かぎりだ","までだ","までもない"],"e":"<b>Vる までだ</b> = thì chỉ còn cách V thôi (thể hiện quyết tâm). しまつだ = rốt cuộc đến nỗi (kết quả xấu), かぎりだ = vô cùng (うれしいかぎりだ), までもない = không cần phải.","a":2}]},{"qs":[{"n":34,"q":"本日（　　）、当店は閉店いたします。長い間ありがとうございました。","o":["をおいて","をめぐって","をもって","をかねて"],"e":"<b>Nをもって</b> = tính đến N là (kết thúc). Dùng trong thông báo trang trọng: 本日をもって閉店. をおいて = ngoài ra không, をめぐって = xoay quanh, をかねて = kiêm.","a":2}]},{"qs":[{"n":35,"q":"いくら親しい友人（　　）、礼儀は守るべきだ。","o":["とあって","ともなると","ときたら","といえども"],"e":"<b>Nといえども</b> = cho dù là N đi nữa. Thường đi với いくら, たとえ. とあって = vì là, ともなると = một khi đã là, ときたら = nói đến (chê).","a":3}]}]},{"id":"m6","title":"問題6 文の組み立て","en":"Sắp xếp câu","instr":"次の文の ★ に入る最もよいものを、1、2、3、4から一つ選びなさい。","fixed":true,"pages":[{"qs":[{"n":36,"q":"今年の冬の寒さは、＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ なりそうだ。","o":["厳しい","例年","ものに","にもまして"],"a":0,"e":"Thứ tự đúng: 例年 にもまして <b>厳しい</b> ものに (2 4 1 3). <b>Nにもまして</b> = hơn cả N. ★ là 厳しい."}]},{"qs":[{"n":37,"q":"この製品は、実際に ＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ わからない。","o":["良さは","使って","みない","ことには"],"a":3,"e":"Thứ tự đúng: 使って みない <b>ことには</b> 良さは (2 3 4 1). <b>Vない ことには～ない</b> = nếu không V thì không thể. ★ là ことには."}]},{"qs":[{"n":38,"q":"この大会には、＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 選手が参加する。","o":["二十か国の","とする","日本","をはじめ"],"a":1,"e":"Thứ tự đúng: 日本 をはじめ <b>とする</b> 二十か国の (3 4 2 1). <b>NをはじめとするN</b> = N, tiêu biểu là N. ★ là とする."}]},{"qs":[{"n":39,"q":"彼は ＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 、料理の味にはうるさい。","o":["長年","だけに","していた","シェフを"],"a":2,"e":"Thứ tự đúng: 長年 シェフを <b>していた</b> だけに (1 4 3 2). <b>～だけに</b> = chính vì ~ nên (đương nhiên). ★ là していた."}]},{"qs":[{"n":40,"q":"今から ＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 間に合わないだろう。","o":["とても","行った","タクシーで","ところで"],"a":3,"e":"Thứ tự đúng: タクシーで 行った <b>ところで</b> とても (3 2 4 1). <b>Vたところで～ない</b> = dù có V cũng không. とても～ない = hoàn toàn không thể. ★ là ところで."}]}]},{"id":"m7","title":"問題7 文章の文法","en":"Ngữ pháp trong đoạn văn","instr":"次の文章を読んで、文章全体の内容を考えて、41 から 45 の中に入る最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　三年前から、毎晩寝る前に日記をつけている。（41）、立派なことを書いているわけではない。その日に食べたものや、会った人、ふと感じたことを、数行書くだけだ。</p><p>　始めたころは、三日も続けば（42）と思っていた。子どものころから、何をやっても長続きしなかったからだ。ところが、不思議なことに今回は続いている。おそらく、うまく書こうと（43）のがよかったのだろう。</p><p>　先日、一年前の日記を読み返してみた。当時、仕事のことでひどく悩んでいたことが書かれていたが、今となっては、何をそんなに悩んでいたのか思い出せない（44）。そのとき、今抱えている悩みも、一年後にはきっと小さなものになっているだろうと思えた。</p><p>　日記は、過去の自分からの手紙のようなものだ。これからも、無理のない範囲で書き（45）。</p>","qs":[{"n":41,"q":"（41）","o":["そのうえ","といっても","したがって","それどころか"],"e":"Câu trước: tôi viết nhật ký mỗi tối. Câu sau: nhưng không phải viết điều gì to tát. Đây là ý đính chính, giảm nhẹ câu trước, nên dùng <b>といっても</b> (nói vậy chứ). そのうえ = hơn nữa, したがって = do đó.","a":1},{"n":42,"q":"（42）","o":["いいものだ","いいほうだ","いいはずだ","いいわけだ"],"e":"<b>三日も続けばいいほうだ</b> = kéo dài được ba ngày đã là khá rồi. ～ばいいほうだ là mẫu nói về kỳ vọng thấp. Câu sau giải thích: từ nhỏ làm gì cũng không bền.","a":1},{"n":43,"q":"（43）","o":["しなかった","したかった","しすぎた","するしかなかった"],"e":"Lý do duy trì được: vì <b>không cố viết cho hay</b> (うまく書こうとしなかった). Khớp với đoạn 1: chỉ viết vài dòng đơn giản.","a":0},{"n":44,"q":"（44）","o":["べきだ","ためだ","ものか","ほどだ"],"e":"<b>思い出せないほどだ</b> = đến mức không nhớ nổi. ～ほどだ diễn tả mức độ. べきだ = nên, ためだ = là vì, ものか = làm gì có chuyện.","a":3},{"n":45,"q":"（45）","o":["続けていきたい","続けてきた","続けるところだった","続けたものだ"],"e":"これからも = từ nay về sau, nên cần ý hướng tới tương lai: <b>書き続けていきたい</b>. てきた là từ trước đến nay, るところだった = suýt nữa, たものだ = ngày xưa thường.","a":0}]}]},{"id":"r8","title":"問題8 内容理解（短文）","en":"Đọc hiểu: đoạn ngắn","instr":"次の（1）から（4）の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>（1）</p><p>　完璧を目指すことは、一見よいことのように思える。しかし、完璧でなければ意味がないと考える人は、失敗を恐れるあまり、なかなか物事を始められない。始めたとしても、細かい部分にこだわりすぎて、期限に間に合わないこともある。まずは六割の出来でもよいから形にし、そこから直していくほうが、結果としてよいものができることが多い。</p>","qs":[{"n":46,"q":"筆者によると、完璧を目指す人が陥りやすいことは何か。","o":["細かい部分まで工夫するため、結果としてよいものが仕上がる。","うまくいかないことを恐れて、取りかかるのが遅れてしまう。","六割の出来で満足してしまい、その後の改善を怠る。","他人の評価を気にして、作業を人に任せられない。"],"e":"Bài viết: <b>失敗を恐れるあまり、なかなか物事を始められない</b>. Đáp án đúng nói lại bằng từ khác (取りかかるのが遅れる). Bẫy: chú ý vào chi tiết thì bài nói là trễ hạn, không phải ra sản phẩm tốt. 六割 là lời khuyên của tác giả, không phải tật xấu.","a":1}]},{"passage":"<p>（2）</p><p>以下は、ある市が住民に出したお知らせである。</p><div class='notice'><p style='text-align:center'><b>年末年始のごみ収集について</b></p><p>　年末年始は、ごみの収集日が下記のとおり変更になります。</p><p>燃えるごみ：年内は12月29日（火）が最終、年始は1月5日（火）から<br>資源ごみ：年内は12月24日（木）が最終、年始は1月7日（木）から</p><p>　なお、12月30日から1月3日までは、清掃センターへの持ち込みも受け付けておりません。年内に持ち込みを希望される方は、12月29日までに、電話で予約のうえお越しください。予約のない持ち込みはお断りしています。</p></div>","qs":[{"n":47,"q":"このお知らせの内容と合うものはどれか。","o":["資源ごみは、12月29日まで収集される。","12月30日以降に出た燃えるごみは、1月5日まで収集に出せない。","予約をすれば、12月30日にも清掃センターに持ち込める。","1月5日からは、燃えるごみも資源ごみも収集が始まる。"],"e":"Rác cháy được: lần thu cuối năm là <b>29/12</b>, năm mới bắt đầu <b>5/1</b>, nên rác sinh ra sau 30/12 phải đợi đến 5/1. Bẫy: rác tài nguyên kết thúc ngày <b>24/12</b> và bắt đầu lại <b>7/1</b>. Từ 30/12 đến 3/1 không nhận mang đến dù có đặt trước.","a":1}]},{"passage":"<p>（3）</p><p>　天気予報で「降水確率50％」と聞くと、一日の半分の時間、雨が降ると思う人がいる。あるいは、地域の半分で雨が降ると考える人もいる。しかし、これはどちらも誤解だ。降水確率とは、同じような気象条件の日が100回あった場合、そのうち何回、1ミリ以上の雨が降るかを示したものである。雨の強さや降る時間の長さは、この数字からはわからない。</p>","qs":[{"n":48,"q":"降水確率が「80％」の日について、本文から言えることはどれか。","o":["一日のほとんどの時間、雨が降り続くということ","50％の日よりも、強い雨が降るということ","同じような気象条件の日の多くで、1ミリ以上の雨が降ったということ","その地域の8割の場所で、雨が降るということ"],"e":"Theo định nghĩa trong bài: trong 100 ngày điều kiện giống nhau thì có 80 ngày mưa từ 1mm trở lên. Bài nói rõ <b>雨の強さや降る時間の長さは…わからない</b>, nên mưa to hơn hay mưa lâu hơn đều là bẫy.","a":2}]},{"passage":"<p>（4）</p><p>　幼い子どもは、「なぜ空は青いの」「なぜ夜は暗いの」と、大人を質問攻めにする。忙しいときには、つい「そういうものなの」と片付けてしまいがちだ。しかし、正確な答えを教えることよりも大切なのは、「どうしてだと思う？」と一緒に考える姿勢ではないだろうか。答えそのものより、不思議に思う気持ちを受け止めてもらった経験が、子どもの学ぶ意欲を育てるのだ。</p>","qs":[{"n":49,"q":"筆者の考えに合うものはどれか。","o":["忙しいときは、「そういうものだ」と答えるのもしかたがない。","子どもの学ぶ意欲は、正確な知識を得ることで育つ。","大人が答えを知らない質問には、答えないほうがよい。","子どもの疑問に正しい答えを返すことが、最も重要なわけではない。"],"e":"<b>正確な答えを教えることよりも大切なのは…一緒に考える姿勢</b>. Đáp án đúng nói ngược lại cùng ý: trả lời đúng không phải điều quan trọng nhất. Bẫy: bài chỉ nói người lớn hay trả lời qua loa (～がちだ), không hề tán thành điều đó.","a":3}]}]},{"id":"r9","title":"問題9 内容理解（中文）","en":"Đọc hiểu: đoạn vừa","instr":"次の（1）から（3）の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>（1）</p><p>　四十歳を過ぎたころ、健康診断の結果をきっかけに走り始めた。最初は五分走っただけで息が上がり、情けない思いをした。それでも、週に三回、近所の川沿いを走ることだけは続けた。</p><p>　三か月ほどたったころ、<u>①変化</u>に気づいた。体重はほとんど減っていなかったが、朝すっきりと目が覚めるようになり、仕事中にいらいらすることが減ったのだ。体を動かすことが、これほど気分に影響するとは思ってもみなかった。</p><p>　走っている間は、不思議と頭の中が静かになる。仕事の心配事や人間関係の悩みも、足を前に出すことに集中しているうちに、どこかへ消えていく。走り終えたころには、問題そのものは何も解決していないのに、<u>②なんとかなるだろうという気持ち</u>になっている。</p><p>　今では、タイムを縮めたいとも、大会に出たいとも思わない。ただ、走ることが、私にとって心を整えるための大切な時間になっている。</p>","qs":[{"n":50,"q":"走り始めて三か月ほどたったころの筆者について、本文の内容と合うものはどれか。","o":["体重が減ったことで、仕事の効率が上がった。","見た目の変化は小さかったが、生活の調子が整ってきた。","毎日走れるようになり、大会を目指し始めた。","仕事の悩みが、走ることですべて解決した。"],"e":"<b>体重はほとんど減っていなかったが</b>, nhưng ngủ dậy sảng khoái và bớt cáu gắt, tức là nhịp sinh hoạt tốt lên. Bẫy: cân nặng KHÔNG giảm. Tác giả chạy tuần 3 lần, và không muốn thi đấu.","a":1},{"n":51,"q":"「問題そのものは何も解決していないのに」とあるが、ここから筆者のどのような考えがわかるか。","o":["走っても悩みが消えないので、あまり意味がない。","走っている間に、問題の解決策が見つかることが多い。","走ることで変わるのは、状況ではなく物事の受け止め方だ。","悩みがあるときは、走るのを控えたほうがよい。"],"e":"Vấn đề vẫn còn nguyên, nhưng tâm trạng chuyển thành <b>なんとかなるだろう</b>. Vậy thứ thay đổi là cách nhìn nhận, không phải tình hình. Câu hỏi này đòi suy luận, đáp án không có sẵn nguyên văn trong bài.","a":2},{"n":52,"q":"筆者にとって、走ることはどのようなものになっているか。","o":["記録や目標のためではなく、気持ちを落ち着かせるための習慣","健康診断の数値を改善するための手段","いつか大会に出るための準備","人間関係の悩みから逃げるための方法"],"e":"<b>タイムを縮めたいとも、大会に出たいとも思わない…心を整えるための大切な時間</b>. Bẫy: kiểm tra sức khỏe chỉ là lý do BẮT ĐẦU chạy. Chạy cũng không phải để trốn tránh (逃げる), mà để ổn định tâm trí.","a":0}]},{"passage":"<p>（2）</p><p>　まだ食べられるのに捨てられてしまう食品、いわゆる「食品ロス」が問題になっている。その原因の一つに、食品の期限表示に対する誤解がある。</p><p>　食品の期限には、「消費期限」と「賞味期限」の二種類がある。消費期限は、弁当や生肉など傷みやすい食品に表示され、その日を過ぎたら食べないほうがよいという期限だ。一方、賞味期限は、スナック菓子や缶詰など比較的長持ちする食品に表示され、おいしく食べられる期限を示している。つまり、<u>①賞味期限を過ぎても、すぐに食べられなくなるわけではない</u>。</p><p>　ところが、この二つを区別せず、賞味期限が一日でも過ぎた食品を捨ててしまう人は少なくない。また、店で買うときに、少しでも期限の長い商品を棚の奥から取る人も多い。その結果、手前の商品が売れ残り、捨てられることになる。</p><p>　最近では、すぐに食べる場合は手前の商品から取るよう呼びかける店も増えてきた。<u>②一人一人の小さな行動</u>が、食品ロスを減らすことにつながるのである。</p>","qs":[{"n":53,"q":"筆者によると、食品ロスが生まれる原因の一つは何か。","o":["消費期限が、実際より短く表示されていること","店が、期限の長い商品を棚の奥に並べていること","期限表示の意味が、正しく理解されていないこと","傷みやすい食品が、多く売られていること"],"e":"<b>原因の一つに、食品の期限表示に対する誤解がある</b>. Bẫy: bài nói KHÁCH lấy hàng ở phía trong kệ, không nói cửa hàng cố tình xếp ở trong (đổi chủ ngữ).","a":2},{"n":54,"q":"本文の内容と合うものはどれか。","o":["弁当は、賞味期限を過ぎても、すぐに食べられなくなるわけではない。","缶詰は、表示された期限を少し過ぎても、すぐに食べられなくなるわけではない。","消費期限は、おいしく食べられる期限を示している。","賞味期限が過ぎた食品は、店で売ってはいけないことになっている。"],"e":"Đồ hộp ghi <b>賞味期限</b> (hạn ăn ngon), nên quá một chút vẫn ăn được. Bẫy: cơm hộp ghi <b>消費期限</b>, không phải 賞味期限. Đáp án thứ ba đổi chỗ hai định nghĩa. Bài không nói gì về luật bán hàng.","a":1},{"n":55,"q":"筆者の考えに沿った行動として、最も適当なものはどれか。","o":["少しでも長く保存できるよう、棚の奥から期限の長い牛乳を取る。","賞味期限を一日過ぎた缶詰を、念のため捨てる。","今日の夕食に使う牛乳を、棚の手前から取る。","傷みやすい食品は、できるだけ買わないようにする。"],"e":"Dạng câu hỏi áp dụng: bài khuyên <b>すぐに食べる場合は手前の商品から取る</b>. Sữa dùng cho bữa tối nay là dùng ngay, nên lấy ở phía trước. Lấy ở phía trong và vứt đồ hộp đều là hành động gây lãng phí mà bài phê phán.","a":2}]},{"passage":"<p>（3）</p><p>　年を取ると物忘れが増え、落ち込む人は多い。人の名前が出てこない、昨日の夕食が思い出せない。記憶力の低下は、誰にとってもうれしいことではないだろう。</p><p>　しかし、<u>①忘れることは、必ずしも悪いことではない</u>。もし、見たもの聞いたものをすべて覚えていたら、どうなるだろうか。頭の中は不要な情報であふれ、本当に必要なことを取り出すのに時間がかかってしまうに違いない。脳は、重要でない情報を捨てることで、大切な情報を使いやすくしているのである。</p><p>　また、つらい経験をいつまでも鮮明に覚えていたら、人は前に進むことができない。時間がたつにつれて記憶が薄れていくからこそ、私たちは悲しみから立ち直ることができる。</p><p>　覚えることと忘れることは、対立するものではない。<u>②両方がうまく働いて</u>はじめて、記憶は役に立つものになるのだ。</p>","qs":[{"n":56,"q":"筆者は、見聞きしたことをすべて覚えていると、どうなると考えているか。","o":["年を取っても、物忘れをしなくなる。","大切な情報だけが、頭に残るようになる。","頭が疲れて、新しいことを覚えられなくなる。","必要な記憶を、すぐに使えなくなる。"],"e":"<b>本当に必要なことを取り出すのに時間がかかってしまう</b>. Bẫy: mệt và không học được điều mới nghe hợp lý, nhưng bài KHÔNG nói vậy. Chỉ chọn điều bài viết nói.","a":3},{"n":57,"q":"つらい経験の記憶について、本文の内容と合うものはどれか。","o":["鮮明に覚えておくことで、同じ失敗を防ぐことができる。","時間とともに記憶がぼやけていくことが、立ち直る助けになる。","つらい経験ほど、早く忘れられるものである。","無理に忘れようとすれば、悲しみから立ち直れる。"],"e":"<b>記憶が薄れていくからこそ…立ち直ることができる</b>. 薄れる được nói lại thành ぼやける. Các đáp án khác nghe hợp lý ngoài đời nhưng không có trong bài, nhất là việc cố gắng quên.","a":1},{"n":58,"q":"筆者の考えに最も近いものはどれか。","o":["記憶力を鍛えれば、物忘れは防ぐことができる。","覚えることより、忘れることのほうが重要だ。","不要な情報は、意識して捨てるようにすべきだ。","忘れることも、記憶の働きを支える大切な要素である。"],"e":"<b>覚えることと忘れることは、対立するものではない。両方がうまく働いて</b>. Bẫy: so sánh cái nào quan trọng hơn (tác giả nói cả hai cùng cần). Não tự động bỏ thông tin, không phải chúng ta cố ý.","a":3}]}]},{"id":"r10","title":"問題10 内容理解（長文）","en":"Đọc hiểu: đoạn dài","instr":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　スーパーの棚には何十種類ものジャムが並び、動画配信サービスでは数え切れないほどの映画が見られる。現代は、かつてないほど選択肢の多い時代である。選べるものが多いほど、自分にぴったりのものが見つかり、満足も大きくなるはずだ。多くの人はそう考えるだろう。</p><p>　ところが、ある有名な実験は、<u>①それとは異なる結果</u>を示している。店頭に二十四種類のジャムを並べた場合と、六種類だけを並べた場合とで、客の行動を比べたのだ。足を止める客は二十四種類のときのほうが多かったが、実際に買った客の割合は、六種類のときのほうがはるかに高かった。選択肢が多すぎると、人は選ぶこと自体をやめてしまうのである。</p><p>　なぜ、このようなことが起こるのか。一つには、比べるものが増えるほど、選ぶための労力が大きくなるからだ。さらに、どれか一つを選んだ後も、「ほかのもののほうがよかったのではないか」という思いが残りやすい。選ばなかったものが多いほど、<u>②その後悔も大きくなる</u>。</p><p>　私自身、休日に映画を見ようとして、何を見るか決められないまま一時間が過ぎてしまったことがある。結局、疲れて何も見ずに寝てしまった。選ぶ自由があることと、満足できることは、どうやら別の問題らしい。</p><p>　では、どうすればよいのか。私は、最高のものを探そうとするのをやめることだと思う。「これで十分だ」と思える基準をあらかじめ決めておき、それを満たすものに出会ったら、そこで選ぶのをやめる。すべてを比べ尽くすことはできないのだから、自分なりの基準で決めたことに納得する。それが、選択肢のあふれる時代を気楽に生きるこつではないだろうか。</p>","qs":[{"n":59,"q":"「それとは異なる結果」とあるが、実験からわかったことはどれか。","o":["選択肢が多いほど、客は店に長くとどまる。","選択肢が少ないと、客は売り場で足を止めない。","選択肢が多いと関心は集まるが、実際の購入には結びつきにくい。","選択肢の数にかかわらず、購入する客の割合は変わらない。"],"e":"Với 24 loại, nhiều khách <b>dừng lại xem hơn</b> (関心), nhưng tỉ lệ <b>mua thì thấp hơn</b>. Bẫy: với 6 loại vẫn có khách dừng lại, chỉ là ÍT HƠN, nên nói không ai dừng lại là quá mức.","a":2},{"n":60,"q":"筆者は、選んだ後に後悔が生まれやすいのはなぜだと述べているか。","o":["比べるための労力が大きく、疲れてしまうから","選ばなかった候補が多いほど、そちらへの未練が残るから","選んだものが、期待より悪いことが多いから","他人の選択と比べてしまうから"],"e":"<b>選ばなかったものが多いほど、その後悔も大きくなる</b>. 未練 = còn vương vấn. Bẫy: công sức so sánh là lý do <b>không chọn được</b>, khác với lý do hối hận. Đề hay trộn hai lý do này.","a":1},{"n":61,"q":"筆者の映画の経験について、本文の内容と合うものはどれか。","o":["選択肢が少なかったために、何も選べなかった例になっている。","疲れていたせいで、映画を楽しめなかった例になっている。","結局、評判のよい映画を選んで満足した例になっている。","選ぶ自由があっても、満足につながらないことの例になっている。"],"e":"Kết luận đoạn: <b>選ぶ自由があることと、満足できることは…別の問題</b>. Bẫy: tác giả KHÔNG xem phim nào cả (何も見ずに寝てしまった), nên không thể nói là không thích phim.","a":3},{"n":62,"q":"筆者の主張に最も近いものはどれか。","o":["自分なりの合格ラインを決め、それを満たしたら選ぶのをやめるのがよい。","選択肢はできるだけ減らし、少ない中から選ぶべきだ。","後悔しないよう、できる限り多くの選択肢を比べるべきだ。","最高のものを選ぶためには、事前に基準を厳しくしておくべきだ。"],"e":"<b>「これで十分だ」と思える基準…それを満たすものに出会ったら、そこで選ぶのをやめる</b>. Bẫy: tiêu chuẩn là \"đủ tốt\", không phải tiêu chuẩn nghiêm khắc. Tác giả cũng không nói phải giảm số lựa chọn.","a":0}]}]},{"id":"r11","title":"問題11 統合理解","en":"Đọc so sánh A và B","instr":"次のAとBの文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p><b>A</b></p><p>　小学生にスマートフォンを持たせることには、慎重であるべきだ。子どもは自分で使用時間を管理することが難しく、気づけば何時間も画面を見続けてしまう。睡眠不足や視力の低下も心配だ。また、インターネット上には子どもにふさわしくない情報も多く、知らない人とのやり取りから事件に巻き込まれる危険もある。連絡手段が必要なら、通話と位置確認だけができる子ども用の携帯電話で十分だろう。スマートフォンは、自分で判断できる年齢になってからでも遅くない。</p><p><b>B</b></p><p>　小学生にスマートフォンを持たせることを心配する声は多い。確かに、使いすぎやインターネット上の危険には注意が必要だ。しかし、今の子どもたちは、将来、情報機器を使いこなすことが求められる社会で生きていく。危険だからと遠ざけるだけでは、正しい使い方を学ぶ機会も失われてしまう。大切なのは、使う時間や場所について親子で話し合い、ルールを決めることだ。親の目が届く小学生のうちにこそ、失敗しながら使い方を身につけさせるべきではないか。</p>","qs":[{"n":63,"q":"AとBの筆者が共通して認めていることは何か。","o":["通話と位置確認ができる携帯電話で十分であること","失敗しながら使い方を学ぶことが大切であること","スマートフォンには、子どもにとって注意すべき点があること","小学生には、使う時間を自分で管理する力があること"],"e":"A nêu nhiều nguy hiểm, B cũng thừa nhận <b>使いすぎやインターネット上の危険には注意が必要</b>. Điện thoại trẻ em chỉ có ở A, học từ thất bại chỉ có ở B. A nói trẻ KHÓ tự quản lý thời gian.","a":2},{"n":64,"q":"AとBの考え方の違いとして、最も適当なものはどれか。","o":["Aは危険から遠ざけることを、Bは使い方を学ぶ機会を重視している。","Aは連絡手段は不要だと考え、Bは必要だと考えている。","Aは親の管理を重視し、Bは子どもの自由を重視している。","Aは持たせる年齢を親が、Bは子ども自身が決めるべきだと考えている。"],"e":"A: đợi đến khi tự phán đoán được. B: <b>遠ざけるだけでは…学ぶ機会も失われ</b>. Bẫy: A vẫn thấy cần liên lạc (điện thoại trẻ em). B cũng coi trọng việc bố mẹ cùng con đặt quy tắc, nên không phải tự do hoàn toàn.","a":0}]}]},{"id":"r12","title":"問題12 主張理解（長文）","en":"Đọc hiểu: quan điểm tác giả","instr":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　人はなぜ、他人と自分を比べてしまうのだろうか。同僚の昇進を聞いて落ち込み、友人の楽しそうな旅行の写真を見てうらやましくなる。比べても仕方がないとわかっていながら、やめられない。そういう経験は誰にでもあるだろう。</p><p>　<u>①比べること自体</u>は、人間にとって自然な行為である。自分の能力や立場を知るには、周りの人を基準にするしかないからだ。自分より優れた人を見て、「あの人のようになりたい」と努力することもある。その意味で、比較は成長のきっかけにもなりうる。</p><p>　問題は、比べる相手と、比べ方にある。SNSが普及した現在、私たちは一日に何十人、何百人もの他人の生活を目にする。しかも、そこに並ぶのは、それぞれの人生の中で最も輝いている瞬間ばかりだ。<u>②そうしたもの</u>と、自分のごく普通の日常を比べれば、自分が劣っているように感じるのは当然だろう。他人の「一番よい場面」と自分の「いつもの場面」を比べるのは、そもそも公平な比較ではない。</p><p>　では、どうすればよいか。私が勧めたいのは、比べる相手を他人から過去の自分に変えることだ。一年前の自分にはできなかったことが、今はできるようになっている。去年は知らなかったことを、今は知っている。そうした小さな変化に目を向けると、他人がどうであれ、自分が確かに前に進んでいることがわかる。</p><p>　他人との比較には終わりがない。どれだけ上に行っても、さらに上の人がいるからだ。しかし、過去の自分との比較は、努力した分だけ必ず結果が見える。自分の歩みを測る物差しは、自分の中に持っておきたいものだ。</p>","qs":[{"n":65,"q":"筆者は、他人と比べることそのものについて、どのように考えているか。","o":["避けがたいものであり、よい方向に働くこともある。","劣等感を生むだけなので、やめるべきだ。","自分の能力を知るには、比較以外の方法のほうがよい。","自分より優れた人とだけ比べるようにすべきだ。"],"e":"<b>人間にとって自然な行為…比較は成長のきっかけにもなりうる</b>. 自然 được nói lại thành 避けがたい. Bẫy: bài nói muốn biết năng lực mình thì <b>chỉ có cách</b> dựa vào người xung quanh.","a":0},{"n":66,"q":"筆者が、SNSでの比較を公平でないと考えるのはなぜか。","o":["SNSでは、目にする人の数が多すぎるから","他人の特別な場面と、自分のふだんの姿を比べることになるから","SNSの写真は、加工されていることが多いから","自分より優れた人ばかりがSNSを使っているから"],"e":"<b>他人の「一番よい場面」と自分の「いつもの場面」を比べる</b>. Bẫy: ảnh bị chỉnh sửa là kiến thức ngoài đời, bài không nói. Số người nhiều có nhắc đến nhưng không phải lý do \"không công bằng\".","a":1},{"n":67,"q":"過去の自分と比べることの利点として、筆者が述べているものはどれか。","o":["他人より優れている点が、はっきりわかる。","比べる相手がいないので、落ち込むことがない。","努力した分の変化を、確かに感じ取れる。","一年ごとに、大きく成長できるようになる。"],"e":"<b>努力した分だけ必ず結果が見える</b>. Bẫy: bài nói về những thay đổi NHỎ (小さな変化), không phải trưởng thành lớn mỗi năm.","a":2},{"n":68,"q":"筆者の主張に最も近いものはどれか。","o":["SNSを見る時間を減らせば、劣等感はなくなる。","自分の進歩は、以前の自分を物差しにして確かめるのがよい。","他人との比較には終わりがないので、目標を持つべきではない。","上には上がいるので、努力しても意味がない。"],"e":"<b>自分の歩みを測る物差しは、自分の中に持っておきたい</b>. Bẫy: tác giả không khuyên bỏ SNS hay bỏ mục tiêu. \"Trên có người giỏi hơn\" là lý do so sánh với người khác không có điểm dừng.","a":1}]}]},{"id":"r13","title":"問題13 情報検索","en":"Tìm thông tin","instr":"次は、あるスポーツクラブの会員プランの案内である。下の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<div class='notice'><p style='text-align:center'><b>スポーツクラブ「アクティブ」　会員プランのご案内</b></p><p>【営業時間】平日 9:00～23:00 ／ 土曜、日曜、祝日 9:00～20:00</p><table class='tbl'><tr><th>プラン</th><th>利用できる時間</th><th>月会費</th><th>備考</th></tr><tr><td>レギュラー</td><td>全営業時間</td><td>9,800円</td><td></td></tr><tr><td>デイタイム</td><td>平日 9:00～17:00</td><td>6,500円</td><td>土日祝は利用不可</td></tr><tr><td>ナイト</td><td>営業日の 19:00～閉館</td><td>7,000円</td><td></td></tr><tr><td>ウィークエンド</td><td>土日祝の全営業時間</td><td>5,500円</td><td></td></tr><tr><td>学生</td><td>全営業時間</td><td>6,000円</td><td>入会時に学生証が必要</td></tr></table><p>※入会金は5,000円です（学生プランは無料）。<br>※プールを利用する場合は、どのプランも月1,000円が別に必要です。<br>※毎週水曜日は休館日です。<br>※11月中に入会された方は、最初の月の月会費が半額になります。</p></div>","qs":[{"n":69,"q":"会社員の山田さんは、平日の仕事帰り（19時半ごろ）と土曜日の午前に、それぞれ週1回通いたい。プールは使わない。11月10日に入会する場合、最初の月に払う金額はいくらか。","o":["9,900円","14,800円","8,500円","4,900円"],"e":"Thứ bảy buổi sáng: gói ナイト chỉ từ 19h, không dùng được. Nên phải chọn <b>レギュラー</b> 9,800円. Gia nhập tháng 11: phí tháng đầu <b>một nửa</b> = 4,900円, cộng phí gia nhập 5,000円 = <b>9,900円</b>. Bẫy: 14,800円 (quên giảm nửa), 8,500円 (chọn nhầm gói ナイト), 4,900円 (quên phí gia nhập).","a":0},{"n":70,"q":"大学生のアンさんは、水曜日の夜と日曜日の昼に通いたいと考えている。本文の内容と合うものはどれか。","o":["学生プランなら、水曜日も日曜日も通うことができる。","水曜日は休館日なので、希望どおりに通えるのは日曜日だけだ。","ウィークエンドプランにすれば、水曜日の夜にも通える。","ナイトプランなら、水曜日の夜に通うことができる。"],"e":"※<b>毎週水曜日は休館日</b>. Dù chọn gói nào cũng không đi được thứ tư. Ba đáp án còn lại đúng về gói, nhưng quên ngày nghỉ. Đây là bẫy kinh điển của 情報検索.","a":1}]}]}];
const SET5 = [{"id":"m1","title":"問題1 漢字読み","en":"Đọc kanji","instr":"＿＿の言葉の読み方として最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":1,"q":"原材料費の高騰で、食料品が<u>軒並み</u>値上がりしている。","o":["けんなみ","のきならび","けんべい","のきなみ"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 4, lần này hỏi theo dạng khác.</span><br><b>軒並み (のきなみ)</b> = đồng loạt. 軒 đọc theo âm Nhật là <b>のき</b> (mái hiên), 並み = なみ. Không đọc theo âm Hán けん (như 一軒 いっけん).","a":3}]},{"qs":[{"n":2,"q":"このレストランは、季節ごとに趣向を<u>凝らした</u>料理を出している。","o":["さらした","ぬらした","そらした","こらした"],"e":"<b>凝らす (こらす)</b> = dồn tâm sức, làm công phu. 趣向を凝らす, 工夫を凝らす là cụm cố định. さらす = 晒す (phơi), ぬらす = 濡らす (làm ướt), そらす = 逸らす (đánh lạc hướng).","a":3}]},{"qs":[{"n":3,"q":"男女の賃金格差を<u>是正</u>するための法律が作られた。","o":["ぜせい","しせい","ぜしょう","ていせい"],"e":"<b>是正 (ぜせい)</b> = điều chỉnh cho đúng, khắc phục (bất bình đẳng, sai lệch). 是 = <b>ぜ</b> (như 是非 ぜひ), 正 = <b>せい</b>. ていせい là 訂正 (đính chính chữ viết, lời nói).","a":0}]},{"qs":[{"n":4,"q":"今月の利益は、先月の損失と<u>相殺</u>されてしまった。","o":["そうさつ","あいさつ","そうさい","しょうさい"],"e":"<b>相殺 (そうさい)</b> = bù trừ lẫn nhau. Chữ 殺 thường đọc là さつ (殺人), nhưng trong từ này đọc là <b>さい</b>. Đây là cách đọc đặc biệt rất hay ra thi.","a":2}]},{"qs":[{"n":5,"q":"この国は、ここ十年で急速な発展を<u>遂げた</u>。","o":["つげた","とげた","しとげた","あげた"],"e":"<b>遂げる (とげる)</b> = đạt được, hoàn thành. 発展を遂げる, 進歩を遂げる, 目的を遂げる. つげる = 告げる (thông báo), あげる = 上げる.","a":1}]},{"qs":[{"n":6,"q":"この地域は災害に対して<u>脆弱</u>で、早急な対策が必要だ。","o":["ぜいじゃく","きじゃく","ぜいにゃく","もろじゃく"],"e":"<b>脆弱 (ぜいじゃく)</b> = yếu ớt, dễ tổn thương. 脆 đọc âm Hán là <b>ぜい</b> (âm Nhật là もろい), 弱 = <b>じゃく</b>.","a":0}]}]},{"id":"m2","title":"問題2 文脈規定","en":"Từ theo ngữ cảnh","instr":"（　　）に入れるのに最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":7,"q":"容疑者の話は（　　）が合わず、警察はさらに詳しく調べることにした。","o":["見当","拍車","相場","辻褄"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>辻褄が合わない (つじつまがあわない)</b> = không khớp, không nhất quán. 見当 dùng với 見当がつく (đoán được), 拍車 dùng với 拍車をかける (thúc đẩy), 相場 = giá thị trường.","a":3}]},{"qs":[{"n":8,"q":"事故現場には、（　　）数のガラスの破片が散らばっていた。","o":["おびただしい","はなはだしい","あわただしい","そそっかしい"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>おびただしい数</b> = số lượng cực kỳ nhiều. はなはだしい = quá mức (誤解もはなはだしい), không đi với 数. あわただしい = vội vã, bận rộn, そそっかしい = hấp tấp.","a":0}]},{"qs":[{"n":9,"q":"市長は、改革に向けた機運を（　　）するため、各地で説明会を開いた。","o":["醸成","養成","熟成","結成"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 2, lần này hỏi theo dạng khác.</span><br><b>醸成 (じょうせい)する</b> = tạo dựng dần (bầu không khí, xu thế: 機運, 雰囲気). 養成 = đào tạo (người), 熟成 = ủ chín (rượu, thịt), 結成 = thành lập (nhóm, đảng).","a":0}]},{"qs":[{"n":10,"q":"大型の台風が近づいており、農作物への被害が（　　）されている。","o":["執念","懸念","断念","観念"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 4, lần này hỏi theo dạng khác.</span><br><b>懸念 (けねん)される</b> = bị lo ngại. 執念 (しゅうねん) = sự cố chấp, quyết tâm dai dẳng, 断念 = từ bỏ, 観念 = quan niệm, hoặc cam chịu.","a":1}]},{"qs":[{"n":11,"q":"政府は対策を打ち出したが、物価の上昇に（　　）がかからない。","o":["歯止め","足止め","口止め","差し止め"],"e":"<b>歯止めがかからない (はどめ)</b> = không kìm hãm được. 足止め = bị giữ chân, kẹt lại, 口止め = bịt miệng, cấm nói, 差し止め = đình chỉ (xuất bản, thi công).","a":0}]},{"qs":[{"n":12,"q":"この二つの言葉は意味が似ているが、（　　）が微妙に異なる。","o":["スケール","レイアウト","ニュアンス","ノルマ"],"e":"<b>ニュアンス</b> = sắc thái ý nghĩa. スケール = quy mô, レイアウト = bố cục, ノルマ = chỉ tiêu.","a":2}]},{"qs":[{"n":13,"q":"あれほど強く反対していた父が、（　　）認めてくれたので驚いた。","o":["がっしり","あっさり","びっしり","ずっしり"],"e":"<b>あっさり</b> = một cách dễ dàng, nhanh gọn (không như dự đoán). がっしり = vạm vỡ, chắc chắn, びっしり = dày đặc, kín mít, ずっしり = nặng trĩu.","a":1}]}]},{"id":"m3","title":"問題3 言い換え類義","en":"Từ gần nghĩa","instr":"＿＿の言葉に意味が最も近いものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":14,"q":"<u>拙い</u>文章ですが、最後まで読んでいただければ幸いです。","o":["短い","古い","下手な","難しい"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 2, lần này hỏi theo dạng khác.</span><br><b>拙い (つたない)</b> = vụng về, kém. Gần nhất là 下手な. Thường dùng để nói khiêm tốn về bản thân.","a":2}]},{"qs":[{"n":15,"q":"住民たちは、市の対応に強い<u>憤り</u>を覚えた。","o":["不安","悲しみ","疑い","怒り"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 3, lần này hỏi theo dạng khác.</span><br><b>憤り (いきどおり)</b> = sự phẫn nộ. Gần nhất là 怒り. 憤りを覚える, 憤りを感じる là cách nói trang trọng.","a":3}]},{"qs":[{"n":16,"q":"雨の日は、外出するのが<u>おっくうだ</u>。","o":["面倒だ","危険だ","楽しみだ","不可能だ"],"e":"<b>おっくう (億劫)</b> = ngại, lười làm vì thấy phiền. Gần nhất là 面倒だ.","a":0}]},{"qs":[{"n":17,"q":"このかばんは軽くて丈夫なので、<u>重宝している</u>。","o":["大切にしまってある","高く評価されている","便利で役に立っている","少し重く感じている"],"e":"<b>重宝 (ちょうほう)する</b> = thấy tiện lợi và dùng thường xuyên. Bẫy: chữ 重 và 宝 khiến dễ nghĩ đến nặng hoặc cất giữ như báu vật, nhưng nghĩa thật là tiện dụng.","a":2}]},{"qs":[{"n":18,"q":"友人の活躍に<u>触発されて</u>、私も資格の勉強を始めた。","o":["誘われて","驚かされて","刺激を受けて","頼まれて"],"e":"<b>触発 (しょくはつ)される</b> = được khơi gợi, lấy cảm hứng từ. Gần nhất là 刺激を受けて. Không phải được rủ (誘われて).","a":2}]},{"qs":[{"n":19,"q":"駅まで走って、<u>かろうじて</u>終電に間に合った。","o":["余裕で","偶然","予定どおり","なんとか"],"e":"<b>かろうじて (辛うじて)</b> = vừa đủ, suýt soát mới được. Gần nhất là なんとか, やっと. 余裕で là trái nghĩa.","a":3}]}]},{"id":"m4","title":"問題4 用法","en":"Cách dùng từ","instr":"次の言葉の使い方として最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":20,"q":"<b>潔い</b>","o":["掃除をしたばかりなので、部屋がとても潔い。","山の上の空気は潔くて、気持ちがいい。","負けが決まると、彼は潔く相手の勝利をたたえた。","彼は潔い服装で、面接に出かけた。"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>潔い (いさぎよい)</b> = dứt khoát, đàng hoàng chấp nhận (thua, lỗi, từ chức). Không dùng cho sạch sẽ: phòng sạch là きれい, không khí trong lành là すがすがしい, quần áo sạch sẽ là 清潔な.","a":2}]},{"qs":[{"n":21,"q":"<b>うろたえる</b>","o":["初めての町で道にうろたえて、約束の時間に遅れた。","面接で予想外の質問をされ、うろたえて何も答えられなかった。","強い風で、木の枝が大きくうろたえている。","休日は、近所の公園をうろたえるのが好きだ。"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>うろたえる</b> = luống cuống, mất bình tĩnh. Lạc đường là 道に迷う, cành cây lay động là 揺れる, đi dạo loanh quanh là ぶらぶらする (hoặc うろうろする, phát âm gần giống nên dễ nhầm).","a":1}]},{"qs":[{"n":22,"q":"<b>おおむね</b>","o":["今回の実験は、おおむね予想どおりの結果になった。","おおむね、明日は雨が降るかもしれない。","彼はおおむね一人で、その仕事を全部やり遂げた。","駅まで走って、おおむね電車に間に合った。"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 2, lần này hỏi theo dạng khác.</span><br><b>おおむね (概ね)</b> = nhìn chung, phần lớn. Dùng để đánh giá tổng thể: おおむね順調, おおむね予想どおり. Phỏng đoán là おそらく, chỉ một mình là たった一人で, vừa kịp là なんとか.","a":0}]},{"qs":[{"n":23,"q":"<b>無造作</b>","o":["この機械は無造作なので、誰でも簡単に使える。","彼は無造作な人で、絵や工作が苦手だ。","材料が無造作になったので、買いに行った。","彼は大切な書類を、机の上に無造作に置いていた。"],"e":"<b>無造作 (むぞうさ)</b> = một cách tùy tiện, không cẩn thận, không để ý. Máy dễ dùng là 操作が簡単, vụng về là 不器用 (ぶきよう), hết nguyên liệu là なくなる.","a":3}]},{"qs":[{"n":24,"q":"<b>食い違う</b>","o":["二人の証言が食い違っていて、どちらが正しいのかわからない。","犬に手を食い違われて、けがをした。","道を食い違って、目的地に着けなかった。","昼ご飯を食い違って、おなかがすいた。"],"e":"<b>食い違う (くいちがう)</b> = (ý kiến, lời khai, con số) không khớp nhau. Bị chó cắn là かまれる, nhầm đường là 間違える, lỡ bữa trưa là 食べ損ねる.","a":0}]},{"qs":[{"n":25,"q":"<b>円滑</b>","o":["会議が円滑に進むよう、事前に資料を配っておいた。","このテーブルは角が円滑で、子どもにも安全だ。","彼は円滑な性格で、めったに怒らない。","雨で道が円滑になっているので、気をつけてください。"],"e":"<b>円滑 (えんかつ)</b> = trôi chảy, suôn sẻ (công việc, giao tiếp, cuộc họp). Góc bàn tròn là 丸い, tính cách ôn hòa là 穏やか hoặc 温厚, đường trơn là 滑りやすい.","a":0}]}]},{"id":"m5","title":"問題5 文法形式の判断","en":"Ngữ pháp","instr":"次の文の（　　）に入れるのに最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":26,"q":"彼は、自分の非を認め（　　）、なかなか謝ろうとしなかった。","o":["つつある","ながらも","たところで","んばかりに"],"e":"<b>Vます + ながらも</b> = tuy V nhưng. Thừa nhận lỗi nhưng không chịu xin lỗi. Bẫy: つつある = đang dần dần V, たところで = dù có V cũng vô ích, んばかりに = như sắp V. Cả bốn đều gắn được với 認め, nên phải dựa vào nghĩa.","a":1}]},{"qs":[{"n":27,"q":"部長は三十九度の熱（　　）、取引先との大事な会議に出席した。","o":["をよそに","を皮切りに","をおして","をきっかけに"],"e":"<b>Nをおして</b> = bất chấp N (bệnh, khó khăn của bản thân) mà vẫn làm. Bẫy gần nghĩa: <b>をよそに</b> dùng khi mặc kệ sự lo lắng hay phản đối của <b>người khác</b>, không dùng cho cơn sốt của chính mình.","a":2}]},{"qs":[{"n":28,"q":"去年の記録的な大雪（　　）、今年の冬は驚くほど雪が少ない。","o":["にもまして","にひきつづき","をよそに","にひきかえ"],"e":"<b>Nにひきかえ</b> = trái ngược hẳn với N. Năm ngoái tuyết lớn, năm nay ít tuyết. Bẫy: にもまして = còn hơn cả (cùng chiều, không đối lập), にひきつづき = tiếp nối.","a":3}]},{"qs":[{"n":29,"q":"窓の外を見る（　　）見ていると、見覚えのある人が通り過ぎた。","o":["ともなると","ところを","そばから","ともなく"],"e":"<b>Vる ともなく V</b> = làm một cách vô thức. 見るともなく見る. Bẫy rất giống về hình thức: <b>ともなると</b> = một khi đã đến mức. ところを = đúng lúc đang, そばから = vừa làm xong đã lại.","a":3}]},{"qs":[{"n":30,"q":"せっかく京都まで行ったのに、雨のせいで金閣寺は見（　　）だった。","o":["ずにはすまない","ずじまい","ずにはいられない","ずもがな"],"e":"<b>Vず じまい</b> = rốt cuộc đã không V được (tiếc nuối). Cả bốn đáp án đều bắt đầu bằng ず, nên phải nhìn đuôi câu <b>だった</b>: chỉ ずじまいだった là đúng ngữ pháp và nghĩa.","a":1}]},{"qs":[{"n":31,"q":"新人の私（　　）が社長に意見するなど、とんでもないことです。","o":["ごとき","ごとく","めく","らしさ"],"e":"<b>Nごとき</b> = cỡ như N (khiêm tốn khi nói về mình). Bẫy hình thức: <b>ごとく</b> là trạng từ (như là ~), phải đi với động từ, không đứng trước が. めく = có vẻ (春めく).","a":0}]},{"qs":[{"n":32,"q":"売り上げの急激な落ち込みにより、その店は閉店を（　　）。","o":["禁じ得なかった","余儀なくさせた","余儀なくされた","やむを得なかった"],"e":"<b>Nを余儀なくされる</b> = buộc phải N (bị động). Bẫy 1: <b>余儀なくさせた</b> là thể sai khiến, nghĩa là cửa hàng bắt ai đó phải đóng cửa, sai chủ ngữ. Bẫy 2: やむを得ない không đi với trợ từ を (phải là 閉店はやむを得なかった).","a":2}]},{"qs":[{"n":33,"q":"理由はどう（　　）、約束を破ったことに変わりはない。","o":["でこそ","であれ","なりとも","だけあって"],"e":"<b>どうであれ</b> = dù thế nào đi nữa. Nであれ = dù là N. でこそ = chính vì là, なりとも = dù chỉ một chút (少しなりとも), だけあって = quả đúng là.","a":1}]},{"qs":[{"n":34,"q":"最後まで接戦になる（　　）、試合は前半だけで大差がついてしまった。","o":["ものと思って","かと思いきや","とばかりに","にしては"],"e":"<b>～かと思いきや</b> = tưởng là ~ ai ngờ lại (kết quả ngược với dự đoán). Bẫy: ものと思って thì phải là ものと思っていたが mới nối được về nghĩa. にしては = so với ~ thì (dùng để đánh giá, không đi với dự đoán).","a":1}]},{"qs":[{"n":35,"q":"祖父は犬を飼い始め（　　）、毎朝散歩するようになり、すっかり元気になった。","o":["てからでないと","たとたん","てからというもの","てこそ"],"e":"<b>Vて からというもの</b> = kể từ khi V (thay đổi lớn và kéo dài). Bẫy: <b>たとたん</b> = vừa V thì ngay lập tức (sự việc bất ngờ một lần), không hợp với thói quen kéo dài (毎朝散歩するようになり).","a":2}]}]},{"id":"m6","title":"問題6 文の組み立て","en":"Sắp xếp câu","instr":"次の文の ★ に入る最もよいものを、1、2、3、4から一つ選びなさい。","fixed":true,"pages":[{"qs":[{"n":36,"q":"この地域は交通の便が ＿＿＿ <b>★</b> ＿＿＿ ＿＿＿ 、毎年多くの観光客が訪れる。","o":["言えない","にもかかわらず","決して","よいとは"],"a":3,"e":"Thứ tự đúng: 決して <b>よいとは</b> 言えない にもかかわらず (3 4 1 2). 決して～ない = hoàn toàn không. ★ ở vị trí THỨ HAI lần này, nên đừng mặc định ★ luôn là ô thứ ba."}]},{"qs":[{"n":37,"q":"いつもは時間どおりに来るのに、＿＿＿ ＿＿＿ ＿＿＿ <b>★</b> 来ない。","o":["限って","バスが","急いでいる","ときに"],"a":1,"e":"Thứ tự đúng: 急いでいる ときに 限って <b>バスが</b> (3 4 1 2). <b>～ときに限って</b> = cứ đúng lúc ~ thì lại. ★ ở vị trí CUỐI CÙNG."}]},{"qs":[{"n":38,"q":"大事な試合なので、<b>★</b> ＿＿＿ ＿＿＿ ＿＿＿ いかない。","o":["わけには","休む","少し熱がある","からといって"],"a":2,"e":"Thứ tự đúng: <b>少し熱がある</b> からといって 休む わけには (3 4 2 1). ★ ở vị trí ĐẦU TIÊN. Mẹo: ghép cặp chắc chắn trước (休む + わけには + いかない), rồi mới xếp phần còn lại."}]},{"qs":[{"n":39,"q":"日本に来たばかりのころ、彼は ＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 書けなかった。","o":["自分の名前","さえ","漢字","どころか"],"a":0,"e":"Thứ tự đúng: 漢字 どころか <b>自分の名前</b> さえ (3 4 1 2). <b>AどころかBさえ～ない</b> = đừng nói A, ngay cả B cũng không. A là thứ khó hơn."}]},{"qs":[{"n":40,"q":"連絡先も住所も ＿＿＿ <b>★</b> ＿＿＿ ＿＿＿ ない。","o":["知らせ","ようが","ので","わからない"],"a":2,"e":"Thứ tự đúng: わからない <b>ので</b> 知らせ ようが (4 3 1 2). <b>Vます bỏ ます + ようがない</b> = không có cách nào V. ★ ở vị trí thứ hai."}]}]},{"id":"m7","title":"問題7 文章の文法","en":"Ngữ pháp trong đoạn văn","instr":"次の文章を読んで、文章全体の内容を考えて、41 から 45 の中に入る最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　先月、思い切って部屋の片付けをした。引っ越してから五年、物は増える（41）で、棚も押し入れもいっぱいになっていたからだ。</p><p>　始めてみると、何年も使っていない物が次々と出てきた。着なくなった服、読み終えた雑誌、いつか使うだろうと思って取っておいた空き箱。捨てようとするたびに、「まだ使えるのに」という気持ちが邪魔をする。（42）、一年以上使わなかった物は、これからも使わない可能性が高い。そう自分に言い聞かせて、少しずつ手放していった。</p><p>　片付けを終えて気づいたのは、物が減ると、探し物をする時間も減るということだ。以前は、はさみ一つ見つける（43）、あちこちの引き出しを開けなければならなかった。今は、どこに何があるかがすぐにわかる。</p><p>　物を持つことは、それを管理する手間を持つこと（44）。本当に必要な物だけに囲まれた暮らしは、思っていた以上に快適だ。これからは、何かを買う前に、それが本当に必要かどうかをよく考える（45）。</p>","qs":[{"n":41,"q":"（41）","o":["始末","一方","次第","末"],"e":"<b>Vる一方だ</b> = ngày càng V (chỉ theo một chiều). Bẫy: 始末 phải ở cuối câu (～始末だ), 末 phải đi với Vた (考えた末に), 次第 = ngay sau khi (Vます + 次第).","a":1},{"n":42,"q":"（42）","o":["それにしても","だからこそ","とはいえ","それゆえに"],"e":"Câu trước: tiếc vì còn dùng được. Câu sau: đồ không dùng hơn một năm thì sau này cũng khó dùng. Đây là ý phản bác lại cảm giác ở câu trước, nên dùng <b>とはいえ</b> (tuy vậy). Bẫy: それにしても = dù vậy thì cũng (thường dùng để cảm thán), だからこそ = chính vì vậy.","a":2},{"n":43,"q":"（43）","o":["ものの","ことには","ばかりに","のにも"],"e":"<b>Vる のにも</b> = ngay cả để V cũng. Vるのに = để làm V (mục đích). Bẫy: ばかりに = chỉ vì (nguyên nhân dẫn đến kết quả xấu), ものの = tuy nhưng.","a":3},{"n":44,"q":"（44）","o":["でもあるまい","でもある","とは限らない","どころではない"],"e":"<b>AことはBことでもある</b> = A cũng chính là B. Bẫy: でもあるまい = chắc không phải là, とは限らない = chưa chắc. Câu sau khẳng định cuộc sống ít đồ thoải mái, nên ý phải là khẳng định.","a":1},{"n":45,"q":"（45）","o":["ようにしたい","ようになった","ことにしていた","ところだった"],"e":"これからは = từ nay về sau, nên cần ý định cho tương lai: <b>ようにしたい</b>. Bẫy: ようになった là thay đổi đã xảy ra, ことにしていた là quyết định trong quá khứ.","a":0}]}]},{"id":"r8","title":"問題8 内容理解（短文）","en":"Đọc hiểu: đoạn ngắn","instr":"次の（1）から（4）の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>（1）</p><p>　話し上手になりたいと願う人は多いが、聞き上手になろうとする人は意外に少ない。しかし、人が「この人とまた話したい」と感じるのは、面白い話をしてくれた相手よりも、自分の話を熱心に聞いてくれた相手であることが多い。人は誰でも、自分のことをわかってほしいと思っているからだ。会話を弾ませたいなら、うまく話そうとする前に、まず相手の話に耳を傾けることである。</p>","qs":[{"n":46,"q":"筆者の考えに合うものはどれか。","o":["話す技術より、聞く姿勢のほうが会話を楽しくする。","聞き上手を目指す人は多いが、実際にそうなれる人はごく一部にすぎない。","面白い話ができないと好かれない。","自分をわかってもらうには、まず自分のことを多く話して知ってもらうべきだ。"],"e":"<b>うまく話そうとする前に、まず相手の話に耳を傾けること</b>. Bẫy: bài nói người muốn trở thành 聞き上手 thì ÍT (少ない), đáp án thứ hai đổi thành \"nhiều người muốn\".","a":0}]},{"passage":"<p>（2）</p><p>以下は、ある大学が学生に送ったメールである。</p><div class='notice'><p>件名：奨学金説明会の日程変更について</p><p>学生の皆さん</p><p>　4月15日（木）に予定していた奨学金説明会は、会場の都合により、4月20日（火）16:30からに変更になりました。会場は、3号館201教室から5号館大ホールに変わります。<br>　すでに参加を申し込んでいる人は、改めて申し込む必要はありません。ただし、変更後の日程で参加できない人は、4月16日までに学生課にメールで連絡してください。後日、説明会の録画を見られるようにします。<br>　なお、申請書類の提出期限（4月30日）に変更はありません。</p><p style='text-align:right'>学生課</p></div>","qs":[{"n":47,"q":"このメールの内容と合うものはどれか。","o":["説明会の会場は、変更前と同じ3号館である。","参加を申し込んでいた学生は、もう一度申し込む必要がある。","4月20日に参加できない学生は、録画を見れば連絡しなくてよい。","申請書類の提出期限は、説明会の日程が変わっても変わらない。"],"e":"<b>なお、申請書類の提出期限（4月30日）に変更はありません</b>. Bẫy: hội trường đổi sang tòa 5. Không cần đăng ký lại. Ai không tham gia được thì PHẢI báo trước ngày 16/4 mới được xem bản ghi.","a":3}]},{"passage":"<p>（3）</p><p>　早起きは健康によく、成功する人はみな朝型だ、とよく言われる。しかし、朝に強いか夜に強いかは、努力や意志だけの問題ではなく、生まれつきの体質も大きく関係していることがわかってきた。夜型の人が無理に早起きを続けても、かえって集中力が落ちてしまうことがある。大切なのは、世間の理想に自分を合わせることではなく、自分が最も力を発揮できる時間帯を知ることだろう。</p>","qs":[{"n":48,"q":"筆者の考えに合うものはどれか。","o":["夜型の人も、努力すれば朝型の人と同じように力を出せる。","朝型の人のほうが、一般に集中力が高い。","朝型か夜型かは、本人の心がけだけで決まるものではない。","早起きは健康によいので、夜型の人も習慣にすべきだ。"],"e":"<b>努力や意志だけの問題ではなく、生まれつきの体質も大きく関係</b>. 意志 được nói lại thành 心がけ. Bẫy: dậy sớm tốt cho sức khỏe là ý kiến \"thường được nói\" (よく言われる), không phải ý của tác giả.","a":2}]},{"passage":"<p>（4）</p><p>　会議で「エビデンス」「コンセンサス」などのカタカナ語が飛び交うことが増えた。新しい概念を表すのに便利な場合もあるが、「根拠」「合意」と言えば済むものまでカタカナにする必要があるだろうか。聞き手がその言葉を知らなければ、内容は伝わらない。言葉は、相手に伝わってはじめて意味を持つ。難しそうな言葉で自分を大きく見せるより、誰にでもわかる言葉を選ぶほうが、よほど知的ではないかと思う。</p>","qs":[{"n":49,"q":"筆者がカタカナ語について最も言いたいことは何か。","o":["新しい概念は、カタカナ語でなければ正確に表すことができないことが多い。","カタカナ語を使う人は、自分を大きく見せようとしている。","相手に伝わってこそ言葉なので、わかる表現を選ぶべきだ。","会議では、カタカナ語の意味を一つ一つ説明してから使うようにすべきだ。"],"e":"<b>言葉は、相手に伝わってはじめて意味を持つ</b>. Bẫy: bài chỉ nói katakana đôi khi tiện (便利な場合もある), không nói \"chỉ có katakana mới diễn đạt được\". Đáp án thứ ba quy chụp tất cả mọi người.","a":2}]}]},{"id":"r9","title":"問題9 内容理解（中文）","en":"Đọc hiểu: đoạn vừa","instr":"次の（1）から（3）の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>（1）</p><p>　祖母の作る煮物は、家族みんなの好物だった。祖母が亡くなる前の年、私は作り方を教えてほしいと頼んだ。ところが、祖母は「しょうゆは少し、砂糖はこのくらい」と言うばかりで、<u>①はっきりした分量を教えてくれなかった</u>。意地悪をしているのではない。長年、目と舌で覚えてきたので、数字では説明できなかったのだ。</p><p>　そこで私は、祖母が料理をする横に立ち、調味料を入れるたびにこっそり量って書き留めた。そうして完成したレシピのとおりに作ってみたが、何かが違う。味は似ているのに、祖母の煮物にはならないのである。</p><p>　何度も作るうちに、ようやく<u>②その理由</u>がわかってきた。祖母は、その日の野菜の状態を見て、火加減や煮る時間を少しずつ変えていたのだ。固い大根の日は長めに煮て、水分の多い日は調味料を控える。レシピに書けるのは料理の骨組みだけで、本当の味は、目の前の材料と向き合う中で決まっていく。</p><p>　今でも祖母の味を完全に再現できたとは思わない。それでも、台所に立って野菜の様子を確かめるとき、私は祖母の隣にいるような気がする。</p>","qs":[{"n":50,"q":"祖母が分量をはっきり言わなかったことについて、筆者はどう受け止めているか。","o":["経験で身についた感覚は、数字にしにくいのだと理解している。","大切な料理の秘密を、家族にも簡単には教えたくなかったのだろうと考えている。","年を取って、記憶があいまいになっていたのだと思っている。","筆者に、自分で味の工夫をさせるためにわざとそうしたのだと感じている。"],"e":"<b>長年、目と舌で覚えてきたので、数字では説明できなかった</b>. Bẫy: tác giả nói rõ bà không cố ý giấu (意地悪をしているのではない).","a":0},{"n":51,"q":"レシピどおりに作っても祖母の味にならなかった理由として、筆者が気づいたことは何か。","o":["筆者が横でこっそり量った調味料の分量が、実際には正確ではなかった。","祖母は材料の状態を見て、作り方を変えていた。","祖母は、筆者に教えていない材料を加えていた。","筆者の家の台所は、祖母の家の台所より火が弱かった。"],"e":"<b>その日の野菜の状態を見て、火加減や煮る時間を少しずつ変えていた</b>. Bẫy: đong sai nghe rất hợp lý, nhưng bài KHÔNG nói vậy.","a":1},{"n":52,"q":"筆者の考えに合うものはどれか。","o":["祖母の味は、何度も作るうちに完全に再現できるようになった。","レシピは役に立たないので、書いておく必要はない。","料理の本当の味は、書き留められる部分だけでは伝えきれない。","料理は、分量を量らずに感覚だけで作るべきだ。"],"e":"<b>レシピに書けるのは料理の骨組みだけ</b>. Bẫy: công thức vẫn có giá trị như bộ khung (骨組み), nên nói vô dụng là quá mức. Tác giả cũng nói chưa tái hiện hoàn toàn.","a":2}]},{"passage":"<p>（2）</p><p>　道路沿いに植えられた街路樹は、都市の景観をよくするだけでなく、さまざまな役割を果たしている。夏には木陰を作って路面の温度を下げ、葉は空気中の汚れを吸着する。車の騒音を和らげ、歩行者と車道を分ける役目もある。</p><p>　一方で、街路樹には<u>①維持の難しさ</u>もある。大きく育った木の根が歩道を持ち上げ、通行の妨げになることがある。秋には大量の落ち葉が出て、近くの住民や店が掃除に追われる。枝が信号や標識を隠さないよう、定期的に切る費用もかかる。このため、苦情を受けて木を切ってしまう自治体も少なくない。</p><p>　しかし、最近では、<u>②住民が街路樹の管理に参加する取り組み</u>が各地で始まっている。ある町では、住民が落ち葉を集めて肥料にし、地域の花壇で使っている。落ち葉掃除を地域の行事にしたところ、近所同士の交流が生まれたという例もある。</p><p>　街路樹を、行政が管理する「設備」と見るか、地域で育てる「財産」と見るか。その見方の違いが、町の風景を大きく変えていくのではないだろうか。</p>","qs":[{"n":53,"q":"街路樹の役割として、本文で述べられていないものはどれか。","o":["夏に、路面の温度を下げる。","車の騒音を和らげる。","歩行者と車道を分ける。","雨水をためて、洪水を防ぐ。"],"e":"Câu hỏi PHỦ ĐỊNH (述べられていないもの), cần đọc kỹ đề. Ba vai trò kia đều có ở đoạn 1. Ngăn lũ có thể đúng ngoài đời nhưng bài không nhắc đến.","a":3},{"n":54,"q":"自治体が街路樹を切ってしまうことがあるのはなぜか。","o":["木が大きく育ちすぎて、町全体の景観を損なってしまうから","新しい道路を作る必要があるから","管理の負担や住民の不満が大きいから","住民が、街路樹の管理にまったく参加しなくなったから"],"e":"Đoạn 2: rễ cây, lá rụng, chi phí cắt cành, rồi <b>苦情を受けて木を切ってしまう</b>. Bẫy: cảnh quan đẹp hơn là VAI TRÒ của cây (đoạn 1). Việc dân tham gia quản lý là giải pháp ở đoạn 3.","a":2},{"n":55,"q":"筆者の考えに最も近いものはどれか。","o":["街路樹の管理は、費用も手間も含めて、すべて住民に任せるべきだ。","街路樹の見方しだいで、町の姿も変わりうる。","苦情の多い街路樹は、切ってもしかたがない。","落ち葉の掃除は、近くの住民ではなく行政の責任で行うべきだ。"],"e":"Câu cuối: <b>見方の違いが、町の風景を大きく変えていく</b>. Câu hỏi tu từ ～ではないだろうか là cách tác giả nêu ý kiến. Bẫy: \"giao hết cho người dân\" là quá mức.","a":1}]},{"passage":"<p>（3）</p><p>　仕事でミスをしたとき、すぐに謝ることができる人と、まず言い訳をしてしまう人がいる。「時間がなかったので」「指示がはっきりしなかったので」。本人は事情を説明しているつもりでも、聞く側には、責任を逃れようとしているように聞こえる。</p><p>　言い訳をしたくなるのは、<u>①自分を守りたい</u>からだ。ミスを認めれば、能力が低いと思われるのではないか。そう恐れる気持ちは理解できる。しかし、実際には逆である。素直に非を認める人のほうが、信頼できる人だと評価されることが多い。誰でもミスはする。問われているのは、ミスをしたかどうかよりも、その後どう行動するかなのだ。</p><p>　ただし、謝ればそれで終わりというわけではない。「申し訳ありません」を繰り返すだけで、同じミスを何度もする人がいる。<u>②それでは謝罪の意味がない</u>。なぜミスが起きたのかを考え、次にどう防ぐかを伝える。そこまでして、はじめて謝罪は相手に届くのである。</p><p>　事情の説明が必要な場合もあるだろう。しかし、それは謝った後でよい。順番を間違えないことだ。</p>","qs":[{"n":56,"q":"言い訳をする人について、筆者はどのように述べているか。","o":["能力が低いと思われたくないので、事実と違うことをわざと言ってしまう。","事情を説明しているので、聞く側も納得しやすい。","言い訳をする人のほうが、素直に謝る人よりも信頼されることが多い。","そのつもりがなくても、責任逃れに聞こえやすい。"],"e":"<b>本人は事情を説明しているつもりでも、聞く側には、責任を逃れようとしているように聞こえる</b>. Bẫy: bài không nói họ nói dối. Người được tin tưởng là người nhận lỗi.","a":3},{"n":57,"q":"筆者によると、謝罪が相手に届くために必要なことは何か。","o":["「申し訳ありません」という言葉を、相手が許してくれるまで何度も繰り返すこと","ミスに至った事情を、最初に詳しく説明すること","原因を考え、再発を防ぐ方法まで示すこと","ミスに気づいたら、事情を確かめるより先に、できるだけ早く謝ること"],"e":"<b>なぜミスが起きたのかを考え、次にどう防ぐかを伝える。そこまでして、はじめて</b>. Bẫy: xin lỗi nhanh nghe hợp lý nhưng bài không nói. Giải thích hoàn cảnh thì phải để SAU khi xin lỗi.","a":2},{"n":58,"q":"筆者の主張に最も近いものはどれか。","o":["ミスをしたときは、相手に事情を説明する必要はまったくない。","ミスを認めると、周りから能力が低いと思われてしまう。","一度謝ればそれで十分だ。","非を素直に認めると、かえって信頼される。"],"e":"<b>実際には逆である。素直に非を認める人のほうが、信頼できる</b>. Bẫy: \"bị nghĩ là kém\" là nỗi sợ mà tác giả phủ nhận. Giải thích hoàn cảnh vẫn cần (必要な場合もある), chỉ là sau khi xin lỗi.","a":3}]}]},{"id":"r10","title":"問題10 内容理解（長文）","en":"Đọc hiểu: đoạn dài","instr":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　観光は、地域に大きな利益をもたらす。宿泊施設や飲食店、土産物店がにぎわい、新しい仕事が生まれる。人口が減り続ける地方の町にとって、観光客を呼び込むことは、地域を維持するための重要な手段となっている。</p><p>　しかし近年、<u>①観光客が増えすぎることによる問題</u>が、各地で深刻になっている。有名な観光地では、バスや電車が混雑して住民が乗れない、ごみが道に捨てられる、写真を撮るために私有地に入り込む人がいる、といった事態が起きている。住民の日常生活が脅かされ、「観光客にはもう来てほしくない」という声さえ上がるようになった。</p><p>　皮肉なことに、こうした混雑は観光客自身の満足度も下げてしまう。静かな寺の庭を楽しみに来たのに、人が多すぎてゆっくり見ることもできない。そうなれば、その土地の魅力そのものが失われていく。<u>②観光が観光資源を壊してしまう</u>のである。</p><p>　対策として、入場者数を制限したり、混雑する時間帯の料金を高くしたりする地域が出てきた。また、有名な場所に集中する観光客を、周辺のあまり知られていない地域へ誘導する試みもある。いずれも一定の効果は上げているが、それだけで十分とは言えない。</p><p>　根本的に必要なのは、観光の成功を何で測るのかという考え方を見直すことではないだろうか。これまでは、訪れた人の数が多ければ多いほどよいとされてきた。しかし、数だけを追い求めれば、住民の暮らしも、訪れる人の体験も損なわれてしまう。住む人が自分の町に誇りを持ち、訪れる人がその土地の文化に敬意を払う。そうした関係を築けるかどうかが、これからの観光地に問われているのだと思う。</p>","qs":[{"n":59,"q":"第1段落で、筆者は観光をどのようなものとして述べているか。","o":["人口の減る地域を保つための重要な手段","都市の混雑を解消し、人の流れを地方へ分散させるための手段","住民の生活を不便にするもの","都会に出た若者を、ふたたび地方に呼び戻すための手段"],"e":"<b>人口が減り続ける地方の町にとって…地域を維持するための重要な手段</b>. Chú ý câu hỏi chỉ hỏi đoạn 1. Gây bất tiện cho người dân là nội dung của đoạn 2.","a":0},{"n":60,"q":"「観光客にはもう来てほしくない」という声が上がるようになったのはなぜか。","o":["観光客が増えても、地域の店にはお金をあまり使わなくなったから","観光地としての魅力が失われたから","有名な観光地の入場料が、住民にとっても高くなったから","観光客が多すぎて、生活に支障が出ているから"],"e":"<b>住民の日常生活が脅かされ</b>: xe buýt quá đông, rác, xâm nhập đất tư. Bẫy: mất sức hấp dẫn là vấn đề của KHÁCH DU LỊCH (đoạn 3), không phải lý do người dân phản đối.","a":3},{"n":61,"q":"「観光が観光資源を壊してしまう」と筆者が言うのはなぜか。","o":["観光客が、寺や庭などの文化財に直接傷をつけてしまうことが多いから","混雑で、訪れる価値そのものが損なわれるから","客が無名の地域へ流れるから","観光客の対応に疲れた住民が、観光の仕事をやめてしまうから"],"e":"Không thể thong thả ngắm vì quá đông, nên <b>その土地の魅力そのものが失われていく</b>. 壊す ở đây là nghĩa bóng. Bẫy: làm hư hại di tích là nghĩa đen, bài không nói.","a":1},{"n":62,"q":"筆者は、これからの観光地に何が必要だと考えているか。","o":["入場者数の制限や時間帯による料金の工夫を、さらに多くの地域に広げること","有名な観光地への訪問を、一定期間禁止すること","住民の誇りを高めるために、これまで以上に観光客を増やしていくこと","数より、住民と訪問者の関係を成功の基準にすること"],"e":"Đoạn cuối: xem lại cách đo thành công, thay vì số lượng thì là <b>住む人が…誇りを持ち、訪れる人が…敬意を払う…関係</b>. Bẫy: về hạn chế số người, tác giả nói <b>それだけで十分とは言えない</b>.","a":3}]}]},{"id":"r11","title":"問題11 統合理解","en":"Đọc so sánh A và B","instr":"次のAとBの文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p><b>A</b></p><p>　小学校の宿題は必要だと思う。授業で習ったことは、その日のうちに復習しなければ、すぐに忘れてしまう。宿題があることで、家で机に向かう習慣もつく。この学習習慣は、中学や高校に進んでから大きな力になるはずだ。確かに、量が多すぎると子どもの負担になる。しかし、だからといって宿題そのものをなくしてしまうと、家庭によって学習量に大きな差が出てしまうだろう。量や内容を工夫したうえで、宿題は続けるべきだ。</p><p><b>B</b></p><p>　全員に同じ宿題を出すやり方は、見直す時期に来ている。すでに理解している子どもにとっては時間の無駄であり、理解できていない子どもにとっては、一人では解けずに苦痛なだけだ。宿題に追われて、遊びや読書、家族と過ごす時間が削られていることも気になる。家で学ぶ習慣は確かに大切だが、それは一律の宿題でなくても身につけられる。自分で課題を決めて取り組む自主学習に切り替えれば、学ぶ意欲も育つのではないか。</p>","qs":[{"n":63,"q":"AとBで意見が対立しているのは、どの点か。","o":["家で学ぶ習慣が大切かどうか","全員に同じ宿題を出し続けることの是非","宿題の量が多すぎると負担になるかどうか","子どもに学ぶ意欲が必要かどうか"],"e":"A: tiếp tục bài tập (có cải tiến). B: bỏ bài tập giống nhau cho mọi người, chuyển sang 自主学習. Bẫy: cả hai ĐỀU đồng ý thói quen học ở nhà là quan trọng, nên đó không phải điểm đối lập.","a":1},{"n":64,"q":"宿題をなくした場合について、Aはどのように考えているか。","o":["家庭によって、学習量の差が大きくなる。","子どもが遊ぶ時間が増えるので、望ましい。","子どもが自分で課題を決めて、意欲が育つ。","中学や高校に進んでも、特に困ることはない。"],"e":"A: <b>宿題そのものをなくしてしまうと、家庭によって学習量に大きな差が出てしまう</b>. Bẫy: thời gian chơi và tự học là ý của B.","a":0}]}]},{"id":"r12","title":"問題12 主張理解（長文）","en":"Đọc hiểu: quan điểm tác giả","instr":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　「普通はこうするでしょう」「普通に考えればわかるはずだ」。私たちは日常的に「普通」という言葉を使う。しかし、この言葉ほど、便利で、同時に危うい言葉もないのではないか。</p><p>　そもそも、「普通」とは何だろうか。多くの人がそうしていること、という意味で使われることが多い。だが、<u>①その「多くの人」とは誰のことか</u>。たいていの場合、それは話し手の周りにいる人々、つまり、同じ地域で育ち、同じような環境で暮らしてきた人々にすぎない。家庭によって朝食の内容が違うように、「普通」の中身は、育った環境によって驚くほど異なる。</p><p>　私がそれを痛感したのは、海外で暮らしたときだった。約束の時間に十分遅れて来た友人に不満を言うと、「十分は遅刻のうちに入らない」と笑われた。私にとっての「普通」は、そこでは少しも普通ではなかったのである。</p><p>　問題は、「普通」という言葉が、<u>②相手を黙らせる力</u>を持っていることだ。「それは普通ではない」と言われると、言われた側は、自分がおかしいのだと感じてしまう。理由を説明されたわけでもないのに、反論しにくくなる。言う側は、自分の考えを述べているだけなのに、あたかも世の中全体の意見であるかのように聞こえるからだ。</p><p>　だから私は、「普通は」と言いたくなったとき、「私はこう思う」と言い換えるようにしている。そうすると、なぜそう思うのか、理由を説明しなければならなくなる。面倒ではあるが、そのほうが相手と対等に話ができる。</p><p>　自分の「普通」が、ほかの人の「普通」と同じとは限らない。その当たり前のことを忘れずにいたいと思う。</p>","qs":[{"n":65,"q":"筆者によると、「普通」という言葉の中身は、実際には何によって決まっていることが多いか。","o":["社会全体で最も多くの人が持っている意見","話す人の身近な環境","法律や規則","その国で古くから受け継がれてきた伝統的な文化"],"e":"<b>話し手の周りにいる人々…にすぎない…育った環境によって驚くほど異なる</b>. Bẫy: \"số đông của toàn xã hội\" chính là điều mọi người TƯỞNG, và tác giả phản bác điều đó.","a":1},{"n":66,"q":"友人に笑われた経験を通して、筆者が気づいたことは何か。","o":["海外では日本と比べて、約束の時間を守らない人が多いということ","当然の感覚が、どこでも通じるとは限らないこと","約束に遅れても、謝る必要はないこと","時間について、友人の考え方のほうが自分より正しかったということ"],"e":"<b>私にとっての「普通」は、そこでは少しも普通ではなかった</b>. Bẫy: tác giả không đánh giá ai đúng ai sai, và không quy chụp người nước ngoài.","a":1},{"n":67,"q":"「普通」という言葉が相手を黙らせる力を持つのはなぜか。","o":["個人の考えが、皆の意見のように響くから","なぜそう考えるのか、理由をていねいに説明するための言葉だから","相手の間違いを、具体的に指摘する言葉だから","目上の人が、立場の下の人に対してよく使う言葉だから"],"e":"<b>あたかも世の中全体の意見であるかのように聞こえる</b>. 世の中全体の意見 được nói lại thành 総意 (ý chung). Bẫy: bài nói KHÔNG hề giải thích lý do (理由を説明されたわけでもないのに).","a":0},{"n":68,"q":"筆者が「私はこう思う」と言い換えるようにしているのはなぜか。","o":["「普通」という言葉と違って、面倒な説明を相手にしなくてすむから","自分の意見に自信が持てるようになるから","理由を説明でき、対等に話せるから","自分の考えを強く示して、相手に反論させないようにするためだから"],"e":"<b>理由を説明しなければならなくなる。面倒ではあるが、そのほうが相手と対等に話ができる</b>. Bẫy: \"không phải giải thích phiền phức\" là ngược lại. Không cho phản bác chính là vấn đề của từ 普通.","a":2}]}]},{"id":"r13","title":"問題13 情報検索","en":"Tìm thông tin","instr":"次は、ある市のマラソン大会の参加者募集の案内である。下の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<div class='notice'><p style='text-align:center'><b>第10回　みなと市民マラソン大会　参加者募集</b></p><p>開催日：3月14日（日）　雨天決行</p><table class='tbl'><tr><th>種目</th><th>参加資格</th><th>参加費</th><th>スタート</th><th>定員</th></tr><tr><td>フルマラソン<br>(42.195km)</td><td>18歳以上</td><td>8,000円</td><td>9:00</td><td>3,000名</td></tr><tr><td>ハーフマラソン<br>(約21km)</td><td>16歳以上</td><td>5,000円</td><td>9:30</td><td>2,000名</td></tr><tr><td>10km</td><td>中学生以上</td><td>3,000円</td><td>10:30</td><td>1,000名</td></tr><tr><td>ファミリーラン<br>(2km)</td><td>小学生と保護者のペア</td><td>1組 2,000円</td><td>11:30</td><td>300組</td></tr></table><p>※市内在住の方は、参加費が1,000円引きになります（ファミリーランは500円引き）。<br>※申し込みは1月31日まで。定員になり次第、締め切ります。<br>※申し込み後の種目変更、返金はできません。<br>※高校生以下の方が参加する場合は、保護者の同意書が必要です。</p></div>","qs":[{"n":69,"q":"市内に住む16歳の高校生ユイさんと、市外に住む母が、同じ種目に出たい。二人が参加できる最も長い種目を選んだ場合、参加費の合計はいくらか。","o":["9,000円","8,000円","10,000円","15,000円"],"e":"Yui 16 tuổi: フル cần 18 tuổi trở lên, nên chọn được dài nhất là <b>ハーフ</b> (16 tuổi trở lên). Yui sống trong thành phố: 5,000 − 1,000 = 4,000円. Mẹ sống ngoài thành phố: 5,000円. Tổng <b>9,000円</b>. Bẫy: 8,000円 (giảm cho cả hai), 15,000円 (chọn フル).","a":0},{"n":70,"q":"中学生の健太さんは、市外に住む祖父と一緒に大会に出たいと考えている。正しいものはどれか。","o":["二人でファミリーランに申し込めば、1組2,000円で一緒に参加することができる。","健太さんは、ハーフマラソンにも出ることができる。","祖父は市外に住んでいるので、割引がないだけでなく10kmにも出られない。","二人とも10kmに出られるが、同意書が要る。"],"e":"ファミリーラン chỉ dành cho <b>học sinh tiểu học</b> và phụ huynh, nên học sinh cấp 2 không tham gia được. 10km dành cho 中学生以上, cả hai đều tham gia được. Kenta thuộc 高校生以下 nên cần <b>同意書</b>. Sống ngoài thành phố chỉ mất ưu đãi giảm giá, vẫn được tham gia.","a":3}]}]}];
const SET6 = [{"id":"m1","title":"問題1 漢字読み","en":"Đọc kanji","instr":"＿＿の言葉の読み方として最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":1,"q":"両国の交渉は、ここに来て<u>暗礁</u>に乗り上げている。","o":["あんそう","あんしょ","あんしょう","やみしょう"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>暗礁 (あんしょう)</b> = đá ngầm. 暗礁に乗り上げる = (đàm phán, kế hoạch) đi vào bế tắc. 礁 đọc là <b>しょう</b>, có trường âm.","a":2}]},{"qs":[{"n":2,"q":"新しい研究会が、来月正式に<u>発足</u>する。","o":["はっそく","ほっそく","はっあし","ほっあし"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 2, lần này hỏi theo dạng khác.</span><br><b>発足 (ほっそく)</b> = thành lập, ra mắt (tổ chức). 発 đọc là <b>ほっ</b> chứ không phải はっ. Đây là cách đọc đặc biệt, rất hay bị bẫy bằng はっそく.","a":1}]},{"qs":[{"n":3,"q":"彼女は<u>手際</u>よく料理を作り、あっという間にテーブルに並べた。","o":["てさい","しゅさい","てぎわ","てきわ"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 4, lần này hỏi theo dạng khác.</span><br><b>手際 (てぎわ)</b> = sự khéo léo, nhanh gọn khi làm việc. 際 thường đọc là さい (国際), nhưng ở đây là âm Nhật <b>きわ</b>, biến âm thành <b>ぎわ</b>.","a":2}]},{"qs":[{"n":4,"q":"顧客の個人情報が外部に<u>漏洩</u>する事件が起きた。","o":["もうえい","ろうせつ","ろうえい","ろえい"],"e":"<b>漏洩 (ろうえい)</b> = rò rỉ (thông tin, bí mật). 漏 = <b>ろう</b> (như 漏水 ろうすい), 洩 = <b>えい</b>.","a":2}]},{"qs":[{"n":5,"q":"次の条件に<u>該当</u>する方は、窓口までお申し出ください。","o":["かいとう","がいどう","けいとう","がいとう"],"e":"<b>該当 (がいとう)</b> = thuộc diện, phù hợp với (điều kiện). 該 đọc là <b>がい</b> (có dakuten). かいとう là 回答 hoặc 解答.","a":3}]},{"qs":[{"n":6,"q":"父は四十年間、病院の建設に<u>携わって</u>きた。","o":["かかわって","たくわえて","たずねて","たずさわって"],"e":"<b>携わる (たずさわる)</b> = tham gia vào, làm công việc gì đó lâu dài. かかわる = 関わる (liên quan), cũng gần nghĩa nhưng chữ kanji khác. たくわえる = 蓄える (tích trữ).","a":3}]}]},{"id":"m2","title":"問題2 文脈規定","en":"Từ theo ngữ cảnh","instr":"（　　）に入れるのに最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":7,"q":"監督の見事な（　　）で、チームは逆転勝利を収めた。","o":["配置","手配","采配","分配"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 2, lần này hỏi theo dạng khác.</span><br><b>采配 (さいはい)</b> = sự chỉ huy, điều binh khiển tướng. Rất hay dùng cho huấn luyện viên. 配置 = bố trí, 手配 = sắp xếp, chuẩn bị (vé, xe), 分配 = phân chia.","a":2}]},{"qs":[{"n":8,"q":"海外での十年間の経験で（　　）た語学力を、今の仕事に生かしている。","o":["培っ","耕し","育て","蓄え"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 4, lần này hỏi theo dạng khác.</span><br><b>培う (つちかう)</b> = vun đắp (năng lực, kinh nghiệm qua thời gian dài). 培った語学力 rất tự nhiên. 耕す = cày (ruộng), 育てる thường dùng cho người, cây. 蓄える dùng cho tiền, năng lượng, tri thức đều được nhưng không tự nhiên với 語学力 bằng 培う.","a":0}]},{"qs":[{"n":9,"q":"会議で反対されないよう、部長は事前に関係者への（　　）を済ませていた。","o":["根回し","下準備","下見","手回し"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 3, lần này hỏi theo dạng khác.</span><br><b>根回し (ねまわし)</b> = vận động, thuyết phục trước với những người liên quan. 下見 = đi xem trước (địa điểm), 下準備 = chuẩn bị trước (công việc, nấu ăn), không dùng với 関係者への.","a":0}]},{"qs":[{"n":10,"q":"新システムを導入したいが、費用の高さが（　　）になっている。","o":["ピーク","ネック","ギャップ","ノルマ"],"e":"<b>ネック</b> = điểm nghẽn, trở ngại chính (từ bottleneck). ～がネックになる. ピーク = đỉnh điểm, ギャップ = khoảng cách, chênh lệch, ノルマ = chỉ tiêu.","a":1}]},{"qs":[{"n":11,"q":"上司と部下の意見が対立し、課長は二人の（　　）になって苦しんでいる。","o":["足止め","板挟み","手詰まり","骨抜き"],"e":"<b>板挟み (いたばさみ)</b> = bị kẹt ở giữa hai bên. 手詰まり = bế tắc, hết cách, 骨抜き = bị làm mất tác dụng (luật, kế hoạch), 足止め = bị giữ chân.","a":1}]},{"qs":[{"n":12,"q":"彼の分析力には、ベテランの記者たちも（　　）置いている。","o":["一歩","一線","一役","一目"],"e":"<b>一目置く (いちもくおく)</b> = nể phục, công nhận ai đó giỏi hơn. 一線を画す = vạch ranh giới, 一役買う = góp một tay.","a":3}]},{"qs":[{"n":13,"q":"このイベントのために、地元の企業が費用の一部を（　　）くれた。","o":["負傷して","負荷して","負債して","負担して"],"e":"<b>負担 (ふたん)する</b> = gánh chịu (chi phí). 負傷 = bị thương, 負荷 = tải trọng (danh từ), 負債 = nợ (danh từ, không dùng với する).","a":3}]}]},{"id":"m3","title":"問題3 言い換え類義","en":"Từ gần nghĩa","instr":"＿＿の言葉に意味が最も近いものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":14,"q":"システムの不具合で、商品の発送が<u>滞って</u>いる。","o":["増えて","中止されて","遅れて","確認されて"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 4, lần này hỏi theo dạng khác.</span><br><b>滞る (とどこおる)</b> = bị đình trệ, chậm trễ. Gần nhất là 遅れている. Không phải là dừng hẳn (中止).","a":2}]},{"qs":[{"n":15,"q":"どちらの方法が良いかは、<u>一概には</u>言えない。","o":["はっきりとした声で","誰に対しても","今の時点では","簡単に決めつけて"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>一概に (いちがいに)</b> = một cách đánh đồng, vơ đũa cả nắm. 一概には言えない = không thể kết luận đơn giản như vậy. Gần nhất là 簡単に決めつけて.","a":3}]},{"qs":[{"n":16,"q":"今日の作業は、<u>ひとまず</u>ここで終わりにしよう。","o":["すっかり","ようやく","いっそ","とりあえず"],"e":"<b>ひとまず</b> = tạm thời, trước mắt. Gần nhất là とりあえず. すっかり = hoàn toàn, ようやく = cuối cùng thì, いっそ = thà rằng.","a":3}]},{"qs":[{"n":17,"q":"その問題は、結局<u>うやむやに</u>なってしまった。","o":["すっかり解決して","はっきりしないまま終わって","さらに大きくなって","誰にも知られずに"],"e":"<b>うやむや</b> = mập mờ, bỏ lửng không rõ ràng. うやむやになる = vấn đề bị bỏ lửng mà không giải quyết.","a":1}]},{"qs":[{"n":18,"q":"彼は客に対して<u>ぞんざいな</u>口のきき方をする。","o":["失礼で乱暴な","丁寧すぎる","声の大きい","早口の"],"e":"<b>ぞんざい</b> = thô lỗ, cẩu thả (trong cách nói, cách đối xử). Gần nhất là 失礼で乱暴な. Trái nghĩa là 丁寧.","a":0}]},{"qs":[{"n":19,"q":"相手のミスを見て、彼は<u>すかさず</u>攻撃に出た。","o":["慎重に","仕方なく","間を置かずに","思い切って"],"e":"<b>すかさず</b> = ngay lập tức, không để lỡ cơ hội. Gần nhất là 間を置かずに (không để khoảng trống).","a":2}]}]},{"id":"m4","title":"問題4 用法","en":"Cách dùng từ","instr":"次の言葉の使い方として最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":20,"q":"<b>賄う</b>","o":["大学の学費は、アルバイトの収入で賄っている。","友人の誕生日に、花束を賄ってあげた。","迷惑をかけた相手に、心から賄った。","雨が降ってきたので、洗濯物を賄った。"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 2, lần này hỏi theo dạng khác.</span><br><b>賄う (まかなう)</b> = trang trải, chi trả (chi phí bằng nguồn tiền nào đó). Tặng hoa là 贈る, xin lỗi là 謝る (hoặc 償う = đền bù), cất đồ phơi là 取り込む.","a":0}]},{"qs":[{"n":21,"q":"<b>まちまち</b>","o":["彼は約束の時間にまちまち遅れてくる。","まちまち雨が降り出しそうな空だ。","この町は道がまちまちで、迷いやすい。","同じ商品でも、店によって値段がまちまちだ。"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 3, lần này hỏi theo dạng khác.</span><br><b>まちまち</b> = mỗi nơi, mỗi người một khác, không thống nhất. Không dùng như trạng từ tần suất (たびたび) hay mô tả đường phức tạp (入り組んでいる).","a":3}]},{"qs":[{"n":22,"q":"<b>打ち込む</b>","o":["彼女は試験に打ち込んで、合格した。","彼は退職後、陶芸に打ち込んでいる。","道で知人に打ち込んで、挨拶した。","雨が窓に打ち込んで、目が覚めた。"],"e":"<b>打ち込む (うちこむ)</b> = dồn hết tâm sức vào (sở thích, công việc). Đỗ kỳ thi là 合格する, gặp người quen là 出会う. Mưa đập vào cửa thì dùng 打ちつける.","a":1}]},{"qs":[{"n":23,"q":"<b>見計らう</b>","o":["駅で友人を見計らって、声をかけた。","この荷物の重さを見計らってください。","彼は人の話をよく見計らう人だ。","客が少なくなる時間を見計らって、店に入った。"],"e":"<b>見計らう (みはからう)</b> = canh, chọn đúng thời điểm thích hợp. 頃合いを見計らう, 時間を見計らう. Tìm thấy bạn là 見つける, đo cân nặng là 量る.","a":3}]},{"qs":[{"n":24,"q":"<b>踏まえる</b>","o":["雪の道を踏まえて、ゆっくり歩いた。","彼は約束を踏まえて、遅れてきた。","前回の反省を踏まえて、今年の計画を立てた。","この机は古いので、踏まえないでください。"],"e":"<b>踏まえる (ふまえる)</b> = dựa trên, căn cứ vào (kinh nghiệm, kết quả, ý kiến). Đi trên tuyết là 踏みしめる, thất hứa là 約束を破る.","a":2}]},{"qs":[{"n":25,"q":"<b>一環</b>","o":["家族の一環として、犬を大切にしている。","この植樹は、環境保護活動の一環として行われている。","このネックレスは、金の一環でできている。","一環の間違いが、大きな事故につながった。"],"e":"<b>Nの一環として (いっかん)</b> = như một phần của (kế hoạch, hoạt động). Thành viên gia đình là 家族の一員, một chỗ sai sót nhỏ là 一つのミス.","a":1}]}]},{"id":"m5","title":"問題5 文法形式の判断","en":"Ngữ pháp","instr":"次の文の（　　）に入れるのに最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":26,"q":"この店は、今月末（　　）、三十年の歴史に幕を下ろすことになった。","o":["を皮切りに","をよそに","を限りに","をおいて"],"e":"<b>Nを限りに</b> = lấy N làm mốc cuối cùng. 幕を下ろす = khép lại, kết thúc. Bẫy: <b>を皮切りに</b> = bắt đầu từ, nghĩa ngược lại hoàn toàn.","a":2}]},{"qs":[{"n":27,"q":"物があふれる現代（　　）、本当に必要なものを見極める力が求められている。","o":["にかけては","にあって","にひきかえ","にもまして"],"e":"<b>Nにあって</b> = ở trong hoàn cảnh N (văn viết). にかけては = về mặt (giỏi), にひきかえ = trái với, にもまして = hơn cả.","a":1}]},{"qs":[{"n":28,"q":"彼は、自分の会社が業界で一番だと公言し（　　）。","o":["てやまない","てはばからない","てたまらない","てしかるべきだ"],"e":"<b>Vて はばからない</b> = không ngần ngại V. 公言してはばからない là cụm rất hay gặp. Bẫy: てやまない = luôn mong mỏi (願ってやまない), てたまらない = vô cùng (cảm xúc), てしかるべきだ = đương nhiên phải.","a":1}]},{"qs":[{"n":29,"q":"彼女は、もう二度と話したくない（　　）、黙って電話を切ってしまった。","o":["ばかりか","とあって","ともなく","とばかりに"],"e":"<b>～とばかりに</b> = như thể muốn nói ~ (thái độ thể hiện qua hành động). Bẫy: ばかりか = không chỉ mà còn, とあって = vì là, ともなく = vô thức.","a":3}]},{"qs":[{"n":30,"q":"この程度の雨なら、わざわざ試合を中止する（　　）。","o":["べくもない","にかたくない","までもない","ずにはすまない"],"e":"<b>Vる までもない</b> = không cần phải V. Bẫy: <b>べくもない</b> = không thể nào V được (khả năng), khác với \"không cần\". にかたくない = dễ dàng (tưởng tượng).","a":2}]},{"qs":[{"n":31,"q":"あと五分早く家を出ていれば、電車に間に合った（　　）。","o":["ものの","ものを","もので","ものだから"],"e":"<b>～ば～たものを</b> = nếu ~ thì đã ~ rồi, vậy mà (tiếc nuối). Bốn đáp án đều có もの. Chỉ ものを kết thúc câu với ý tiếc nuối. ものの, もので, ものだから đều cần vế sau.","a":1}]},{"qs":[{"n":32,"q":"最新の技術（　　）、この程度の修理は一日で終わるだろう。","o":["をおいては","にもまして","をもってすれば","をよそに"],"e":"<b>Nをもってすれば</b> = nếu dùng đến N (năng lực, kỹ thuật) thì. Bẫy: をおいては phải đi với phủ định (～をおいてはいない).","a":2}]},{"qs":[{"n":33,"q":"これだけ多くの人が被害を受けたのだから、会社は責任を取っ（　　）。","o":["てしかるべきだ","てはばからない","てやまない","てもさしつかえない"],"e":"<b>Vて しかるべきだ</b> = đương nhiên phải V. Bẫy: <b>てもさしつかえない</b> = V cũng không sao, nghĩa quá nhẹ so với ngữ cảnh nhiều người bị thiệt hại.","a":0}]},{"qs":[{"n":34,"q":"彼の説明には、信頼する（　　）根拠が何一つなかった。","o":["にたえる","に至る","にあたる","に足る"],"e":"<b>Vる に足る</b> = đáng để V. 信頼するに足る根拠 = căn cứ đáng tin cậy. Bẫy: にたえる (đáng xem, đáng nghe: 鑑賞にたえる) không đi với 信頼する.","a":3}]},{"qs":[{"n":35,"q":"人の車に傷をつけてしまったのだから、謝ら（　　）。","o":["ずにはおかない","ずにはすまない","ずじまいだ","ずにすむ"],"e":"<b>Vず にはすまない</b> = không thể không V (theo lẽ phải). Bẫy gần nghĩa: <b>ずにはおかない</b> = nhất định sẽ gây ra (dùng khi chủ ngữ là sự việc tác động lên cảm xúc người khác).","a":1}]}]},{"id":"m6","title":"問題6 文の組み立て","en":"Sắp xếp câu","instr":"次の文の ★ に入る最もよいものを、1、2、3、4から一つ選びなさい。","fixed":true,"pages":[{"qs":[{"n":36,"q":"彼女は、＿＿＿ <b>★</b> ＿＿＿ ＿＿＿ 、一度も弱音を吐かなかった。","o":["ときで","あっても","つらい","どんなに"],"a":2,"e":"Thứ tự đúng: どんなに <b>つらい</b> ときで あっても (4 3 1 2). ★ ở vị trí thứ hai."}]},{"qs":[{"n":37,"q":"新製品の売り上げは、＿＿＿ ＿＿＿ ＿＿＿ <b>★</b> 伸び悩んでいる。","o":["に","反して","期待","関係者の"],"a":1,"e":"Thứ tự đúng: 関係者の 期待 に <b>反して</b> (4 3 1 2). <b>Nに反して</b> = trái với N. ★ ở vị trí cuối."}]},{"qs":[{"n":38,"q":"彼は、＿＿＿ <b>★</b> ＿＿＿ ＿＿＿ 毎日勉強している。","o":["べく","寝る間も惜しんで","弁護士に","なる"],"a":3,"e":"Thứ tự đúng: 弁護士に <b>なる</b> べく 寝る間も惜しんで (3 4 1 2). <b>Vる べく</b> = để V. 寝る間も惜しんで = tiếc cả thời gian ngủ."}]},{"qs":[{"n":39,"q":"この問題は、＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 。","o":["わからなく","なる","考えるほど","考えれば"],"a":0,"e":"Thứ tự đúng: 考えれば 考えるほど <b>わからなく</b> なる (4 3 1 2). <b>VばVほど</b> = càng V càng."}]},{"qs":[{"n":40,"q":"この料理は、<b>★</b> ＿＿＿ ＿＿＿ ＿＿＿ 作れる。","o":["そろえば","誰でも簡単に","さえ","材料"],"a":3,"e":"Thứ tự đúng: <b>材料</b> さえ そろえば 誰でも簡単に (4 3 1 2). <b>Nさえ～ば</b> = chỉ cần N là. ★ ở vị trí đầu."}]}]},{"id":"m7","title":"問題7 文章の文法","en":"Ngữ pháp trong đoạn văn","instr":"次の文章を読んで、文章全体の内容を考えて、41 から 45 の中に入る最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　大学進学をきっかけに一人暮らしを始めて、三か月がたった。実家にいたころは、食事も洗濯も、すべて母に任せきりだった。（41）、今はすべて自分でやらなければならない。</p><p>　最初の一か月は、毎日が失敗の連続だった。ご飯を炊けば水の量を間違え、洗濯をすれば白いシャツを青く染めてしまう。料理（42）、レシピを見ながら作っても、なぜか食べられたものではなかった。</p><p>　それでも、少しずつできることが増えてきた。今では、一週間分の献立を考えて買い物をすることもできる。自分でやってみて初めて、母がどれほど大変だったかが（43）。</p><p>　先週、久しぶりに実家に帰ったとき、母に「いつもありがとう」と伝えた。母は驚いたような顔をしていたが、（44）うれしそうだった。一人暮らしは、家事の技術だけでなく、感謝する気持ちも教えてくれた。これからも、自分の生活を自分で作っていく喜びを（45）。</p>","qs":[{"n":41,"q":"（41）","o":["しかし","それなら","それでいて","ちなみに"],"e":"Trước đây mẹ làm hết, <b>しかし</b> bây giờ phải tự làm. Bẫy: それでいて = vậy mà đồng thời (cùng một chủ thể có hai tính chất trái ngược), それなら = nếu vậy thì.","a":0},{"n":42,"q":"（42）","o":["にかけては","に先立って","にとっては","に至っては"],"e":"<b>Nに至っては</b> = còn N thì (ví dụ tệ nhất trong một chuỗi). Bẫy: <b>にかけては</b> = về mặt N thì giỏi nhất, chỉ dùng cho nghĩa tích cực, mà ở đây là thất bại.","a":3},{"n":43,"q":"（43）","o":["身に余る思いだった","身にしみてわかった","身についた","身を粉にした"],"e":"<b>身にしみてわかる</b> = thấm thía sâu sắc. Tất cả đáp án đều là thành ngữ với 身: 身に余る = quá sức mình xứng đáng (vinh dự), 身を粉にする = làm việc cật lực. Câu có trợ từ が (大変だったかが) nên chỉ わかる là hợp.","a":1},{"n":44,"q":"（44）","o":["なにしろ","どこか","あいにく","かろうじて"],"e":"<b>どこかうれしそうだった</b> = có phần vui. Bẫy: なにしろ = dù sao thì (nêu lý do), あいにく = không may, かろうじて = vừa đủ.","a":1},{"n":45,"q":"（45）","o":["大切にしていきたい","大切にしてきたつもりだ","大切にしたためしがない","大切にしかねない"],"e":"これからも = từ nay về sau, nên cần ý định tương lai: <b>ていきたい</b>. Bẫy: てきた = từ trước đến nay, ためしがない = chưa từng, かねない = có thể (chuyện xấu).","a":0}]}]},{"id":"r8","title":"問題8 内容理解（短文）","en":"Đọc hiểu: đoạn ngắn","instr":"次の（1）から（4）の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>（1）</p><p>　締め切りが近づくと、不思議と作業がはかどる。時間がたっぷりあるときは、つい後回しにしてしまうのに、残り時間が少なくなると、驚くほど集中できるのだ。これを利用しない手はない。大きな仕事を任されたら、最終的な締め切りとは別に、自分で小さな締め切りをいくつも設けてみるとよい。そうすれば、最後に慌てることなく、集中した状態で作業を進められる。</p>","qs":[{"n":46,"q":"筆者の考えに合うものはどれか。","o":["時間に余裕があるほうが、作業ははかどるものだ。","最終の締め切り直前に、集中して一気に仕上げるのが効率的だ。","締め切りによる集中を、自分で何度も作り出すとよい。","大きな仕事は、締め切りを延ばしてもらうほうがよい。"],"e":"<b>自分で小さな締め切りをいくつも設けてみる</b>. Bẫy: bài nói gần hạn mới tập trung, nhưng khuyên tạo NHIỀU hạn nhỏ để không bị cuống ở phút chót (最後に慌てることなく).","a":2}]},{"passage":"<p>（2）</p><p>以下は、ある美容院から客に届いたメールである。</p><div class='notice'><p>件名：ご予約の変更、キャンセルについてのお願い</p><p>いつもご利用いただき、ありがとうございます。<br>　ご予約の変更、キャンセルは、ご予約日の前日の18時までに、お電話またはウェブサイトからお願いいたします。<br>　前日の18時を過ぎてからのキャンセル、およびご連絡のないキャンセルにつきましては、次回のご来店時に、キャンセル料として施術料金の50％をいただきます。<br>　なお、体調不良など、やむを得ない事情の場合は、当日でもご相談ください。</p></div>","qs":[{"n":47,"q":"予約日の前日の夜9時に、急に熱が出たため予約を取り消したい客について、このメールの内容から言えることはどれか。","o":["キャンセル料について、店に相談できる。","前日の18時を過ぎているので、理由にかかわらず施術料金の50％を必ず払わなければならない。","当日中に料金を払う。","前日の18時を過ぎているので、もう予約を取り消すことはできない。"],"e":"Bình thường sau 18h sẽ mất phí 50%. Nhưng phần <b>なお</b>: <b>体調不良など、やむを得ない事情の場合は…ご相談ください</b>. Sốt là 体調不良. Bẫy: 50% là quy định chung, nhưng ngoại lệ trong なお mới là đáp án.","a":0}]},{"passage":"<p>（3）</p><p>　スマートフォンの地図アプリは便利だが、頼りすぎると、自分で道を覚える力が衰えるという指摘がある。画面の指示どおりに歩いていると、周りの景色や建物の位置関係に注意を払わなくなるからだ。実際、毎日通る道なのに、アプリがなければ一人で行けないという人もいる。たまにはアプリを閉じて、目印を確かめながら歩いてみてはどうだろうか。</p>","qs":[{"n":48,"q":"本文の内容と合うものはどれか。","o":["地図アプリを使っていると、知らないうちに毎日違う道を通るようになる。","地図アプリの指示は、必ずしも正確ではない。","指示に従うと、周りの目印に注意が向かなくなる。","毎日通っている道なら、アプリがなくても迷うことはまずない。"],"e":"<b>周りの景色や建物の位置関係に注意を払わなくなる</b>. 景色や建物 được nói lại thành 手がかり (dấu hiệu nhận biết). Bẫy: bài ví dụ có người đi đường quen mà KHÔNG có app thì không đi được.","a":2}]},{"passage":"<p>（4）</p><p>　「急がば回れ」ということわざがある一方で、「善は急げ」ということわざもある。一見、正反対のことを言っているようだが、矛盾しているわけではない。前者は、危険な近道より確実な方法を選べという教えであり、後者は、よいと思ったことはためらわずに始めよという教えである。ことわざは、それぞれ異なる場面に向けた知恵なのだ。大切なのは、今の状況にどちらが当てはまるかを見極めることだろう。</p>","qs":[{"n":49,"q":"ことわざについて、筆者が述べていることと合うものはどれか。","o":["反対に見えても、別々の場面に向けた教えだ。","二つのことわざのうち、どちらか一方の内容は誤っていると考えるべきである。","急いでいるときほど、近道を選ぶべきである。","ことわざの正しい意味を知るには、まずその由来を詳しく調べるべきである。"],"e":"<b>ことわざは、それぞれ異なる場面に向けた知恵</b>. Bẫy: tác giả nói <b>矛盾しているわけではない</b>. 急がば回れ khuyên KHÔNG đi đường tắt nguy hiểm.","a":0}]}]},{"id":"r9","title":"問題9 内容理解（中文）","en":"Đọc hiểu: đoạn vừa","instr":"次の（1）から（3）の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>（1）</p><p>　去年の夏、大雨の被害を受けた町で、災害ボランティアに参加した。泥に埋まった家から家具を運び出し、床下の泥をかき出す。真夏の暑さの中での作業は、想像以上に厳しかった。</p><p>　作業を始めてすぐに、私は<u>①自分の考えの甘さ</u>を思い知らされた。困っている人を助けたいという気持ちさえあれば、役に立てると思っていた。しかし、現地では、言われたとおりに体を動かすことしかできず、むしろ慣れた人の足を引っ張っているのではないかと感じた。</p><p>　ところが、作業の最終日、ある家の主人から「来てくれて、本当に心強かった」と声をかけられた。家の片付けそのものよりも、遠くから人が手伝いに来てくれたことが、何よりも励みになったのだという。</p><p>　その言葉を聞いて、私は<u>②ボランティアの意味</u>を考え直した。専門的な技術がなくても、そこにいて一緒に汗を流すことで、相手の心を支えることができる。助けるつもりで行った私のほうが、実は多くのことを教えてもらったのかもしれない。</p>","qs":[{"n":50,"q":"作業を始めてすぐ、筆者はどのように感じたか。","o":["かえって邪魔になっているのではと思った。","真夏の暑さがあまりに厳しく、作業を途中でやめて帰りたいと思った。","気持ちさえあれば、十分に役に立てると確信した。","泥や家具を運ぶための、専門的な技術を身につけたいと思った。"],"e":"<b>むしろ慣れた人の足を引っ張っているのではないか</b>. 足を引っ張る được nói lại thành 妨げになる. Bẫy: \"chỉ cần có lòng\" là suy nghĩ TRƯỚC khi đến, mà tác giả nhận ra là ngây thơ.","a":0},{"n":51,"q":"家の主人の言葉から、筆者はどのようなことを知ったか。","o":["家の片付けが予定より早く終わったことに、主人がとても感謝していること","遠方の人ほど作業が上手なこと","来てくれる人の存在自体が支えになること","主人が、自分の家を早く直すために専門的な技術を持つ人を求めていたこと"],"e":"<b>家の片付けそのものよりも、遠くから人が手伝いに来てくれたことが…励みになった</b>. Bẫy: mẫu AよりもB, chủ nhà coi trọng B (có người đến) hơn A (dọn xong).","a":2},{"n":52,"q":"「多くのことを教えてもらった」とあるが、筆者が学んだことに最も近いものはどれか。","o":["泥のかき出し方や重い家具の運び方など、作業の具体的なやり方","人を支えるのは技術だけではないこと","災害に備えておくことの大切さ","真夏の暑い中で長時間の作業をするときの、体の守り方のこつ"],"e":"<b>専門的な技術がなくても、そこにいて一緒に汗を流すことで、相手の心を支えることができる</b>. Câu hỏi về ý nghĩa sâu xa, không phải kỹ năng thực tế.","a":1}]},{"passage":"<p>（2）</p><p>　かつて動物園は、珍しい動物を見せて人々を楽しませる場所だった。しかし今、動物園の役割は大きく変わりつつある。その一つが、<u>①絶滅のおそれがある動物を守ること</u>である。野生での数が減った動物を園内で繁殖させ、その一部を自然に帰す取り組みが、世界各地で進められている。</p><p>　展示の方法も変わってきた。以前は、狭いおりの中に動物を入れて見せることが多かった。最近では、動物が本来暮らしている環境に近づけた空間をつくり、その中で自然な行動を見られるようにする動物園が増えている。泳ぐ、木に登る、獲物を探すといった姿を見ることで、来園者はその動物が野生でどのように生きているのかを知ることができる。</p><p>　もちろん、動物を囲いの中で飼うこと自体を疑問視する声もある。しかし、多くの人が実際に動物を見て、その魅力や置かれている状況を知ることが、自然を守ろうとする意識につながるのも事実だ。<u>②動物園は、人と野生をつなぐ窓</u>としての役割を担っているのである。</p>","qs":[{"n":53,"q":"本文で、最近の動物園の取り組みとして述べられていないものはどれか。","o":["珍しい動物を、世界中から集めて展示すること","野生で数が減った動物を、園内で繁殖させること","動物が本来暮らす環境に近い展示をすること","繁殖させた動物の一部を、自然に帰すこと"],"e":"Câu hỏi PHỦ ĐỊNH. Trưng bày động vật quý hiếm là vai trò CŨ của sở thú (かつて), không phải hoạt động gần đây. Đọc kỹ thì thấy đây là bẫy về thời gian.","a":0},{"n":54,"q":"動物が自然な行動をとれる展示によって、来園者はどうなると述べられているか。","o":["動物に直接触れることができる。","おりの中にいるよりも、動物を近くで見られる。","野生での動物の暮らしぶりを理解できる。","動物の芸を楽しめる。"],"e":"<b>来園者はその動物が野生でどのように生きているのかを知ることができる</b>. 生きている được nói lại thành 暮らしぶり.","a":2},{"n":55,"q":"動物を囲いの中で飼うことへの批判について、筆者はどう考えているか。","o":["批判は正しいので、動物園はなくすべきだと考えている。","批判は誤解によるものなので、動物園としては気にする必要はまったくないと考えている。","囲いをなくして動物を自由にすれば、批判はなくなると考えている。","声は認めつつ、意義もあると考えている。"],"e":"<b>もちろん…疑問視する声もある。しかし…</b>: mẫu nhượng bộ rồi phản biện. Tác giả thừa nhận có ý kiến phản đối, nhưng vẫn khẳng định vai trò của sở thú.","a":3}]},{"passage":"<p>（3）</p><p>　「やる気が出たら始めよう」。そう思っているうちに、一日が終わってしまった経験は誰にでもあるだろう。多くの人は、やる気があるから行動できるのだと考えている。しかし、実際には<u>①その逆</u>であることが多いという。</p><p>　脳は、何かを始めると、それを続けようとする性質を持っているとされる。最初は気が進まなくても、手を動かしているうちに、
