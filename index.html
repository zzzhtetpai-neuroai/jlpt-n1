],"e":"Đoạn 4: <b>何がわかっていて、何がまだわかっていないのか。なぜ以前の意見を変えたのか…丁寧に説明すれば</b>. Đáp án về việc khẳng định chắc chắn là điều tác giả cho là nguy hiểm.","a":1},{"n":62,"q":"この文章で筆者が最も言いたいことは何か。","o":["科学には不確かさがあることを理解して、付き合っていくべきだ。","専門家の意見は、信じないほうがよい。","科学は、いつか絶対に正しい答えを出せる。","不安なときこそ、はっきりした答えを求めるべきだ。"],"e":"Đoạn cuối: <b>科学は、完成した答えの集まりではなく、答えに近づくための方法…不確かさを含めて科学と付き合うこと</b>.","a":0}]}]},{"id":"r11","title":"問題11 統合理解","en":"Đọc so sánh A và B","instr":"次のAとBの文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p><b>A</b></p><p>　週休三日制を導入する企業が出てきた。休みが増えれば、社員は趣味や家族との時間、学び直しにも時間を使える。心身の疲れがとれることで、働く日の集中力も高まるだろう。実際、導入した企業の中には、生産性が下がらなかったという例もある。育児や介護をしながら働く人にとっても、大きな助けになるはずだ。人材を確保するためにも、多くの企業が積極的に取り入れていくべきだ。</p><p><b>B</b></p><p>　週休三日制は、確かに魅力的に聞こえる。休みが増えて喜ぶ人は多いだろう。しかし、どんな職場にも合う制度ではない。客の対応が必要な店や工場では、人員を増やさなければ仕事が回らない。また、休みが増える代わりに給料が減る仕組みの場合、生活が苦しくなる人も出てくる。一日の労働時間が長くなり、かえって疲れるという声もある。制度を一律に広めるのではなく、職場の実情や働く人の希望に合わせて、選べるようにすべきだ。</p>","qs":[{"n":63,"q":"AとBのどちらの文章でも触れられていることは何か。","o":["生産性が下がらなかった企業があること","給料が減る場合があること","週休三日制には、働く人にとってよい面があること","育児や介護をする人の助けになること"],"e":"A liệt kê nhiều điểm tốt. B mở đầu bằng <b>確かに魅力的…休みが増えて喜ぶ人は多い</b>. Năng suất và chăm con chỉ có ở A. Giảm lương chỉ có ở B.","a":2},{"n":64,"q":"週休三日制について、AとBはどのように述べているか。","o":["AもBも、すべての企業がすぐに導入すべきだと述べている。","Aは積極的に導入すべきだと述べ、Bは職場や個人に合わせて選べるようにすべきだと述べている。","Aは給料が減るので反対だと述べ、Bは生産性が上がるので賛成だと述べている。","AもBも、週休三日制には問題が多いので、導入すべきではないと述べている。"],"e":"Câu cuối của A: <b>積極的に取り入れていくべきだ</b>. Câu cuối của B: <b>一律に広めるのではなく…選べるようにすべきだ</b>. B không phản đối hoàn toàn.","a":1}]}]},{"id":"r12","title":"問題12 主張理解（長文）","en":"Đọc hiểu: quan điểm tác giả","instr":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　友人の誕生日が近づくと、毎年頭を悩ませる。何を贈れば喜んでもらえるのか。インターネットで「人気のプレゼント」を調べ、値段や評判を比べるうちに、何時間もたってしまうことがある。</p><p>　最近は、相手に欲しいものを直接聞いたり、好きなものを選べるカタログを贈ったりする人も増えているという。確かに、そのほうが失敗はない。相手が本当に必要としているものを確実に渡せるのだから、合理的な方法と言えるだろう。</p><p>　しかし、私はどこか<u>①物足りなさ</u>を感じてしまう。贈り物の価値は、品物そのものだけにあるのではないと思うからだ。相手の好みを思い出し、最近の様子を想像し、何なら喜んでくれるだろうかと考える。その<u>②迷う時間</u>こそが、贈り物の中心にあるのではないか。</p><p>　私が今でも大切にしている贈り物に、学生時代の友人からもらった一冊の古本がある。高価なものではない。しかし、私が以前に何気なく話した作家の本を、友人は覚えていて、古本屋で探してくれたのだ。本を手に取ったとき、自分の話をきちんと聞いてくれていたことが、何よりうれしかった。</p><p>　贈り物を受け取ったとき、私たちが喜ぶのは、品物を手に入れたからだけではない。自分のことを考えてくれた人がいる、という事実に心を動かされるのだ。だとすれば、多少好みから外れていたとしても、相手のことを思って選んだ贈り物には、十分な価値がある。失敗を恐れず、相手を思う時間を楽しみたいと思う。</p>","qs":[{"n":65,"q":"筆者は、欲しいものを直接聞く方法についてどう考えているか。","o":["合理的ではあるが、何か足りないと感じる。","失敗が多いので、やめるべきだ。","相手に失礼なので、すべきではない。","最も気持ちが伝わる方法だ。"],"e":"Đoạn 2 thừa nhận <b>合理的な方法</b>, đoạn 3: <b>しかし…物足りなさを感じてしまう</b>. 物足りない = thấy thiếu thiếu, chưa thỏa mãn. Tác giả không nói phương pháp này thất lễ.","a":0},{"n":66,"q":"<u>②迷う時間</u>とはどのような時間か。","o":["店で品物の値段を比べる時間","相手のことを思い浮かべながら、何を贈るか考える時間","贈り物を渡すタイミングを考える時間","相手に欲しいものを聞くかどうか迷う時間"],"e":"その chỉ câu ngay trước: <b>相手の好みを思い出し、最近の様子を想像し、何なら喜んでくれるだろうかと考える</b>.","a":1},{"n":67,"q":"古本の贈り物が筆者にとってうれしかったのはなぜか。","o":["とても高価で、珍しい本だったから","ずっと欲しいと友人に頼んでいた本だったから","自分の話を友人がきちんと覚えていてくれたから","有名な作家のサインが入っていたから"],"e":"<b>自分の話をきちんと聞いてくれていたことが、何よりうれしかった</b>. Bài nói rõ 高価なものではない, và tác giả chỉ tình cờ nhắc đến (何気なく話した), không hề nhờ mua.","a":2},{"n":68,"q":"筆者の考えに最も近いものはどれか。","o":["贈り物は、相手が本当に必要なものを選ぶべきだ。","相手を思って選んだ贈り物には、好みに合わなくても価値がある。","高価な贈り物ほど、相手の心を動かす。","贈り物で失敗しないために、相手に直接聞くべきだ。"],"e":"Đoạn cuối: <b>多少好みから外れていたとしても、相手のことを思って選んだ贈り物には、十分な価値がある</b>.","a":1}]}]},{"id":"r13","title":"問題13 情報検索","en":"Tìm thông tin","instr":"次は、ある宅配会社の料金表である。下の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<div class='notice'><p style='text-align:center'><b>そよかぜ便　料金のご案内（関東から発送する場合）</b></p><table class='tbl'><tr><th>サイズ<br>（縦横高さの合計）</th><th>関東</th><th>関西</th><th>九州</th><th>北海道</th></tr><tr><td>60cmまで</td><td>900円</td><td>1,100円</td><td>1,300円</td><td>1,400円</td></tr><tr><td>80cmまで</td><td>1,200円</td><td>1,400円</td><td>1,600円</td><td>1,700円</td></tr><tr><td>100cmまで</td><td>1,500円</td><td>1,700円</td><td>1,900円</td><td>2,000円</td></tr><tr><td>120cmまで</td><td>1,800円</td><td>2,000円</td><td>2,200円</td><td>2,300円</td></tr></table><p>※重さが20kgを超える場合は、サイズにかかわらず「120cmまで」の料金となります。<br>※営業所に直接お持ち込みいただくと、1個につき100円引きとなります。<br>※お届け時間の指定は無料です。お届け日の指定は、発送日から7日以内に限ります。<br>※冷蔵、冷凍での発送は、上記料金に300円が加算されます。</p></div>","qs":[{"n":69,"q":"東京に住む佐藤さんは、九州の実家に、縦横高さの合計が75cm、重さ5kgの荷物を冷蔵で送る。荷物は営業所に持ち込む。料金はいくらか。","o":["1,900円","1,600円","2,000円","1,800円"],"e":"75cm thuộc mức <b>80cmまで</b>, gửi đi 九州: 1,600円. Gửi lạnh (冷蔵): <b>+300円</b>. Tự mang đến văn phòng: <b>−100円</b>. Vậy 1,600 + 300 − 100 = <b>1,800円</b>. 1,900円 là bẫy cho người quên trừ 100円.","a":3},{"n":70,"q":"横浜に住む田中さんは、縦横高さの合計が55cm、重さ22kgの本の入った箱を北海道に送る。家まで集荷してもらう場合、料金はいくらか。","o":["2,300円","1,400円","2,200円","1,300円"],"e":"Kích thước 55cm thì thường là mức 60cm, nhưng nặng <b>22kg vượt quá 20kg</b>, nên tính theo mức <b>120cmまで</b>. Gửi đi 北海道: <b>2,300円</b>. Nhờ đến lấy tại nhà nên không được giảm 100円. 1,400円 là bẫy cho người chỉ nhìn kích thước.","a":0}]}]}];
const SET7 = [{"id":"m1","title":"問題1 漢字読み","en":"Đọc kanji","instr":"＿＿の言葉の読み方として最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":1,"q":"どちらの作品も素晴らしく、<u>優劣</u>をつけるのは難しい。","o":["ゆうれつ","ゆうりつ","ゆれつ","ようれつ"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 2, lần này hỏi theo dạng khác.</span><br><b>優劣 (ゆうれつ)</b> = hơn kém. 優 = <b>ゆう</b> (trường âm), 劣 = <b>れつ</b> (như 劣る おとる, 劣化 れっか).","a":0}]},{"qs":[{"n":2,"q":"彼の明るい言葉とは<u>裏腹</u>に、表情は暗かった。","o":["りふく","うらばら","うらはら","りはら"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 4, lần này hỏi theo dạng khác.</span><br><b>裏腹 (うらはら)</b> = trái ngược. Cả hai chữ đều đọc theo âm Nhật: 裏 = うら, 腹 = はら. Không biến âm thành ばら.","a":2}]},{"qs":[{"n":3,"q":"彼女はハンカチで、そっと涙を<u>拭った</u>。","o":["ぬぐった","ふいた","はらった","すくった"],"e":"<b>拭う (ぬぐう)</b> = lau, chùi (nước mắt, mồ hôi). Bẫy: chữ 拭 cũng đọc là <b>ふく</b> (拭く = lau), nhưng 拭った với đuôi った thì là ぬぐった. ふいた sẽ viết là 拭いた.","a":0}]},{"qs":[{"n":4,"q":"政府は、被害を受けた地域に対して特別な<u>措置</u>をとった。","o":["しょち","そうち","そち","さくち"],"e":"<b>措置 (そち)</b> = biện pháp. 措 = <b>そ</b>, 置 = <b>ち</b>. Bẫy là しょち vì 処置 (しょち) cũng có nghĩa gần giống (xử lý).","a":2}]},{"qs":[{"n":5,"q":"来月から、入国の制限が<u>緩和</u>される予定だ。","o":["かんわ","えんわ","かんか","だんわ"],"e":"<b>緩和 (かんわ)</b> = nới lỏng, giảm nhẹ (quy định, triệu chứng). 緩 = <b>かん</b> (âm Nhật: ゆるい), 和 = <b>わ</b>.","a":0}]},{"qs":[{"n":6,"q":"祖父は<u>頑な</u>に、自分のやり方を変えようとしなかった。","o":["かたくな","がんこな","かたな","がんな"],"e":"<b>頑な (かたくな)</b> = cố chấp, bướng bỉnh. Bẫy: がんこ là 頑固, nghĩa gần giống nhưng chữ khác. 頑な với đuôi な thì đọc là <b>かたくな</b>.","a":0}]}]},{"id":"m2","title":"問題2 文脈規定","en":"Từ theo ngữ cảnh","instr":"（　　）に入れるのに最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":7,"q":"この十年で、医療技術は（　　）発展を遂げた。","o":["慌ただしい","紛らわしい","目覚ましい","目まぐるしい"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>目覚ましい (めざましい)</b> = ngoạn mục, đáng kinh ngạc (sự tiến bộ). Bẫy: 目まぐるしい = thay đổi chóng mặt (目まぐるしく変わる), không đi với 発展を遂げる. 紛らわしい = dễ gây nhầm lẫn.","a":2}]},{"qs":[{"n":8,"q":"迷子の犬を探すため、近所の人たちが（　　）して町中を回った。","o":["手配","手入れ","手当て","手分け"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>手分け (てわけ)する</b> = chia nhau ra làm. 手配 = sắp xếp, chuẩn bị, 手入れ = chăm sóc, bảo dưỡng, 手当て = chữa trị (vết thương), hoặc phụ cấp.","a":3}]},{"qs":[{"n":9,"q":"さっきまで晴れていたのに、空が（　　）曇り出した。","o":["しだいに","にわかに","ひそかに","おもむろに"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 4, lần này hỏi theo dạng khác.</span><br><b>にわかに</b> = đột nhiên. Đi với さっきまで晴れていたのに (vừa nãy còn nắng). しだいに = dần dần, ひそかに = lén lút, おもむろに = thong thả, từ từ.","a":1}]},{"qs":[{"n":10,"q":"新製品の大ヒットが、会社の業績回復に（　　）をかけた。","o":["歯止め","水","手間","拍車"],"e":"<b>拍車をかける (はくしゃ)</b> = thúc đẩy nhanh hơn. 歯止めをかける = kìm hãm (ngược nghĩa), 水をかける = dội nước lạnh, làm mất hứng, 手間をかける = tốn công.","a":3}]},{"qs":[{"n":11,"q":"記者に質問されても、大臣の答えはどこか（　　）が悪かった。","o":["口数","歯切れ","手応え","風当たり"],"e":"<b>歯切れが悪い (はぎれ)</b> = nói ấp úng, không dứt khoát. 口数が少ない = ít nói, 手応えがある = có cảm giác thành công, 風当たりが強い = bị chỉ trích nhiều.","a":1}]},{"qs":[{"n":12,"q":"ベテラン社員が長年かけて身につけた（　　）を、若手に伝える研修を始めた。","o":["ハンディ","ブランク","ノウハウ","ギャップ"],"e":"<b>ノウハウ</b> = bí quyết, kinh nghiệm thực tế (know-how). ハンディ = bất lợi, ブランク = khoảng trống (thời gian nghỉ việc), ギャップ = khoảng cách, chênh lệch.","a":2}]},{"qs":[{"n":13,"q":"準備には（　　）はない。あとは本番で力を出すだけだ。","o":["漏れ","抜かり","隙間","不備"],"e":"<b>抜かりはない (ぬかり)</b> = không có sơ suất gì, chuẩn bị chu đáo. 抜かりない là cụm cố định. 漏れ = sót (漏れがない cũng có nhưng đi với danh sách, kiểm tra), 不備 = thiếu sót (dùng 不備がない nhưng không đi với には).","a":1}]}]},{"id":"m3","title":"問題3 言い換え類義","en":"Từ gần nghĩa","instr":"＿＿の言葉に意味が最も近いものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":14,"q":"新人の彼は、初めての仕事も<u>そつなく</u>こなした。","o":["時間をかけて","楽しそうに","一人だけで","問題なく上手に"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 2, lần này hỏi theo dạng khác.</span><br><b>そつなく</b> = trơn tru, không mắc lỗi gì. Gần nhất là 問題なく上手に.","a":3}]},{"qs":[{"n":15,"q":"その名前には、まったく<u>心当たりがない</u>。","o":["思い当たることがない","興味がない","聞いたことがある","覚えたくない"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 2, lần này hỏi theo dạng khác.</span><br><b>心当たり (こころあたり)がない</b> = không có chút manh mối, không nghĩ ra là ai. Gần nhất là 思い当たることがない.","a":0}]},{"qs":[{"n":16,"q":"事故の影響で、電車は運転を<u>見合わせて</u>いる。","o":["遅らせて","一時的に止めて","変更して","再開して"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 2, lần này hỏi theo dạng khác.</span><br><b>見合わせる (みあわせる)</b> = tạm dừng, hoãn lại. 運転を見合わせる = tạm dừng chạy tàu. Gần nhất là 一時的に止めて. 再開 = chạy lại, là trái nghĩa.","a":1}]},{"qs":[{"n":17,"q":"毎日練習を続けていれば、<u>おのずと</u>結果はついてくる。","o":["すぐに","必ずしも","自然に","少しずつ"],"e":"<b>おのずと (自ずと)</b> = tự nhiên, tự khắc. Gần nhất là 自然に.","a":2}]},{"qs":[{"n":18,"q":"引っ越しの準備は、<u>あらかた</u>終わった。","o":["やっと","ほとんど","少しだけ","すべて"],"e":"<b>あらかた</b> = hầu hết, phần lớn. Gần nhất là ほとんど. Không phải すべて (toàn bộ).","a":1}]},{"qs":[{"n":19,"q":"部長に、来年度の海外赴任を<u>打診された</u>。","o":["行くように命令された","行かないように言われた","してもいいか意向を聞かれた","詳しく説明された"],"e":"<b>打診 (だしん)する</b> = thăm dò ý kiến (trước khi quyết định chính thức). Gần nhất là 意向を聞かれた. Không phải là ra lệnh (命令).","a":2}]}]},{"id":"m4","title":"問題4 用法","en":"Cách dùng từ","instr":"次の言葉の使い方として最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":20,"q":"<b>白紙</b>","o":["彼女は白紙な性格で、誰とでも仲良くなれる。","雪が降って、町が一面白紙になった。","テストの答えがわからず、頭の中が白紙で光った。","予算が足りず、新しい駅の建設計画は白紙に戻された。"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>白紙に戻す (はくしにもどす)</b> = hủy bỏ, quay lại từ đầu (kế hoạch). Tính cách trong sáng là 素直, tuyết phủ trắng là 真っ白になる, đầu óc trống rỗng là 頭が真っ白になる.","a":3}]},{"qs":[{"n":21,"q":"<b>ことごとく</b>","o":["ことごとく、明日は晴れるだろう。","彼の予想は、ことごとく外れた。","彼女はことごとく親切な人だ。","雨がことごとく降り続いている。"],"e":"<span class='rev'>【Ôn tập】 Từ này đã xuất hiện ở 模試 1, lần này hỏi theo dạng khác.</span><br><b>ことごとく</b> = tất cả, không trừ cái nào (đối tượng có số nhiều). Không dùng để phỏng đoán, nhấn mạnh tính từ, hay mô tả thời gian kéo dài.","a":1}]},{"qs":[{"n":22,"q":"<b>気兼ね</b>","o":["試験の前日は、気兼ねで眠れなかった。","ここは私の家だと思って、気兼ねなくゆっくりしてください。","彼は気兼ねが強くて、すぐに怒る。","旅行の気兼ねに、新しいかばんを買った。"],"e":"<b>気兼ね (きがね)</b> = ngại ngùng, e ngại làm phiền người khác. 気兼ねなく = cứ tự nhiên. Lo lắng là 不安 hoặc 心配, nóng tính là 気が短い.","a":1}]},{"qs":[{"n":23,"q":"<b>見込み</b>","o":["彼は人の見込みをよく覚えている。","窓から見込みのいい部屋を選んだ。","この工事は、来年の春に完成する見込みだ。","この絵は、遠くから見込むと美しい。"],"e":"<b>見込み (みこみ)</b> = dự kiến, triển vọng. ～見込みだ = dự kiến sẽ ~. Nhớ mặt người là 顔を覚える, phòng có tầm nhìn đẹp là 見晴らしがいい.","a":2}]},{"qs":[{"n":24,"q":"<b>張り合い</b>","o":["子どもたちが喜んでくれるので、料理にも張り合いがある。","この布は張り合いがあって、しわになりにくい。","二人は張り合いをして、仲直りした。","寒さで、手の張り合いがなくなった。"],"e":"<b>張り合い (はりあい)がある</b> = có động lực, thấy đáng công làm. Vải cứng cáp là 張りがある, cảm giác ở tay là 感覚.","a":0}]},{"qs":[{"n":25,"q":"<b>秀でる</b>","o":["この店の料理は値段が秀でている。","今朝は早く秀でて、散歩に出かけた。","山の上から、朝日が秀でてきた。","彼女は語学に秀でており、五か国語を話す。"],"e":"<b>Nに秀でる (ひいでる)</b> = xuất sắc, vượt trội về N. Giá đắt là 高い, dậy sớm là 起きる, mặt trời mọc là 昇る.","a":3}]}]},{"id":"m5","title":"問題5 文法形式の判断","en":"Ngữ pháp","instr":"次の文の（　　）に入れるのに最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"qs":[{"n":26,"q":"家族の心配（　　）、彼は会社を辞めて世界一周の旅に出た。","o":["をもとに","をめぐって","をよそに","を通して"],"e":"<span class='rev'>【Ôn tập ngữ pháp】 Mẫu này đã xuất hiện ở 模試 1, lần này trong câu mới.</span><br><b>Nをよそに</b> = bất chấp, mặc kệ N (sự lo lắng, phản đối của người khác). をもとに = dựa trên, をめぐって = xoay quanh (tranh luận), を通して = thông qua.","a":2}]},{"qs":[{"n":27,"q":"うちの息子（　　）、毎日ゲームばかりして、少しも勉強しない。","o":["ともなると","とあれば","といえども","ときたら"],"e":"<b>Nときたら</b> = nói đến N thì (than phiền, chê). Thường dùng cho người thân, đồ vật của mình. ともなると = một khi đã là, とあれば = nếu là vì, といえども = dù là.","a":3}]},{"qs":[{"n":28,"q":"この事件は、社会に大きな衝撃を与え（　　）だろう。","o":["ずじまいの","ずにすむ","ずにはおかない","ずにはいられない"],"e":"<span class='rev'>【Ôn tập ngữ pháp】 Mẫu này đã xuất hiện ở 模試 2, lần này trong câu mới.</span><br><b>Vずにはおかない</b> = chắc chắn sẽ gây ra (chủ ngữ là sự việc). Bẫy là ずにはいられない vì mẫu này dùng cho cảm xúc của chính người nói (không thể không), không hợp với chủ ngữ 事件.","a":2}]},{"qs":[{"n":29,"q":"引っ越しの日は忙しくて、水を飲む時間（　　）なかった。","o":["こそ","ばかり","すら","なり"],"e":"<b>Nすら～ない</b> = ngay cả N cũng không (= さえ, văn viết hơn). こそ = chính là, nhấn mạnh tích cực.","a":2}]},{"qs":[{"n":30,"q":"一人で子どもを育てながら働く彼女の苦労は、想像（　　）。","o":["に足らない","にかたくない","にたえない","に及ばない"],"e":"<span class='rev'>【Ôn tập ngữ pháp】 Mẫu này đã xuất hiện ở 模試 3, lần này trong câu mới.</span><br><b>Nにかたくない</b> = không khó để N, dễ dàng N (想像にかたくない, 理解にかたくない). に足らない = không đáng, に及ばない = không cần phải.","a":1}]},{"qs":[{"n":31,"q":"借金をし（　　）、海外旅行に行く必要はないと思う。","o":["てまで","てこそ","てから","ては"],"e":"<b>Vてまで</b> = đến mức phải V (làm điều quá đáng để đạt mục đích). てこそ = chỉ khi V mới, ては = nếu V thì (kết quả xấu).","a":0}]},{"qs":[{"n":32,"q":"毎日とは言わ（　　）、せめて週に一度は連絡してほしい。","o":["ないものでもない","ないまでも","ないことには","ないばかりか"],"e":"<b>Vないまでも</b> = dù không đến mức V, thì ít nhất cũng. Thường đi với せめて. ないものでもない = không phải là không thể (đã học ở 模試 3), ないことには = nếu không ~ thì không.","a":1}]},{"qs":[{"n":33,"q":"簡単な試験（　　）、最後の問題は専門家でも解けないほど難しかった。","o":["かと思いきや","とあって","にしては","だけに"],"e":"<span class='rev'>【Ôn tập ngữ pháp】 Mẫu này đã xuất hiện ở 模試 5, lần này trong câu mới.</span><br><b>～かと思いきや</b> = tưởng là ~, ai ngờ lại (kết quả bất ngờ, ngược với dự đoán). にしては = so với ~ thì (khác mong đợi, nhưng không đi với かと), だけに = chính vì.","a":0}]},{"qs":[{"n":34,"q":"たばこの吸いすぎは、命（　　）病気の原因になる。","o":["にわたる","にあたる","にこたえる","にかかわる"],"e":"<b>Nにかかわる</b> = ảnh hưởng nghiêm trọng đến N (命にかかわる = nguy hiểm đến tính mạng). にわたる = kéo dài suốt, にあたる = tương ứng với, にこたえる = đáp ứng.","a":3}]},{"qs":[{"n":35,"q":"彼はゲームを始めた（　　）、何時間でもやめようとしない。","o":["が早いか","がゆえに","が最後","がてら"],"e":"<b>Vたが最後 (がさいご)</b> = một khi đã V thì (không dừng lại được, thường là kết quả xấu). が早いか = vừa mới thì ngay (đã học ở 模試 2), がゆえに = vì, がてら = nhân tiện.","a":2}]}]},{"id":"m6","title":"問題6 文の組み立て","en":"Sắp xếp câu","instr":"次の文の ★ に入る最もよいものを、1、2、3、4から一つ選びなさい。","fixed":true,"pages":[{"qs":[{"n":36,"q":"私は君の将来を ＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 厳しいことを言うのだ。","o":["あえて","思えば","本気で","こそ"],"a":3,"e":"<span class='rev'>【Ôn tập ngữ pháp】 Mẫu này đã xuất hiện ở 模試 4, lần này trong câu mới.</span><br>Thứ tự đúng: 本気で 思えば <b>こそ</b> あえて (3 2 4 1). <b>Vばこそ</b> = chính vì V (lý do tích cực). あえて = cố ý, dám làm điều khó. ★ là こそ."}]},{"qs":[{"n":37,"q":"彼は ＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 、休日も会社に来ている。","o":["上","立場","社長","という"],"a":1,"e":"Thứ tự đúng: 社長 という <b>立場</b> 上 (3 4 2 1). <b>N上 (じょう)</b> = xét về mặt N. 立場上 = vì vị trí của mình. ★ là 立場."}]},{"qs":[{"n":38,"q":"この店は ＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ ので、いつも行列ができている。","o":["うえに","おいしい","安い","値段が"],"a":0,"e":"Thứ tự đúng: 値段が 安い <b>うえに</b> おいしい (4 3 1 2). <b>～うえに</b> = không những ~ mà còn (hai điều tốt). ★ là うえに."}]},{"qs":[{"n":39,"q":"彼女は ＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 、また同じミスをした。","o":["された","なのに","ばかり","注意"],"a":2,"e":"Thứ tự đúng: 注意 された <b>ばかり</b> なのに (4 1 3 2). <b>Vたばかり</b> = vừa mới V. ★ là ばかり."}]},{"qs":[{"n":40,"q":"こんな難しい仕事は、＿＿＿ ＿＿＿ <b>★</b> ＿＿＿ 引き受けられない。","o":["とても","私には","ない","経験の"],"a":1,"e":"Thứ tự đúng: 経験の ない <b>私には</b> とても (4 3 2 1). とても～ない = hoàn toàn không thể. とても đứng ngay trước động từ phủ định. ★ là 私には."}]}]},{"id":"m7","title":"問題7 文章の文法","en":"Ngữ pháp trong đoạn văn","instr":"次の文章を読んで、文章全体の内容を考えて、41 から 45 の中に入る最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　四十歳を過ぎてから、ピアノを習い始めた。子どものころから憧れてはいたが、この年で始めても上達しないだろうと、ずっと（41）。</p><p>　きっかけは、友人の一言だった。「やってみない（42）、上達するかどうかなんてわからないよ」。確かにそのとおりだ。そう思い直して、近所の教室に申し込んだ。</p><p>　始めてみると、思うように指が動かない。子どもなら一週間で覚える曲に、一か月かかることもある。（43）、不思議と苦にはならなかった。誰かと競争しているわけではないし、昨日弾けなかったところが今日弾けるようになる、それだけでうれしいのだ。</p><p>　大人になると、新しいことを始めるのをためらいがちだ。失敗するのが恥ずかしい、今さら遅い、と考えてしまう。しかし、上手になること（44）、楽しむことを目的にすれば、年齢は関係ない。来年の発表会では、子どもたちに交じって一曲弾く（45）。</p>","qs":[{"n":41,"q":"（41）","o":["あきらめていた","習っていた","続けていた","楽しんでいた"],"e":"Từ nhỏ đã ngưỡng mộ nhưng nghĩ học ở tuổi này sẽ không tiến bộ, nên <b>đã từ bỏ ý định</b> (あきらめていた). Đoạn 1 nói mới bắt đầu học sau 40 tuổi, nên không thể là 習っていた.","a":0},{"n":42,"q":"（42）","o":["ことなく","ことには","ことだから","ことか"],"e":"<span class='rev'>【Ôn tập ngữ pháp】 Mẫu này đã xuất hiện ở 模試 4, lần này trong câu mới.</span><br><b>Vないことには～ない</b> = nếu không V thì không thể ~. やってみないことには、わからない = không thử thì không biết được. ことなく = mà không.","a":1},{"n":43,"q":"（43）","o":["それなら","そのうえ","それゆえ","それでも"],"e":"Câu trước: tay không chạy, học chậm (khó khăn). Câu sau: lạ là không thấy khổ. Quan hệ ngược chiều, nên dùng <b>それでも</b> (dù vậy). それゆえ = vì thế, そのうえ = hơn nữa.","a":3},{"n":44,"q":"（44）","o":["よりも","にとって","について","によって"],"e":"<b>AよりもB</b> = B hơn là A. Lấy niềm vui làm mục đích <b>hơn là</b> việc chơi giỏi. Các đáp án khác không tạo được ý so sánh.","a":0},{"n":45,"q":"（45）","o":["ところだった","はずがない","つもりだ","わけにはいかない"],"e":"来年の発表会 = buổi biểu diễn năm sau, là dự định tương lai: <b>弾くつもりだ</b>. ところだった = suýt nữa, はずがない = không thể nào.","a":2}]}]},{"id":"r8","title":"問題8 内容理解（短文）","en":"Đọc hiểu: đoạn ngắn","instr":"次の（1）から（4）の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>（1）</p><p>　メールやメッセージに、すぐに返信しなければと焦る人は多い。返事が遅れると、相手に失礼だと感じるからだろう。しかし、急いで書いた返信は、内容が不十分だったり、誤解を招く表現が含まれていたりすることも少なくない。大切なのは返信の速さではなく、相手の問いに正確に答えることだ。すぐに答えられない内容なら、「確認して後ほどご連絡します」と一言送っておけば十分である。</p>","qs":[{"n":46,"q":"筆者の考えに合うものはどれか。","o":["メールには、できるだけ早く返信すべきだ。","すぐに答えられないメールには、返信しなくてよい。","速さよりも、正確に答えることを大切にすべきだ。","急いで書いた返信は、必ず誤解を招く。"],"e":"<b>大切なのは返信の速さではなく、相手の問いに正確に答えること</b>. Tác giả vẫn khuyên gửi một câu báo trước, nên đáp án không cần trả lời là sai. 必ず (chắc chắn) quá tuyệt đối, bài chỉ nói 少なくない (không ít).","a":2}]},{"passage":"<p>（2）</p><p>以下は、ある駅前の駐輪場に貼られたお知らせである。</p><div class='notice'><p style='text-align:center'><b>駐輪場の利用方法変更のお知らせ</b></p><p>　4月1日より、駐輪場の利用方法が以下のように変わります。</p><p>【一時利用】最初の2時間は無料、以降24時間ごとに100円<br>【定期利用】月額1,800円（学生は月額1,200円）</p><p>　定期利用の申し込みは、駐輪場の管理事務所で受け付けます。学生料金で申し込む場合は、学生証をお持ちください。<br>　なお、3月末までに定期利用を申し込んだ方は、4月分の料金が無料となります。</p></div>","qs":[{"n":47,"q":"大学生のチャンさんは、4月から毎日この駐輪場を使いたい。料金をできるだけ安くするには、どうすればよいか。","o":["4月1日に、管理事務所で一時利用を申し込む。","3月中に、学生証を持って管理事務所で定期利用を申し込む。","4月から、毎日2時間以内だけ利用する。","3月中に、ウェブサイトで定期利用を申し込む。"],"e":"Ba điều kiện: dùng mỗi ngày nên chọn <b>定期利用</b>. Sinh viên thì <b>mang thẻ sinh viên</b> để được 1,200円. Đăng ký <b>trước cuối tháng 3</b> thì tháng 4 miễn phí (phần なお). Đăng ký ở <b>管理事務所</b>, không có trang web.","a":1}]},{"passage":"<p>（3）</p><p>　一人で考え事をしているとき、つい独り言を言ってしまうことがある。周りの人に聞かれると恥ずかしいが、実は独り言には、考えを整理する効果があるという。頭の中だけで考えていると、同じところをぐるぐる回ってしまいがちだ。声に出すことで、自分の考えを外から聞くことになり、どこが曖昧なのかに気づきやすくなる。行き詰まったときは、小さな声で考えを口にしてみるのもよいだろう。</p>","qs":[{"n":48,"q":"筆者によると、独り言にはどのような効果があるか。","o":["周りの人に、自分の考えを伝えることができる。","恥ずかしさを感じなくなる。","同じことを何度も考えられるようになる。","考えを声に出すことで、曖昧な点に気づきやすくなる。"],"e":"<b>声に出すことで…どこが曖昧なのかに気づきやすくなる</b>. Nghĩ đi nghĩ lại một chỗ (ぐるぐる回る) là vấn đề khi chỉ nghĩ trong đầu, không phải tác dụng của độc thoại.","a":3}]},{"passage":"<p>（4）</p><p>　手帳の予定を隙間なく埋めると、充実した毎日を送っているような気がする。しかし、予定を詰め込みすぎると、一つの予定が遅れただけで、その後のすべてが崩れてしまう。急な用事や体調の変化にも対応できない。予定と予定の間に、あえて何も入れない時間を作っておくこと。その余白こそが、計画を最後まで守るための支えになるのである。</p>","qs":[{"n":49,"q":"筆者が最も言いたいことは何か。","o":["予定はできるだけ多く入れたほうが、充実した生活になる。","急な用事が入ったら、予定をすべて取り消すべきだ。","予定の間に何もしない時間を作ることで、計画が守りやすくなる。","手帳を使わずに、予定を頭の中で管理すべきだ。"],"e":"Câu cuối: <b>その余白こそが、計画を最後まで守るための支えになる</b>. 余白 = khoảng trống. 充実している chỉ là cảm giác (気がする), không phải ý kiến của tác giả.","a":2}]}]},{"id":"r9","title":"問題9 内容理解（中文）","en":"Đọc hiểu: đoạn vừa","instr":"次の（1）から（3）の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>（1）</p><p>　小学生のころ、近所の書道教室に通っていた。先生は七十代の女性で、普段はとても穏やかだったが、筆の持ち方や姿勢には厳しかった。</p><p>　ある日、何枚書いても字がうまく書けず、私は途中で投げやりになった。すると先生は、私の書いた紙を一枚ずつ並べ、「よく見てごらん」と言った。言われて見比べると、最初の一枚より最後の一枚のほうが、線がまっすぐになっている。<u>①自分では気づかなかった変化</u>だった。</p><p>　先生は続けて、「上手に書けなかった紙も、全部あなたの練習の跡。無駄な一枚なんてないのよ」と言った。その言葉を聞いて、私はもう一度筆を取った。</p><p>　大人になった今、仕事でうまくいかないとき、私はよくこの言葉を思い出す。結果がすぐに出なくても、積み重ねた努力は必ずどこかに残っている。<u>②先生が教えてくれたのは、字の書き方だけではなかった</u>のだ。</p>","qs":[{"n":50,"q":"<u>①自分では気づかなかった変化</u>とは何か。","o":["書くたびに少しずつ線がよくなっていたこと","先生が一枚ずつ紙を並べていたこと","最初の一枚が一番上手だったこと","筆の持ち方が変わっていたこと"],"e":"Câu ngay trước: <b>最初の一枚より最後の一枚のほうが、線がまっすぐになっている</b>. Tức là nét chữ đã tiến bộ dần mà bản thân không nhận ra.","a":0},{"n":51,"q":"先生の言葉を聞いて、筆者はどうしたか。","o":["書道教室をやめた。","書いた紙を全部捨てた。","先生に字の書き方を質問した。","もう一度、練習を続けた。"],"e":"<b>私はもう一度筆を取った</b> = tôi lại cầm bút lên. Nghĩa là tiếp tục luyện tập.","a":3},{"n":52,"q":"<u>②先生が教えてくれたのは、字の書き方だけではなかった</u>とあるが、ほかに何を教えてくれたのか。","o":["仕事では、厳しい姿勢が大切だということ","すぐに結果が出なくても、努力は無駄にならないということ","字がうまい人は、仕事もうまくいくということ","失敗した紙は、すぐに捨てるべきだということ"],"e":"Câu ngay trước: <b>結果がすぐに出なくても、積み重ねた努力は必ずどこかに残っている</b>. Khớp với lời cô giáo: 無駄な一枚なんてない.","a":1}]},{"passage":"<p>（2）</p><p>　レジ袋が有料になって数年がたち、買い物に自分の袋を持参する人はすっかり増えた。プラスチックごみを減らすための一歩として、この取り組みには一定の効果があったと言える。</p><p>　しかし、<u>①これで十分だ</u>と考えるのは早い。実は、レジ袋がプラスチックごみ全体に占める割合は、それほど大きくない。食品の容器や包装、ペットボトルなど、私たちの身の回りには、まだ大量のプラスチックがあふれている。</p><p>　では、レジ袋の有料化に意味はなかったのだろうか。私はそうは思わない。この取り組みの最も大きな成果は、<u>②人々の意識を変えたこと</u>にある。袋を断るという小さな行動を毎日繰り返すうちに、ごみについて考える習慣が生まれた。包装の少ない商品を選んだり、詰め替え用の製品を買ったりする人が増えたのも、その表れだろう。</p><p>　一人一人の行動は小さくても、意識が変われば、社会全体の変化につながっていく。レジ袋は、そのきっかけにすぎないのだ。</p>","qs":[{"n":53,"q":"<u>①これで十分だ</u>と考えるのが早いのはなぜか。","o":["レジ袋以外にも、身の回りに多くのプラスチックがあるから","レジ袋を使う人が、まだ多いから","自分の袋を持参する人が減ってきたから","レジ袋の値段が安すぎるから"],"e":"<b>レジ袋がプラスチックごみ全体に占める割合は、それほど大きくない…まだ大量のプラスチックがあふれている</b>. Số người mang túi riêng thì đã TĂNG nhiều.","a":0},{"n":54,"q":"<u>②人々の意識を変えたこと</u>の例として、本文に合うものはどれか。","o":["レジ袋を高い値段で買う人が増えた。","プラスチックごみの量が半分になった。","包装の少ない商品を選ぶ人が増えた。","ペットボトルを使う人がいなくなった。"],"e":"<b>包装の少ない商品を選んだり、詰め替え用の製品を買ったりする人が増えた</b>. Bài không đưa ra con số giảm một nửa.","a":2},{"n":55,"q":"レジ袋の有料化について、筆者はどう考えているか。","o":["効果がなかったので、やめるべきだ。","ごみについて考えるきっかけとして、意味があった。","プラスチックごみの問題を、すべて解決した。","レジ袋以外の取り組みは必要ない。"],"e":"<b>レジ袋は、そのきっかけにすぎない</b> và tác giả trả lời rõ là có ý nghĩa: <b>私はそうは思わない</b> (không phải là vô nghĩa). ～にすぎない = chỉ là, nghĩa là vẫn cần thêm các biện pháp khác.","a":1}]},{"passage":"<p>（3）</p><p>　年を取ると、新しいことへの興味が薄れていくと考える人は多い。しかし、八十歳を過ぎても、驚くほど好奇心が旺盛な人がいる。私の祖父もその一人だ。</p><p>　祖父は八十二歳でスマートフォンを買い、使い方を孫の私に毎日のように聞いてくる。写真の撮り方を覚えると、今度は動画の撮り方を知りたがり、最近ではビデオ通話で遠くに住む友人と話している。わからないことがあると、<u>①恥ずかしがらずに何度でも質問する</u>。その姿を見ていると、学ぶことに年齢は関係ないのだと感じる。</p><p>　祖父に、なぜそんなに新しいことに挑戦するのかと聞いてみたことがある。祖父は笑って、「知らないことを知るのが楽しいからだよ。それに、できなかったことができるようになると、まだまだ自分も捨てたものではないと思える」と答えた。</p><p>　好奇心は、若さを保つ秘訣なのかもしれない。<u>②祖父の言葉</u>を聞いて、私も何か新しいことを始めてみたくなった。</p>","qs":[{"n":56,"q":"<u>①恥ずかしがらずに何度でも質問する</u>のは誰か。","o":["筆者","筆者の祖父","祖父の友人","スマートフォンの店員"],"e":"Chủ ngữ là ông của tác giả, người hỏi cháu cách dùng điện thoại mỗi ngày. Câu hỏi về chủ ngữ cũng hay xuất hiện trong đề N1.","a":1},{"n":57,"q":"祖父が新しいことに挑戦する理由として、合っているものはどれか。","o":["知らないことを知るのが楽しく、自信にもつながるから","家族に迷惑をかけたくないから","友人に勧められたから","若い人に負けたくないから"],"e":"<b>知らないことを知るのが楽しいから</b> và <b>まだまだ自分も捨てたものではないと思える</b>. 捨てたものではない = vẫn còn giá trị, chưa đến nỗi tệ.","a":0},{"n":58,"q":"<u>②祖父の言葉</u>を聞いて、筆者はどう感じたか。","o":["祖父にスマートフォンの使い方を教えるのが大変だと思った。","自分も新しいことを始めたいと思った。","年を取ると、好奇心はなくなると思った。","祖父は若い人に負けないようにしていると思った。"],"e":"Câu cuối: <b>私も何か新しいことを始めてみたくなった</b>.","a":1}]}]},{"id":"r10","title":"問題10 内容理解（長文）","en":"Đọc hiểu: đoạn dài","instr":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　近所の公園の入り口に、こんな看板が立っている。「ボール遊び禁止」「大声禁止」「自転車の乗り入れ禁止」「ペットの散歩禁止」。並んだ禁止の文字を見ていると、いったいこの公園で何をしてよいのかと、考え込んでしまう。</p><p>　こうした看板が増えた背景には、近隣住民からの苦情があるという。子どもの声がうるさい、ボールが庭に飛び込んでくる、犬のふんが放置されている。苦情が寄せられるたびに、管理者は新しい禁止事項を加えていく。一つ一つの対応は、もっともなものだろう。しかし、<u>①その結果として</u>、公園は誰も使わない、静かな空き地になってしまった。</p><p>　禁止によって問題を防ごうとする方法は、手軽で、すぐに効果が見える。だが、そこには見落とされているものがある。それは、人々が互いに話し合い、折り合いをつける機会である。たとえば、ボール遊びをする時間帯を決める、住宅に近い側では使わないなど、工夫次第で、遊びたい人と静かに暮らしたい人が共存する方法はあるはずだ。<u>②一律の禁止</u>は、そうした知恵を生み出す機会そのものを奪ってしまう。</p><p>　実際、ある町では、住民と子どもたちが集まって、公園の使い方を一緒に考える会を開いた。最初は意見がぶつかったが、話し合いを重ねるうちに、互いの事情が見えてきた。最終的には、禁止の看板を外し、利用者自身が決めたルールを掲示することになったという。自分たちで決めたルールは、上から与えられたものより、守られやすいそうだ。</p><p>　公園は、本来、さまざまな人が共に過ごす場所である。誰かにとって迷惑な行為をすべて禁止するのではなく、どうすれば共に使えるかを考えること。それが、地域で暮らすということなのではないだろうか。</p>","qs":[{"n":59,"q":"公園に禁止の看板が増えた理由は何か。","o":["近隣の住民から苦情が寄せられたから","公園で事故が起きたから","公園の利用者が少なくなったから","子どもたちが管理者に頼んだから"],"e":"<b>こうした看板が増えた背景には、近隣住民からの苦情がある</b>. Ít người dùng công viên là KẾT QUẢ của các biển cấm, không phải lý do.","a":0},{"n":60,"q":"<u>①その結果として</u>とあるが、何の結果か。","o":["子どもたちが大声で遊んだ結果","住民が話し合いをした結果","公園の管理者がいなくなった結果","苦情のたびに禁止事項を増やしてきた結果"],"e":"その chỉ câu trước: <b>苦情が寄せられるたびに、管理者は新しい禁止事項を加えていく</b>. Kết quả là công viên thành bãi đất trống không ai dùng.","a":3},{"n":61,"q":"<u>②一律の禁止</u>について、筆者はどう考えているか。","o":["問題を防ぐための、最もよい方法だ。","子どもを守るためには必要だ。","住民の意見を正しく反映している。","人々が話し合って共存の方法を考える機会を奪う。"],"e":"<b>そうした知恵を生み出す機会そのものを奪ってしまう</b>. 知恵 ở đây là cách cùng nhau tìm ra cách chung sống. 一律 = đồng loạt, áp dụng như nhau cho mọi người.","a":3},{"n":62,"q":"この文章で筆者が最も言いたいことは何か。","o":["公園では、ボール遊びを禁止すべきだ。","禁止するのではなく、共に使う方法を地域で考えるべきだ。","苦情を言う住民は、我慢すべきだ。","公園の管理者は、看板を増やすべきだ。"],"e":"Đoạn cuối: <b>すべて禁止するのではなく、どうすれば共に使えるかを考えること</b>. Ví dụ ở đoạn 4 (người dân tự đặt quy tắc) minh họa cho ý này.","a":1}]}]},{"id":"r11","title":"問題11 統合理解","en":"Đọc so sánh A và B","instr":"次のAとBの文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p><b>A</b></p><p>　24時間営業の店を見直す動きが広がっている。深夜は客が少なく、売り上げに比べて電気代や人件費がかさむ。人手不足の中、夜中に働く店員を確保するのも難しい。深夜の勤務は体への負担も大きく、店員の健康を守るという点からも、営業時間の短縮は当然の流れだろう。夜中に買い物をしなければならない人は、それほど多くないはずだ。</p><p><b>B</b></p><p>　店の営業時間を短くすることには、確かに合理的な理由がある。人手不足や働く人の負担を考えれば、見直しはやむを得ないだろう。しかし、夜中に開いている店に助けられている人もいる。夜勤の仕事を終えた人や、急に子どもの薬が必要になった親にとって、深夜の店は欠かせない。また、明かりのついた店が、夜道を歩く人に安心感を与えているという面もある。地域の事情を考えて、本当に必要な場所には深夜の店を残す工夫が必要だ。</p>","qs":[{"n":63,"q":"AとBのどちらの文章でも述べられていることは何か。","o":["人手不足や働く人の負担が、営業時間を見直す理由になっていること","深夜の店が、夜道の安全に役立っていること","夜中に買い物をする人は少ないこと","深夜は電気代が高くなること"],"e":"A: <b>人手不足…体への負担も大きく</b>. B: <b>人手不足や働く人の負担を考えれば</b>. An toàn ban đêm chỉ có ở B. Ít khách và tiền điện chỉ có ở A.","a":0},{"n":64,"q":"24時間営業について、AとBはどのように述べているか。","o":["AもBも、すべての店で24時間営業を続けるべきだと述べている。","Aは営業時間の短縮は当然だと述べ、Bは必要な場所には深夜の店を残すべきだと述べている。","Aは深夜の店が地域に必要だと述べ、Bは営業時間を短くすべきだと述べている。","AもBも、24時間営業はすぐにやめるべきだと述べている。"],"e":"A: <b>営業時間の短縮は当然の流れ</b>. B: <b>本当に必要な場所には深夜の店を残す工夫が必要</b>. Có một đáp án đảo ngược A và B.","a":1}]}]},{"id":"r12","title":"問題12 主張理解（長文）","en":"Đọc hiểu: quan điểm tác giả","instr":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　日本では、ほめられたときに「いえいえ、そんなことはありません」と否定するのが礼儀だとされてきた。自分の家族を人に紹介するときにも、「うちの息子は出来が悪くて」などと言うことがある。こうした謙遜は、相手を立て、和を大切にする日本の文化の表れだと言われる。</p><p>　私自身、長い間それを当然のことと思ってきた。しかし、海外の大学で学んでいたころ、<u>①ある出来事</u>をきっかけに考えが変わった。発表の後、指導教員に「とてもよかった」とほめられ、私はいつものように「いえ、まだまだです」と答えた。すると教員は、少し困った顔で「あなたは私の評価が間違っていると言いたいの？」と尋ねたのである。</p><p>　その一言で、私ははっとした。謙遜のつもりで口にした言葉が、相手の評価を否定することにもなりうる。ほめてくれた人の気持ちを受け止めず、はね返してしまうことでもあるのだ。</p><p>　もちろん、謙遜の文化そのものを捨てるべきだとは思わない。自分を大きく見せようとせず、他人を立てる姿勢には、学ぶべき点も多い。<u>②問題は、それが形だけの習慣になってしまうこと</u>だ。本心では努力を認めてもらってうれしいのに、反射的に否定の言葉を口にする。それは、相手のためにも自分のためにもならないのではないか。</p><p>　最近、私はほめられたら、まず「ありがとうございます」と言うようにしている。そのうえで、「〇〇さんに助けていただいたおかげです」と付け加えることもある。感謝の言葉で受け止め、周りの人への敬意を示す。それも、相手を立てる一つの形だと思うのだ。</p>","qs":[{"n":65,"q":"<u>①ある出来事</u>とはどのようなことか。","o":["発表がうまくいかず、教員に厳しく注意されたこと","教員にほめられて、自信を持てるようになったこと","海外の学生に、日本の文化について質問されたこと","謙遜して答えたら、評価を否定したように受け取られたこと"],"e":"Đoạn 2: tác giả khiêm tốn trả lời まだまだです, giáo viên hỏi lại <b>私の評価が間違っていると言いたいの？</b>. Bài thuyết trình được KHEN, không bị chê.","a":3},{"n":66,"q":"謙遜の文化について、筆者はどう考えているか。","o":["学ぶべき点もあるので、捨てるべきではない。","古い習慣なので、やめるべきだ。","海外でも通じるので、続けるべきだ。","日本人だけが持つ、最も優れた文化だ。"],"e":"<b>謙遜の文化そのものを捨てるべきだとは思わない…学ぶべき点も多い</b>. Tác giả không phủ nhận văn hóa khiêm tốn, mà chỉ ra vấn đề khi nó thành thói quen hình thức.","a":0},{"n":67,"q":"<u>②問題は、それが形だけの習慣になってしまうこと</u>とはどういうことか。","o":["謙遜の言葉を、外国語に訳せないこと","若い人が、謙遜の言葉を使わなくなったこと","謙遜すると、相手に嫌われてしまうこと","本当はうれしいのに、考えずに否定の言葉を言ってしまうこと"],"e":"Câu ngay sau: <b>本心では…うれしいのに、反射的に否定の言葉を口にする</b>. 反射的に = theo phản xạ, không suy nghĩ.","a":3},{"n":68,"q":"筆者の考えに最も近いものはどれか。","o":["ほめられたら、謙遜せずに自分の努力を強調すべきだ。","人をほめることは、相手にとって迷惑になることがある。","海外では、日本の礼儀は通用しないので気をつけるべきだ。","ほめられたら感謝で受け止めることも、相手を立てる方法の一つだ。"],"e":"Đoạn cuối: <b>感謝の言葉で受け止め、周りの人への敬意を示す。それも、相手を立てる一つの形</b>. Tác giả không nói nên nhấn mạnh nỗ lực của bản thân, mà còn cảm ơn người khác (おかげです).","a":3}]}]},{"id":"r13","title":"問題13 情報検索","en":"Tìm thông tin","instr":"次は、ある映画館の料金案内である。下の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<div class='notice'><p style='text-align:center'><b>シネマみなと　料金のご案内</b></p><table class='tbl'><tr><th>区分</th><th>通常料金</th></tr><tr><td>一般</td><td>1,900円</td></tr><tr><td>大学生、専門学校生</td><td>1,500円</td></tr><tr><td>高校生</td><td>1,000円</td></tr><tr><td>中学生以下</td><td>800円</td></tr><tr><td>シニア（60歳以上）</td><td>1,200円</td></tr></table><p style='margin-top:8px'><b>【割引サービス】</b><br>●毎月1日（映画の日）：どなたでも1,200円<br>●レイトショー（20時以降に始まる回）：一般、大学生は1,400円<br>●夫婦50割（どちらかが50歳以上のご夫婦）：二人で2,400円</p><p>※割引サービスは、ほかの割引と一緒に使うことはできません。<br>※学生料金、シニア料金でご購入の際は、学生証または年齢がわかるものをご提示ください。<br>※3D作品は、上記の料金に400円が加算されます。</p></div>","qs":[{"n":69,"q":"会社員の森さん（35歳）は、15日の夜8時半から始まる3D作品を一人で見たい。料金はいくらか。","o":["1,400円","2,300円","1,800円","1,600円"],"e":"20h30 là sau 20h nên được <b>レイトショー</b>: người lớn 1,400円. Phim <b>3D: +400円</b>. Vậy 1,400 + 400 = <b>1,800円</b>. 1,400円 là bẫy cho người quên phụ phí 3D. Ngày 15 không phải ngày 1 nên không có 映画の日.","a":2},{"n":70,"q":"山本さん（52歳）と妻（48歳）は、毎月1日に、二人で通常の作品を見に行く。二人分の料金が最も安くなるのはいくらか。","o":["3,800円","2,700円","3,100円","2,400円"],"e":"Có hai cách: <b>映画の日</b> 1,200円 × 2 = 2,400円, hoặc <b>夫婦50割</b> (chồng 52 tuổi, trên 50) cũng là 2,400円. Không thể dùng hai ưu đãi cùng lúc. Vậy rẻ nhất là <b>2,400円</b>. 3,800円 là giá thường của hai người lớn.","a":3}]}]}];

</script>
<script>
const KEY="n1mock_v1";
const SETS=[{id:"s1",name:"模試 1",secs:SECTIONS},{id:"s2",name:"模試 2",secs:SET2},{id:"s3",name:"模試 3",secs:SET3},{id:"s4",name:"模試 4",secs:SET4},{id:"s5",name:"模試 5",secs:SET5},{id:"s6",name:"模試 6",secs:SET6},{id:"s7",name:"模試 7",secs:SET7}];
let st={cur:"s1",d:{}};
function blank(){SETS.forEach(x=>{if(!st.d[x.id])st.d[x.id]={ans:{},last:null}})}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);
 if(o&&o.d)st=o; else if(o&&o.ans)st={cur:"s1",d:{s1:{ans:o.ans,last:o.last||null}}};}}catch(e){} blank(); st.sec=null}
function save(){try{localStorage.setItem(KEY,JSON.stringify({cur:st.cur,d:st.d}))}catch(e){}}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
load();
const $=id=>document.getElementById(id);
const SET=()=>SETS.find(x=>x.id===st.cur);
const SECS=()=>SET().secs;
const D=()=>st.d[st.cur];
function secStats(s){let t=0,d=0,c=0;const A=D().ans;s.pages.forEach(p=>p.qs.forEach(q=>{t++;if(q.n in A){d++;if(A[q.n]===q.a)c++}}));return{t,d,c}}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function setCur(id){st.cur=id;save();home()}
function home(){
 st.sec=null;$("nav").classList.add("hide");
 let tot=0,done=0,cor=0;SECS().forEach(s=>{const x=secStats(s);tot+=x.t;done+=x.d;cor+=x.c});
 const last=D().last;
 let h=`<h1>JLPT N1 模擬試験</h1><p class="sub">言語知識（文字 語彙 文法）と読解　本番は110分、全${tot}問</p>`;
 h+=`<label class="pick"><span>Chọn đề</span><select onchange="setCur(this.value)">`+SETS.map(x=>{const a=st.d[x.id]?st.d[x.id].ans:{};const dn=Object.keys(a).length;let tt=0;x.secs.forEach(z=>z.pages.forEach(p=>tt+=p.qs.length));return `<option value="${x.id}" ${x.id===st.cur?'selected':''}>${x.name}　(${dn}/${tt})</option>`}).join("")+`</select></label>`;
 h+=`<div class="card"><div class="row" style="justify-content:space-between"><div><div class="sub" style="margin:0">${SET().name}　解答済み</div><div class="big">${done}<span style="font-size:1rem;color:var(--mute)"> / ${tot}</span></div></div><div style="text-align:right"><div class="sub" style="margin:0">正解</div><div class="big" style="color:var(--ok)">${cor}</div></div></div>`;
 if(last&&last.sec){const s=SECS().find(x=>x.id===last.sec);if(s)h+=`<button class="btn" style="width:100%;margin-top:12px" onclick="openSec('${s.id}',${last.page})">続きから: ${esc(s.title)}</button>`}
 h+=`</div>`;
 const grp=(lab,f)=>{h+=`<div class="grp">${lab}</div>`;SECS().filter(f).forEach(s=>{const x=secStats(s);h+=`<div class="sec" onclick="openSec('${s.id}',0)"><div><div class="t">${esc(s.title)}</div><div class="e">${esc(s.en)}</div></div><div class="p">${x.d?`${x.c}/${x.t} 正解`:`${x.t}問`}<div class="bar"><i style="width:${x.t?100*x.d/x.t:0}%"></i></div></div></div>`})};
 grp("文字 語彙　VOCABULARY",s=>/^m[1-4]$/.test(s.id));
 grp("文法　GRAMMAR",s=>/^m[5-7]$/.test(s.id));
 grp("読解　READING",s=>s.id[0]==="r");
 h+=`<div class="card"><b>ほかの端末で続きをする</b><p class="sub" style="margin:4px 0 8px">Progress saves automatically on this device. To continue on another device, copy the code, send it to yourself, and paste it there. The code includes both 模試 1 and 2.</p><div class="row" style="flex-wrap:wrap"><button class="ghost small" onclick="copyCode()">コードをコピー</button><button class="ghost small" onclick="showPaste()">コードを貼り付け</button></div><div id="codeArea"></div><div class="msg" id="msg"></div></div>`;
 h+=`<div class="card"><b>公式サンプル問題</b><p class="sub" style="margin:4px 0 6px">Official free N1 sample test from the JLPT organizers (real format, PDF):</p><a href="https://www.jlpt.jp/samples/sample2018/pdf/N1V.pdf" target="_blank" rel="noopener">N1 言語知識 読解 sample (jlpt.jp)</a><br><a href="https://jlpt.jp/e/samples/forlearners.html" target="_blank" rel="noopener">JLPT sample questions page</a></div>`;
 h+=`<div style="text-align:center;margin-top:16px"><button class="ghost small" onclick="askReset()">${SET().name}をリセット (Reset)</button></div>`;
 $("app").innerHTML=h;window.scrollTo(0,0);
}
function openSec(id,page){st.sec=id;st.page=page||0;D().last={sec:id,page:st.page};save();render()}
function render(){
 const s=SECS().find(x=>x.id===st.sec);if(!s)return home();
 const p=s.pages[st.page];$("nav").classList.remove("hide");const A=D().ans;
 let h=`<div class="top"><span class="pill">${SET().name}　${esc(s.title)}</span><span class="sub" style="margin:0">${esc(s.en)}</span></div>`;
 if(st.page===0||p.passage)h+=`<div class="instr">${s.instr}</div>`;
 if(p.passage)h+=`<div class="card passage"><div class="${/tbl/.test(p.passage)?'tblwrap':''}">${p.passage}</div></div>`;
 h+=`<div class="card">`;
 p.qs.forEach(q=>{
  const ans=A[q.n];const done=ans!==undefined;
  h+=`<div class="qblock"><div class="q"><span class="qn">${q.n}</span>${q.q}</div>`;
  q.o.forEach((o,i)=>{let cls="";if(done){if(i===q.a)cls="ok";else if(i===ans)cls="ng"}
   h+=`<button class="opt ${cls}" ${done?"disabled":""} onclick="pick(${q.n},${i})"><span class="num">${i+1}</span><span>${o}</span></button>`});
  if(done){const ok=ans===q.a;h+=`<div class="exp"><div class="v ${ok?"ok":"ng"}">${ok?"○ 正解":"× 不正解　正解は "+(q.a+1)}</div>${q.e}<div style="text-align:right;margin-top:4px"><button class="ghost small" onclick="retry(${q.n})">もう一度</button></div></div>`}
  h+=`</div>`});
 h+=`</div>`;
 $("app").innerHTML=h;
 const si=SECS().indexOf(s);
 $("navMid").textContent=`${st.page+1} / ${s.pages.length}`;
 $("bPrev").disabled=(st.page===0&&si===0);
 $("bNext").textContent=(st.page===s.pages.length-1)?(si===SECS().length-1?"結果 →":"次の問題 →"):"次 →";
}
function pick(n,i){D().ans[n]=i;save();const y=window.scrollY;render();window.scrollTo(0,y)}
function retry(n){delete D().ans[n];save();const y=window.scrollY;render();window.scrollTo(0,y)}
function go(d){
 const L=SECS();const s=L.find(x=>x.id===st.sec);let si=L.indexOf(s),pg=st.page+d;
 if(pg<0){if(si===0)return;si--;pg=L[si].pages.length-1}
 else if(pg>=s.pages.length){if(si===L.length-1){return result()}si++;pg=0}
 st.sec=L[si].id;st.page=pg;D().last={sec:st.sec,page:pg};save();render();window.scrollTo(0,0)
}
function result(){
 $("nav").classList.add("hide");let h=`<h1>結果　${SET().name}</h1><div class="card">`;let T=0,C=0;
 SECS().forEach(s=>{const x=secStats(s);T+=x.t;C+=x.c;h+=`<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(s.title)}</span><b>${x.c} / ${x.t}</b></div>`});
 h+=`<div class="row" style="justify-content:space-between;padding-top:10px"><b>合計</b><span class="big">${C} / ${T}</span></div></div><p class="sub">Wrong answers: open the section and tap もう一度 to try again.</p><button class="btn" style="width:100%" onclick="home()">目次へ戻る</button>`;
 $("app").innerHTML=h;window.scrollTo(0,0)
}
function code(){return btoa(unescape(encodeURIComponent(JSON.stringify({v:2,d:st.d}))))}
function copyCode(){const c=code();const show=()=>{$("codeArea").innerHTML=`<textarea readonly onclick="this.select()">${c}</textarea>`};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(c).then(()=>{$("msg").textContent="コピーしました。もう一つの端末で貼り付けてください。"},()=>{show();$("msg").textContent="Long-press the code to copy it."})}else{show();$("msg").textContent="Long-press the code to copy it."}}
function showPaste(){$("codeArea").innerHTML=`<textarea id="pin" placeholder="ここにコードを貼り付け"></textarea><button class="btn small" style="margin-top:6px" onclick="applyCode()">読み込む</button>`;$("msg").textContent=""}
function applyCode(){try{const o=JSON.parse(decodeURIComponent(escape(atob($("pin").value.trim()))));
 if(o&&o.d)st.d=o.d; else if(o&&typeof o.a==="object")st.d.s1={ans:o.a,last:o.l||null}; else throw 0;
 blank();save();home();$("msg").textContent="読み込みました！"}catch(e){$("msg").style.color="var(--ng)";$("msg").textContent="コードが正しくありません。"}}
function askReset(){$("modalBody").innerHTML=`<b>${SET().name}をリセットしますか？</b><p class="sub">All answers for ${SET().name} on this device will be erased. The other test is kept.</p><div class="row" style="justify-content:flex-end"><button class="ghost small" onclick="closeM()">キャンセル</button><button class="btn small" style="background:var(--ng)" onclick="doReset()">リセット</button></div>`;$("modal").classList.remove("hide")}
function closeM(){$("modal").classList.add("hide")}
function doReset(){st.d[st.cur]={ans:{},last:null};save();closeM();home()}
$("bHome").onclick=home;$("bPrev").onclick=()=>go(-1);$("bNext").onclick=()=>go(1);
home();
</script>
</body>
</html>
