,"新しく導入された機械の使い方を、入居者や家族にわかりやすく教えること","相手の様子の小さな変化を感じ取り、寄り添うこと"],"e":"<b>表情の小さな変化に気づき、相手の気持ちに寄り添うのは、やはり人の役割</b>. Bẫy: nâng người và đi tuần đêm là việc ĐÃ giao cho máy.","a":3},{"n":55,"q":"<u>②それぞれが得意なこと</u>を分け合うとは、どういうことか。","o":["すべての作業を、できるだけ機械に任せること","機械を使わず、人だけで介護を行うこと","職員と入居者が、作業を分担すること","力仕事は機械に、心のケアは人に任せること"],"e":"Gộp ý của đoạn 2 (máy làm việc nặng, đi tuần) và đoạn 3 (người quan tâm cảm xúc). Bẫy: tác giả nói không cần chọn một trong hai (どちらかを選ぶことではなく).","a":3}]},{"passage":"<p>（3）</p><p>　毎日通る道に、名前も知らない木や草がたくさん生えている。以前の私は、それらをただの「緑」としてしか見ていなかった。</p><p>　あるとき、友人に誘われて植物の観察会に参加した。講師の説明を聞きながら歩くと、道端の小さな花にも一つ一つ名前があり、季節によって姿を変えることを知った。<u>①その日を境に</u>、通勤の景色が一変した。「あ、もう咲き始めた」「この実は先週より赤くなった」。名前を知っただけで、見過ごしていたものが次々と目に入ってくるのだ。</p><p>　名前とは、ものを見るための入り口のようなものなのかもしれない。名前を知ることで、私たちはそれを他と区別し、関心を向けられるようになる。<u>②世界の見え方</u>は、自分が知っている言葉の数によって、大きく変わるのだろう。</p>","qs":[{"n":56,"q":"<u>①その日を境に</u>、筆者の何が変わったか。","o":["見慣れた道の植物の変化に、目が向くようになった。","毎日通る道を、別の道に変えるようになった。","植物の観察会に、毎週参加するようになった。","道端で見つけた名前のわかる花を、家に持ち帰って自分で育てるようになった。"],"e":"<b>通勤の景色が一変した…見過ごしていたものが次々と目に入ってくる</b>. 一変した không có nghĩa là đổi đường đi, mà là cách nhìn thay đổi.","a":0},{"n":57,"q":"筆者は、ものの名前について、どのように述べているか。","o":["名前を知らなくても、植物の美しさは十分に楽しめる。","植物の名前は、専門家に教わらないと覚えられない。","名前を知ると、そのものに注意を向けやすくなる。","名前を覚えるより、実物を観察するほうが大切だ。"],"e":"<b>名前を知ることで、私たちはそれを他と区別し、関心を向けられるようになる</b>. Bẫy: hai đáp án cuối đều là những ý mà bài không nói, và còn ngược lại với ý chính.","a":2},{"n":58,"q":"<u>②世界の見え方</u>について、筆者の考えに合うものはどれか。","o":["世界の見え方は、生まれつき人によって決まっている。","多くの言葉を知っている人ほど、植物に詳しい。","言葉を知りすぎると、ものを素直に見られなくなる。","知っている言葉が増えるほど、見えるものも増える。"],"e":"<b>世界の見え方は、自分が知っている言葉の数によって、大きく変わる</b>. Bẫy: đáp án thứ ba thu hẹp ý chung thành chỉ về thực vật.","a":3}]}]},{"id":"r10","title":"問題10 内容理解（長文）","en":"Đọc hiểu: đoạn dài","instr":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　子どものスポーツの大会を見に行くと、ときどき胸が痛む光景に出会う。ミスをした子どもに、コーチや保護者が大声で怒鳴る。試合に勝つために、一部の上手な子どもだけが試合に出続け、ほかの子どもはベンチで一日を過ごす。勝ちたいという気持ちは自然なものだが、<u>①それが行き過ぎる</u>と、スポーツは子どもにとって楽しいものではなくなってしまう。</p><p>　実際、小学生のころに熱心に競技をしていた子どもが、中学生になるとやめてしまう例は少なくない。理由を聞くと、「怒られるのが嫌になった」「試合に出られなくて面白くなかった」という答えが多いという。勝利を目指すあまり、子どもがスポーツを続ける意欲そのものを奪ってしまっているのだとすれば、本末転倒と言うほかない。</p><p>　もちろん、勝負にこだわることが悪いわけではない。勝つために工夫し、仲間と力を合わせる経験は、子どもを大きく成長させる。負けて悔しい思いをすることも、大切な学びだ。問題は、勝ち負けが<u>②唯一の物差し</u>になってしまうことである。</p><p>　海外のある国では、低学年の大会では順位をつけず、全員が同じ時間だけ試合に出られるように決めているという。日本でも、試合への出場時間を均等にする大会や、勝敗よりも「楽しかったか」を振り返る時間を設けるチームが出てきた。</p><p>　子どもの時期のスポーツの目的は、目の前の大会で勝つことだけではないはずだ。体を動かす喜びを知り、生涯にわたってスポーツと付き合っていける人を育てること。大人がその視点を持てるかどうかが、今問われている。</p>","qs":[{"n":59,"q":"<u>①それが行き過ぎる</u>とは、どのようなことか。","o":["試合に勝つために子どもたちが毎日長時間練習しすぎて、体にけがをしてしまうこと","保護者が試合を見に来すぎて、子どもが緊張すること","勝利へのこだわりが強すぎて、子どもへの接し方がゆがむこと","大会の数が多すぎて、子どもが疲れること"],"e":"それ = <b>勝ちたいという気持ち</b>. Ví dụ ngay trước: quát mắng khi sai, chỉ cho đứa giỏi ra sân. Đáp án đúng khái quát lại các ví dụ đó. Chấn thương do tập quá sức không được nhắc đến.","a":2},{"n":60,"q":"筆者が「本末転倒」と言っているのはなぜか。","o":["子どもが勝つことに興味を持たなくなっているから","勝つことを求めた結果、子どもが競技を続けなくなっているから","中学生になると、試合に出られる子どもが減るから","チームのコーチが、実際にプレーする子どもよりも、試合を見に来る保護者の意見を重視しているから"],"e":"本末転倒 = đảo lộn gốc ngọn. <b>勝利を目指すあまり、子どもがスポーツを続ける意欲そのものを奪って</b>. Mục đích là thể thao cho trẻ, nhưng chính việc theo đuổi chiến thắng lại làm trẻ bỏ thể thao.","a":1},{"n":61,"q":"<u>②唯一の物差し</u>とあるが、筆者はどうなることを問題視しているか。","o":["勝負にこだわって、仲間と力を合わせなくなること","大人が結果を気にしすぎるために、負けて悔しいという思いを子どもが経験しなくなること","大会で、一つの競技しか行われなくなること","勝ち負けだけで、子どものスポーツの価値が判断されること"],"e":"物差し = thước đo, tiêu chuẩn. Vấn đề là thắng thua trở thành tiêu chuẩn DUY NHẤT. Bẫy: tác giả nói hợp sức với đồng đội và nếm vị thua là ĐIỀU TỐT của việc thi đấu.","a":3},{"n":62,"q":"この文章で筆者が最も言いたいことは何か。","o":["海外の国にならって、日本でも子どもの大会では順位をつけることを法律で禁止すべきだ。","勝負にこだわることは、子どもの成長に悪い影響しか与えない。","子どもには、勝つための技術を早くから教えるべきだ。","大人は、子どもが長くスポーツを楽しめるかという視点を持つべきだ。"],"e":"Đoạn cuối: <b>生涯にわたってスポーツと付き合っていける人を育てること。大人がその視点を持てるかどうか</b>. Bẫy: \"cấm xếp hạng\" chỉ là ví dụ ở nước ngoài. Tác giả nói rõ <b>勝負にこだわることが悪いわけではない</b>.","a":3}]}]},{"id":"r11","title":"問題11 統合理解","en":"Đọc so sánh A và B","instr":"次のAとBの文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p><b>A</b></p><p>　感染症の流行をきっかけに広がった大学のオンライン授業は、今後も続けるべきだ。録画された授業なら、学生は自分のペースで何度も見直すことができる。通学に時間のかかる学生や、働きながら学ぶ社会人にとっても、学びやすい環境になった。対面でなければ質問しにくいという声もあるが、チャット機能を使えば、かえって気軽に質問できるという学生も少なくない。大学は、オンラインの良さを積極的に生かしていくべきだ。</p><p><b>B</b></p><p>　オンライン授業には確かに便利な面がある。自分の都合に合わせて学べることは、多くの学生にとって魅力だろう。しかし、大学で得られるものは、授業の内容だけではない。教室で友人と議論したり、授業の後に教員と雑談したりする中で、新しい考えに出会うことも多い。画面越しの授業では、そうした偶然の出会いは生まれにくい。オンラインは補助的に使い、大学はあくまで人が集まって学ぶ場であり続けるべきだ。</p>","qs":[{"n":63,"q":"AとBのどちらの文章でも述べられていることは何か。","o":["オンライン授業には、自分の都合で学べる利点があること","チャット機能を使えば、教室で手を挙げるよりも気軽に教員に質問できること","教室での議論から、新しい考えが生まれること","働きながら学ぶ社会人が増えていること"],"e":"A: <b>自分のペースで何度も見直す</b>. B: <b>自分の都合に合わせて学べること</b>. Hai cách nói khác nhau cho cùng một ý. Chat chỉ có ở A, thảo luận trong lớp chỉ có ở B.","a":0},{"n":64,"q":"オンライン授業について、AとBはどのような立場をとっているか。","o":["AもBも、オンライン授業はやめるべきだとしている。","Aは補助的に使うべきだとし、Bは積極的に増やすべきだとしている。","AもBも、対面授業はもう必要ないとしている。","Aは中心的に活用すべきだとし、Bは補助的に使うべきだとしている。"],"e":"A: <b>オンラインの良さを積極的に生かしていくべき</b>. B: <b>オンラインは補助的に使い</b>. Có một đáp án đảo ngược A và B. B không phản đối hoàn toàn.","a":3}]}]},{"id":"r12","title":"問題12 主張理解（長文）","en":"Đọc hiểu: quan điểm tác giả","instr":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<p>　わからないことがあれば、手元の端末で調べれば数秒で答えが見つかる。歴史の年号も、外国語の単語も、料理の手順も、覚えておく必要はほとんどなくなった。こうした時代に、学校で知識を覚えさせることに意味はあるのかと問う声もある。覚える時間があるなら、調べ方や考え方を学んだほうがよい、というわけだ。</p><p>　確かに、知識を丸暗記させるだけの教育には限界がある。意味もわからないまま年号を並べて覚えても、試験が終われば忘れてしまうだろう。しかし、だからといって、<u>①覚えることそのもの</u>の価値がなくなったわけではないと私は考える。</p><p>　まず、人は頭の中にある知識を材料にしてしか考えることができない。新しい情報に出会ったとき、それが重要かどうか、どこがおかしいのかを判断できるのは、すでに持っている知識と照らし合わせることができるからだ。何も知らない人は、検索して出てきた情報が正しいかどうかさえ見分けられない。調べる力は、知識の土台があってはじめて生きるのである。</p><p>　さらに、知識同士が頭の中で結びつくことで、新しい発想が生まれる。歴史の出来事と、経済の仕組みと、最近読んだ小説の場面とが、ふとつながる瞬間がある。<u>②そうした結びつき</u>は、必要なときにその都度調べるだけでは起こりにくい。頭の中に蓄えられているからこそ、思いがけない組み合わせが可能になるのだ。</p><p>　調べればわかる時代だからこそ、何を自分の中に蓄えておくかが問われている。覚えることと調べることは、どちらかを選ぶものではない。互いを支え合う、考える力の両輪なのである。</p>","qs":[{"n":65,"q":"第1段落で紹介されている意見に最も近いものはどれか。","o":["学校では、より多くの知識を覚えさせるべきだ。","知識を覚えるより、調べ方を学ぶほうが役に立つ。","手元の端末に頼らずに、まずは自分の頭だけでじっくり考えるようにすべきだ。","外国語の単語だけは、覚えておく必要がある。"],"e":"<b>覚える時間があるなら、調べ方や考え方を学んだほうがよい</b>. Chú ý: đây là ý kiến của NGƯỜI KHÁC (～という声もある), không phải ý của tác giả. Câu hỏi chỉ hỏi về ý kiến được giới thiệu.","a":1},{"n":66,"q":"筆者によると、知識がない人はどうなるか。","o":["新しい情報を調べることができない。","試験が終わると、すぐに忘れてしまう。","調べて得た情報の真偽を判断できない。","調べる力が自然に身につく。"],"e":"<b>何も知らない人は、検索して出てきた情報が正しいかどうかさえ見分けられない</b>. 正しいかどうか được nói lại thành 真偽 (thật giả). Bẫy: họ VẪN tìm kiếm được, chỉ là không phán đoán được. Quên sau kỳ thi là chuyện của việc học thuộc lòng máy móc.","a":2},{"n":67,"q":"<u>②そうした結びつき</u>が起こりにくいのは、どのような場合か。","o":["歴史や経済など、多くの分野を学んでいる場合","必要になるたびに調べるだけで、知識を蓄えていない場合","小説をたくさん読んで、知識が増えすぎた場合","知識を覚えるときに、一つ一つの言葉の意味や背景を深く考えすぎてしまった場合"],"e":"<b>必要なときにその都度調べるだけでは起こりにくい</b>. その都度 được nói lại thành 必要になるたびに. Bẫy: học nhiều lĩnh vực chính là ĐIỀU KIỆN để sự kết nối xảy ra.","a":1},{"n":68,"q":"筆者の主張に最も近いものはどれか。","o":["端末で調べればすぐにわかる時代なので、学校で知識を覚える必要はもうほとんどない。","調べる力より、覚える力のほうがずっと重要だ。","丸暗記の教育こそが、考える力を育てる。","覚えることと調べることは、互いに支え合う関係にある。"],"e":"<b>どちらかを選ぶものではない。互いを支え合う、考える力の両輪</b>. 両輪 = hai bánh xe, cả hai đều cần. Bẫy: tác giả không xếp hạng cái nào quan trọng hơn, và phê phán học thuộc lòng máy móc (丸暗記には限界がある).","a":3}]}]},{"id":"r13","title":"問題13 情報検索","en":"Tìm thông tin","instr":"次は、ある美術館の利用案内である。下の問いに対する答えとして最もよいものを、1、2、3、4から一つ選びなさい。","pages":[{"passage":"<div class='notice'><p style='text-align:center'><b>あおば市立美術館　ご利用案内</b></p><p>【開館時間】10:00～18:00（金曜日は20:00まで）　※入館は閉館の30分前まで<br>【休館日】月曜日（祝日の場合は翌日）</p><table class='tbl'><tr><th>区分</th><th>常設展</th><th>特別展（常設展も見られます）</th></tr><tr><td>一般</td><td>500円</td><td>1,500円</td></tr><tr><td>大学生、高校生</td><td>300円</td><td>1,000円</td></tr><tr><td>中学生以下</td><td>無料</td><td>無料</td></tr><tr><td>65歳以上</td><td>250円</td><td>1,200円</td></tr></table><p>※20名以上の団体は、上記料金の2割引きとなります。<br>※金曜日の17:00以降に入館される方は、特別展の料金が一般1,000円、大学生と高校生700円になります（65歳以上の方は割引なし）。<br>※年間パスポート（一般6,000円）：1年間、常設展、特別展ともに何度でも入館できます。<br>※割引は、ほかの割引と一緒に使うことはできません。</p></div>","qs":[{"n":69,"q":"大学生のミンさんは、友人の高校生と二人で、金曜日の夕方5時半に特別展を見に行く。二人分の入館料の合計はいくらか。","o":["2,000円","1,700円","1,400円","1,000円"],"e":"Thứ sáu sau 17h, vé triển lãm đặc biệt cho sinh viên đại học và học sinh cấp 3 đều là <b>700円</b>. 700 × 2 = <b>1,400円</b>. Bẫy: 2,000円 là giá thường của cả hai. 1,700円 là chỉ giảm cho một người. 1,000円 là nhầm sang giá buổi tối của người lớn (一般).","a":2},{"n":70,"q":"70歳の田中さんは、毎月2回ずつ1年間、特別展を見に行きたい。最も安くなる方法について、正しいものはどれか。","o":["毎回、65歳以上の料金で入館する。","一般の年間パスポートを買う。","金曜日の17時以降に、毎回入館する。","20名以上の団体に入り、毎回2割引きで入館する。"],"e":"65歳以上: 1,200円 × 24 lần = 28,800円. Thứ sáu sau 17h: <b>65歳以上 không được giảm</b>, vẫn 1,200円. Đoàn 20 người: 960円 × 24 = 23,040円. Vé năm <b>6,000円</b> rẻ nhất. Bẫy: ưu đãi buổi tối thứ sáu không áp dụng cho người trên 65 tuổi.","a":1}]}]}];

</script>
<script>
const KEY="n1mock_v1";
const SETS=[{id:"s1",name:"模試 1",secs:SECTIONS},{id:"s2",name:"模試 2",secs:SET2},{id:"s3",name:"模試 3",secs:SET3},{id:"s4",name:"模試 4",secs:SET4},{id:"s5",name:"模試 5",secs:SET5},{id:"s6",name:"模試 6",secs:SET6},{id:"s7",name:"模試 7",secs:SET7},{id:"s8",name:"模試 8",secs:SET8},{id:"s9",name:"模試 9",secs:SET9}];
let st={cur:"s1",d:{}};
function blank(){SETS.forEach(x=>{if(!st.d[x.id])st.d[x.id]={ans:{},last:null}})}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);
 if(o&&o.d)st=o; else if(o&&o.ans)st={cur:"s1",d:{s1:{ans:o.ans,last:o.last||null}}};}}catch(e){} blank(); st.sec=null}
function save(){try{localStorage.setItem(KEY,JSON.stringify({cur:st.cur,d:st.d}))}catch(e){}}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
load();
const $=id=>document.getElementById(id);
const SET=()=>SETS.find(x=>x.id===st.cur);
const SECS=()=>SET().secs;
const D=()=>st.d[st.cur];
function secStats(s){let t=0,d=0,c=0;const A=D().ans;s.pages.forEach(p=>p.qs.forEach(q=>{t++;if(q.n in A){d++;if(A[q.n]===q.a)c++}}));return{t,d,c}}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function setCur(id){st.cur=id;save();home()}
function home(){
 st.sec=null;$("nav").classList.add("hide");
 let tot=0,done=0,cor=0;SECS().forEach(s=>{const x=secStats(s);tot+=x.t;done+=x.d;cor+=x.c});
 const last=D().last;
 let h=`<h1>JLPT N1 模擬試験</h1><p class="sub">言語知識（文字 語彙 文法）と読解　本番は110分、全${tot}問</p>`;
 h+=`<label class="pick"><span>Chọn đề</span><select onchange="setCur(this.value)">`+SETS.map(x=>{const a=st.d[x.id]?st.d[x.id].ans:{};const dn=Object.keys(a).length;let tt=0;x.secs.forEach(z=>z.pages.forEach(p=>tt+=p.qs.length));return `<option value="${x.id}" ${x.id===st.cur?'selected':''}>${x.name}　(${dn}/${tt})</option>`}).join("")+`</select></label>`;
 h+=`<div class="card"><div class="row" style="justify-content:space-between"><div><div class="sub" style="margin:0">${SET().name}　解答済み</div><div class="big">${done}<span style="font-size:1rem;color:var(--mute)"> / ${tot}</span></div></div><div style="text-align:right"><div class="sub" style="margin:0">正解</div><div class="big" style="color:var(--ok)">${cor}</div></div></div>`;
 if(last&&last.sec){const s=SECS().find(x=>x.id===last.sec);if(s)h+=`<button class="btn" style="width:100%;margin-top:12px" onclick="openSec('${s.id}',${last.page})">続きから: ${esc(s.title)}</button>`}
 h+=`</div>`;
 const grp=(lab,f)=>{h+=`<div class="grp">${lab}</div>`;SECS().filter(f).forEach(s=>{const x=secStats(s);h+=`<div class="sec" onclick="openSec('${s.id}',0)"><div><div class="t">${esc(s.title)}</div><div class="e">${esc(s.en)}</div></div><div class="p">${x.d?`${x.c}/${x.t} 正解`:`${x.t}問`}<div class="bar"><i style="width:${x.t?100*x.d/x.t:0}%"></i></div></div></div>`})};
 grp("文字 語彙　VOCABULARY",s=>/^m[1-4]$/.test(s.id));
 grp("文法　GRAMMAR",s=>/^m[5-7]$/.test(s.id));
 grp("読解　READING",s=>s.id[0]==="r");
 h+=`<div class="card"><b>ほかの端末で続きをする</b><p class="sub" style="margin:4px 0 8px">Progress saves automatically on this device. To continue on another device, copy the code, send it to yourself, and paste it there. The code includes both 模試 1 and 2.</p><div class="row" style="flex-wrap:wrap"><button class="ghost small" onclick="copyCode()">コードをコピー</button><button class="ghost small" onclick="showPaste()">コードを貼り付け</button></div><div id="codeArea"></div><div class="msg" id="msg"></div></div>`;
 h+=`<div class="card"><b>公式サンプル問題</b><p class="sub" style="margin:4px 0 6px">Official free N1 sample test from the JLPT organizers (real format, PDF):</p><a href="https://www.jlpt.jp/samples/sample2018/pdf/N1V.pdf" target="_blank" rel="noopener">N1 言語知識 読解 sample (jlpt.jp)</a><br><a href="https://jlpt.jp/e/samples/forlearners.html" target="_blank" rel="noopener">JLPT sample questions page</a></div>`;
 h+=`<div style="text-align:center;margin-top:16px"><button class="ghost small" onclick="askReset()">${SET().name}をリセット (Reset)</button></div>`;
 $("app").innerHTML=h;window.scrollTo(0,0);
}
function openSec(id,page){st.sec=id;st.page=page||0;D().last={sec:id,page:st.page};save();render()}
function render(){
 const s=SECS().find(x=>x.id===st.sec);if(!s)return home();
 const p=s.pages[st.page];$("nav").classList.remove("hide");const A=D().ans;
 let h=`<div class="top"><span class="pill">${SET().name}　${esc(s.title)}</span><span class="sub" style="margin:0">${esc(s.en)}</span></div>`;
 if(st.page===0||p.passage)h+=`<div class="instr">${s.instr}</div>`;
 if(p.passage)h+=`<div class="card passage"><div class="${/tbl/.test(p.passage)?'tblwrap':''}">${p.passage}</div></div>`;
 h+=`<div class="card">`;
 p.qs.forEach(q=>{
  const ans=A[q.n];const done=ans!==undefined;
  h+=`<div class="qblock"><div class="q"><span class="qn">${q.n}</span>${q.q}</div>`;
  q.o.forEach((o,i)=>{let cls="";if(done){if(i===q.a)cls="ok";else if(i===ans)cls="ng"}
   h+=`<button class="opt ${cls}" ${done?"disabled":""} onclick="pick(${q.n},${i})"><span class="num">${i+1}</span><span>${o}</span></button>`});
  if(done){const ok=ans===q.a;h+=`<div class="exp"><div class="v ${ok?"ok":"ng"}">${ok?"○ 正解":"× 不正解　正解は "+(q.a+1)}</div>${q.e}<div style="text-align:right;margin-top:4px"><button class="ghost small" onclick="retry(${q.n})">もう一度</button></div></div>`}
  h+=`</div>`});
 h+=`</div>`;
 $("app").innerHTML=h;
 const si=SECS().indexOf(s);
 $("navMid").textContent=`${st.page+1} / ${s.pages.length}`;
 $("bPrev").disabled=(st.page===0&&si===0);
 $("bNext").textContent=(st.page===s.pages.length-1)?(si===SECS().length-1?"結果 →":"次の問題 →"):"次 →";
}
function pick(n,i){D().ans[n]=i;save();const y=window.scrollY;render();window.scrollTo(0,y)}
function retry(n){delete D().ans[n];save();const y=window.scrollY;render();window.scrollTo(0,y)}
function go(d){
 const L=SECS();const s=L.find(x=>x.id===st.sec);let si=L.indexOf(s),pg=st.page+d;
 if(pg<0){if(si===0)return;si--;pg=L[si].pages.length-1}
 else if(pg>=s.pages.length){if(si===L.length-1){return result()}si++;pg=0}
 st.sec=L[si].id;st.page=pg;D().last={sec:st.sec,page:pg};save();render();window.scrollTo(0,0)
}
function result(){
 $("nav").classList.add("hide");let h=`<h1>結果　${SET().name}</h1><div class="card">`;let T=0,C=0;
 SECS().forEach(s=>{const x=secStats(s);T+=x.t;C+=x.c;h+=`<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(s.title)}</span><b>${x.c} / ${x.t}</b></div>`});
 h+=`<div class="row" style="justify-content:space-between;padding-top:10px"><b>合計</b><span class="big">${C} / ${T}</span></div></div><p class="sub">Wrong answers: open the section and tap もう一度 to try again.</p><button class="btn" style="width:100%" onclick="home()">目次へ戻る</button>`;
 $("app").innerHTML=h;window.scrollTo(0,0)
}
function code(){return btoa(unescape(encodeURIComponent(JSON.stringify({v:2,d:st.d}))))}
function copyCode(){const c=code();const show=()=>{$("codeArea").innerHTML=`<textarea readonly onclick="this.select()">${c}</textarea>`};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(c).then(()=>{$("msg").textContent="コピーしました。もう一つの端末で貼り付けてください。"},()=>{show();$("msg").textContent="Long-press the code to copy it."})}else{show();$("msg").textContent="Long-press the code to copy it."}}
function showPaste(){$("codeArea").innerHTML=`<textarea id="pin" placeholder="ここにコードを貼り付け"></textarea><button class="btn small" style="margin-top:6px" onclick="applyCode()">読み込む</button>`;$("msg").textContent=""}
function applyCode(){try{const o=JSON.parse(decodeURIComponent(escape(atob($("pin").value.trim()))));
 if(o&&o.d)st.d=o.d; else if(o&&typeof o.a==="object")st.d.s1={ans:o.a,last:o.l||null}; else throw 0;
 blank();save();home();$("msg").textContent="読み込みました！"}catch(e){$("msg").style.color="var(--ng)";$("msg").textContent="コードが正しくありません。"}}
function askReset(){$("modalBody").innerHTML=`<b>${SET().name}をリセットしますか？</b><p class="sub">All answers for ${SET().name} on this device will be erased. The other test is kept.</p><div class="row" style="justify-content:flex-end"><button class="ghost small" onclick="closeM()">キャンセル</button><button class="btn small" style="background:var(--ng)" onclick="doReset()">リセット</button></div>`;$("modal").classList.remove("hide")}
function closeM(){$("modal").classList.add("hide")}
function doReset(){st.d[st.cur]={ans:{},last:null};save();closeM();home()}
$("bHome").onclick=home;$("bPrev").onclick=()=>go(-1);$("bNext").onclick=()=>go(1);
home();
</script>
</body>
</html>
